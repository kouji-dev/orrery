[workspace]
members = ["updater-stub"]

[package]
name = "orrery"
version = "0.19.1"
description = "Orrery - agent orchestration"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orrery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: lets tauri::image::Image decode the PNG bytes we bake in for the
# runtime theme-aware window icon (see src/appicon.rs).
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2.8.0"
log = "0.4.32"
rusqlite = { version = "0.40.0", features = ["bundled"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
thiserror = "2.0.18"
git2 = "0.21.0"
ignore = "0.4.23"
# find-in-files (B3.1): ripgrep's engine as a library — no bundled rg binary
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "6.1.1"
portable-pty = "0.8.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
clap = { version = "4.5", features = ["derive"] }
toml_edit = "0.22"
# system metrics: per-process cpu/mem sampling for the status-bar monitor
sysinfo = "0.39"
base64 = "0.22"
regex = "1"
blake3 = "1"

# Windows-only: Job Object APIs so the whole agent process tree dies with us,
# even on force-kill/crash (kill-on-job-close). Already in the tree via tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # psapi (K32GetProcessMemoryInfo): per-process PRIVATE bytes for the A7.7
    # process tree — RSS double-counts shared pages and must not be summed.
    "Win32_System_ProcessStatus",
] }
# BrowserProcessId for the A7.7 tree: WebView2 shares one browser-process
# family per user-data-dir, so a second Orrery instance's UI processes parent
# under the FIRST instance — the ppid walk alone cannot attribute them. Same
# version tauri/wry already pull in.
webview2-com = "0.38"

# Unix-only: portable-pty already makes each PTY child a session leader
# (setsid), so killing the process group reaches grandchildren too. libc is
# already in the tree via portable-pty.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
