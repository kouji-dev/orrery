name: Publish changelog

# Manually bake real commits for a release into the landing changelog, commit
# the result to main, and redeploy the Render static site. Manual-only because
# the summary is human-written copy. The commit-back uses the default
# GITHUB_TOKEN, whose pushes never retrigger a workflow — so no deploy loop.
on:
  workflow_dispatch:
    inputs:
      summary:
        description: "One-line summary for this release (marketing copy)"
        required: true
        type: string
      tag:
        description: "Release tag (vX.Y.Z). Blank = latest tag."
        required: false
        type: string
      channel:
        description: "Release channel badge"
        required: false
        default: "beta"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-changelog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history + tags for the local-git changelog append

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update changelog.json in orrery-releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SUMMARY: ${{ inputs.summary }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${RELEASES_TOKEN}@github.com/kouji-dev/orrery-releases.git" releases-repo
          if [ -f releases-repo/changelog.json ]; then
            args=(append --summary "$SUMMARY" --channel "$CHANNEL" --out releases-repo/changelog.json)
            if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
            node scripts/release/changelog-json.mjs "${args[@]}"
          else
            node scripts/release/changelog-json.mjs migrate --channel "$CHANNEL" --out releases-repo/changelog.json
          fi
          cd releases-repo
          if git diff --quiet -- changelog.json; then
            echo "No changelog changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.json
          git commit -m "chore(changelog): ${TAG:-latest}"
          git push
