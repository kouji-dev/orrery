name: Release

# Normal path: `pnpm release` / `pnpm release:patch` locally (scripts/release/
# bump.mjs) commits the stamped version and pushes a `vX.Y.Z` tag — that tag
# triggers this workflow, and the version comes from the tag name. The manual
# dispatch (typed version) remains as an escape hatch for re-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0 (no leading v)"
        required: true
        type: string
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Resolve version (dispatch input, or the pushed vX.Y.Z tag)
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { Write-Error "no version (dispatch without input?)"; exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Stamp version (idempotent on tag builds — the bump commit already carries it)
        run: node scripts/release/stamp-version.mjs ${{ steps.ver.outputs.version }}
      - name: Build Tauri app with signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Stage release files (flat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig dist-release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-release/
          # MSI updater signature (per-machine installs update via the MSI). Tolerant:
          # if it's absent, make-latest-json just omits the MSI updater entry.
          Copy-Item src-tauri/target/release/bundle/msi/*.msi.sig dist-release/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist-release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: artifacts
      - name: Resolve version (dispatch input, or the pushed vX.Y.Z tag)
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          [ -z "$v" ] && { echo "no version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build latest.json
        run: >
          node scripts/release/make-latest-json.mjs
          --version ${{ steps.ver.outputs.version }}
          --dir artifacts
          --out artifacts/latest.json
          --repo kouji-dev/orrery-releases
          --notes "${{ inputs.notes }}"
      - name: Create release in orrery-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >
          gh release create "v${{ steps.ver.outputs.version }}"
          --repo kouji-dev/orrery-releases
          --target main
          --title "v${{ steps.ver.outputs.version }}"
          --notes "${{ inputs.notes != '' && inputs.notes || format('Orrery v{0}', steps.ver.outputs.version) }}"
          artifacts/*-setup.exe artifacts/*.msi artifacts/latest.json
