name: Release

# Two equivalent entry points, no version is ever typed:
#  - local:  `pnpm release` / `pnpm release:patch` (scripts/release/bump.mjs)
#    stamps + commits + tags; the pushed `vX.Y.Z` tag triggers this workflow.
#  - manual: dispatch with a release/patch SELECT — the workflow runs the same
#    bump.mjs on main (auto-detecting the current version from package.json),
#    pushes the bump commit + tag, and builds it. (The GITHUB_TOKEN tag push
#    does not re-trigger this workflow, so there is no double run.)
# The built/published version always comes from the checked-out package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "What to ship"
        required: true
        type: choice
        options: [patch, release]
        default: patch
      notes:
        description: "Release notes (optional)"
        required: false
        type: string
      summary:
        description: "Changelog one-liner (optional — auto-derived from commits if blank)"
        required: false
        type: string

permissions:
  contents: write # dispatch path pushes the bump commit + tag back to main

jobs:
  # Bump/version/notes run ONCE here (not in the build matrix): the dispatch
  # path pushes a commit + tag, which two parallel builds would race. Both
  # builders then check out the exact SHA this job resolved.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # full history + tags: the auto release notes are the commit list
          # since the previous v* tag (and bump.mjs needs the tags to range)
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Bump version (dispatch only — same script as `pnpm release`)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/release/bump.mjs ${{ inputs.bump }}
      - name: Resolve version (auto-detected from package.json)
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"; tag="${tag#v}"
            if [ "$tag" != "$v" ]; then
              echo "tag v$tag != package.json $v — bump with pnpm release[:patch]" >&2; exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Auto release notes (commits since the previous release, no merges)
        id: notes
        run: |
          {
            echo "notes<<NOTES_EOF"
            node scripts/release/notes.mjs
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve build SHA (post-bump HEAD)
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest # x64 NSIS + MSI
            slug: windows
          - os: macos-14 # Apple Silicon (aarch64) dmg + updater .app.tar.gz — unsigned (no Apple identity yet)
            slug: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          # pnpm 10+ required: the repo keeps config (allowBuilds) in a
          # packages-less pnpm-workspace.yaml and ships a pnpm 11 lockfile —
          # pnpm 9 rejects both ("packages field missing or empty").
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri app with signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Stage release files (flat, windows)
        if: matrix.slug == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig dist-release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-release/
          # MSI updater signature (per-machine installs update via the MSI). Tolerant:
          # if it's absent, make-latest-json just omits the MSI updater entry.
          Copy-Item src-tauri/target/release/bundle/msi/*.msi.sig dist-release/ -ErrorAction SilentlyContinue
      - name: Stage release files (flat, mac)
        if: matrix.slug == 'mac'
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
          # Updater payload + minisign signature — what latest.json's darwin entry points at.
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/
      - uses: actions/upload-artifact@v7
        with:
          name: release-files-${{ matrix.slug }}
          path: dist-release/

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files-*
          merge-multiple: true
          path: artifacts
      # Typed dispatch notes win; otherwise the auto commit list; otherwise the
      # plain title. Multiline-safe: env + --notes-file, never inline quoting.
      - name: Resolve notes
        env:
          TYPED: ${{ inputs.notes }}
          AUTO: ${{ needs.prepare.outputs.notes }}
        run: |
          NOTES="$TYPED"
          [ -z "$NOTES" ] && NOTES="$AUTO"
          [ -z "$NOTES" ] && NOTES="Orrery v${{ needs.prepare.outputs.version }}"
          printf '%s\n' "$NOTES" > notes.md
      - name: Build latest.json
        run: >
          node scripts/release/make-latest-json.mjs
          --version ${{ needs.prepare.outputs.version }}
          --dir artifacts
          --out artifacts/latest.json
          --repo kouji-dev/orrery-releases
          --notes "$(cat notes.md)"
      - name: Create release in orrery-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >
          gh release create "v${{ needs.prepare.outputs.version }}"
          --repo kouji-dev/orrery-releases
          --target main
          --title "v${{ needs.prepare.outputs.version }}"
          --notes-file notes.md
          artifacts/*-setup.exe artifacts/*.msi artifacts/*.dmg artifacts/*.app.tar.gz artifacts/latest.json

  # release => changelog. After the app is published, append this release's entry
  # to changelog.json in the PUBLIC orrery-releases repo (orrery is private). Both
  # the app and the landing changelog page fetch that file at runtime, so there's
  # no landing redeploy to wait on.
  changelog:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # full history + tags — the append reads commits since the previous tag via local git
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Update changelog.json in orrery-releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SUMMARY: ${{ inputs.summary }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${RELEASES_TOKEN}@github.com/kouji-dev/orrery-releases.git" releases-repo
          # First run bootstraps the full history from git tags; afterwards each
          # release appends one entry (preserving any curated summaries already there).
          if [ -f releases-repo/changelog.json ]; then
            args=(append --tag "$TAG" --channel beta --out releases-repo/changelog.json)
            if [ -n "${SUMMARY:-}" ]; then args+=(--summary "$SUMMARY"); fi
            node scripts/release/changelog-json.mjs "${args[@]}"
          else
            node scripts/release/changelog-json.mjs migrate --channel beta --out releases-repo/changelog.json
          fi
          cd releases-repo
          if git diff --quiet -- changelog.json; then
            echo "No changelog changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.json
          git commit -m "chore(changelog): ${TAG}"
          git push
