name: Release

# Two equivalent entry points, no version is ever typed:
#  - local:  `pnpm release` / `pnpm release:patch` (scripts/release/bump.mjs)
#    stamps + commits + tags; the pushed `vX.Y.Z` tag triggers this workflow.
#  - manual: dispatch with a release/patch SELECT — the workflow runs the same
#    bump.mjs on main (auto-detecting the current version from package.json),
#    pushes the bump commit + tag, and builds it. (The GITHUB_TOKEN tag push
#    does not re-trigger this workflow, so there is no double run.)
# The built/published version always comes from the checked-out package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "What to ship"
        required: true
        type: choice
        options: [patch, release]
        default: patch
      notes:
        description: "Release notes (optional)"
        required: false
        type: string
      summary:
        description: "Changelog one-liner (optional — auto-derived from commits if blank)"
        required: false
        type: string

permissions:
  contents: write # dispatch path pushes the bump commit + tag back to main

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          # full history + tags: the auto release notes are the commit list
          # since the previous v* tag (and bump.mjs needs the tags to range)
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          # pnpm 10+ required: the repo keeps config (allowBuilds) in a
          # packages-less pnpm-workspace.yaml and ships a pnpm 11 lockfile —
          # pnpm 9 rejects both ("packages field missing or empty").
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Bump version (dispatch only — same script as `pnpm release`)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/release/bump.mjs ${{ inputs.bump }}
      - name: Resolve version (auto-detected from package.json)
        id: ver
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $v) { Write-Error "tag v$tag != package.json $v — bump with pnpm release[:patch]"; exit 1 }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Auto release notes (commits since the previous release, no merges)
        id: notes
        shell: pwsh
        run: |
          $notes = (node scripts/release/notes.mjs) -join "`n"
          Add-Content $env:GITHUB_OUTPUT "notes<<NOTES_EOF"
          Add-Content $env:GITHUB_OUTPUT $notes
          Add-Content $env:GITHUB_OUTPUT "NOTES_EOF"
      - name: Build Tauri app with signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Stage release files (flat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig dist-release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-release/
          # MSI updater signature (per-machine installs update via the MSI). Tolerant:
          # if it's absent, make-latest-json just omits the MSI updater entry.
          Copy-Item src-tauri/target/release/bundle/msi/*.msi.sig dist-release/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist-release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: artifacts
      # Typed dispatch notes win; otherwise the auto commit list; otherwise the
      # plain title. Multiline-safe: env + --notes-file, never inline quoting.
      - name: Resolve notes
        env:
          TYPED: ${{ inputs.notes }}
          AUTO: ${{ needs.build.outputs.notes }}
        run: |
          NOTES="$TYPED"
          [ -z "$NOTES" ] && NOTES="$AUTO"
          [ -z "$NOTES" ] && NOTES="Orrery v${{ needs.build.outputs.version }}"
          printf '%s\n' "$NOTES" > notes.md
      - name: Build latest.json
        run: >
          node scripts/release/make-latest-json.mjs
          --version ${{ needs.build.outputs.version }}
          --dir artifacts
          --out artifacts/latest.json
          --repo kouji-dev/orrery-releases
          --notes "$(cat notes.md)"
      - name: Create release in orrery-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >
          gh release create "v${{ needs.build.outputs.version }}"
          --repo kouji-dev/orrery-releases
          --target main
          --title "v${{ needs.build.outputs.version }}"
          --notes-file notes.md
          artifacts/*-setup.exe artifacts/*.msi artifacts/latest.json

  # release => changelog => landing. After the app is published, bake this
  # release's entry into the landing changelog and commit it to main. The
  # landing then redeploys when this whole workflow completes (the workflow_run
  # hook in deploy-landing.yml), so the deployed site includes the new entry.
  changelog:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate changelog entry (typed summary, else auto-derived)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          args=(--channel beta --tag "v${{ needs.build.outputs.version }}")
          if [ -n "${SUMMARY:-}" ]; then args+=(--summary "$SUMMARY"); fi
          node scripts/landing/gen-changelog.mjs "${args[@]}"
      - name: Commit changelog to main
        run: |
          set -euo pipefail
          if git diff --quiet -- landing/changelog.html; then
            echo "No changelog changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing/changelog.html
          git commit -m "chore(landing): changelog for v${{ needs.build.outputs.version }} [skip ci]"
          git push origin HEAD:main
