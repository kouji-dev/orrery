name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The client SDK runs the same conformance fixtures the Rust SDK does.
      # Two implementations, one contract; a green Rust run means nothing on its
      # own.
      - run: pnpm -C harness/clients/sdk-ts test

  # The harness is a separate product from the ADE, so it gets its own job and
  # neither waits on the other. Deliberately NOT `cargo test --workspace`: the
  # repo convention is per-crate test runs, and each plan adds its own line here
  # as it lands.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      # Keyed on the root Cargo.lock, so this shares one cache with the ADE job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.lock') }}
      # Harness crates only. `cargo fmt --all` would also reformat the ADE,
      # which is not rustfmt-clean and is not this job's business; rustfmt has
      # no --exclude, so the package list is computed instead.
      - name: cargo fmt --check (harness crates)
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_root as $r
                     | .packages[]
                     | select(.manifest_path | startswith($r + "/harness/"))
                     | "-p " + .name' \
            | tr '\n' ' ')
          cargo fmt $pkgs -- --check
      - run: cargo clippy --workspace --exclude orrery-ade --exclude orrery-updater -- -D warnings
      - run: cargo test -p orrery-proto
      - run: cargo test -p orrery-cli
      - run: cargo test -p xtask
      - run: cargo test -p orrery-agui
      - run: cargo test -p orrery-transport
      - run: cargo test -p orrery-client
      - run: cargo test -p orrery-client-json
      - run: cargo xtask deps-check
      # Plan 18. The offline half: the manifest preconditions `cargo publish`
      # evaluates before it opens a socket. `cargo test -p xtask` covers it too;
      # this line is here so a red build names the rule rather than a test file.
      - run: cargo xtask publish-check
      # Plan 18, task 4: the same logical tool in four runtimes, one Outcome.
      # `tinygo-examples` is left off — the runner has neither tinygo nor
      # wit-bindgen-go, and the test prints that the Go leg was not compared.
      - run: cargo test -p orrery-harness --test parity
      # One of the two steps in this repo allowed a network read (the other is
      # the publish dry run below): the vendored AG-UI enum is checked against what
      # upstream actually publishes. `--fetch` is passed here and nowhere else,
      # so the same task offline reads the installed `@ag-ui/core` or falls back
      # to the pinned list and stays green. It fails only on a name we invented,
      # never on being unable to reach the network.
      - name: cargo xtask agui-drift (networked, CI only)
        run: cargo xtask agui-drift --fetch
      # Plan 18, task 5. The real dry run, which needs the crates.io index and
      # therefore cannot be a test: nothing in this repo's suite may reach the
      # network. It is the second and last networked step here, and it runs in
      # dependency order — the trait crates before anything that names them —
      # because an unpublished dependency is exactly what it is looking for.
      - name: cargo publish --dry-run (networked, CI only)
        run: |
          set -euo pipefail
          crates="orrery-proto orrery-ext-api orrery-provider orrery-session orrery-memory orrery-grader orrery-guest"
          for crate in $crates; do
            cargo publish --dry-run -p "$crate" --allow-dirty
          done
