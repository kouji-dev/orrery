[package]
name = "orrery-client"
version = "0.1.0"
description = "The Rust Orrery client SDK: an AG-UI session and a SurfaceStore. Pure data, no drawing."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not publishable while it depends on orrery-transport, which is not published.
# Splitting the store (publishable, pure data) from the session (transport) is
# the phase-2 move; there is no third-party consumer yet to need it.
publish = false

[dependencies]
orrery-proto = { workspace = true }
orrery-agui = { version = "0.1.0", path = "../../core/crates/orrery-agui" }
orrery-transport = { version = "0.1.0", path = "../../core/crates/orrery-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
# `reqwest` here is built against `rustls-no-provider`: a client cannot be built
# until a provider is installed, so this crate installs it rather than leaving
# every binary to remember.
rustls = { workspace = true }
interprocess = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
