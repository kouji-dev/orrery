[package]
name = "orrery-skills"
version = "0.1.0"
description = "SKILL.md front matter, the discovery pass, and running a skill's scripts under a grant."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The script a `scripts::` test runs. A committed Rust fixture rather than a
# shell script: it must behave identically on every platform CI runs on, and it
# must never touch the network.
[[bin]]
name = "orrery-skill-fixture"
path = "tests/fixtures/script/main.rs"
test = false
doc = false

[dependencies]
orrery-proto = { workspace = true }
orrery-audit = { workspace = true }
orrery-policy = { workspace = true }
orrery-broker = { workspace = true }
orrery-tools = { workspace = true }
orrery-config = { path = "../orrery-config" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
serde_yaml_ng = { workspace = true }
