[package]
name = "orrery-host-rpc"
version = "0.0.0"
description = "Extension hosts that run a child process: node, python and plain process children, contained per platform."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orrery-proto = { workspace = true }
orrery-ext-api = { workspace = true }
orrery-host = { path = "../orrery-host" }
orrery-jsonrpc = { path = "../orrery-jsonrpc" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
orrery-tools = { path = "../orrery-tools" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
