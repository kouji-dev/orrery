[package]
name = "orrery-host"
version = "0.0.0"
description = "The ExtensionHost trait, the instance table keyed by generation id, the load/degrade/unload machine and the native runtime."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orrery-proto = { workspace = true }
orrery-ext-api = { workspace = true }
# By path, not `workspace = true`: `orrery-tools` is `publish = false`, so it is
# not one of the version+path pairs the root declares for the published half.
orrery-tools = { path = "../orrery-tools" }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
