[package]
name = "orrery-kernel"
version = "0.0.0"
description = "The phase pipeline, the sync interceptor chain, context building and run_turn."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orrery-proto = { workspace = true }
orrery-provider = { workspace = true }
orrery-session = { workspace = true }
orrery-audit = { workspace = true }
# By path, not `workspace = true`: `orrery-tools` is `publish = false`, so it is
# not one of the version+path pairs the root declares for the published half.
orrery-tools = { path = "../orrery-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# **No extension crates, and therefore no integration tests in this crate.**
# `cargo xtask deps-check` rule 1 is about the whole graph, dev-dependencies
# included: no `core/` crate names an `extensions/` one, and the single
# exception is the facade. A kernel test needs a provider and a store, both of
# which live in `extensions/`, so the loop's tests live in
# `orrery-harness/tests/{intercept,lifecycle,turn,budget,retry,cancel}.rs` —
# against the real sqlite store and the committed model streams, rather than
# against doubles written to keep the graph tidy.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
