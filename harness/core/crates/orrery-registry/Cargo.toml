[package]
name = "orrery-registry"
version = "0.0.0"
description = "The signed registry client: pinning, signature checks, and refusing unpinned extensions under a managed profile."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orrery-proto = { workspace = true }
orrery-ext-api = { workspace = true }
orrery-config = { path = "../orrery-config" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
# ed25519 comes from `ring`, which rustls already puts in this tree: one crypto
# stack, not two. See `verify.rs` for the decision and plan 15 task 2.
ring = { version = "0.17", default-features = false, features = ["alloc"] }
hex = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
