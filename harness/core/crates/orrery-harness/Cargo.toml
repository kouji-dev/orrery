[package]
name = "orrery-harness"
version = "0.0.0"
description = "The facade: builds a Kernel from resolved config, owns the tokio runtime, links the first-party set behind features."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The first-party set. This is the **only** core crate allowed to name an
# `extensions/` crate; `cargo xtask deps-check` allow-lists it by name.
#
# `anthropic` is off by default, which is a deliberate deviation from the plan's
# `default = [.., "anthropic", ..]`: it pulls a TLS stack in, and nothing in
# this repo's tests may reach the network. Turning it on is one flag.
# `views-default` and `agents-default` are in the default set because without
# them the product is missing its floor: a client with no view bindings can
# legitimately draw a blank screen (section 6.7), and the five named roles
# (section 4.6) are names nothing answers to. They are still ordinary
# extensions - manifest, ledger entry, deny rule - which is the whole point.
# `git-tools` and `lsp-tools` are in the default set because the default set has
# to be a WORKING harness: they are how an agent reads a repository the way a
# person does, and `references` finding uses of a *symbol* rather than places a
# string appears is the difference between navigating a codebase and grepping
# it. Both are pure in-process reads - no socket, no TLS, no child process
# unless a language server is actually configured and asked for.
default = [
  "builtin-tools", "sqlite", "fixture-provider", "views-default", "agents-default",
  "memory-file", "rpc-extensions", "wasm-extensions", "graders",
  "git-tools", "lsp-tools",
]
# The three ported example extensions (phase 4). **Off by default**: they are
# demos, and a shipped binary has no business carrying them. On, they are
# registered through the same door the builtin tools go through, so `orrery ext
# list` lists them and a real turn can call them - which is the only way the
# phase-4 criterion ("three ported extensions render with no drawing code of
# their own") can be exercised through the binary at all. Compiled in rather
# than discovered on disk, because `features::host_for` returns `None` for
# `native` and that answer is correct: a native extension is linked, not loaded.
example-extensions = [
  "dep:workspace-census", "dep:patch-review", "dep:release-train",
]
builtin-tools = ["dep:orrery-ext-tools-builtin"]
# Read-only git verbs over gitoxide, and a managed language-server client.
# Ordinary extensions - manifest, ledger entry, deny rule - which is the point.
git-tools = ["dep:orrery-ext-git"]
lsp-tools = ["dep:orrery-ext-lsp"]
# An OpenAI-compatible endpoint: ollama, vllm, llama.cpp, a gateway. **Off by
# default, for the same reason `anthropic` is**: its `http` feature links
# reqwest and rustls, and the default build must pull no TLS stack and reach no
# network. It is tempting to make an exception because a local server wants no
# credential and nothing dials until `--provider` names one - but "needs no key"
# and "links no TLS" are different properties, and only the second is the rule
# here. Turning it on is one flag, and `ProviderChoice::OpenAiCompat` exists in
# every build so the error can say which flag.
openai-compat = ["dep:orrery-ext-provider-openai-compat"]
views-default = ["dep:orrery-ext-views-default"]
agents-default = ["dep:orrery-ext-agents-default"]
# Compiled in, and **not switched on**: the reference memory provider is
# deliberately mediocre, and a mediocre default memory is worse than none for
# evals. It is linked so a profile can name it (`[memory] provider = "file"`)
# without a rebuild; naming it is what turns it on.
memory-file = ["dep:orrery-ext-memory-file"]
# Node, python and plain process extensions. On by default: `orrery install`
# happily installs one, so a build that cannot start it is a build that lies.
rpc-extensions = ["dep:orrery-host-rpc"]
# The wasm runtime: the one runtime with a real sandbox, and the only reason
# `orrery-wit`'s arena encoding is in the binary at all. On by default so the
# engine a `runtime = "wasm"` manifest needs is present rather than a rebuild
# away.
#
# **Known gap, named rather than hidden:** `orrery-host-wasm` does not implement
# `orrery_host::ExtensionHost` yet, so `features::host_for` has no arm for it and
# a discovered wasm extension is reported as skipped. The engine, the ceilings
# and the imports are all here and tested (`tests/parity.rs`); what is missing is
# the adapter between them and the extension table.
wasm-extensions = ["dep:orrery-host-wasm"]
sqlite = ["dep:orrery-ext-session-sqlite"]
fixture-provider = ["dep:orrery-ext-provider-fixture"]
anthropic = ["dep:orrery-ext-provider-anthropic"]
# The three built-in graders, for `orrery eval`. On by default: an eval runner
# with no grader can run a case and cannot score it, which is not a runner.
graders = ["dep:orrery-ext-graders"]
# `tests/parity.rs`'s fourth leg. TinyGo and wit-bindgen-go are not cargo
# dependencies and no machine is required to have them, so the Go half of the
# four-runtime comparison is opt-in. Off, the test **says** the leg was not
# compared rather than passing quietly.
tinygo-examples = []

[dependencies]
orrery-proto = { workspace = true }
orrery-provider = { workspace = true }
orrery-session = { workspace = true }
orrery-audit = { workspace = true }
orrery-policy = { workspace = true }
orrery-broker = { workspace = true }
# The memory half of plan 12. Named here and nowhere else in `core/`: the kernel
# owns a typed hole, this crate is the one allowed to fill it.
orrery-memory = { workspace = true }
# Plan 13's two crates. Named here because the RUN PATH is what phase 7 is
# about: `orrery-cli` depended on both and `orrery-harness` on neither, so an
# inspection command could list an MCP tool that no turn could call and a
# discovered `SKILL.md` reached no system prompt. The crates were green; the
# product was broken. Same defect class as the inert `[permissions]`.
orrery-mcp = { path = "../orrery-mcp" }
orrery-skills = { path = "../orrery-skills" }
# The grader trait, so `features::graders` has a return type that does not
# depend on the extension being compiled in.
orrery-grader = { workspace = true }
orrery-ext-api = { workspace = true }
# By path, not `workspace = true`: these are `publish = false`, so they are not
# among the version+path pairs the root declares for the published half.
orrery-config = { path = "../orrery-config" }
# The supply-chain half of plan 15. Named here because the LOAD path is what
# phase 8's criterion is about - "unpinned extensions refuse to load" - and the
# load path is built in this crate. `orrery-cli` reads the same answer through
# `plan::skip_for` rather than implementing the gate a second time.
orrery-registry = { path = "../orrery-registry" }
orrery-tools = { path = "../orrery-tools" }
orrery-host = { path = "../orrery-host" }
orrery-kernel = { path = "../orrery-kernel" }
# Plan 11's two crates. This is the crate that may name a kernel *and* an
# orchestrator, so `TurnRunner` and `StepExecutor` - which nothing implemented -
# are implemented here in `steps.rs`. Without this the loop machine, its caps
# and every routing rule were green library tests the binary could not reach.
orrery-router = { path = "../orrery-router" }
# The kernel-side differ. Named here because this is where the extension table
# is built, and the table is what hands each call its sink.
orrery-surface = { path = "../orrery-surface" }
orrery-orchestrator = { path = "../orrery-orchestrator" }
async-trait = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

# --- the first-party set, each behind its feature ---------------------------
orrery-ext-tools-builtin = { path = "../../../extensions/crates/orrery-ext-tools-builtin", optional = true }
orrery-ext-session-sqlite = { path = "../../../extensions/crates/orrery-ext-session-sqlite", optional = true }
orrery-ext-provider-fixture = { path = "../../../extensions/crates/orrery-ext-provider-fixture", optional = true }
orrery-ext-provider-anthropic = { path = "../../../extensions/crates/orrery-ext-provider-anthropic", optional = true }
orrery-ext-provider-openai-compat = { path = "../../../extensions/crates/orrery-ext-provider-openai-compat", optional = true }
orrery-ext-git = { path = "../../../extensions/crates/orrery-ext-git", optional = true }
orrery-ext-lsp = { path = "../../../extensions/crates/orrery-ext-lsp", optional = true }
orrery-ext-graders ={ path = "../../../extensions/crates/orrery-ext-graders", optional = true }
orrery-ext-views-default = { path = "../../../extensions/crates/orrery-ext-views-default", optional = true }
orrery-ext-agents-default = { path = "../../../extensions/crates/orrery-ext-agents-default", optional = true }
orrery-ext-memory-file = { path = "../../../extensions/crates/orrery-ext-memory-file", optional = true }

# Phase 4's three ported examples, behind `example-extensions`.
workspace-census = { path = "../../../extensions/examples/workspace-census", optional = true }
patch-review = { path = "../../../extensions/examples/patch-review", optional = true }
release-train = { path = "../../../extensions/examples/release-train", optional = true }

# The other extension runtimes. Real dependencies, on by default: a build that
# cannot start a node or python extension is not a harness, it is a demo, and
# these were dev-dependencies - reachable from `tests/parity.rs` and from
# nowhere the product could use them.
orrery-host-rpc = { path = "../orrery-host-rpc", optional = true }
orrery-host-wasm = { path = "../orrery-host-wasm", optional = true }

[dev-dependencies]
# The kernel's own suites live here: `deps-check` rule 1 forbids a core crate
# from naming an extension, and this is the one crate allowed to. The optional
# first-party deps above are in scope for tests whenever their feature is on,
# which the default set turns on.
serde_json = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# `tests/parity.rs` only: the other two runtime hosts, and the `native` worked
# example. This is the one core crate allowed to name an `extensions/` crate,
# which is why the four-runtime comparison lives here and nowhere else.
native-hello = { path = "../../../extensions/examples/native-hello" }

# `builtin::bash_is_contained` needs a real process tree to kill.
[[example]]
name = "contain_probe"

