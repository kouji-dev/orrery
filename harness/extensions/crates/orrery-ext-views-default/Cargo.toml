[package]
name = "orrery-ext-views-default"
version = "0.0.0"
description = "The default view bindings: assistant text, tool started and settled, consent prompts and errors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
# No dev-dependencies: the tests load this bundle through
# `orrery-ext-api::testing`, the published mock-broker harness — the same door a
# community author goes through. No kernel internals, nothing unpublished.
[dependencies]
orrery-ext-api = { version = "0.2", path = "../../../core/crates/orrery-ext-api" }
orrery-proto = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
