[package]
name = "orrery-ext-views-default"
version = "0.0.0"
description = "The default view bindings: assistant text, tool started and settled, consent prompts and errors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-ext-api = { version = "0.1", path = "../../../core/crates/orrery-ext-api" }
orrery-surface = { version = "0.1", path = "../../../core/crates/orrery-surface" }
orrery-proto = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
orrery-host = { path = "../../../core/crates/orrery-host" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
