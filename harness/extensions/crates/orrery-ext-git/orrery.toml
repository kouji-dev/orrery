api = "orrery-ext/1"
runtime = "native"

[extension]
id = "git"
version = "0.1.0"

# Five read-only verbs. `branch` and `commit` were declared here while this
# crate was a scaffold; they are not implemented, so they are not declared — a
# manifest that lists a tool the extension does not have makes the ledger a lie.
[provides]
tools = ["status", "log", "show", "diff", "blame"]

# Read, and nothing else. gitoxide opens the object database in place, so the
# bundle asks the broker for permission on the repository path before any verb
# touches it. The scaffold also asked for `write = ["$WORKSPACE/.git/**"]` and
# `spawn = ["git"]`; neither is used by anything here, and a grant nothing uses
# is a capability handed over for nothing. Both come back with the write verbs.
[requires]
read = ["$WORKSPACE/**"]
