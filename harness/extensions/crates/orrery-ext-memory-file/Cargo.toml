[package]
name = "orrery-ext-memory-file"
version = "0.0.0"
description = "The reference memory provider: file-backed, global and session scopes only. Not in any default feature set."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-memory = { version = "0.1", path = "../../../core/crates/orrery-memory" }
