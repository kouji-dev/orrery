[package]
name = "orrery-ext-memory-file"
version = "0.0.0"
description = "The reference memory provider: file-backed, global and session scopes only. Not in any default feature set."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-memory = { version = "0.1", path = "../../../core/crates/orrery-memory" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
tracing = { workspace = true }

[features]
# The crate is a **feature of an embedder, not of itself**: nothing here is
# conditional, and `orrery-harness` is where the switch lives. It is not in that
# crate's `default` set, and it must not be — a mediocre default memory is worse
# than none for evals, which is why `EvalRun.memory` defaults to `"off"`
# (plan 16).
default = []

[dev-dependencies]
# `orrery-memory` is `publish = true`, so `deps-check` rule 3 is satisfied:
# this extension's tests reach core only through a published crate, which is
# exactly the harness a community author would have.
orrery-proto = { version = "0.1", path = "../../../core/crates/orrery-proto" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
