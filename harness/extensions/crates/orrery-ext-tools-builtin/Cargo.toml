[package]
name = "orrery-ext-tools-builtin"
version = "0.0.0"
description = "The built-in tool bundle: read, write, edit, bash, grep and glob, shipped as a first-party extension like any other."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-ext-api = { version = "0.1", path = "../../../core/crates/orrery-ext-api" }
orrery-proto = { workspace = true }
async-trait = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# **No dev-dependencies, on purpose.** `cargo xtask deps-check` rule 3: an
# extension's tests may not reach into an unpublished core crate, so that a
# community author runs the identical suite. The four named tests of this
# bundle are tests *of the broker* — a ceiling that bounds peak memory, a write
# that reverts on cancel, a child whose grandchild dies with it — and a broker
# is precisely what this crate may not name. They live in
# `orrery-harness/tests/builtin.rs`, where the real broker is wired, and they
# exercise the production facade rather than a rig built for them.
