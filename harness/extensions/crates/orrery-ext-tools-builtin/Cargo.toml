[package]
name = "orrery-ext-tools-builtin"
version = "0.0.0"
description = "The built-in tool bundle: read, write, edit, bash, grep and glob, shipped as a first-party extension like any other."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-ext-api = { version = "0.2", path = "../../../core/crates/orrery-ext-api" }
orrery-proto = { workspace = true }
async-trait = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# The suite is `tests/tools.rs`, against the published mock broker in
# `orrery-ext-api::testing` — the same harness `orrery ext test` runs, so it
# doubles as the worked example for a community author. `deps-check` rule 3 is
# satisfied by construction: nothing here names an unpublished core crate.
#
# The tests of the *broker* — a ceiling that bounds peak memory, a write that
# reverts on cancel, a child whose grandchild dies with it — stay in
# `orrery-harness/tests/builtin.rs`, where the real broker is wired, because a
# broker is precisely what this crate may not name.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true }
