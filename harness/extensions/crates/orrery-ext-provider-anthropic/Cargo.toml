[package]
name = "orrery-ext-provider-anthropic"
version = "0.0.0"
description = "The Anthropic Messages provider: request builder, SSE parser, tool-use blocks, cache_control and usage."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-provider = { version = "0.1", path = "../../../core/crates/orrery-provider" }
