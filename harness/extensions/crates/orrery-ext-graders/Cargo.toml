[package]
name = "orrery-ext-graders"
version = "0.0.0"
description = "The built-in graders: command, assertion and model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Dependencies on core name BOTH halves: `version` makes this crate
# publishable, `path` makes it build in-tree. At split time the path goes and
# nothing else changes. See harness/extensions/README.md.
[dependencies]
orrery-grader = { version = "0.1", path = "../../../core/crates/orrery-grader" }
orrery-ext-api = { version = "0.2", path = "../../../core/crates/orrery-ext-api" }
orrery-proto = { version = "0.1", path = "../../../core/crates/orrery-proto" }
orrery-provider = { version = "0.1", path = "../../../core/crates/orrery-provider" }
orrery-session = { version = "0.1", path = "../../../core/crates/orrery-session" }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
futures-core = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
