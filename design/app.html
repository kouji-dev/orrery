<!DOCTYPE html>
<html lang="en" data-theme="dark" data-preset="graphite" data-density="regular" data-motion="on" data-view="spec">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orrery — design system & multi-agent console</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg/%3E" />
<script>
(function () {
  var A = 22, B = 13, K = -4, TAU = Math.PI * 2, d = "";
  for (var i = 0; i <= 140; i++) {
    var t = i / 140 * TAU;
    d += (i ? "L" : "M") + (50 + A * Math.cos(t) + B * Math.cos(K * t)).toFixed(2) + " " + (50 + A * Math.sin(t) + B * Math.sin(K * t)).toFixed(2) + " ";
  }
  d += "Z";
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
    '<defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="%23ff5d9e"/><stop offset=".5" stop-color="%23a855f7"/><stop offset="1" stop-color="%2322d3ee"/></linearGradient>' +
    '<radialGradient id="c"><stop offset="0" stop-color="%23ffffff"/><stop offset=".45" stop-color="%23a855f7"/><stop offset="1" stop-color="%23a855f7" stop-opacity="0"/></radialGradient></defs>' +
    '<rect width="100" height="100" rx="22" fill="%23090a0f"/>' +
    '<path d="' + d + '" fill="none" stroke="url(%23r)" stroke-width="5" stroke-linejoin="round"/>' +
    '<circle cx="50" cy="50" r="13" fill="url(%23c)"/></svg>';
  document.getElementById("favicon").setAttribute("href", "data:image/svg+xml," + svg.replace(/#/g, "%23"));
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   ORCHESTRA — multi-agent orchestrator IDE
   Futuristic IntelliJ-inspired design tokens
   ========================================================================= */

:root {
  /* layout widths (shared by workspace grid + top-bar chrome) */
  --sidebar-w: 252px;
  --rail-w: 54px;
  --right-w: 280px;

  /* ---- UI accent. The ONLY decorative hue. Allowed on: focus ring, text
     selection, active tab/rail indicator, primary button fill, meters. ---- */
  --accent: #a855f7;        /* fills, indicators */
  --accent-fill: #b082f7;   /* filled accent surface — text 6.83:1, 5.86:1 vs panel-2 */
  --accent-on: #0d0d0f;     /* ink on a filled accent surface */
  --accent-ink: #c39afc;    /* accent-as-text / icon on dark */
  --accent-rgb: 168, 85, 247;

  /* brand mark only — the logo gradient. Never in functional chrome. */
  --brand-1: #ff5d9e;
  --brand-2: #a855f7;
  --brand-3: #22d3ee;
  --accent-2: #22d3ee;      /* legacy alias of brand-3, brand surfaces only */
  --accent-3: #ff5d9e;      /* legacy alias of brand-1 */
  --accent-2-rgb: 34, 211, 238;

  /* ---- semantic hues. One meaning-class each. Only these hold values. ---- */
  --sem-add: #57c98a;       /* additive, succeeded */
  --sem-del: #e06c7a;       /* destructive, failed */
  --sem-attn: #d9a441;      /* needs a human: conflict, waiting, warn */
  --sem-change: #5e9cf5;    /* changed in place: modified, renamed */
  --sem-live: #3fb6c4;      /* running now, streaming */

  /* ---- vocabularies alias the semantic hues. Never a raw hex. ---- */
  /* agent status */
  --st-running: var(--sem-live);
  --st-blocked: var(--sem-del);
  --st-waiting: var(--sem-attn);
  --st-done: var(--sem-add);
  --st-idle: var(--ink-3);

  /* VCS file state */
  --vcs-added: var(--sem-add);
  --vcs-modified: var(--sem-change);
  --vcs-renamed: var(--sem-change);   /* + arrow glyph carries the rest */
  --vcs-deleted: var(--ink-3);        /* dim + strikethrough, NOT red */
  --vcs-conflicted: var(--sem-attn);
  --vcs-untracked: var(--ink-3);
  --vcs-ignored: var(--ink-4);

  /* log levels — sys is the quietest line in the terminal, not the loudest */
  --log-err: var(--sem-del);
  --log-warn: var(--sem-attn);
  --log-info: var(--ink-2);
  --log-sys: var(--ink-3);

  /* diff sides: column position + A/B badge carry the meaning. Neutral tints. */
  --side-a: color-mix(in oklch, var(--ink), transparent 96%);
  --side-b: color-mix(in oklch, var(--ink), transparent 92%);

  /* UI-accent roles — the only consumers of --accent */
  --ui-ink: var(--accent-ink);
  --ui-fill: var(--accent-fill);
  --ui-on-fill: var(--accent-on);
  --ui-ind: var(--accent);
  --ui-sel: color-mix(in oklch, var(--accent), transparent 88%);
  --ui-sel-2: color-mix(in oklch, var(--accent), transparent 74%);
  --ui-line: color-mix(in oklch, var(--accent), transparent 55%);
  --ui-focus: var(--accent);
  --ui-ring: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 84%);
  --ui-meter: var(--accent);
  --ui-link: var(--accent-ink);

  /* commit-graph lanes: identity, not meaning — muted, flat chroma */
  --lane-1: #8f7bd6; --lane-2: #5e8fb8; --lane-3: #67a888; --lane-4: #c09a54;
  --lane-5: #b8798f; --lane-6: #6f8fc4; --lane-7: #9d86b8;

  /* identity palette — projects, avatars, authors. Identity, not meaning. */
  --id-1: var(--lane-1); --id-2: var(--lane-2); --id-3: var(--lane-3); --id-4: var(--lane-4);
  --id-5: var(--lane-5); --id-6: var(--lane-6); --id-7: var(--lane-7);

  /* agent-tool marks — external brands, kept verbatim */
  --tool-claude: #d98a5b;
  --tool-codex: #10a37f;
  --tool-cursor: #6e9bff;
  --tool-gemini: #8a7cff;

  /* ink that sits on a solid semantic or danger fill */
  --on-solid: #ffffff;

  /* brand splash + icon plate (pre-theme surfaces, deliberately fixed) */
  --brand-core: #ffffff;
  --brand-plate: #090a0f;
  --boot-bg: #07080d;
  --boot-grid: rgba(255,255,255,.022);

  /* type — Inter for chrome, JetBrains Mono for code, paths, refs, figures */
  --font-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-disp: var(--font-ui);

  /* radii */
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;

  /* density (overridden via [data-density]) */
  --row-h: 30px;
  --pad: 12px;
  --fs-ui: 12.5px;
  --fs-tree: 12.5px;
}

[data-density="compact"] {
  --row-h: 26px;
  --pad: 9px;
  --fs-ui: 11.5px;
  --fs-tree: 11.5px;
}
[data-density="comfy"] {
  --row-h: 36px;
  --pad: 16px;
  --fs-ui: 13.5px;
  --fs-tree: 13px;
}

/* ---------- DARK (default) — GRAPHITE ramp ----------
   Chroma held flat at ~0.005 OKLCH across the whole ramp; it never rises
   with elevation. Elevation is a lightness step plus a hairline. */
[data-theme="dark"] {
  --bg: #121315;        /* L 18.6%  C .0044 */
  --panel: #17181a;     /* L 20.9%  C .0042 */
  --panel-2: #1d1e20;   /* L 23.5%  C .0041  <- editor surface */
  --panel-3: #232427;   /* L 26.0%  C .0058 */
  --elev: #2c2d30;      /* L 29.7%  C .0056 */
  --hair: #353739;
  --hair-2: #444548;
  --bg-grid: rgba(255, 255, 255, 0.02);
  --ink: #dee0e2;       /* 12.6:1 on panel-2 */
  --ink-2: #b0b1b3;     /*  7.8:1 */
  --ink-3: #8a8b8c;     /*  4.9:1 */
  --ink-4: #68696b;     /*  3.0:1 — non-text / disabled only */
  --code-add-bg: color-mix(in oklch, var(--sem-add), transparent 88%);
  --code-add-ink: #7fd7a5;
  --code-del-bg: color-mix(in oklch, var(--sem-del), transparent 88%);
  --code-del-ink: #ef8a95;
  --glow: 0 0 0 1px color-mix(in oklch, var(--accent), transparent 45%);
  --shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.65);
  --scan: rgba(255,255,255,0.02);
  --scrim: rgba(4, 5, 9, 0.58);        /* modal backdrop */
  --desk-1: #11131d;                   /* desktop behind the app window */
  --desk-2: #050609;
  color-scheme: dark;
}

/* ---------- LIGHT ----------
   "Paper" — One Light's structure and soft ink, shifted down into real grey.
   Pure neutral (chroma 0.0000). Elevation goes DOWN, not up: the editor is the
   single brightest surface and everything else recedes. --elev is capped short
   of white so popovers never glare. */
[data-theme="light"] {
  --bg: #dedede;        /* L 90.1%  app shell, gutters */
  --panel: #e8e8e8;     /* L 93.1%  sidebars, rail, status bar */
  --panel-2: #f2f2f2;   /* L 96.1%  editor — the ONE bright surface */
  --panel-3: #e4e4e4;   /* L 91.9%  rows, inputs, tab strip (recessed) */
  --elev: #f7f7f7;      /* L 97.6%  popovers — capped, never #fff */
  --hair: #d1d1d1;
  --hair-2: #bababa;
  --bg-grid: rgba(0, 0, 0, 0.022);
  /* One Light's signature: soft foreground, not near-black. ~10:1, not 16:1. */
  --ink: #3b3b3b;       /* 10.0:1 on panel-2 */
  --ink-2: #515151;     /*  7.1:1 */
  --ink-3: #6e6e6e;     /*  4.6:1 */
  --ink-4: #8c8c8c;     /*  3.0:1 — non-text / disabled ONLY */
  --accent: #8d4dcc;
  --accent-fill: #752cb3;   /* white text 7.6:1 · vs editor 6.8:1 */
  --accent-on: #ffffff;
  --accent-ink: #8d4dcc;    /* 4.6:1 — accent as text/icon */
  --accent-rgb: 141, 77, 204;
  /* One Light's own syntax palette fails AA on light (#50a14f = 2.86:1,
     #4078f2 = 3.62:1). These keep its muted character but clear 4.6:1. */
  --sem-add: #1e7d3e;
  --sem-del: #bf4240;
  --sem-attn: #996100;
  --sem-change: #1c6dc8;
  --sem-live: #00788b;
  --code-add-bg: color-mix(in oklch, var(--sem-add), transparent 90%);
  --code-add-ink: #146b33;
  --code-del-bg: color-mix(in oklch, var(--sem-del), transparent 90%);
  --code-del-ink: #a83234;
  --glow: 0 0 0 1px color-mix(in oklch, var(--accent), transparent 50%);
  --shadow: 0 6px 18px -10px rgba(0, 0, 0, 0.28);
  --scan: rgba(0,0,0,0.015);
  --scrim: rgba(30, 30, 30, 0.34);
  --desk-1: #c4c4c4;
  --desk-2: #a8a8a8;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family:var(--font-ui);
  font-size: var(--fs-ui);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.01em;
}

#root { height: 100vh; }

/* background texture: faint grid + accent vignette */
.bg-texture {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 34px 34px;
}
.bg-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(60% 50% at 18% 0%, rgba(var(--accent-rgb), 0.10), transparent 70%),
    radial-gradient(50% 50% at 100% 100%, rgba(var(--accent-2-rgb), 0.07), transparent 70%);
}

/* ---------- desktop window chrome ---------- */
.os {
  position: fixed; inset: 0; overflow: hidden; display: flex;
  transition: padding 0.36s cubic-bezier(.2,.7,.2,1);
}
.os .desktop {
  position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s ease; z-index: 0;
  background: radial-gradient(90% 70% at 50% -10%, var(--desk-1), var(--desk-2) 72%);
}

.os:not(.win-max) .desktop { opacity: 1; }

.appwin {
  position: relative; flex: 1 1 auto; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
  border: 1px solid transparent; z-index: 1;
  transition: border-radius 0.36s ease, box-shadow 0.36s ease, opacity 0.3s ease,
    transform 0.36s cubic-bezier(.2,.7,.2,1), border-color 0.36s ease;
  transform-origin: 9% 100%;
}
.win-normal { padding: 30px; }
.win-normal .appwin {
  border-radius: 13px; border-color: var(--hair-2);
  box-shadow: 0 44px 130px -34px rgba(0,0,0,.82);
}
.win-min .appwin { transform: translateY(120%) scale(.22); opacity: 0; pointer-events: none; }
.win-hidden .appwin { transform: scale(.975); opacity: 0; pointer-events: none; }
.win-closed .appwin { transform: scale(.985); opacity: 0; pointer-events: none; }

/* window-control buttons */
.winbtn {
  height: 100%; width: 36px; display: grid; place-items: center;
  border: none; background: transparent; color: var(--ink-3); cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.winbtn:hover { background: var(--panel-3); color: var(--ink); }
.winbtn.danger:hover { background: var(--sem-del); color: var(--on-solid); }

/* factorized top-bar action group: run/pause · theme · settings */
.action-pill {
  display: flex; align-items: stretch; height: 30px;
  border: 1px solid var(--hair); border-radius: var(--r-sm);
  background: var(--panel-2); overflow: hidden; flex: none;
}
.action-pill .pill-seg {
  min-width: 32px; padding: 0 9px; display: grid; place-items: center;
  background: transparent; border: none; color: var(--ink-2); cursor: pointer;
  transition: background 0.12s, color 0.12s, filter 0.12s;
}
.action-pill .pill-seg:hover { background: var(--panel-3); color: var(--ink); }
.action-pill .pill-div { width: 1px; align-self: stretch; background: var(--hair); flex: none; }
.action-pill .pill-seg.run {
  padding: 0 11px;
  color: var(--ui-on-fill);
  background: var(--ui-fill);
}
.action-pill .pill-seg.run:hover { filter: brightness(1.06); }

.action-pill .pill-seg.run.running {
  background: transparent; color: var(--ink-2); box-shadow: none;
}
.action-pill .pill-seg.run.running:hover { background: var(--panel-3); color: var(--ink); }

/* taskbar pill / tray chip / closed card live on the desktop */
.os-float {
  position: absolute; z-index: 50; display: flex; align-items: center; gap: 9px;
  background: var(--panel); border: 1px solid var(--hair-2); border-radius: 11px;
  box-shadow: var(--shadow); cursor: pointer; color: var(--ink); font-family: var(--font-ui);
}

/* ---------- shell grid ---------- */
.shell {
  position: relative;
  z-index: 1;
  height: 100%;
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: grid;
  grid-template-rows: 44px 1fr 24px;
  /* minmax(0,…) — otherwise the column's automatic minimum is the header's
     min-content (~1160px) and every row overflows a narrower window */
  grid-template-columns: minmax(0, 1fr);
}

.workspace {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--right-w);
  min-height: 0;
  overflow: hidden;
}
.workspace.no-right { grid-template-columns: var(--sidebar-w) 1fr; }
.workspace.compact { grid-template-columns: var(--rail-w) 1fr var(--right-w); }
.workspace.compact.no-right { grid-template-columns: var(--rail-w) 1fr; }

/* scrollbars */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb {
  background: var(--hair-2);
  border-radius: 6px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- skeleton / loading shimmer ---------- */
.skel {
  display: inline-block;
  background: var(--panel-2);
  background-image: linear-gradient(90deg,
    color-mix(in oklch, var(--panel-2), transparent 0%) 0%,
    color-mix(in oklch, var(--ink-4), transparent 78%) 50%,
    color-mix(in oklch, var(--panel-2), transparent 0%) 100%);
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: skel-shimmer 1.25s ease-in-out infinite;
  border-radius: var(--r-sm);
  flex: none;
}
@keyframes skel-shimmer {
  0%   { background-position: 140% 0; }
  100% { background-position: -140% 0; }
}
[data-motion="off"] .skel { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel-fade { animation: skel-fade-in 0.35s ease both; }
@keyframes skel-fade-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- generic atoms ---------- */
.mono { font-family: var(--font-mono); }
.disp { font-family: var(--font-disp); letter-spacing: -0.02em; }
.tnum { font-variant-numeric: tabular-nums; }
.up { text-transform: uppercase; letter-spacing: 0.12em; }

.dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex: none; position: relative;
}
.dot::after {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  background: inherit; opacity: 0.45; filter: blur(3px); z-index: -1;
}
.dot.running { background: var(--st-running); animation: pulse 1.4s ease-in-out infinite; }
.dot.blocked { background: var(--st-blocked); animation: pulse 1.1s ease-in-out infinite; }
.dot.waiting { background: var(--st-waiting); }
.dot.done { background: var(--st-done); }
.dot.idle { background: var(--st-idle); }
.dot.queued { background: var(--st-idle); animation: pulse 2s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
  50% { opacity: 0.55; }
}

.btn {
  font-family: var(--font-ui);
  font-size: var(--fs-ui);
  color: var(--ink-2);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  padding: 5px 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.13s ease;
  white-space: nowrap;
  user-select: none;
}
.btn:hover { color: var(--ink); background: var(--panel-3); }
.btn.ghost-hair { border-color: var(--hair); }
.btn.ghost-hair:hover { border-color: var(--hair-2); }
.btn.primary {
  color: var(--ui-on-fill);
  background: var(--ui-fill);
  font-weight: 600;
}
.btn.primary:hover { filter: brightness(1.06); color: var(--ui-on-fill); }

.btn:disabled { opacity: 0.4; cursor: default; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--hair); color: var(--ink-2);
  background: var(--panel-2); white-space: nowrap;
}

.kbd {
  font-size: 10px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--hair-2); color: var(--ink-3);
  background: var(--panel-2); line-height: 1.6;
}

.divider { height: 1px; background: var(--hair); }
.vdiv { width: 1px; background: var(--hair); align-self: stretch; }

/* tag picker / filter rows */
.tag-row {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 6px 9px; border: none; border-radius: var(--r-sm); cursor: pointer;
  background: transparent; color: var(--ink-2); font-family: var(--font-ui);
  font-size: 11.5px; transition: background 0.12s, color 0.12s;
}
.tag-row:hover { background: var(--panel-2); color: var(--ink); }
.tag-row .tag-check {
  width: 15px; height: 15px; flex: none; border-radius: 4px; display: grid; place-items: center;
  border: 1px solid var(--hair-2); color: var(--ui-on-fill); transition: background 0.12s, border-color 0.12s;
}
.tag-row .tag-check.on { background: var(--ui-fill); border-color: var(--ui-focus); }

.tag-row .tag-count { margin-left: auto; font-size: 9.5px; color: var(--ink-4); }

.icon { width: 15px; height: 15px; flex: none; display: inline-block; vertical-align: middle; }
.icon-sm { width: 13px; height: 13px; }
.icon-lg { width: 18px; height: 18px; }

/* card surface */
.surface {
  background: var(--panel);
  border: 1px solid var(--hair);
  border-radius: var(--r-lg);
}

.scroll-y { overflow-y: auto; overflow-x: hidden; min-height: 0; }

/* gradient text */
.grad-ink {
  background: linear-gradient(100deg, var(--brand-2), var(--brand-3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

/* focus ring panel */
.focus-glow { box-shadow: var(--glow); }

/* streaming caret */
.caret::after {
  content: '▋'; color: var(--st-running);
  animation: blink 1s steps(2) infinite; margin-left: 1px;
}
@keyframes blink { 50% { opacity: 0; } }

/* subtle entrance — transform only, so content is NEVER hidden if the
   animation doesn't play (e.g. background-throttled tab / reduced motion) */
@keyframes rise {
  from { transform: translateY(7px); }
  to { transform: none; }
}
.rise { animation: rise 0.32s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } }

/* activity bar (running) */
.activity {
  height: 2px; border-radius: 2px; overflow: hidden;
  background: var(--hair); position: relative;
}
.activity::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 38%;

/* tree + project rows */
.tree-row:hover { background: var(--panel-2); }
.proj-row:hover { background: var(--panel-2); }

  background-repeat: no-repeat;
}

.field-label { font-size: 9.5px; color: var(--ink-3); display: block; margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.12em; }

/* split-pane dividers */
.divider { position: relative; background: transparent; }
.divider::after { content: ""; position: absolute; }
.divider.v::after { inset: 0 -5px; cursor: col-resize; }
.divider.h::after { inset: -5px 0; cursor: row-resize; }
.divider .grip-handle {
  background: var(--ui-line);
  border-radius: 999px; position: relative; z-index: 1;

}
.divider:hover .grip-handle, .divider.on .grip-handle {
  background: var(--ui-fill); ;
}

<script>
/* Orrery boot sequence — the mark draws itself as an epicycloid: a pen riding an
   epicycle of radius 13 on a deferent of radius 22 at frequency -4.
   Exposed as window.OrreryBoot(host, {inline}) so the spec can replay it. */
(function () {
  var A = 22, B = 13, K = -4, TAU = Math.PI * 2, seq = 0;
  function epi(t) { return [50 + A * Math.cos(t) + B * Math.cos(K * t), 50 + A * Math.sin(t) + B * Math.sin(K * t)]; }
  var N = 140, PD = "";
  for (var i = 0; i <= N; i++) { var t = i / N * TAU, p = epi(t); PD += (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2) + " "; }
  PD += "Z";
  var MSGS = ['initializing orchestrator','mounting worktrees','linking agents','warming terminals','ready'];

  /* The runtime (React + Babel transpiling ~34 inline blocks) blocks the main
     thread for seconds, which starved the draw loop and made the splash
     stutter. So the splash paints its first frame immediately, holds there
     while the runtime boots, and only starts its clock once the app has
     mounted — the draw then runs on an idle main thread. */
  var pending = [];
  window.OrreryBootBegin = function () {
    var q = pending; pending = null;
    for (var i = 0; i < q.length; i++) q[i]();
  };

  window.OrreryBoot = function (host, opts) {
    opts = opts || {};
    var id = ++seq, S = opts.inline ? 118 : 156, inline = !!opts.inline;
    host.classList.add('boot');
    if (inline) host.classList.add('boot-inline');
    host.classList.remove('done');
    host.innerHTML =
      '<div class="boot-mark"><span class="boot-halo"></span><svg width="' + S + '" height="' + S + '" viewBox="0 0 100 100" fill="none" aria-label="Orrery">' +
        '<defs>' +
          '<linearGradient id="bg' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brand-1)"/><stop offset=".5" stop-color="var(--brand-2)"/><stop offset="1" stop-color="var(--brand-3)"/></linearGradient>' +
          '<radialGradient id="bc' + id + '"><stop offset="0" stop-color="var(--brand-core)"/><stop offset=".42" stop-color="var(--brand-2)"/><stop offset="1" stop-color="var(--brand-2)" stop-opacity="0"/></radialGradient>' +
        '</defs>' +
        '<circle cx="50" cy="50" r="22" fill="none" stroke="var(--ink-4)" stroke-width=".6" stroke-opacity=".3"/>' +
        '<path class="b-path" d="' + PD + '" fill="none" stroke="url(#bg' + id + ')" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
        '<g class="b-epi-g"><circle class="b-epi" cx="50" cy="50" r="13" fill="none" stroke="var(--ink-4)" stroke-width=".6" stroke-opacity=".4"/></g>' +
        '<line class="b-arm" stroke="var(--brand-3)" stroke-width="1" stroke-opacity=".6"/>' +
        '<circle class="boot-core-pulse" cx="50" cy="50" r="8.5" fill="url(#bc' + id + ')"/>' +
        '<g class="b-pen-g"><circle class="b-pen" cx="50" cy="50" r="4" fill="var(--brand-3)"/></g>' +
      '</svg></div>' +
      '<div class="boot-word"><span class="o">O</span>rrery</div>' +
      '<div class="boot-status">' + MSGS[0] + '</div>' +
      '<div class="boot-bar"><i></i></div>';

    var path = host.querySelector('.b-path'), penG = host.querySelector('.b-pen-g'),
        epcG = host.querySelector('.b-epi-g'), arm = host.querySelector('.b-arm'),
        word = host.querySelector('.boot-word'), status = host.querySelector('.boot-status'),
        bar = host.querySelector('.boot-bar > i');
    var L = path.getTotalLength();
    path.style.strokeDasharray = L; path.style.strokeDashoffset = L;

    var DUR = 2200, start = 0, wordIn = false, mi = -1, dismissed = false;
    function ease(x) { return 1 - Math.pow(1 - x, 3); }
    function dismiss() {
      if (inline || dismissed) return; dismissed = true;
      host.classList.add('done');
      setTimeout(function () { if (host.parentNode) host.parentNode.removeChild(host); }, 700);
    }
    function finish() {
      epcG.style.transition = arm.style.transition = 'opacity .3s';
      epcG.style.opacity = 0; arm.style.opacity = 0;
      var s = epi(0); penG.setAttribute('transform', 'translate(' + (s[0] - 50).toFixed(2) + ',' + (s[1] - 50).toFixed(2) + ')');
      setTimeout(dismiss, 520);
    }
    function frame(now) {
      /* read first, then one batched write pass — the pen and the epicycle each
         move as a <g> transform, the bar scales, nothing triggers layout */
      if (!start) start = now;
      var p = Math.min(1, (now - start) / DUR), e = ease(p);
      var t = e * TAU, dx = A * Math.cos(t), dy = A * Math.sin(t), pp = epi(t);
      var idx = Math.min(MSGS.length - 1, Math.floor(p * MSGS.length));
      path.style.strokeDashoffset = L * (1 - e);
      epcG.setAttribute('transform', 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')');
      penG.setAttribute('transform', 'translate(' + (pp[0] - 50).toFixed(2) + ',' + (pp[1] - 50).toFixed(2) + ')');
      arm.setAttribute('x1', (50 + dx).toFixed(2)); arm.setAttribute('y1', (50 + dy).toFixed(2));
      arm.setAttribute('x2', pp[0].toFixed(2)); arm.setAttribute('y2', pp[1].toFixed(2));
      bar.style.transform = 'scaleX(' + e.toFixed(4) + ')';
      if (idx !== mi) { mi = idx; status.textContent = MSGS[idx]; }
      if (p >= 0.45 && !wordIn) { wordIn = true; word.classList.add('in'); }
      if (p < 1) requestAnimationFrame(frame); else finish();
    }
    setTimeout(function () { status.classList.add('in'); }, 140);
    var run = function () {
      if (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) {
        path.style.strokeDashoffset = 0; word.classList.add('in'); status.classList.add('in');
        bar.style.transform = 'scaleX(1)'; epcG.style.opacity = 0; arm.style.opacity = 0;
        setTimeout(dismiss, 800);
      } else {
        requestAnimationFrame(frame);
        /* rAF is paused in background tabs; make sure the splash still resolves */
        setTimeout(function () { if (!dismissed && start) { path.style.strokeDashoffset = 0; bar.style.transform = 'scaleX(1)'; word.classList.add('in'); finish(); } else if (!dismissed) { dismiss(); } }, DUR + 1400);
      }
    };
    /* hold the first frame until the app has mounted (or 6s, whichever comes
       first) so the draw never competes with the transpile for the main thread */
    if (inline || !pending) run(); else { pending.push(run); setTimeout(function () { if (pending) { pending = null; run(); } }, 6000); }
    if (!inline) host.addEventListener('click', dismiss); // click to skip
  };

  window.OrreryBoot(document.getElementById('boot'));
})();
</script>

<script>
/* global window */
// Orrery — agent-scoped git inspection data builders.
// Derives per-agent branch history, blame, file history and conflict sessions
// from the existing AGENTS / COMMITS / DIFFS, reusing window.GIT (authors,
// conflict template) registered by repo-data.js.

(function () {
  const G = window.GIT;
  const AGENTS = window.AGENTS || [];
  const COMMITS = window.COMMITS || [];
  const DIFFS = window.DIFFS || {};
  const TOOLS = window.AGENT_TOOLS || [];
  const glyph = { claude: "✳", codex: "◆", cursor: "▸", gemini: "✦" };

  // register each agent as a commit author (tool-colored)
  AGENTS.forEach((ag) => {
    const tm = TOOLS.find((t) => t.id === ag.tool) || {};
    G.authors["self_" + ag.id] = { name: ag.name, short: glyph[ag.tool] || "A", color: tm.accent || "var(--ui-ink)", kind: "agent", tool: ag.tool };
  });

  // reuse each agent's rich primary-file diff under its head sha
  AGENTS.forEach((ag) => {
    const d = DIFFS[ag.id];
    const c = COMMITS.find((x) => x.agent === ag.id);
    if (d && c) G.commitDiffs[c.sha + "/" + d.file] = { lang: d.lang, hunks: d.hunks };
  });

  const shaFrom = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h.toString(16).padStart(7, "0").slice(0, 7); };
  const baseAuthors = ["mara", "devin", "priya", "tom"];
  const relForBase = { mara: "5d", devin: "1w", priya: "3d", tom: "4d" };

  // ---- branch commit history (newest → oldest) ----
  function agentHistory(ag) {
    const self = "self_" + ag.id;
    const headCommit = COMMITS.find((x) => x.agent === ag.id);
    const files = ag.files && ag.files.length ? ag.files : [{ path: "src/" + ag.name.replace(/[^a-z0-9]/gi, "-") + ".ts", state: "M", add: 8, del: 2 }];
    const out = [];
    if (headCommit) {
      out.push({ sha: headCommit.sha, author: self, rel: headCommit.when, date: "today", msg: headCommit.msg, files, head: true });
    }
    // earlier scaffold commits derived from the task
    const n = Math.max(1, Math.min(3, ag.commits || 1));
    const subjects = [
      "wip: " + ag.name + " — implement core path",
      "test: cover " + ag.name + " edge cases",
      "chore: branch from " + ag.base,
    ];
    for (let i = 0; i < n; i++) {
      const subFiles = files.slice(0, Math.max(1, files.length - 1 - i));
      out.push({ sha: shaFrom(ag.id + "c" + i), author: self, rel: (i + 2) + "h", date: "today", msg: subjects[i % subjects.length], files: subFiles.length ? subFiles : files.slice(0, 1) });
    }
    return out;
  }

  // ---- per-line blame for an agent file ----
  function agentBlame(ag, path) {
    const lines = (window.getFileLines ? window.getFileLines(path, ag) : []).slice(0, 40);
    const headCommit = COMMITS.find((x) => x.agent === ag.id);
    const headSha = headCommit ? headCommit.sha : ag.base;
    const ages = [1.0, 0.62, 0.42];
    return lines.map((ln, i) => {
      if (ln.add) {
        return { n: ln.n, s: ln.s, sha: headSha, author: "self_" + ag.id, rel: "now", age: 0.05 };
      }
      const a = baseAuthors[(i + path.length) % baseAuthors.length];
      return { n: ln.n, s: ln.s, sha: ag.base, author: a, rel: relForBase[a], age: ages[i % ages.length] };
    });
  }

  // ---- file history (revisions touching a file) ----
  function agentFileHistory(ag, path) {
    const d = DIFFS[ag.id];
    const headCommit = COMMITS.find((x) => x.agent === ag.id);
    const cf = (ag.files || []).find((f) => f.path === path) || { add: 8, del: 3 };
    const fn = (window.fileName || ((p) => p))(path);
    const revisions = [
      { sha: headCommit ? headCommit.sha : shaFrom(ag.id + path), author: "self_" + ag.id, rel: headCommit ? headCommit.when : "now", date: "today", msg: headCommit ? headCommit.msg : "edit " + fn, add: cf.add, del: cf.del },
      { sha: ag.base, author: "mara", rel: "5d", date: "Jun 11", msg: "feat: earlier work on " + fn, add: 22, del: 6 },
      { sha: shaFrom("scaffold" + path), author: "devin", rel: "1w", date: "Jun 09", msg: "chore: scaffold " + fn, add: 14, del: 0 },
    ];
    const diff = d && d.file === path ? { lang: d.lang, hunks: d.hunks } : (window.synthDiff ? window.synthDiff({ path, state: "M", add: cf.add, del: cf.del }) : { lang: "text", hunks: [] });
    return { path, lang: (window.langOf || (() => "text"))(path), revisions, diff };
  }

  // ---- which agents currently have an in-progress conflicted merge ----
  const CONFLICT_AGENTS = ["b2"]; // jwt-refresh (auth/jwt.ts) — matches the conflict template
  function agentHasConflict(ag) { return CONFLICT_AGENTS.includes(ag.id); }

  function agentConflict(ag, project) {
    const base = G.conflict;
    const target = project ? project.branch : "main";
    const mine = ag.branch.replace("agent/", "");
    return Object.assign({}, base, {
      op: "merge",
      title: "Merge " + target + " → " + mine,
      ours: mine,
      theirs: target,
    });
  }

  window.AGENT_GIT = { agentHistory, agentBlame, agentFileHistory, agentHasConflict, agentConflict };
})();

</script>

function fmtDur(sec) {

function Spark({ data, color, w = 60, h = 18 }) {
  const max = Math.max(...data, 1);

  const pts = data.map((v, i) => `${i * step},${h - (v / max) * (h - 2) - 1}`).join(" ");
  return (
    <svg width={w} height={h} style={{ display: "block" }}>

  );
}

function Ring({ value, size = 30, stroke = 3, color }) {

}

function getFileLines(path, agent) {

  }
  return stubLines(path);
}

function stubLines(path) {
  const name = fileName(path).replace(/\.[^.]+$/, "");
  const ext = (path.split(".").pop() || "").toLowerCase();
  const cap = name.replace(/(^|[-_])(\w)/g, (_, __, c) => c.toUpperCase());
  let body;
  if (ext === "json") body = `{\n  "name": "${name}",\n  "version": "1.0.0"\n}`;
  else if (ext === "css") body = `.${name} {\n  display: flex;\n  gap: var(--space-2);\n}`;
  else if (ext === "tf") body = `resource "aws_${name}" "this" {\n  name = var.name\n  tags = { env = var.env }\n}`;
  else if (ext === "md") body = `# ${cap}\n\nDocumentation for ${name}.`;
  else if (ext === "sql") body = `-- ${name}\nCREATE TABLE ${name} (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  created_at timestamptz NOT NULL DEFAULT now()\n);`;
  else if (ext === "tsx" || ext === "jsx") body = `import React from 'react';\n\nexport function ${cap}() {\n  return <div className="${name}" />;\n}`;
  else body = `// ${path}\nimport { logger } from '../lib/log';\n\nexport function ${name.replace(/[^a-zA-Z0-9]/g, "")}() {\n  logger.debug('${name}');\n  return null;\n}`;
  return body.split("\n").map((s, i) => ({ n: i + 1, s }));
}

const KW = new RegExp("\\b(" + ["import","from","export","default","const","let","var","function","return","async","await","if","else","for","while","class","extends","new","try","catch","throw","type","interface","public","private","this","void","null","undefined","true","false","resource","module","variable","required_providers","describe","it","expect"].join("|") + ")\\b", "g");

// very light tokenizer → array of React spans (no external deps)
function highlight(line, lang) {
  if (line == null) return " ";
  const trimmed = line.trimStart();
  if (trimmed.startsWith("//") || trimmed.startsWith("#") || trimmed.startsWith("--") || trimmed.startsWith("*")) {
    return <span style={{ color: "var(--ink-4)", fontStyle: "italic" }}>{line || " "}</span>;
  }
  const out = [];
  // split by strings first, then keyword-highlight the rest
  const re = /("[^"]*"|'[^']*'|`[^`]*`)/g;
  let last = 0, m, key = 0;
  const pushPlain = (txt) => {
    let li = 0, km;
    KW.lastIndex = 0;
    while ((km = KW.exec(txt))) {
      if (km.index > li) out.push(<span key={key++}>{txt.slice(li, km.index)}</span>);
      out.push(<span key={key++} style={{ color: "var(--ui-ink)" }}>{km[0]}</span>);
      li = km.index + km[0].length;
    }
    if (li < txt.length) out.push(<span key={key++}>{txt.slice(li)}</span>);
  };
  while ((m = re.exec(line))) {
    if (m.index > last) pushPlain(line.slice(last, m.index));
    out.push(<span key={key++} style={{ color: "var(--code-add-ink)" }}>{m[0]}</span>);
    last = m.index + m[0].length;
  }
  if (last < line.length) pushPlain(line.slice(last));
  return out.length ? out : " ";
}
