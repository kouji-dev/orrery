// layout, gutter widths, +/- inks and hunk-meta band.

const { useState: useStateD } = React;
const GA = () => window.GIT.authors;

// ---- author avatar (initials chip, colored per author) ----
function AuthorAvatar({ id, size = 18 }) {
  const a = GA()[id] || { short: "?", color: "var(--ink-3)" };
  return (
    <span title={a.name} style={{
      width: size, height: size, flex: "none", borderRadius: a.kind === "agent" ? 5 : "50%",
      display: "grid", placeItems: "center", fontSize: size * 0.46, fontWeight: 700, lineHeight: 1,
      color: a.color, background: "color-mix(in oklch, " + a.color + ", transparent 84%)",
      border: "1px solid color-mix(in oklch, " + a.color + ", transparent 60%)",
    }}>{a.short}</span>
  );
}
function authorName(id) { return (GA()[id] || {}).name || id; }

// ---- sha chip ----
function Sha({ sha, onClick, dim }) {
  return (
    <span className="chip tnum" onClick={onClick}
      style={{ fontSize: 9.5, padding: "0 6px", letterSpacing: "0.02em", cursor: onClick ? "pointer" : "default",
        color: dim ? "var(--ink-3)" : "var(--ink-2)" }}
      onMouseEnter={onClick ? (e) => { e.currentTarget.style.color = "var(--ink)"; e.currentTarget.style.borderColor = "var(--hair-2)"; } : undefined}
      onMouseLeave={onClick ? (e) => { e.currentTarget.style.color = dim ? "var(--ink-3)" : "var(--ink-2)"; e.currentTarget.style.borderColor = "var(--hair)"; } : undefined}>
      {sha}
    </span>
  );
}

// ---- per-file state badge (A/M/D/R) ----
function RStateBadge({ state }) {
  const c = state === "A" ? "var(--vcs-added)" : state === "D" ? "var(--vcs-deleted)" : state === "R" ? "var(--vcs-renamed)" : "var(--vcs-modified)";
  const bg = state === "A" ? "color-mix(in oklch, var(--vcs-added), transparent 88%)" : state === "D" ? "transparent" : state === "R" ? "color-mix(in oklch, var(--vcs-renamed), transparent 88%)" : "color-mix(in oklch, var(--vcs-modified), transparent 88%)";
  return (
    <span style={{ flex: "none", width: 15, height: 15, borderRadius: 3, display: "grid", placeItems: "center",
      fontSize: 9, fontWeight: 700, color: c, background: bg }}>{state}</span>
  );
}

function AddDel({ add, del, gap = 4 }) {
  return (
    <span className="tnum" style={{ display: "flex", gap, fontSize: 9.5, flex: "none" }}>
      {add > 0 && <span style={{ color: "var(--code-add-ink)" }}>+{add}</span>}
      {del > 0 && <span style={{ color: "var(--code-del-ink)" }}>−{del}</span>}
    </span>
  );
}

// =========================================================================
// HunkRows — THE diff renderer. Optional per-line render-prefix (gutter
// checkboxes for partial-commit) and per-line click.
// =========================================================================
function HunkRows({ hunks, lang, lead, onLineClick, lineStyle }) {
  return hunks.map((h, hi) => (
    <div key={hi}>
      <div style={{ display: "flex", alignItems: "center", padding: "5px 14px", fontSize: 11, color: "var(--ink-2)",
        background: "var(--side-a)", borderTop: hi ? "1px solid var(--hair)" : "none" }}>
        {lead && lead.hunkHead ? lead.hunkHead(h, hi) : null}
        <span className="tnum" style={{ opacity: 0.95 }}>{h.meta}</span>
      </div>
      {h.lines.map((ln, li) => {
        const k = ln.k;
        const bg = lineStyle ? lineStyle(h, ln, li) : (k === "+" ? "var(--code-add-bg)" : k === "-" ? "var(--code-del-bg)" : "transparent");
        return (
          <div key={li} onClick={onLineClick ? () => onLineClick(h, ln, li) : undefined}
            style={{ display: "flex", fontSize: 12, lineHeight: 1.7, background: bg, cursor: onLineClick ? "pointer" : "default" }}>
            {lead && lead.lineHead ? lead.lineHead(h, ln, li) : null}
            <span className="tnum" style={{ width: 44, flex: "none", textAlign: "right", padding: "0 10px 0 0", color: "var(--ink-4)", userSelect: "none" }}>{ln.n}</span>
            <span style={{ width: 16, flex: "none", textAlign: "center", userSelect: "none",
              color: k === "+" ? "var(--code-add-ink)" : k === "-" ? "var(--code-del-ink)" : "var(--ink-4)" }}>{k}</span>
            <span style={{ flex: 1, whiteSpace: "pre-wrap", wordBreak: "break-word", paddingRight: 14,
              color: k === "+" ? "var(--code-add-ink)" : k === "-" ? "var(--code-del-ink)" : "var(--ink-2)" }}>{ln.s || " "}</span>
          </div>
        );
      })}
    </div>
  ));
}

// ---- file header band (sticky) used above a diff ----
function DiffFileHeader({ path, lang, right, left }) {
  return (
    <div style={{ position: "sticky", top: 0, display: "flex", alignItems: "center", gap: 8, padding: "8px 14px",
      background: "var(--panel)", borderBottom: "1px solid var(--hair)", fontSize: 11.5, zIndex: 2, flex: "none" }}>
      {left}
      <Icon name="file" size="sm" style={{ color: "var(--ink-3)" }} />
      <span style={{ color: "var(--ink-4)" }}>{fileDir(path)}</span>
      <span style={{ marginLeft: -6 }}>{fileName(path)}</span>
      {right}
      <span className="chip" style={{ marginLeft: "auto", fontSize: 9.5 }}>{lang || langOf(path)}</span>
    </div>
  );
}

// ---- a complete scrollable diff for one file ----
// When `agentId` is supplied, the diff is rendered through ReviewCode so the
// reviewer can drop inline comments here too (commit / range "changes" diffs).
// `view` namespaces comments per diff context so anchors don't collide.
function FileDiff({ path, diff, headerRight, agentId, view }) {
  if (!diff) return <div style={{ display: "grid", placeItems: "center", color: "var(--ink-4)", fontSize: 12, padding: 30 }}>no textual diff</div>;
  const header = <DiffFileHeader path={path} lang={diff.lang} right={headerRight} />;
  if (agentId && typeof ReviewCode === "function") {
    return <ReviewCode agentId={agentId} file={path} view={view || "diff"} rows={diffToRows(diff)} lang={diff.lang} sticky={header} />;
  }
  return (
    <div className="scroll-y mono" style={{ flex: 1, background: "var(--bg)", minHeight: 0 }}>
      {header}
      <HunkRows hunks={diff.hunks} lang={diff.lang} />
    </div>
  );
}

// =========================================================================
// fallback diff synthesizer for (sha,path) pairs without an explicit diff.
// keeps the long tail of history clickable without authoring every hunk.
// =========================================================================
function synthDiff(file) {
  const lang = langOf(file.path);
  const base = file.path.split("/").pop().replace(/\.[^.]+$/, "");
  const cap = base.replace(/(^|[-_])(\w)/g, (_, __, c) => c.toUpperCase());
  if (file.state === "A") {
    const body = lang === "json"
      ? ['{', '  "name": "' + base + '",', '  "version": "1.0.0"', '}']
      : lang === "sql"
      ? ["CREATE TABLE " + base + " (", "  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),", "  created_at timestamptz NOT NULL DEFAULT now()", ");"]
      : lang === "hcl"
      ? ['resource "aws_' + base + '" "this" {', "  name = var.name", '  tags = { env = var.env }', "}"]
      : ["import { logger } from '../lib/log';", "", "export function " + cap.replace(/[^a-zA-Z0-9]/g, "") + "() {", "  logger.debug('" + base + "');", "}"];
    const show = body.slice(0, Math.max(2, Math.min(body.length, file.add)));
    return { lang, hunks: [{ meta: "@@ -0,0 +1," + file.add + " @@ new file", lines: show.map((s, i) => ({ k: "+", n: i + 1, s })) }] };
  }
  if (file.state === "D") {
    return { lang, hunks: [{ meta: "@@ -1," + file.del + " +0,0 @@ deleted", lines: [
      { k: "-", n: 1, s: "// " + file.path + " removed" },
      { k: "-", n: 2, s: "export {};" },
    ] }] };
  }
  // modified — a believable small edit
  return { lang, hunks: [{ meta: "@@ -8,6 +8,7 @@ " + base, lines: [
    { k: " ", n: 8, s: "export function " + cap.replace(/[^a-zA-Z0-9]/g, "") + "() {" },
    { k: "-", n: 9, s: "  return legacy();" },
    { k: "+", n: 9, s: "  return next();   // " + file.add + " insertions, " + file.del + " deletions" },
    { k: " ", n: 10, s: "}" },
  ] }] };
}

function diffFor(sha, file) {
  const explicit = window.GIT.commitDiffs[sha + "/" + file.path];
  return explicit || synthDiff(file);
}

// =========================================================================
// ChangedFiles — selectable file list (flat + tree), with ± and state badge.
// =========================================================================
function rBuildTree(files) {
  const root = {};
  files.forEach((f) => {
    const parts = f.path.split("/");
    let cur = root;
    parts.forEach((p, i) => {
      const leaf = i === parts.length - 1;
      cur[p] = cur[p] || { name: p, leaf, path: leaf ? f.path : parts.slice(0, i + 1).join("/"), file: leaf ? f : null, children: {} };
      cur = cur[p].children;
    });
  });
  const walk = (obj) => Object.values(obj).sort((a, b) => (a.leaf === b.leaf) ? a.name.localeCompare(b.name) : a.leaf ? 1 : -1)
    .map((n) => n.leaf ? n : { ...n, dir: true, children: walk(n.children) });
  return walk(root);
}

function FileRowFlat({ f, active, onSelect }) {
  return (
    <div onClick={() => onSelect(f.path)}
      style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)", background: active ? "var(--panel-3)" : "transparent" }}
      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
      <RStateBadge state={f.state} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "var(--ink)", textDecoration: f.state === "D" ? "line-through" : "none", opacity: f.state === "D" ? 0.7 : 1 }}>{fileName(f.path)}</div>
        {fileDir(f.path) && <div style={{ fontSize: 9.5, color: "var(--ink-4)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</div>}
      </div>
      <AddDel add={f.add} del={f.del} />
    </div>
  );
}

function DiffTreeRows({ nodes, depth, selPath, onSelect }) {
  return nodes.map((node) => {
    const pad = 8 + depth * 13;
    if (node.dir) {
      return (
        <div key={node.path}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 8px", paddingLeft: pad }}>
            <Icon name="folderOpen" size="sm" style={{ width: 13, height: 13, color: "var(--ink-4)", flex: "none" }} />
            <span style={{ fontSize: 11, color: "var(--ink-3)" }}>{node.name}</span>
          </div>
          <DiffTreeRows nodes={node.children} depth={depth + 1} selPath={selPath} onSelect={onSelect} />
        </div>
      );
    }
    const f = node.file, active = selPath === node.path;
    return (
      <div key={node.path} onClick={() => onSelect(node.path)}
        style={{ display: "flex", alignItems: "center", gap: 7, padding: "4px 10px", paddingLeft: pad + 4, cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)", background: active ? "var(--panel-3)" : "transparent" }}
        onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
        onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
        <RStateBadge state={f.state} />
        <span style={{ flex: 1, fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: active ? "var(--ink)" : "var(--ink-2)", textDecoration: f.state === "D" ? "line-through" : "none", opacity: f.state === "D" ? 0.7 : 1 }}>{node.name}</span>
        <AddDel add={f.add} del={f.del} />
      </div>
    );
  });
}

function DiffFileList({ files, selPath, onSelect, title, defaultTree }) {
  const [tree, setTree] = useStateD(!!defaultTree);
  const tot = files.reduce((s, f) => ({ a: s.a + f.add, d: s.d + f.del }), { a: 0, d: 0 });
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, height: "100%" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px 8px 14px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
        <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>{title || "Changed"} · {files.length}</span>
        <AddDel add={tot.a} del={tot.d} />
        <div style={{ marginLeft: "auto", display: "flex", gap: 2, padding: 2, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)" }}>
          {[{ k: true, icon: "graph", label: "Tree" }, { k: false, icon: "dots", label: "Flat" }].map((o) => (
            <button key={o.label} className="btn" onClick={() => setTree(o.k)} title={o.label + " view"}
              style={{ padding: "3px 7px", borderRadius: 4, gap: 5, fontSize: 10,
                background: tree === o.k ? "var(--panel-3)" : "transparent", color: tree === o.k ? "var(--ink)" : "var(--ink-3)",
                boxShadow: tree === o.k ? "0 0 0 1px var(--hair-2)" : "none" }}>
              <Icon name={o.icon} size="sm" style={{ width: 12, height: 12, color: tree === o.k ? "var(--ui-ink)" : "inherit" }} />{o.label}
            </button>
          ))}
        </div>
      </div>
      <div className="scroll-y" style={{ flex: 1, padding: "6px 0" }}>
        {tree
          ? <DiffTreeRows nodes={rBuildTree(files)} depth={0} selPath={selPath} onSelect={onSelect} />
          : files.map((f) => <FileRowFlat key={f.path} f={f} active={selPath === f.path} onSelect={onSelect} />)}
      </div>
    </div>
  );
}

Object.assign(window, {
  AuthorAvatar, authorName, Sha, RStateBadge, AddDel,
  HunkRows, DiffFileHeader, FileDiff, DiffFileList, diffFor, synthDiff,
});

</script>

<!-- repo-conflict.jsx -->
<script type="text/babel">
/* global React, Icon, fileName, fileDir, highlight, RStateBadge */
// Orrery — Repository ▸ Conflicts  (Feature 4)
// 3-way merge/rebase session: conflicted-file list + per-file base/ours/theirs
// with per-conflict accept ours/theirs/both, conflict-to-conflict nav, a
// resolved/remaining counter, and Commit-merge / Continue / Abort actions.

const { useState: useStateC, useRef: useRefC, useMemo: useMemoC } = React;
const GC = () => window.GIT;

function resultLines(seg, r) {
  if (r === "ours") return seg.ours;
  if (r === "theirs") return seg.theirs;
  if (r === "both") return [...seg.ours, ...seg.theirs];
  return null;
}

// one side column (ours / theirs) — hue-free: position + label carry the side
function SideCol({ label, sub, color, lines, chosen, onPick, lang }) {
  return (
    <div style={{ flex: 1, minWidth: 0, border: "1px solid " + (chosen ? color : "var(--hair)"), borderRadius: "var(--r-sm)", overflow: "hidden",
      background: chosen ? "color-mix(in oklch, " + color + ", transparent 92%)" : "var(--panel-2)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "5px 9px", borderBottom: "1px solid var(--hair)", background: "color-mix(in oklch, " + color + ", transparent 88%)" }}>
        <span style={{ width: 7, height: 7, borderRadius: 2, background: color, flex: "none" }} />
        <span style={{ fontSize: 10.5, fontWeight: 600, color: "var(--ink)" }}>{label}</span>
        <span className="tnum" style={{ fontSize: 9, color: "var(--ink-4)" }}>{sub}</span>
        <button className="btn" onClick={onPick} style={{ marginLeft: "auto", padding: "2px 8px", fontSize: 10,
          color: chosen ? "var(--sem-add)" : "var(--ink-3)", border: "1px solid " + (chosen ? "color-mix(in oklch, var(--sem-add), transparent 55%)" : "var(--hair)"),
          background: chosen ? "color-mix(in oklch, var(--sem-add), transparent 88%)" : "transparent" }}>
          {chosen ? <><Icon name="check" size="sm" style={{ width: 11, height: 11 }} />accepted</> : "accept"}
        </button>
      </div>
      <pre style={{ margin: 0, padding: "5px 0", fontFamily: "var(--font-mono)", fontSize: 11.5, lineHeight: 1.65 }}>
        {lines.map((s, i) => (
          <div key={i} style={{ display: "flex" }}>
            <span style={{ width: 14, flex: "none", textAlign: "center", color: color, userSelect: "none", opacity: 0.7 }}>{chosen ? "✓" : "·"}</span>
            <code style={{ flex: 1, whiteSpace: "pre-wrap", wordBreak: "break-word", paddingRight: 10, color: "var(--ink-2)" }}>{highlight(s, lang) }</code>
          </div>
        ))}
      </pre>
    </div>
  );
}

function ConflictBlock({ seg, idx, num, res, lang, ours, theirs, onResolve, onEdit, blockRef, ai }) {
  const [showBase, setShowBase] = useStateC(false);
  const [editing, setEditing] = useStateC(false);
  const resolved = res && res.res;
  const rLines = res && res.custom != null ? res.custom.split("\n") : resultLines(seg, resolved);

  return (
    <div ref={blockRef} style={{ margin: "10px 14px", border: "1px solid " + (resolved ? "color-mix(in oklch, var(--st-done), transparent 60%)" : "color-mix(in oklch, var(--vcs-conflicted), transparent 55%)"),
      borderRadius: "var(--r-md)", overflow: "hidden", background: "var(--panel)" }}>
      {/* conflict header */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 11px",
        background: resolved ? "color-mix(in oklch, var(--st-done), transparent 90%)" : "color-mix(in oklch, var(--vcs-conflicted), transparent 91%)" }}>
        <span style={{ width: 8, height: 8, borderRadius: "50%", flex: "none", background: resolved ? "var(--st-done)" : "var(--vcs-conflicted)" }} />
        <span style={{ fontSize: 11, fontWeight: 600, color: "var(--ink)" }}>Conflict {num}</span>
        <span style={{ fontSize: 10, color: resolved ? "var(--st-done)" : "var(--vcs-conflicted)" }}>{resolved ? "resolved · " + ({ ours: "ours", theirs: "theirs", both: "both sides" }[resolved] || "edited") : "unresolved"}</span>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
          {ai && window.GitActionButton && (
            <window.GitActionButton label="Both" small kind="ghost-hair" flash={ai.flash}
              title="Accept both sides · native, 0 tokens"
              onNative={() => onResolve(idx, "both")}
              estimateInput={{ op: "hunk", conflicts: 1, diffBytes: ((seg.ours || []).join("\n").length + (seg.theirs || []).join("\n").length), model: ai.model }}
              variants={[{ id: "hunk", label: "Resolve this hunk with AI", op: "hunk", icon: "spark", run: (est) => ai.onAI({ scope: "hunk", idx, est }) }]} />
          )}
          {!ai && <button className="btn ghost-hair" onClick={() => onResolve(idx, "both")} style={{ padding: "3px 8px", fontSize: 10 }}>Both</button>}
          <button className="btn ghost-hair" onClick={() => setShowBase((v) => !v)} style={{ padding: "3px 8px", fontSize: 10, color: showBase ? "var(--ink)" : "var(--ink-3)" }}>
            <Icon name={showBase ? "chevronD" : "chevron"} size="sm" style={{ width: 11, height: 11 }} />Base
          </button>
        </div>
      </div>

      {/* base (common ancestor) */}
      {showBase && (
        <div style={{ padding: "6px 0", borderBottom: "1px solid var(--hair)", background: "var(--bg)" }}>
          <div className="up" style={{ fontSize: 8.5, color: "var(--ink-4)", padding: "0 14px 4px" }}>base · common ancestor</div>
          <pre style={{ margin: 0, fontFamily: "var(--font-mono)", fontSize: 11.5, lineHeight: 1.6, color: "var(--ink-3)", padding: "0 14px" }}>{seg.base.join("\n")}</pre>
        </div>
      )}

      {/* ours | theirs */}
      <div style={{ display: "flex", gap: 9, padding: 11 }}>
        <SideCol label="Ours" sub={ours} color="var(--ink-4)" lines={seg.ours} lang={lang}
          chosen={resolved === "ours"} onPick={() => onResolve(idx, "ours")} />
        <SideCol label="Theirs" sub={theirs} color="var(--ink-2)" lines={seg.theirs} lang={lang}
          chosen={resolved === "theirs"} onPick={() => onResolve(idx, "theirs")} />
      </div>

      {/* result (editable) */}
      <div style={{ borderTop: "1px solid var(--hair)", background: "var(--bg)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "5px 12px" }}>
          <Icon name="enter" size="sm" style={{ width: 12, height: 12, color: resolved ? "var(--st-done)" : "var(--ink-4)" }} />
          <span className="up" style={{ fontSize: 8.5, color: "var(--ink-4)" }}>Result</span>
          {resolved && <button className="btn" onClick={() => setEditing((v) => !v)} style={{ marginLeft: "auto", padding: "2px 7px", fontSize: 9.5, color: editing ? "var(--ui-ink)" : "var(--ink-3)" }}>
            <Icon name="rename" size="sm" style={{ width: 11, height: 11 }} />{editing ? "done" : "edit"}
          </button>}
        </div>
        {resolved ? (
          editing ? (
            <textarea autoFocus defaultValue={rLines.join("\n")} onBlur={(e) => { onEdit(idx, e.target.value); setEditing(false); }}
              spellCheck={false}
              style={{ width: "100%", minHeight: 70, resize: "vertical", background: "var(--panel-2)", border: "1px solid var(--ui-focus)", outline: "none",
                color: "var(--code-add-ink)", fontFamily: "var(--font-mono)", fontSize: 11.5, lineHeight: 1.65, padding: "6px 12px 6px 14px" }} />
          ) : (
            <pre style={{ margin: 0, padding: "2px 12px 8px 14px", fontFamily: "var(--font-mono)", fontSize: 11.5, lineHeight: 1.65, background: "var(--code-add-bg)" }}>
              {rLines.map((s, i) => (
                <div key={i} style={{ display: "flex" }}>
                  <span style={{ width: 14, flex: "none", textAlign: "center", color: "var(--code-add-ink)", userSelect: "none" }}>+</span>
                  <code style={{ flex: 1, whiteSpace: "pre-wrap", wordBreak: "break-word", color: "var(--code-add-ink)" }}>{highlight(s, lang)}</code>
                </div>
              ))}
            </pre>
          )
        ) : (
          <div style={{ padding: "10px 14px", fontSize: 10.5, color: "var(--ink-4)", borderTop: "1px dashed var(--hair-2)", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name="flag" size="sm" style={{ width: 12, height: 12, color: "var(--st-blocked)" }} />pick a side above, or accept both, to resolve
          </div>
        )}
      </div>
    </div>
  );
}

function ContextLines({ lines, lang }) {
  return (
    <pre style={{ margin: 0, padding: "2px 0", fontFamily: "var(--font-mono)", fontSize: 11.5, lineHeight: 1.65 }}>
      {lines.map((s, i) => (
        <div key={i} style={{ display: "flex" }}>
          <span style={{ width: 14, flex: "none" }} />
          <code style={{ flex: 1, whiteSpace: "pre-wrap", wordBreak: "break-word", paddingRight: 10, color: "var(--ink-3)", paddingLeft: 14 }}>{highlight(s, lang)}</code>
        </div>
      ))}
    </pre>
  );
}

function ConflictView({ session, onFlash }) {
  const G = GC();
  session = session || G.conflict;
  const [activePath, setActivePath] = useStateC(session.files[0].path);
  // resolutions: { path: { confIdx: {res, custom} } }
  const [resMap, setResMap] = useStateC({});
  const [cursor, setCursor] = useStateC(0); // index within current file's conflicts
  const scrollRef = useRefC(null);
  const blockRefs = useRefC({});

  const file = session.files.find((f) => f.path === activePath);
  const confIdxs = useMemoC(() => file.segments.map((s, i) => s.type === "conflict" ? i : -1).filter((i) => i >= 0), [activePath]);

  const fileRes = resMap[activePath] || {};
  const resolvedCount = (f) => {
    const rm = resMap[f.path] || {};
    return f.segments.filter((s, i) => s.type === "conflict" && rm[i] && rm[i].res).length;
  };
  const totalConf = session.files.reduce((s, f) => s + f.conflicts, 0);
  const totalResolved = session.files.reduce((s, f) => s + resolvedCount(f), 0);
  const allDone = totalResolved === totalConf;

  const resolve = (confIdx, res) => {
    setResMap((m) => ({ ...m, [activePath]: { ...(m[activePath] || {}), [confIdx]: { res, custom: null } } }));
  };
  const editResult = (confIdx, custom) => {
    setResMap((m) => ({ ...m, [activePath]: { ...(m[activePath] || {}), [confIdx]: { ...(m[activePath] || {})[confIdx], custom } } }));
  };

  const gotoConf = (dir) => {
    const next = Math.max(0, Math.min(confIdxs.length - 1, cursor + dir));
    setCursor(next);
    const el = blockRefs.current[confIdxs[next]];
    if (el && scrollRef.current) scrollRef.current.scrollTop = el.offsetTop - 70;
  };

  const acceptAll = (side) => {
    setResMap((m) => {
      const fm = { ...(m[activePath] || {}) };
      confIdxs.forEach((ci) => { fm[ci] = { res: side, custom: null }; });
      return { ...m, [activePath]: fm };
    });
    onFlash && onFlash("accepted " + side + " for all conflicts in " + fileName(activePath));
  };

  return (
    <div style={{ flex: 1, display: "grid", gridTemplateColumns: "292px 1fr", minHeight: 0, background: "var(--panel-2)" }}>
      {/* conflicted file list + session actions */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)" }}>
        <div style={{ padding: "10px 14px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <Icon name="merge" size="sm" style={{ color: "var(--st-blocked)" }} />
            <span style={{ fontSize: 12, fontWeight: 600, color: "var(--ink)" }}>{session.title}</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, fontSize: 10, color: "var(--ink-4)" }} className="tnum">
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 7, height: 7, borderRadius: 2, background: "var(--ink-4)" }} />ours · {session.ours}</span>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 7, height: 7, borderRadius: 2, background: "var(--ink-2)" }} />theirs · {session.theirs}</span>
          </div>
          {/* progress */}
          <div style={{ marginTop: 11 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9.5, color: "var(--ink-3)", marginBottom: 5 }} className="tnum">
              <span>{totalResolved} resolved</span><span>{totalConf - totalResolved} remaining</span>
            </div>
            <div className="meter"><i style={{ width: (totalResolved / totalConf * 100) + "%", background: allDone ? "var(--st-done)" : "var(--ui-ind)" }} /></div>
          </div>
        </div>

        <div className="scroll-y" style={{ flex: 1, padding: "6px 0" }}>
          {session.files.map((f) => {
            const rc = resolvedCount(f), done = rc === f.conflicts, active = f.path === activePath;
            return (
              <div key={f.path} onClick={() => { setActivePath(f.path); setCursor(0); }}
                style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)", background: active ? "var(--panel-3)" : "transparent" }}
                onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
                onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                <span style={{ flex: "none", width: 15, height: 15, borderRadius: "50%", display: "grid", placeItems: "center",
                  background: done ? "var(--st-done)" : "color-mix(in oklch, var(--st-blocked), transparent 80%)", border: done ? "none" : "1px solid color-mix(in oklch, var(--st-blocked), transparent 50%)" }}>
                  {done ? <Icon name="check" size="sm" style={{ width: 10, height: 10, color: "var(--ui-on-fill)" }} /> : <span style={{ width: 5, height: 5, borderRadius: "50%", background: "var(--st-blocked)" }} />}
                </span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileName(f.path)}</div>
                  <div style={{ fontSize: 9.5, color: "var(--ink-4)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</div>
                </div>
                <span className="tnum" style={{ fontSize: 9.5, color: done ? "var(--st-done)" : "var(--vcs-conflicted)", flex: "none" }}>{rc}/{f.conflicts}</span>
              </div>
            );
          })}
        </div>

        {/* session actions */}
        <div style={{ padding: 12, borderTop: "1px solid var(--hair)", display: "grid", gap: 7, flex: "none" }}>
          <button className={"btn " + (allDone ? "primary" : "ghost-hair")} disabled={!allDone}
            onClick={() => onFlash && onFlash(allDone ? "committed merge — " + session.theirs + " → " + session.ours : "")}
            style={{ justifyContent: "center" }}>
            <Icon name="commit" size="sm" />Commit merge
          </button>
          <div style={{ display: "flex", gap: 7 }}>
            <button className="btn ghost-hair" onClick={() => onFlash && onFlash("continued — staged resolved files")} style={{ flex: 1, justifyContent: "center" }}>
              <Icon name="merge" size="sm" />Continue
            </button>
            <button className="btn ghost-hair" onClick={() => onFlash && onFlash("aborted merge — working tree restored")} style={{ flex: 1, justifyContent: "center", color: "var(--st-blocked)" }}>
              <Icon name="discard" size="sm" />Abort
            </button>
          </div>
        </div>
      </div>

      {/* per-file 3-way merge surface */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", fontSize: 11.5, flex: "none" }}>
          <Icon name="file" size="sm" style={{ color: "var(--ink-3)" }} />
          <span style={{ color: "var(--ink-4)" }}>{fileDir(activePath)}</span><span style={{ marginLeft: -6 }}>{fileName(activePath)}</span>
          {/* conflict navigation */}
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
            <button className="btn ghost-hair" onClick={() => acceptAll("ours")} style={{ padding: "3px 8px", fontSize: 10 }}>Accept all ours</button>
            <button className="btn ghost-hair" onClick={() => acceptAll("theirs")} style={{ padding: "3px 8px", fontSize: 10 }}>theirs</button>
            <div style={{ display: "flex", alignItems: "center", gap: 2, padding: 2, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)" }}>
              <button className="pane-btn" onClick={() => gotoConf(-1)} title="Previous conflict"><Icon name="chevron" size="sm" style={{ transform: "rotate(180deg)", width: 13, height: 13 }} /></button>
              <span className="tnum" style={{ fontSize: 10, color: "var(--ink-3)", padding: "0 4px" }}>{cursor + 1}/{confIdxs.length}</span>
              <button className="pane-btn" onClick={() => gotoConf(1)} title="Next conflict"><Icon name="chevron" size="sm" style={{ width: 13, height: 13 }} /></button>
            </div>
          </div>
        </div>

        <div ref={scrollRef} className="scroll-y mono" style={{ flex: 1, padding: "4px 0 16px", minHeight: 0 }}>
          {file.segments.map((seg, i) => {
            if (seg.type === "ctx") return <ContextLines key={i} lines={seg.lines} lang={file.lang} />;
            const num = confIdxs.indexOf(i) + 1;
            return <ConflictBlock key={i} seg={seg} idx={i} num={num} res={fileRes[i]} lang={file.lang}
              ours={session.ours} theirs={session.theirs} onResolve={resolve} onEdit={editResult}
              blockRef={(el) => { blockRefs.current[i] = el; }} />;
          })}
        </div>
      </div>
    </div>
  );
}

// per-file 3-way resolution surface (right side), resolution state lifted to caller.
// used both by the standalone ConflictView and folded into the agent Diff pane.
function ConflictFilePane({ file, fileRes, ours, theirs, onResolve, onEdit, onAcceptAll, ai }) {
  const [cursor, setCursor] = useStateC(0);
  const scrollRef = useRefC(null);
  const blockRefs = useRefC({});
  const confIdxs = useMemoC(() => file.segments.map((s, i) => s.type === "conflict" ? i : -1).filter((i) => i >= 0), [file.path]);
  React.useEffect(() => { setCursor(0); }, [file.path]);
  const gotoConf = (dir) => {
    const next = Math.max(0, Math.min(confIdxs.length - 1, cursor + dir));
    setCursor(next);
    const el = blockRefs.current[confIdxs[next]];
    if (el && scrollRef.current) scrollRef.current.scrollTop = el.offsetTop - 60;
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", fontSize: 11.5, flex: "none" }}>
        <Icon name="merge" size="sm" style={{ color: "var(--st-blocked)" }} />
        <span style={{ color: "var(--ink-4)" }}>{fileDir(file.path)}</span><span style={{ marginLeft: -6 }}>{fileName(file.path)}</span>
        <span className="chip" style={{ fontSize: 9, padding: "1px 6px", color: "var(--st-blocked)", borderColor: "color-mix(in oklch, var(--st-blocked), transparent 55%)" }}>3-way merge</span>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
          <button className="btn ghost-hair" onClick={() => onAcceptAll("ours", confIdxs)} style={{ padding: "3px 8px", fontSize: 10 }}>Accept all ours</button>
          <button className="btn ghost-hair" onClick={() => onAcceptAll("theirs", confIdxs)} style={{ padding: "3px 8px", fontSize: 10 }}>theirs</button>
          {ai && window.GitActionButton && (
            <window.GitActionButton label="Auto-resolve" icon="merge" small kind="ghost-hair" flash={ai.flash}
              title="Accept both sides for every conflict · native, 0 tokens"
              onNative={() => onAcceptAll("both", confIdxs)}
              estimateInput={{ op: "conflict", conflicts: confIdxs.length, diffBytes: JSON.stringify(file.segments).length, model: ai.model }}
              variants={[
                { id: "file", label: "Resolve this file with AI", op: "conflict", icon: "spark", run: (est) => ai.onAI({ scope: "file", idxs: confIdxs, est }) },
                { id: "file-v", label: "Resolve with AI (verbose)", op: "conflict", verbose: true, icon: "spark", run: (est) => ai.onAI({ scope: "file", idxs: confIdxs, est, verbose: true }) },
              ]} />
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 2, padding: 2, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)" }}>
            <button className="pane-btn" onClick={() => gotoConf(-1)} title="Previous conflict"><Icon name="chevron" size="sm" style={{ transform: "rotate(180deg)", width: 13, height: 13 }} /></button>
            <span className="tnum" style={{ fontSize: 10, color: "var(--ink-3)", padding: "0 4px" }}>{cursor + 1}/{confIdxs.length}</span>
            <button className="pane-btn" onClick={() => gotoConf(1)} title="Next conflict"><Icon name="chevron" size="sm" style={{ width: 13, height: 13 }} /></button>
          </div>
        </div>
      </div>
      <div ref={scrollRef} className="scroll-y mono" style={{ flex: 1, padding: "4px 0 16px", minHeight: 0 }}>
        {file.segments.map((seg, i) => {
          if (seg.type === "ctx") return <ContextLines key={i} lines={seg.lines} lang={file.lang} />;
          const num = confIdxs.indexOf(i) + 1;
          return <ConflictBlock key={i} seg={seg} idx={i} num={num} res={fileRes[i]} lang={file.lang}
            ours={ours} theirs={theirs} onResolve={onResolve} onEdit={onEdit} ai={ai}
            blockRef={(el) => { blockRefs.current[i] = el; }} />;
        })}
      </div>
    </div>
  );
}

Object.assign(window, { ConflictView, ConflictFilePane, ConflictBlock, ContextLines });

</script>

<!-- repo-extra.jsx -->
<script type="text/babel">
/* global React, Icon, fileName, fileDir, AuthorAvatar, authorName, Sha, AddDel, RStateBadge, HunkRows, FileDiff, DiffFileHeader, synthDiff */
// Orrery — Repository ▸ File history (Feature 5) and Partial commit (Feature 6)

const { useState: useStateE, useMemo: useMemoE } = React;
const GE = () => window.GIT;

// =========================================================================
// Feature 5 — file history: commits that touched a file; pick any two to diff
// =========================================================================
function RevRow({ r, role, onClick }) {
  const a = GE().authors[r.author] || {};
  const tint = role === "base" ? "var(--side-a)" : role === "compare" ? "var(--side-b)" : null;
  return (
    <div onClick={onClick}
      style={{ position: "relative", display: "flex", gap: 9, padding: "9px 12px 9px 10px", cursor: "pointer", borderRadius: "var(--r-sm)", margin: "1px 6px",
        background: role ? "color-mix(in oklch, " + tint + ", transparent 90%)" : "transparent",
        boxShadow: role ? "inset 0 0 0 1px " + tint : "none" }}
      onMouseEnter={(e) => { if (!role) e.currentTarget.style.background = "var(--panel-2)"; }}
      onMouseLeave={(e) => { if (!role) e.currentTarget.style.background = "transparent"; }}>
      <span style={{ flex: "none", width: 18, display: "grid", placeItems: "center", paddingTop: 1 }}>
        {role
          ? <span className="up" style={{ fontSize: 8, fontWeight: 700, color: tint }}>{role === "base" ? "A" : "B"}</span>
          : <span style={{ width: 9, height: 9, borderRadius: "50%", background: "var(--panel)", border: "2px solid " + (a.color || "var(--ink-4)") }} />}
      </span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.msg}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 5, fontSize: 9.5, color: "var(--ink-4)" }} className="tnum">
          <AuthorAvatar id={r.author} size={15} />
          <span style={{ color: "var(--ink-3)" }}>{a.name}</span>
          <Sha sha={r.sha} dim />
          <AddDel add={r.add} del={r.del} />
          <span style={{ marginLeft: "auto" }}>{r.rel}</span>
        </div>
      </div>
    </div>
  );
}

function FileHistoryView({ fh }) {
  const G = GE();
  fh = fh || G.fileHistory;
  // default: base = older (index 1), compare = newer (index 0)
  const [base, setBase] = useStateE(fh.revisions[1].sha);
  const [compare, setCompare] = useStateE(fh.revisions[0].sha);

  // clicking a revision: assign to whichever end is "further" — simple compare picker
  const pick = (sha) => {
    if (sha === base || sha === compare) return;
    // replace the end that keeps base older than compare in list order
    const idx = (s) => fh.revisions.findIndex((r) => r.sha === s);
    if (idx(sha) > idx(compare)) setBase(sha); else setCompare(sha);
  };
  const swap = () => { const b = base; setBase(compare); setCompare(b); };

  const isDefault = base === fh.revisions[1].sha && compare === fh.revisions[0].sha;
  const baseRev = fh.revisions.find((r) => r.sha === base);
  const compRev = fh.revisions.find((r) => r.sha === compare);
  const diff = isDefault ? fh.diff : synthDiff({ path: fh.path, state: "M", add: compRev.add, del: baseRev.del });

  return (
    <div style={{ flex: 1, display: "grid", gridTemplateColumns: "346px 1fr", minHeight: 0, background: "var(--panel-2)" }}>
      {/* revision timeline */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)" }}>
        <div style={{ padding: "10px 14px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <Icon name="clock" size="sm" style={{ color: "var(--ink-3)" }} />
            <span style={{ color: "var(--ink-4)", fontSize: 11 }}>{fileDir(fh.path)}</span><span style={{ fontSize: 11.5, color: "var(--ink)", marginLeft: -4 }}>{fileName(fh.path)}</span>
          </div>
          <div style={{ fontSize: 10, color: "var(--ink-3)", marginTop: 7 }}>{fh.revisions.length} revisions · click two to compare</div>
        </div>
        <div className="scroll-y" style={{ flex: 1, position: "relative", padding: "6px 0" }}>
          <div style={{ position: "absolute", left: 23, top: 12, bottom: 12, width: 1, background: "var(--hair)" }} />
          {fh.revisions.map((r) => (
            <RevRow key={r.sha} r={r} role={r.sha === base ? "base" : r.sha === compare ? "compare" : null} onClick={() => pick(r.sha)} />
          ))}
        </div>
      </div>

      {/* diff across revisions */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <Icon name="diff" size="sm" style={{ color: "var(--ink-3)" }} />
          <span style={{ fontSize: 11, color: "var(--ink-2)" }}>{fileName(fh.path)} across revisions</span>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 7 }} className="tnum">
            <span className="chip" style={{ fontSize: 9.5, padding: "1px 7px", color: "var(--ink-2)", borderColor: "var(--hair-2)" }}>A {base}</span>
            <button className="pane-btn" onClick={swap} title="Swap"><Icon name="swap" size="sm" style={{ width: 14, height: 14 }} /></button>
            <span className="chip" style={{ fontSize: 9.5, padding: "1px 7px", color: "var(--ink-2)", borderColor: "var(--hair-2)" }}>B {compare}</span>
          </div>
        </div>
        <div className="scroll-y" style={{ flex: 1, minHeight: 0 }}>
          <div style={{ padding: "7px 14px", fontSize: 10, color: "var(--ink-4)", borderBottom: "1px solid var(--hair)", display: "flex", gap: 10, flexWrap: "wrap" }} className="tnum">
            <span><b style={{ color: "var(--ink)" }}>A</b> {baseRev.rel} · {baseRev.msg}</span>
            <span><b style={{ color: "var(--ink)" }}>B</b> {compRev.rel} · {compRev.msg}</span>
          </div>
          <HunkRows hunks={diff.hunks} lang={diff.lang} />
        </div>
      </div>
    </div>
  );
}

// =========================================================================
// Feature 6 — partial commit: hunk- and line-level selection for partial
// commit / partial discard, with a running "N hunks selected" state.
// =========================================================================
const lineKey = (fp, hid, li) => fp + ":" + hid + ":" + li;

function PartialCommitView({ onFlash }) {
  const G = GE();
  const tree = G.workingTree;
  const [activePath, setActivePath] = useStateE(tree[0].path);
  // selected changed lines (default: all selected)
  const [sel, setSel] = useStateE(() => {
    const s = {};
    tree.forEach((f) => f.hunks.forEach((h) => h.lines.forEach((ln, li) => { if (ln.k !== " ") s[lineKey(f.path, h.id, li)] = true; })));
    return s;
  });

  const file = tree.find((f) => f.path === activePath);
  const changedOf = (h) => h.lines.map((ln, li) => ({ ln, li })).filter((x) => x.ln.k !== " ");
  const hunkSel = (fp, h) => {
    const ch = changedOf(h);
    const on = ch.filter((x) => sel[lineKey(fp, h.id, x.li)]).length;
    return on === 0 ? "none" : on === ch.length ? "all" : "some";
  };

  const toggleLine = (fp, hid, li) => setSel((s) => ({ ...s, [lineKey(fp, hid, li)]: !s[lineKey(fp, hid, li)] }));
  const toggleHunk = (fp, h) => {
    const want = hunkSel(fp, h) !== "all";
    setSel((s) => { const n = { ...s }; changedOf(h).forEach((x) => { n[lineKey(fp, h.id, x.li)] = want; }); return n; });
  };
  const setAll = (want) => setSel(() => {
    const s = {};
    tree.forEach((f) => f.hunks.forEach((h) => h.lines.forEach((ln, li) => { if (ln.k !== " ") s[lineKey(f.path, h.id, li)] = want; })));
    return s;
  });

  // running counters
  const stats = useMemoE(() => {
    let lines = 0, hunks = 0, filesTouched = new Set();
    tree.forEach((f) => f.hunks.forEach((h) => {
      const ch = changedOf(h);
      const on = ch.filter((x) => sel[lineKey(f.path, h.id, x.li)]).length;
      if (on > 0) { hunks++; lines += on; filesTouched.add(f.path); }
    }));
    return { lines, hunks, files: filesTouched.size };
  }, [sel]);

  // file-level selection summary for the list
  const fileSummary = (f) => {
    let on = 0, total = 0;
    f.hunks.forEach((h) => changedOf(h).forEach((x) => { total++; if (sel[lineKey(f.path, h.id, x.li)]) on++; }));
    return { on, total };
  };

  // gutter checkbox render-props for HunkRows
  const lead = {
    hunkHead: (h) => {
      const st = hunkSel(activePath, h);
      return (
        <button onClick={(e) => { e.stopPropagation(); toggleHunk(activePath, h); }} title="Select hunk"
          style={{ flex: "none", width: 15, height: 15, marginRight: 9, borderRadius: 4, display: "grid", placeItems: "center", cursor: "pointer",
            border: "1px solid " + (st === "none" ? "var(--hair-2)" : "var(--ui-focus)"), background: st === "all" ? "var(--ui-fill)" : st === "some" ? "var(--ui-line)" : "transparent" }}>
          {st === "all" && <Icon name="check" size="sm" style={{ width: 10, height: 10, color: "var(--ui-on-fill)" }} />}
          {st === "some" && <span style={{ width: 7, height: 2, borderRadius: 2, background: "var(--ui-on-fill)" }} />}
        </button>
      );
    },
    lineHead: (h, ln, li) => {
      if (ln.k === " ") return <span style={{ width: 24, flex: "none" }} />;
      const on = sel[lineKey(activePath, h.id, li)];
      return (
        <button onClick={(e) => { e.stopPropagation(); toggleLine(activePath, h.id, li); }}
          style={{ flex: "none", width: 14, height: 14, margin: "3px 10px 0 8px", borderRadius: 3, display: "grid", placeItems: "center", cursor: "pointer",
            border: "1px solid " + (on ? "var(--ui-focus)" : "var(--hair-2)"), background: on ? "var(--ui-fill)" : "transparent" }}>
          {on && <Icon name="check" size="sm" style={{ width: 9, height: 9, color: "var(--ui-on-fill)" }} />}
        </button>
      );
    },
  };
  // dim unselected changed lines
  const lineStyle = (h, ln, li) => {
    if (ln.k === " ") return "transparent";
    const on = sel[lineKey(activePath, h.id, li)];
    if (!on) return "transparent";
    return ln.k === "+" ? "var(--code-add-bg)" : "var(--code-del-bg)";
  };

  return (
    <div style={{ flex: 1, display: "grid", gridTemplateColumns: "300px 1fr", minHeight: 0, background: "var(--panel-2)" }}>
      {/* working-tree file list */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px 8px 14px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <Icon name="diff" size="sm" style={{ color: "var(--ink-3)" }} />
          <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Working tree · {tree.length}</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
            <button className="btn ghost-hair" onClick={() => setAll(true)} style={{ padding: "2px 7px", fontSize: 9.5 }}>All</button>
            <button className="btn ghost-hair" onClick={() => setAll(false)} style={{ padding: "2px 7px", fontSize: 9.5 }}>None</button>
          </div>
        </div>
        <div className="scroll-y" style={{ flex: 1, padding: "6px 0" }}>
          {tree.map((f) => {
            const { on, total } = fileSummary(f), active = f.path === activePath;
            const st = on === 0 ? "none" : on === total ? "all" : "some";
            return (
              <div key={f.path} onClick={() => setActivePath(f.path)}
                style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)", background: active ? "var(--panel-3)" : "transparent" }}
                onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
                onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
                <span style={{ flex: "none", width: 15, height: 15, borderRadius: 4, display: "grid", placeItems: "center",
                  border: "1px solid " + (st === "none" ? "var(--hair-2)" : "var(--ui-focus)"), background: st === "all" ? "var(--ui-fill)" : st === "some" ? "var(--ui-line)" : "transparent" }}>
                  {st === "all" && <Icon name="check" size="sm" style={{ width: 10, height: 10, color: "var(--ui-on-fill)" }} />}
                  {st === "some" && <span style={{ width: 7, height: 2, borderRadius: 2, background: "var(--ui-on-fill)" }} />}
                </span>
                <RStateBadge state={f.state} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, color: "var(--ink)", textDecoration: f.state === "D" ? "line-through" : "none", opacity: f.state === "D" ? 0.7 : 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileName(f.path)}</div>
                  <div style={{ fontSize: 9.5, color: "var(--ink-4)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</div>
                </div>
                <AddDel add={f.add} del={f.del} />
              </div>
            );
          })}
        </div>
      </div>

      {/* hunks with hunk/line selection */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
        <DiffFileHeader path={activePath} lang={file.lang}
          left={<span className="chip" style={{ fontSize: 9, padding: "1px 6px", color: "var(--vcs-modified)" }}>modified</span>} />
        <div className="scroll-y" style={{ flex: 1, minHeight: 0 }}>
          <HunkRows hunks={file.hunks} lang={file.lang} lead={lead} lineStyle={lineStyle} onLineClick={(h, ln, li) => ln.k !== " " && toggleLine(activePath, h.id, li)} />
        </div>

        {/* running selection state + actions */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderTop: "1px solid var(--hair)", background: "var(--panel)", flex: "none" }}>
          <span style={{ fontSize: 11, color: "var(--ink)" }}>
            <b className="tnum" style={{ color: "var(--ui-ink)" }}>{stats.hunks}</b> {stats.hunks === 1 ? "hunk" : "hunks"} selected
          </span>
          <span className="tnum" style={{ fontSize: 10, color: "var(--ink-4)" }}>{stats.lines} lines · {stats.files} files</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <button className="btn ghost-hair" disabled={!stats.hunks} onClick={() => onFlash && onFlash("discarded " + stats.hunks + " hunks")} style={{ color: "var(--st-blocked)" }}>
              <Icon name="discard" size="sm" />Discard selected
            </button>
            <button className="btn ghost-hair" disabled={!stats.hunks} onClick={() => onFlash && onFlash("staged " + stats.hunks + " hunks")}>
              <Icon name="stage" size="sm" />Stage
            </button>
            <button className="btn primary" disabled={!stats.hunks} onClick={() => onFlash && onFlash("committed " + stats.hunks + " hunks · " + stats.lines + " lines")}>
              <Icon name="commit" size="sm" />Commit {stats.hunks} {stats.hunks === 1 ? "hunk" : "hunks"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { FileHistoryView, PartialCommitView });

</script>

<script type="text/babel">
/* global React, Icon, fileName, fileDir, langOf, highlight, getFileLines, AuthorAvatar, Sha, RStateBadge, AddDel, HunkRows, FileDiff, DiffFileHeader, DiffFileList, diffFor, synthDiff, ConflictView, FileHistoryView */
// Orrery — agent-scoped git inspection UI (right-panel history/conflict +
// center diff/blame/file-history/conflict views).

const { useState: useStateAG, useMemo: useMemoAG } = React;
const AGG = () => window.AGENT_GIT;
const GAU = () => window.GIT.authors;

// ============================ blame gutter ================================
function ageBgA(age) { return "color-mix(in oklch, var(--ui-ink), transparent " + (86 + Math.round(age * 11)) + "%)"; }

function FileBlameGutter({ agent, path, onOpenCommit }) {
  const blame = AGG().agentBlame(agent, path);
  const lang = langOf(path);
  const [hover, setHover] = useStateAG(null);
  const rows = blame.map((ln, i) => ({ ...ln, first: i === 0 || blame[i - 1].sha !== ln.sha }));
  return (
    <div className="scroll-y mono" style={{ flex: 1, position: "relative", background: "var(--bg)" }}>
      <pre style={{ margin: 0, fontFamily: "var(--font-mono)", fontSize: 12, lineHeight: 1.7 }}>
        {rows.map((ln) => {
          const a = GAU()[ln.author] || {};
          return (
            <div key={ln.n} style={{ display: "flex" }}>
              <div onMouseEnter={(e) => { const r = e.currentTarget.getBoundingClientRect(); setHover({ ...ln, msg: (window.GIT.history.find((c) => c.sha === ln.sha) || {}).msg || ln.s, x: r.right, y: r.top, name: a.name }); }}
                onMouseLeave={() => setHover(null)}
                onClick={() => onOpenCommit && onOpenCommit(ln.sha)}
                style={{ flex: "none", width: 196, display: "flex", alignItems: "center", gap: 7, padding: "0 9px 0 0", borderRight: "1px solid var(--hair)", cursor: "pointer", userSelect: "none", background: ageBgA(ln.age) }}>
                <span style={{ flex: "none", width: 3, alignSelf: "stretch", background: a.color || "var(--ink-4)", opacity: 0.25 + (1 - ln.age) * 0.7 }} />
                {ln.first ? <React.Fragment>
                  <AuthorAvatar id={ln.author} size={14} />
                  <span style={{ fontSize: 10, color: "var(--ink-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, minWidth: 0 }}>{a.name}</span>
                  <span className="tnum" style={{ fontSize: 9, color: "var(--ink-4)" }}>{ln.rel}</span>
                  <span className="tnum chip" style={{ fontSize: 8, padding: "0 4px" }}>{ln.sha}</span>
                </React.Fragment> : <span style={{ flex: 1 }} />}
              </div>
              <span className="tnum" style={{ width: 44, flex: "none", textAlign: "right", padding: "0 11px 0 0", color: "var(--ink-4)", userSelect: "none" }}>{ln.n}</span>
              <code style={{ flex: 1, whiteSpace: "pre-wrap", wordBreak: "break-word", paddingRight: 14, color: "var(--ink-2)" }}>{highlight(ln.s, lang)}</code>
            </div>
          );
        })}
      </pre>
      {hover && (
        <div style={{ position: "fixed", left: Math.min(hover.x + 8, window.innerWidth - 300), top: hover.y, zIndex: 80, width: 280, background: "var(--elev)", border: "1px solid var(--hair-2)", borderRadius: "var(--r-md)", boxShadow: "var(--shadow)", padding: 11, pointerEvents: "none" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}>
            <AuthorAvatar id={hover.author} size={20} />
            <span style={{ fontSize: 11, fontWeight: 600, color: "var(--ink)", flex: 1 }}>{hover.name}</span>
            <Sha sha={hover.sha} />
          </div>
          <div style={{ fontSize: 10.5, color: "var(--ink-2)", lineHeight: 1.45, textWrap: "pretty" }}>{hover.msg}</div>
          <div style={{ fontSize: 9, color: "var(--ink-2)", marginTop: 7, display: "flex", alignItems: "center", gap: 5 }}><Icon name="enter" size="sm" style={{ width: 11, height: 11 }} />click → open commit diff</div>
        </div>
      )}
    </div>
  );
}

// ===================== right-panel: branch commits ========================
function AgentCommitRow({ c, expanded, selected, selecting, onToggle, onToggleSel, onOpenCommit, onOpenFileHistory }) {
  const a = GAU()[c.author] || {};
  const tot = c.files.reduce((s, f) => ({ a: s.a + f.add, d: s.d + f.del }), { a: 0, d: 0 });
  return (
    <div style={{ margin: "0 6px", borderRadius: "var(--r-sm)", background: selected ? "var(--ui-sel)" : "transparent" }}>
      <div style={{ position: "relative", display: "flex", gap: 8, padding: "7px 8px 7px 6px", cursor: "pointer" }}
        onClick={() => onToggle(c.sha)}
        onMouseEnter={(e) => { if (!selected) e.currentTarget.parentNode.style.background = "var(--panel-2)"; }}
        onMouseLeave={(e) => { if (!selected) e.currentTarget.parentNode.style.background = "transparent"; }}>
        <button onClick={(e) => { e.stopPropagation(); onToggleSel(c.sha); }} title="Select for range diff"
          style={{ flex: "none", width: 15, height: 15, marginTop: 1, borderRadius: 4, display: "grid", placeItems: "center", cursor: "pointer", border: "1px solid " + (selected ? "var(--ui-focus)" : "var(--hair-2)"), background: selected ? "var(--ui-fill)" : "transparent", opacity: selecting || selected ? 1 : 0.5 }}>
          {selected && <Icon name="check" size="sm" style={{ width: 10, height: 10, color: "var(--ui-on-fill)" }} />}
        </button>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name={expanded ? "chevronD" : "chevron"} size="sm" style={{ width: 11, height: 11, color: "var(--ink-4)", flex: "none" }} />
            <span style={{ fontSize: 11, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.msg}</span>
            {c.head && <span className="chip" style={{ fontSize: 8, padding: "0 5px", color: "var(--ink-2)", flex: "none" }}>HEAD</span>}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4, paddingLeft: 17, fontSize: 9.5, color: "var(--ink-4)" }} className="tnum">
            <AuthorAvatar id={c.author} size={13} />
            <Sha sha={c.sha} dim />
            <span>{c.files.length}f</span>
            <AddDel add={tot.a} del={tot.d} />
            <span style={{ marginLeft: "auto" }}>{c.rel}</span>
          </div>
        </div>
      </div>
      {expanded && (
        <div style={{ paddingLeft: 28, paddingBottom: 4 }}>
          {c.files.map((f) => (
            <div key={f.path} className="rise" style={{ display: "flex", alignItems: "center", gap: 7, padding: "3px 8px 3px 4px", cursor: "pointer", borderRadius: "var(--r-sm)" }}
              onClick={() => onOpenCommit(c.sha, f.path)}
              onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"}
              onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <RStateBadge state={f.state} />
              <span style={{ flex: 1, fontSize: 10.5, color: "var(--ink-2)", textDecoration: f.state === "D" ? "line-through" : "none", opacity: f.state === "D" ? 0.7 : 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileName(f.path)}</span>
              <AddDel add={f.add} del={f.del} />
              <button className="pane-btn" title="File history" onClick={(e) => { e.stopPropagation(); onOpenFileHistory(f.path); }} style={{ flex: "none" }}>
                <Icon name="clock" size="sm" style={{ width: 12, height: 12 }} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AgentCommitHistory({ ag, onOpenCommit, onOpenRange, onOpenFileHistory }) {
  const history = useMemoAG(() => AGG().agentHistory(ag), [ag.id]);
  const [exp, setExp] = useStateAG(history[0] ? history[0].sha : null);
  const [sel, setSel] = useStateAG([]);
  const toggle = (sha) => setExp((e) => (e === sha ? null : sha));
  const toggleSel = (sha) => setSel((s) => s.includes(sha) ? s.filter((x) => x !== sha) : [...s, sha]);
  const selecting = sel.length > 0;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "4px 14px" }}>
        <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Commits on this branch</span>
        <span className="tnum" style={{ fontSize: 9, color: "var(--ink-4)" }}>{history.length}</span>
      </div>
      {selecting && (
        <div className="rise" style={{ display: "flex", alignItems: "center", gap: 7, margin: "2px 8px 6px", padding: "6px 9px", borderRadius: "var(--r-sm)", background: "var(--ui-sel)", border: "1px solid var(--ui-sel-2)" }}>
          <span style={{ fontSize: 10.5, color: "var(--ink)" }}><b className="tnum">{sel.length}</b> selected</span>
          <button className="btn" onClick={() => setSel([])} style={{ marginLeft: "auto", padding: "2px 7px", fontSize: 10, color: "var(--ink-3)" }}>Clear</button>
          <button className="btn primary" onClick={() => onOpenRange(sel)} style={{ padding: "3px 9px", fontSize: 10.5 }}>
            <Icon name="diff" size="sm" />Diff ({sel.length})
          </button>
        </div>
      )}
      {history.map((c) => (
        <AgentCommitRow key={c.sha} c={c} expanded={exp === c.sha} selected={sel.includes(c.sha)} selecting={selecting}
          onToggle={toggle} onToggleSel={toggleSel} onOpenCommit={onOpenCommit} onOpenFileHistory={onOpenFileHistory} />
      ))}
    </div>
  );
}

// right-panel conflict card
function AgentConflictCard({ ag, project, onOpenConflict }) {
  const sess = AGG().agentConflict(ag, project);
  return (
    <div style={{ margin: "10px 12px", border: "1px solid color-mix(in oklch, var(--st-blocked), transparent 55%)", borderRadius: "var(--r-md)", overflow: "hidden", background: "color-mix(in oklch, var(--st-blocked), transparent 92%)" }}>
      <div style={{ padding: 11 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
          <Icon name="merge" size="sm" style={{ color: "var(--st-blocked)" }} />
          <span style={{ fontSize: 11.5, fontWeight: 600, color: "var(--ink)" }}>Merge conflicts</span>
          <span className="chip tnum" style={{ marginLeft: "auto", fontSize: 9, padding: "0 6px", color: "var(--st-blocked)", borderColor: "color-mix(in oklch, var(--st-blocked), transparent 55%)" }}>{sess.files.length} files</span>
        </div>
        <div style={{ fontSize: 10.5, color: "var(--ink-3)", lineHeight: 1.5, marginBottom: 9 }}>
          {sess.title} stopped — <b style={{ color: "var(--vcs-conflicted)" }}>{sess.files.reduce((s, f) => s + f.conflicts, 0)} conflicts</b> need resolving before this branch can land.
        </div>
        <button className="btn ghost-hair" disabled style={{ width: "100%", justifyContent: "center", borderColor: "color-mix(in oklch, var(--st-blocked), transparent 65%)", color: "var(--st-blocked)", opacity: 1 }}>
          <Icon name="diff" size="sm" />Resolve in the Diff tab →
        </button>
      </div>
    </div>
  );
}

// ====================== center: commit / range diff =======================
function CommitContextHeader({ left, title, sub }) {
  return (
    <div style={{ padding: "9px 16px", borderBottom: "1px solid var(--hair)", background: "var(--panel)", flex: "none" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>{left}
        <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--ink)", textWrap: "pretty" }}>{title}</span>
      </div>
      {sub && <div style={{ marginTop: 5, fontSize: 10, color: "var(--ink-4)", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }} className="tnum">{sub}</div>}
    </div>
  );
}

// diff with an Annotate (blame) toggle — lets you flip any commit/range diff
// into its per-line blame gutter, same affordance as the file viewer.
function DiffOrBlame({ ag, path, diff, addDel, onOpenCommit, view }) {
  const [blame, setBlame] = useStateAG(false);
  React.useEffect(() => { setBlame(false); }, [path]);
  const annotate = (
    <button className={"btn " + (blame ? "" : "ghost-hair")} onClick={() => setBlame((v) => !v)} title="Toggle blame / annotate"
      style={{ padding: "3px 9px", fontSize: 10, color: blame ? "var(--ink)" : "var(--ink-3)",
        background: blame ? "var(--ui-sel)" : "transparent",
        border: "1px solid " + (blame ? "var(--ui-sel-2)" : "var(--hair)") }}>
      <Icon name="git" size="sm" style={{ color: blame ? "var(--ui-ink)" : "inherit" }} />Annotate
    </button>
  );
  const right = <React.Fragment>{addDel}{annotate}</React.Fragment>;
  if (blame) {
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
        <DiffFileHeader path={path} lang={diff && diff.lang} right={right} />
        <FileBlameGutter agent={ag} path={path} onOpenCommit={onOpenCommit} />
      </div>
    );
  }
  return <FileDiff path={path} diff={diff} headerRight={right} agentId={ag.id} view={view} />;
}

function AgentCommitDiffView({ ag, sha, initPath }) {
  const history = useMemoAG(() => AGG().agentHistory(ag), [ag.id]);
  const c = history.find((x) => x.sha === sha) || history[0];
  const [selPath, setSelPath] = useStateAG((initPath && c.files.some((f) => f.path === initPath) ? initPath : (c.files[0] ? c.files[0].path : null)));
  const a = GAU()[c.author] || {};
  const f = c.files.find((x) => x.path === selPath);
  const diff = f ? diffFor(sha, f) : null;
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel-2)" }}>
      <CommitContextHeader left={<><Icon name="commit" size="sm" style={{ color: "var(--ink-3)" }} /></>} title={c.msg}
        sub={<><AuthorAvatar id={c.author} size={15} /><span style={{ color: "var(--ink-2)" }}>{a.name}</span><Sha sha={c.sha} /><span>committed {c.rel} ago</span></>} />
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "232px 1fr", minHeight: 0 }}>
        <div style={{ minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)" }}>
          <DiffFileList files={c.files} selPath={selPath} onSelect={setSelPath} title="Files in commit" />
        </div>
        {selPath ? <DiffOrBlame key={selPath} ag={ag} path={selPath} diff={diff} view={"commit:" + c.sha} addDel={f && <AddDel add={f.add} del={f.del} gap={6} />} />
          : <div style={{ display: "grid", placeItems: "center", color: "var(--ink-4)", background: "var(--bg)" }}>select a file</div>}
      </div>
    </div>
  );
}

function AgentRangeDiffView({ ag, shas }) {
  const history = useMemoAG(() => AGG().agentHistory(ag), [ag.id]);
  const commits = shas.map((s) => history.find((c) => c.sha === s)).filter(Boolean);
  const files = useMemoAG(() => {
    const m = {};
    commits.forEach((c) => c.files.forEach((f) => {
      const e = m[f.path] || { path: f.path, add: 0, del: 0, state: f.state };
      e.add += f.add; e.del += f.del; if (f.state === "A" && e.state !== "A") e.state = "M";
      m[f.path] = e;
    }));
    return Object.values(m).sort((a, b) => a.path.localeCompare(b.path));
  }, [shas.join()]);
  const [selPath, setSelPath] = useStateAG(files[0] ? files[0].path : null);
  const f = files.find((x) => x.path === selPath);
  const diff = f ? synthDiff(f) : null;
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel-2)" }}>
      <CommitContextHeader left={<Icon name="diff" size="sm" style={{ color: "var(--ui-ink)" }} />} title={"Range diff · " + commits.length + " commits"}
        sub={commits.map((c, i) => <React.Fragment key={c.sha}>{i > 0 && <span style={{ color: "var(--ink-4)" }}>·</span>}<span className="chip" style={{ fontSize: 9, padding: "1px 6px" }}>{c.sha}</span></React.Fragment>)} />
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "232px 1fr", minHeight: 0 }}>
        <div style={{ minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)" }}>
          <DiffFileList files={files} selPath={selPath} onSelect={setSelPath} title="Range files" />
        </div>
        {selPath ? <DiffOrBlame key={selPath} ag={ag} path={selPath} diff={diff} view={"range:" + shas.join("+")} addDel={f && <AddDel add={f.add} del={f.del} gap={6} />} />
          : <div style={{ display: "grid", placeItems: "center", color: "var(--ink-4)", background: "var(--bg)" }}>select a file</div>}
      </div>
    </div>
  );
}

// ====================== center dispatcher =================================
function AgentGitView({ ag, project, gitView, onFlash, onOpenCommit }) {
  if (gitView.kind === "commit") return <AgentCommitDiffView ag={ag} sha={gitView.sha} initPath={gitView.path} />;
  if (gitView.kind === "range") return <AgentRangeDiffView ag={ag} shas={gitView.shas} />;
  if (gitView.kind === "filehistory") return <FileHistoryView fh={AGG().agentFileHistory(ag, gitView.path)} />;
  if (gitView.kind === "conflict") return <ConflictView session={AGG().agentConflict(ag, project)} onFlash={onFlash} />;
  return null;
}

Object.assign(window, { FileBlameGutter, AgentCommitHistory, AgentConflictCard, AgentGitView });

</script>
