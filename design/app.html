          {agent && myFile && (
            <div onClick={(e) => { e.stopPropagation(); onView(node.id, "file"); }}
              style={{ display: "flex", alignItems: "center", gap: 6, flex: "none", padding: "3px 5px 3px 8px", borderRadius: 5, cursor: "pointer",
                background: node.view === "file" ? "var(--panel-3)" : "transparent", border: "1px solid " + (node.view === "file" ? "var(--hair)" : "transparent") }}>
              <Icon name="file" size="sm" style={{ width: 12, height: 12, color: node.view === "file" ? "var(--ui-ink)" : "var(--ink-4)" }} />
              <span style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: node.view === "file" ? "var(--ink)" : "var(--ink-3)", whiteSpace: "nowrap" }}>{fileName(myFile)}</span>
              <button onClick={(e) => { e.stopPropagation(); onCloseFile && onCloseFile(); if (node.view === "file") onView(node.id, "terminal"); }} title="Close file"

        )}
      </div>
      {dropSide && zoneStyle && (
        <div style={{ position: "absolute", inset: 0, zIndex: 20, pointerEvents: "none" }}>
          <div style={{ position: "absolute", ...zoneStyle,
            background: "var(--ui-sel)",

            boxShadow: "none", transition: "all 0.08s ease" }}>
            <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)",
              display: "flex", alignItems: "center", gap: 6, padding: "4px 9px", borderRadius: 999,

              <Icon name={dropSide === "center" ? "swap" : (dropSide === "left" || dropSide === "right") ? "splitCol" : "splitRow"} size="sm" style={{ width: 12, height: 12 }} />
              {dropSide === "center" ? "Replace" : "Split " + dropSide}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---- recursive splitter with draggable divider ----
function SplitNode(props) {
  const { node } = props;
  const ref = useRefP(null);
  const [drag, setDrag] = useStateP(false);
  if (node.type === "leaf") return <Pane node={node} {...props} />;

  const horiz = node.dir === "v"; // side-by-side columns
  const onDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const el = e.currentTarget;
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    setDrag(true);
    const rect = ref.current.getBoundingClientRect();
    document.body.style.userSelect = "none";
    document.body.style.cursor = horiz ? "col-resize" : "row-resize";
    const move = (ev) => {
      const r = horiz ? (ev.clientX - rect.left) / rect.width : (ev.clientY - rect.top) / rect.height;
      props.onRatio(node.id, Math.max(0.1, Math.min(0.9, r)));
    };
    const up = (ev) => {
      setDrag(false);
      document.body.style.userSelect = "";
      document.body.style.cursor = "";
      if (el.releasePointerCapture) try { el.releasePointerCapture(ev.pointerId); } catch (_) {}
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      el.removeEventListener("lostpointercapture", up);
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
    el.addEventListener("lostpointercapture", up);
  };

  return (
    <div ref={ref} style={{ flex: 1, minWidth: 0, minHeight: 0, display: "flex", flexDirection: horiz ? "row" : "column", gap: 0 }}>
      <div style={{ flexGrow: node.ratio, flexShrink: 1, flexBasis: 0, minWidth: 0, minHeight: 0, display: "flex" }}>
        <SplitNode {...props} node={node.a} />
      </div>
      <div onPointerDown={onDown} className={"divider " + (horiz ? "v" : "h") + (drag ? " on" : "")}
        style={{ flex: "none", [horiz ? "width" : "height"]: 8, [horiz ? "height" : "width"]: "100%", alignSelf: "stretch",
          cursor: horiz ? "col-resize" : "row-resize",
          display: "flex", alignItems: "center", justifyContent: "center", touchAction: "none", position: "relative", zIndex: 3 }}>
        <span className="grip-handle" style={{ [horiz ? "width" : "height"]: 6, [horiz ? "height" : "width"]: "100%" }} />
      </div>
      <div style={{ flexGrow: 1 - node.ratio, flexShrink: 1, flexBasis: 0, minWidth: 0, minHeight: 0, display: "flex" }}>
        <SplitNode {...props} node={node.b} />
      </div>
    </div>
  );
}

function PaneManager({ root, setRoot, agents, projects, liveLogs, onFocusAgent, onAct, onFlash, gitView, openFile, onOpenGit, onCloseGitView, onCloseFile, onAppendLog, onSendPrompt, autosave, jump }) {
  const [focus, setFocus] = useStateP(null);
  const [dropTarget, setDropTarget] = useStateP(null); // { paneId, side }

  const pickNextAgent = () => {
    const used = new Set();
    (function walk(n) { if (n.type === "leaf") { if (n.agentId) used.add(n.agentId); } else { walk(n.a); walk(n.b); } })(root);
    const free = agents.find((a) => !used.has(a.id) && a.status === "running") || agents.find((a) => !used.has(a.id)) || agents[0];
    return free ? free.id : null;
  };

  const handlers = {
    onSplit: (id, dir) => setRoot((r) => splitLeaf(r, id, dir, leaf(pickNextAgent(), "terminal"))),
    onClose: (id) => setRoot((r) => removeLeaf(r, id)),
    onAgent: (id, agentId) => { setRoot((r) => patchLeaf(r, id, { agentId })); if (onFocusAgent) onFocusAgent(agentId); },
    onView: (id, view) => setRoot((r) => patchLeaf(r, id, { view })),
    onRatio: (id, ratio) => setRoot((r) => setRatio(r, id, ratio)),
    onFocus: (id) => { setFocus(id); const aid = leafAgentOf(root, id); if (aid && onFocusAgent) onFocusAgent(aid); },
    onDropOver: (id, side) => setDropTarget(id ? { paneId: id, side } : null),
    onPaneDrop: (id) => {
      const d = window.__omDrag;
      const side = dropTarget && dropTarget.paneId === id ? dropTarget.side : "center";
      if (d && d.agentId) {
        setRoot((r) => splitLeafSide(r, id, side, leaf(d.agentId, "terminal")));
        if (onFocusAgent) onFocusAgent(d.agentId);
      }
      setDropTarget(null);
      window.__omDrag = null;
    },
    dropTarget,
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel-2)" }}>
      <div style={{ flex: 1, minHeight: 0, padding: 8, display: "flex" }}>
        <SplitNode node={root} agents={agents} projects={projects} liveLogs={liveLogs}
          onAct={onAct} onFlash={onFlash} gitView={gitView} openFile={openFile}
          onOpenGit={onOpenGit} onCloseGitView={onCloseGitView} onCloseFile={onCloseFile}
          onAppendLog={onAppendLog} onSendPrompt={onSendPrompt} autosave={autosave} jump={jump}
          {...handlers} canClose={countLeaves(root) > 1} focused={focus} />
      </div>
    </div>
  );
}

Object.assign(window, { PaneManager, makeLeaf: leaf, treeAgentIds, countLeaves, dropAgent, setLeafViewByAgent });

</script>

<script type="text/babel">
/* global React, Icon, ToolBadge, toolMeta, fileName, fileDir, langOf, StatusDot */
// Orrery — command registry, command palette, Search Everywhere, recent files,
// go-to-line, navigation stack. Every action in the app is registered here once;
// menus/overlays render FROM the registry (roadmap B2.1 / B2.2 / B2.3 / B2.6 / B6.2).

const { useState: useStateC, useEffect: useEffectC, useRef: useRefC, useMemo: useMemoC } = React;

// ---------------------------------------------------------------- keybindings
const IS_MAC = typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

function parseBinding(str) {
  if (!str) return null;
  const parts = str.split("+").map((s) => s.trim());
  const b = { mod: false, ctrl: false, alt: false, shift: false, key: "" };
  parts.forEach((p) => {
    const l = p.toLowerCase();
    if (l === "mod") b.mod = true;
    else if (l === "ctrl") b.ctrl = true;
    else if (l === "alt") b.alt = true;
    else if (l === "shift") b.shift = true;
    else b.key = l;
  });
  return b;
}

function matchBinding(e, str) {
  const b = parseBinding(str);
  if (!b) return false;
  const k = (e.key || "").toLowerCase();
  if (k !== b.key) return false;
  const primary = IS_MAC ? e.metaKey : e.ctrlKey;
  if (b.mod && !primary) return false;
  if (!b.mod && !b.ctrl && (e.metaKey || (e.ctrlKey && k.length === 1))) return false;
  if (b.ctrl && !e.ctrlKey) return false;
  if (!b.ctrl && !b.mod && e.ctrlKey) return false;
  if (!!b.shift !== !!e.shiftKey) return false;
  if (!!b.alt !== !!e.altKey) return false;
  return true;
}

// "Mod+Shift+P" → "⌘⇧P" (mac) / "Ctrl+Shift+P"
function kbdLabel(str) {
  if (!str) return "";
  if (str === "Shift Shift") return IS_MAC ? "⇧⇧" : "Shift Shift";
  const map = IS_MAC
    ? { mod: "⌘", ctrl: "⌃", alt: "⌥", shift: "⇧" }
    : { mod: "Ctrl+", ctrl: "Ctrl+", alt: "Alt+", shift: "Shift+" };
  return str.split("+").map((p) => {
    const l = p.trim().toLowerCase();
    if (map[l]) return map[l];
    const K = { arrowup: "↑", arrowdown: "↓", arrowleft: "←", arrowright: "→", enter: "⏎", escape: "esc", "[": "[", "]": "]", "/": "/" }[l];
    return K || p.trim().toUpperCase();
  }).join("");
}

// ------------------------------------------------------------- fuzzy matching
// subsequence match with word-start + run bonuses; returns {score, idx} or null
function fzMatch(text, q) {
  if (!q) return { score: 0, idx: [] };
  const t = text.toLowerCase(), s = q.toLowerCase().replace(/\s+/g, "");
  let ti = 0, score = 0, run = 0;
  const idx = [];
  for (let qi = 0; qi < s.length; qi++) {
    const c = s[qi];
    let found = -1;
    for (let i = ti; i < t.length; i++) { if (t[i] === c) { found = i; break; } }
    if (found < 0) return null;
    const prev = found ? t[found - 1] : "";
    const boundary = found === 0 || prev === "/" || prev === "." || prev === "-" || prev === "_" || prev === " " || prev === ":";
    score += 6 + (boundary ? 10 : 0) + (found === ti ? run * 5 : 0);
    run = found === ti ? run + 1 : 1;
    idx.push(found);
    ti = found + 1;
  }
  score -= Math.max(0, text.length - s.length) * 0.12;
  if (t.startsWith(s)) score += 14;
  return { score, idx };
}

function FzText({ text, idx, style }) {
  if (!idx || !idx.length) return <span style={style}>{text}</span>;
  const set = new Set(idx);
  return <span style={style}>{text.split("").map((ch, i) => set.has(i)
    ? <b key={i} style={{ color: "var(--ui-ink)", fontWeight: 600 }}>{ch}</b>
    : <span key={i}>{ch}</span>)}</span>;
}

// -------------------------------------------------------------- search corpus
const GITD = () => window.GIT || {};

function repoFilePaths() {
  const set = new Set(Object.keys(window.FILE_CONTENTS || {}));
  (GITD().workingTree || []).forEach((f) => set.add(f.path));
  (window.AGENTS || []).forEach((a) => (a.files || []).forEach((f) => set.add(f.path)));
  Object.values(window.DIFFS || {}).forEach((d) => d && set.add(d.file));
  (GITD().history || []).forEach((c) => (c.files || []).forEach((f) => set.add(f.path)));
  if (GITD().fileHistory) set.add(GITD().fileHistory.path);
  if (GITD().blameFile) set.add(GITD().blameFile.path);
  Object.keys(GITD().commitDiffs || {}).forEach((k) => set.add(k.split("/").slice(1).join("/")));
  return Array.from(set).filter(Boolean).sort();
}

const SYM_RE = [
  [/^\s*export\s+(?:default\s+)?(?:async\s+)?function\s+([A-Za-z_$][\w$]*)/, "function"],
  [/^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)/, "function"],
  [/^\s*export\s+(?:abstract\s+)?class\s+([A-Za-z_$][\w$]*)/, "class"],
  [/^\s*class\s+([A-Za-z_$][\w$]*)/, "class"],
  [/^\s*export\s+interface\s+([A-Za-z_$][\w$]*)/, "interface"],
  [/^\s*export\s+type\s+([A-Za-z_$][\w$]*)/, "type"],
  [/^\s*export\s+const\s+([A-Za-z_$][\w$]*)/, "const"],
  [/^\s*const\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\(/, "function"],
  [/^\s*resource\s+"([^"]+)"\s+"([^"]+)"/, "resource"],
  [/^\s*CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?([\w.]+)/i, "table"],
  [/^\s*(?:describe|it)\(['"]([^'"]+)/, "test"],
];

// symbols of one file (structure view + Search Everywhere both use this)
function symbolsOf(path) {
  const src = (window.FILE_CONTENTS || {})[path];
  const lines = src != null ? src.split("\n") : (window.getFileLines ? window.getFileLines(path, {}).map((l) => l.s) : []);
  const out = [];
  lines.forEach((s, i) => {
    for (const [re, kind] of SYM_RE) {
      const m = s.match(re);
      if (m) { out.push({ name: kind === "resource" ? m[1] + "." + m[2] : m[1], kind, line: i + 1, path, indent: (s.match(/^\s*/) || [""])[0].length }); break; }
    }
  });
  return out;
}

function allSymbols() {
  const out = [];
  Object.keys(window.FILE_CONTENTS || {}).forEach((p) => out.push(...symbolsOf(p)));
  return out;
}

const SYM_ICON = { function: "bolt", class: "box", interface: "layers", type: "tag", const: "commit", resource: "server", table: "database", test: "check" };

// ------------------------------------------------------------- overlay shells
function OverlayShell({ width = 640, top = "12vh", onClose, children, label }) {
  const box = useRefC(null);
  useEffectC(() => {
    const onDown = (e) => { if (box.current && !box.current.contains(e.target)) onClose(); };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [onClose]);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "var(--scrim)", backdropFilter: "blur(2px)", display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "0 20px" }}>
      <div ref={box} className="surface rise" role="dialog" aria-label={label}
        style={{ width, maxWidth: "100%", marginTop: top, boxShadow: "var(--shadow)", overflow: "hidden", display: "flex", flexDirection: "column", maxHeight: "72vh" }}>
        {children}
      </div>
    </div>
  );
}

function OverlayInput({ value, onChange, placeholder, onKeyDown, icon = "search", right }) {
  const ref = useRefC(null);
  useEffectC(() => { if (ref.current) ref.current.focus(); }, []);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
      <Icon name={icon} style={{ color: "var(--ui-ink)" }} />
      <input ref={ref} value={value} onChange={(e) => onChange(e.target.value)} onKeyDown={onKeyDown} placeholder={placeholder}
        style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 14 }} />
      {right}
    </div>
  );
}

function OverlayFooter({ hints }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "7px 14px", borderTop: "1px solid var(--hair)", background: "var(--panel-2)", flex: "none", fontSize: 9.5, color: "var(--ink-4)" }}>
      {hints.map((h, i) => <span key={i} style={{ display: "flex", gap: 5, alignItems: "center" }}><span className="kbd">{h[0]}</span>{h[1]}</span>)}
    </div>
  );
}

// keyboard list navigation shared by every overlay
function useListNav(count, onPick, onClose) {
  const [sel, setSel] = useStateC(0);
  useEffectC(() => { setSel(0); }, [count]);
  const onKeyDown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel((s) => (count ? (s + 1) % count : 0)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel((s) => (count ? (s - 1 + count) % count : 0)); }
    else if (e.key === "Enter") { e.preventDefault(); if (count) onPick(sel); }
    else if (e.key === "Escape") { e.preventDefault(); onClose(); }
    else return false;
    return true;
  };
  return [sel, setSel, onKeyDown];
}

function RowShell({ active, onClick, onMouseEnter, children, danger, ...rest }) {
  return (
    <div onClick={onClick} onMouseEnter={onMouseEnter} {...rest}
      style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 14px", cursor: "pointer", borderLeft: "2px solid " + (active ? "var(--ui-focus)" : "transparent"),
        background: active ? "var(--panel-3)" : "transparent", color: danger ? "var(--st-blocked)" : "inherit" }}>
      {children}
    </div>
  );
}

// ------------------------------------------------------------ command palette
function CommandPalette({ commands, onClose }) {
  const [q, setQ] = useStateC("");
  const items = useMemoC(() => {
    const scored = commands.map((c) => {
      const m = fzMatch(c.label, q) || (q ? fzMatch(c.group + " " + c.label, q) : { score: 0, idx: [] });
      return m ? { c, score: m.score + (c.enabled ? 4 : 0), idx: fzMatch(c.label, q) ? m.idx : [] } : null;
    }).filter(Boolean);
    if (q) scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 60);
  }, [commands, q]);
  const pick = (i) => { const it = items[i]; if (it && it.c.enabled) { onClose(); setTimeout(() => it.c.run(), 0); } };
  const [sel, setSel, onKeyDown] = useListNav(items.length, pick, onClose);
  const listRef = useRefC(null);
  useEffectC(() => {
    const el = listRef.current && listRef.current.children[sel];
    if (el && el.offsetTop < listRef.current.scrollTop) listRef.current.scrollTop = el.offsetTop;
    else if (el && el.offsetTop + el.offsetHeight > listRef.current.scrollTop + listRef.current.clientHeight) listRef.current.scrollTop = el.offsetTop + el.offsetHeight - listRef.current.clientHeight;
  }, [sel]);
  let lastGroup = null;
  return (
    <OverlayShell width={600} onClose={onClose} label="Command palette">
      <OverlayInput value={q} onChange={setQ} onKeyDown={onKeyDown} placeholder="Type a command…" icon="bolt"
        right={<span className="chip" style={{ fontSize: 9 }}>{commands.length} commands</span>} />
      <div ref={listRef} className="scroll-y" style={{ flex: 1, padding: "6px 0" }}>
        {items.length === 0 && <div style={{ padding: "18px 14px", fontSize: 11.5, color: "var(--ink-4)" }}>no matching command</div>}
        {items.map((it, i) => {
          const c = it.c;
          const head = !q && c.group !== lastGroup ? (lastGroup = c.group) : null;
          return (
            <React.Fragment key={c.id}>
              {head && <div className="up" style={{ fontSize: 9, color: "var(--ink-4)", padding: "8px 14px 4px" }}>{head}</div>}
              <RowShell active={i === sel} onMouseEnter={() => setSel(i)} onClick={() => pick(i)} danger={c.danger}>
                <Icon name={c.icon} size="sm" style={{ color: i === sel ? "var(--ui-ink)" : "var(--ink-3)" }} />
                <span style={{ flex: 1, fontSize: 12.5, opacity: c.enabled ? 1 : 0.42, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  <FzText text={c.label} idx={it.idx} />
                </span>
                {q && <span style={{ fontSize: 9.5, color: "var(--ink-4)", flex: "none" }}>{c.group}</span>}
                {c.kbd && <span className="kbd" style={{ flex: "none" }}>{kbdLabel(c.kbd)}</span>}
              </RowShell>
            </React.Fragment>
          );
        })}
      </div>
      <OverlayFooter hints={[["↑↓", "navigate"], ["⏎", "run"], ["esc", "close"]]} />
    </OverlayShell>
  );
}

// --------------------------------------------------------- Search Everywhere
const SE_TABS = [
  { k: "commands", label: "Actions" }, { k: "files", label: "Files" }, { k: "symbols", label: "Symbols" },
  { k: "agents", label: "Agents" }, { k: "tickets", label: "Tickets" }, { k: "git", label: "Git" },
];
// tabs whose corpus is too large to be useful empty — they stay blank until you type
const SE_LAZY = { files: 1, symbols: 1 };
// …and the same two group their results by project, IntelliJ workspace-style
const SE_GROUPED = { files: 1, symbols: 1 };

// which project owns a path — projects declare their file list in data.js
function projectOfPath(path, projects) {
  if (!path) return null;
  const list = projects || window.PROJECTS || [];
  const own = list.find((p) => (p.files || []).indexOf(path) >= 0);
  if (own) return own;
  // paths only an agent's worktree knows about still belong to that agent's project
  const ag = (window.AGENTS || []).find((a) => (a.files || []).some((f) => f.path === path));
  if (ag) { const p = list.find((x) => x.id === ag.projectId); if (p) return p; }
  const c = (GITD().history || []).find((h) => (h.files || []).some((f) => f.path === path));
  if (c && c.projectId) { const p = list.find((x) => x.id === c.projectId); if (p) return p; }
  return null;
}

function SearchEverywhere({ ctx, commands, initialTab, onClose }) {
  const [tab, setTab] = useStateC(initialTab || "commands");
  const [q, setQ] = useStateC("");
  const corpus = useMemoC(() => {
    const files = repoFilePaths().map((p) => ({ type: "file", key: "f:" + p, text: p, path: p, label: fileName(p), sub: fileDir(p), meta: langOf(p) }));
    const symbols = allSymbols().map((s) => ({ type: "symbol", key: "s:" + s.path + ":" + s.line, text: s.name, label: s.name, sub: s.path + ":" + s.line, meta: s.kind, path: s.path, line: s.line }));
    const agents = (ctx.agents || []).map((a) => ({ type: "agent", key: "a:" + a.id, text: a.name + " " + a.branch + " " + (a.task || ""), label: a.name, sub: a.branch, meta: a.status, agent: a }));
    const tickets = (ctx.tickets || []).map((t) => ({ type: "ticket", key: "t:" + t.id, text: t.title, label: t.title, sub: (t.tags || []).join(" · ") || t.status, meta: t.status, ticket: t }));
    const cmds = commands.map((c) => ({ type: "command", key: "c:" + c.id, text: c.label + " " + c.group, label: c.label, sub: c.group, meta: kbdLabel(c.kbd), cmd: c }));
    const refs = [];
    (ctx.projects || []).forEach((p) => (p.branches || []).forEach((b) => refs.push({ type: "ref", key: "r:" + p.id + b, text: b, label: b, sub: p.name, meta: "branch" })));
    (ctx.agents || []).forEach((a) => refs.push({ type: "ref", key: "r:" + a.id, text: a.branch, label: a.branch, sub: a.name, meta: "agent branch" }));
    (GITD().history || []).slice(0, 24).forEach((c) => refs.push({ type: "ref", key: "r:" + c.sha, text: c.sha + " " + (c.msg || c.summary || ""), label: c.sha, sub: c.msg || c.summary || "", meta: "commit", sha: c.sha }));
    return { files, symbols, agents, tickets, commands: cmds, git: refs };
  }, [ctx.agents, ctx.tickets, ctx.projects, commands]);

  const pool = corpus[tab] || [];
  const items = useMemoC(() => {
    if (SE_LAZY[tab] && !q) return [];
    const scored = pool.map((it) => {
      const m = fzMatch(it.label, q) || fzMatch(it.text, q);
      if (!m) return null;
      const bump = { agent: 8, file: 6, symbol: 4, ticket: 4, command: 2, ref: 0 }[it.type] || 0;
      return { it, score: m.score + bump, idx: fzMatch(it.label, q) ? m.idx : [] };
    }).filter(Boolean);
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 80);
  }, [pool, q, tab]);

  const open = (r) => {
    const it = r.it;
    onClose();
    setTimeout(() => {
      if (it.type === "file") ctx.openFileAt(it.text);
      else if (it.type === "symbol") ctx.openFileAt(it.path, it.line);
      else if (it.type === "agent") ctx.openAgent(it.agent.id);
      else if (it.type === "ticket") ctx.openTicket(it.ticket.id);
      else if (it.type === "command") { if (it.cmd.enabled) it.cmd.run(); }
      else if (it.type === "ref") { if (it.sha) ctx.openCommit(it.sha); else ctx.openBranches(); }
    }, 0);
  };
  const [sel, setSel, listKeys] = useListNav(items.length, (i) => items[i] && open(items[i]), onClose);
  const onKeyDown = (e) => {
    if (e.key === "Tab") { e.preventDefault(); const i = SE_TABS.findIndex((t) => t.k === tab); setTab(SE_TABS[(i + (e.shiftKey ? -1 + SE_TABS.length : 1)) % SE_TABS.length].k); return; }
    listKeys(e);
  };
  // group by project (files/symbols): groups ordered by their best hit, rows keep score order
  const groups = useMemoC(() => {
    if (!SE_GROUPED[tab]) return null;
    const byId = new Map();
    items.forEach((r, i) => {
      const p = projectOfPath(r.it.path || r.it.text, ctx.projects);
      const key = p ? p.id : "_other";
      if (!byId.has(key)) byId.set(key, { project: p, rows: [] });
      byId.get(key).rows.push({ r, i });
    });
    return Array.from(byId.values());
  }, [items, tab, ctx.projects]);

  const listRef = useRefC(null);
  useEffectC(() => {

  const submit = () => { if (parsed) { onClose(); setTimeout(() => onGo(parsed.line, parsed.col), 0); } };
  return (
    <OverlayShell width={380} top="20vh" onClose={onClose} label="Go to line">

// --------------------------------------------------------------- key handling
// One global listener drives every registered binding + double-shift.
function CommandCenter({ ctx, overlay, setOverlay }) {
  const commands = useMemoC(() => buildCommandRegistry(ctx), [ctx]);
  const shiftRef = useRefC({ t: 0, armed: false });
  const cmdRef = useRefC(commands);
  cmdRef.current = commands;
  const ctxRef = useRefC(ctx);
  ctxRef.current = ctx;

  useEffectC(() => { window.ORRERY_COMMANDS = commands; }, [commands]);

  useEffectC(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
      if (e.key === "Shift") {
        const now = Date.now();
        if (!typing && shiftRef.current.armed && now - shiftRef.current.t < 380) {
          shiftRef.current.armed = false;
          e.preventDefault();
          setOverlay({ kind: "search" });
          return;
        }
        shiftRef.current = { t: now, armed: true };
        return;
      }
      if (e.key !== "Shift") shiftRef.current.armed = false;
      if (e.key === "Escape") { if (overlay) { setOverlay(null); } return; }
      for (const c of cmdRef.current) {
        if (!c.kbd || c.kbd === "Shift Shift") continue;
        if (matchBinding(e, c.kbd)) {
          if (typing && !(e.metaKey || e.ctrlKey)) return;
          e.preventDefault();
          if (c.enabled) c.run(); else ctxRef.current.flash && ctxRef.current.flash(c.label + " — not available here");
          return;
        }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [overlay, setOverlay]);

  const close = () => setOverlay(null);
  if (!overlay) return null;
  if (overlay.kind === "palette") return <CommandPalette commands={commands} onClose={close} />;
  if (overlay.kind === "search") return <SearchEverywhere ctx={ctx} commands={commands} initialTab={overlay.tab} onClose={close} />;
  if (overlay.kind === "recent") return <RecentFiles items={ctx.recentFiles || []} onPick={(it) => ctx.openFileAt(it.path)} onClose={close} />;
  if (overlay.kind === "goto") return <GoToLine path={ctx.openFile && ctx.openFile.path} max={ctx.openFileLines || 1} onGo={ctx.goToLine} onClose={close} />;
  if (overlay.kind === "keymap") return <KeymapModal keymap={ctx.keymap} commands={commands} onPick={(k) => { ctx.setKeymap(k); }} onClose={close} />;
  return null;
}

Object.assign(window, {
  buildCommandRegistry, CommandCenter, CommandPalette, SearchEverywhere, RecentFiles, GoToLine, KeymapModal,
  NavArrows, kbdLabel, matchBinding, fzMatch, FzText, symbolsOf, allSymbols, repoFilePaths, SYM_ICON, KEYMAP_PRESETS, IS_MAC,
});

</script>

<script type="text/babel">
/* global React, Icon */
// Orrery — bottom tool window (IntelliJ-style dock). Panels register themselves
// into window.TOOL_PANELS; the shell owns the tab strip, resize and close.

const { useState: useStateTW, useRef: useRefTW, useEffect: useEffectTW } = React;

window.TOOL_PANELS = window.TOOL_PANELS || {};
// order of the tab strip
window.TOOL_ORDER = ["search", "graph", "branches", "history", "cost", "github"];

function ToolWindow({ tool, onSelect, onClose, ctx }) {
  const [h, setH] = useStateTW(() => Math.round(Math.min(420, Math.max(240, window.innerHeight * 0.36))));
  // a tab can hold agents from several projects, so the tool window carries its
  // own scope: pick the project (and optionally one worktree) the panels act on
  const projects = ctx.projects || [];
  const [scope, setScope] = useStateTW(() => ({ projectId: (ctx.scopeAgent && ctx.scopeAgent.projectId) || (projects[0] || {}).id, agentId: (ctx.scopeAgent || {}).id || null }));
  const project = projects.find((p) => p.id === scope.projectId) || projects[0] || null;
  const projAgents = (ctx.agents || []).filter((a) => project && a.projectId === project.id);
  const agent = projAgents.find((a) => a.id === scope.agentId) || projAgents[0] || null;
  const focus = ctx.scopeAgent;
  const outOfSync = !!(focus && (focus.projectId !== (project && project.id) || focus.id !== (agent && agent.id)) && projects.some((p) => p.id === focus.projectId));
  const scoped = Object.assign({}, ctx, { project, projectId: project && project.id, agents: projAgents, allAgents: ctx.agents, scopeAgent: agent });
  const drag = useRefTW(null);
  useEffectTW(() => {
    const move = (e) => { if (!drag.current) return; const dy = drag.current.y - e.clientY; setH(Math.max(160, Math.min(window.innerHeight - 200, drag.current.h + dy))); };
    const up = () => { drag.current = null; document.body.style.cursor = ""; };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  }, []);
  const panels = window.TOOL_ORDER.map((k) => window.TOOL_PANELS[k]).filter(Boolean);
  const panel = window.TOOL_PANELS[tool.kind];
  const Body = panel && panel.Component;
  return (
    <div style={{ height: h, flex: "none", display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel)", borderTop: "1px solid var(--hair)" }}>
      <div onMouseDown={(e) => { drag.current = { y: e.clientY, h }; document.body.style.cursor = "row-resize"; }}
        style={{ height: 4, marginTop: -3, cursor: "row-resize", flex: "none" }} />
      <div style={{ display: "flex", alignItems: "stretch", gap: 2, padding: "0 8px", borderBottom: "1px solid var(--hair)", flex: "none", background: "var(--panel-2)" }}>
        {panels.map((p) => {
          const on = p.kind === tool.kind;

              {on && <span style={{ position: "absolute", left: 8, right: 8, bottom: 0, height: 2, background: "var(--ui-ind)" }} />}
              <Icon name={p.icon} size="sm" style={{ color: on ? "var(--ui-ink)" : "inherit" }} />{p.label}
            </button>

        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, paddingLeft: 10 }}>
          <span className="up" style={{ fontSize: 8.5, color: "var(--ink-4)", flex: "none" }}>scope</span>
          {project && (
            <span style={{ display: "flex", alignItems: "center", gap: 5, flex: "none" }}>
              <Icon name={project.icon} size="sm" style={{ width: 12, height: 12, color: project.color }} />
              <select className="osel" value={project.id} onChange={(e) => setScope({ projectId: e.target.value, agentId: null })}
                style={{ width: 152, padding: "3px 22px 3px 8px", fontSize: 10.5 }}>
                {projects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </span>
          )}
          <select className="osel" value={(agent && agent.id) || ""} onChange={(e) => setScope((s) => ({ ...s, agentId: e.target.value || null }))}
            title="Worktree the panel reads from" style={{ width: 150, padding: "3px 22px 3px 8px", fontSize: 10.5, flex: "none" }}>
            {!projAgents.length && <option value="">no worktrees</option>}
            {projAgents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
          {outOfSync && (
            <button className="btn ghost-hair" title={"Follow the focused agent · " + focus.name} style={{ padding: "2px 7px", fontSize: 10, color: "var(--ink-2)", flex: "none" }}
              onClick={() => setScope({ projectId: focus.projectId, agentId: focus.id })}>
              <Icon name="link" size="sm" style={{ width: 11, height: 11 }} />{focus.name}
            </button>
          )}
          <button className="pane-btn" onClick={onClose} title="Hide tool window" style={{ alignSelf: "center" }}>
            <Icon name="x" size="sm" />

        </div>
      </div>
      <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", background: "var(--panel)" }}>
        {Body ? <Body key={(project && project.id) + ":" + ((agent && agent.id) || "none")} tool={tool} ctx={scoped} onClose={onClose} /> : <div style={{ padding: 18, fontSize: 11.5, color: "var(--ink-4)" }}>panel unavailable</div>}
      </div>
    </div>
  );
}

Object.assign(window, { ToolWindow });
