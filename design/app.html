<script type="text/babel">
/* global React, Icon, fileName, fileDir, highlight */
// Orrery — Inline review → send to agent.
// The reviewer (human) drops GitHub-style line/range comments while reading a
// diff or file; comments accumulate per-agent across files; the whole batch
// (plus a global note) is sent to the live local agent as one structured msg.

const { useState: useStateRv, useEffect: useEffectRv, useRef: useRefRv } = React;

// ========================================================================
// store — comments are keyed by agentId so the count follows the user across
// files. Persisted to localStorage; subscribers re-render on change.
// ========================================================================
const REVIEW_LS = "orrery.review.v2";
const reviewState = (() => { try { return JSON.parse(localStorage.getItem(REVIEW_LS)) || {}; } catch (e) { return {}; } })();
const reviewSubs = new Set();
function reviewPersist() {
  try { localStorage.setItem(REVIEW_LS, JSON.stringify(reviewState)); } catch (e) { /* ignore */ }
  reviewSubs.forEach((f) => f());
}
function reviewSlot(agentId) {
  if (!reviewState[agentId]) reviewState[agentId] = { comments: [], seq: 0 };
  return reviewState[agentId];
}
function reviewGet(agentId) { return (reviewState[agentId] && reviewState[agentId].comments) || []; }
function reviewAdd(agentId, c) {
  const slot = reviewSlot(agentId);
  const id = "rc" + (++slot.seq);
  slot.comments.push(Object.assign({ id }, c));
  reviewPersist();
  return id;
}
function reviewRemove(agentId, id) {
  const slot = reviewSlot(agentId);
  slot.comments = slot.comments.filter((c) => c.id !== id);
  reviewPersist();
}
function reviewClear(agentId) { if (reviewState[agentId]) { reviewState[agentId].comments = []; reviewPersist(); } }

function useReviewComments(agentId) {
  const [, force] = useStateRv(0);
  useEffectRv(() => {
    const f = () => force((x) => x + 1);
    reviewSubs.add(f);
    return () => reviewSubs.delete(f);
  }, []);
  return reviewGet(agentId);
}

// reference label exactly like the structured message (file:line or file:from-to)
function refLines(c) { return c.fromLine === c.toLine ? "" + c.fromLine : c.fromLine + "-" + c.toLine; }
function isBlock(c) { return c.toIdx > c.fromIdx; }

// ========================================================================
// row builders — normalize a diff or a plain file into a flat row list.
// type:"hunk" rows are separators (not commentable); type:"code" rows are.
// ========================================================================
function diffToRows(diff) {
  const rows = [];
  diff.hunks.forEach((h, hi) => {
    rows.push({ type: "hunk", meta: h.meta });
    h.lines.forEach((ln) => {
      rows.push({ type: "code", k: ln.k, n: ln.n, s: ln.s, side: ln.k === "-" ? "old" : "new" });
    });
  });
  return rows;
}
function fileToRows(lines) {
  return lines.map((ln) => ({ type: "code", k: ln.add ? "+" : " ", n: ln.n, s: ln.s, side: "file" }));
}

// ========================================================================
// ReviewCode — the diff/file renderer with gutter "+", drag-range select,
// inline composer, saved-comment markers + persistent inline cards.
// ========================================================================
function ReviewCode({ agentId, file, view, rows, lang, sticky }) {
  const all = useReviewComments(agentId);
  const comments = all.filter((c) => c.file === file && c.view === view);
  const [hover, setHover] = useStateRv(-1);
  const [drag, setDrag] = useStateRv(null);       // { anchor, current }
  const [composer, setComposer] = useStateRv(null); // { fromIdx, toIdx }
  const [draft, setDraft] = useStateRv("");
  const dragRef = useRefRv(null); dragRef.current = drag;
  const taRef = useRefRv(null);

  // finish a gutter drag → open one composer for the selected range
  useEffectRv(() => {
    if (!drag) return;
    const up = () => {
      const d = dragRef.current;
      if (d) { const a = Math.min(d.anchor, d.current), b = Math.max(d.anchor, d.current); openComposer(a, b); }
      setDrag(null);
    };
    window.addEventListener("mouseup", up);
    return () => window.removeEventListener("mouseup", up);
  }, [drag]);

  useEffectRv(() => { if (composer && taRef.current) taRef.current.focus(); }, [composer]);

  const openComposer = (a, b) => { setComposer({ fromIdx: a, toIdx: b }); setDraft(""); };
  const cancel = () => { setComposer(null); setDraft(""); };
  const save = () => {
    if (!composer || !draft.trim()) return;
    const block = rows.slice(composer.fromIdx, composer.toIdx + 1).filter((r) => r.type === "code");
    const fromLine = block[0] ? block[0].n : null;
    const toLine = block[block.length - 1] ? block[block.length - 1].n : fromLine;
    reviewAdd(agentId, {
      file, view, lang,
      fromIdx: composer.fromIdx, toIdx: composer.toIdx,
      fromLine, toLine,
      side: block[0] ? block[0].side : "new",
      snippet: (block[0] ? block[0].s : "").trim(),
      lines: block.map((r) => r.s),
      note: draft.trim(),
    });
    cancel();
  };

  const commentCovering = (i) => comments.find((c) => i >= c.fromIdx && i <= c.toIdx);
  const inSelection = (i) => drag && i >= Math.min(drag.anchor, drag.current) && i <= Math.max(drag.anchor, drag.current);
  const inComposer = (i) => composer && i >= composer.fromIdx && i <= composer.toIdx;

  const startDrag = (i, e) => { e.preventDefault(); e.stopPropagation(); if (composer) return; setDrag({ anchor: i, current: i }); };

  return (
    <div className="scroll-y mono" style={{ flex: 1, background: "var(--bg)", minHeight: 0, userSelect: drag ? "none" : "auto" }}>
      {sticky}
      <div style={{ position: "relative" }}>
        {rows.map((r, i) => {
          if (r.type === "hunk") {
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", padding: "5px 14px 5px 38px", fontSize: 11,
                color: "var(--ink-2)", background: "var(--side-a)", borderTop: i ? "1px solid var(--hair)" : "none" }}>
                <span className="tnum" style={{ opacity: 0.95 }}>{r.meta}</span>
              </div>
            );
          }
          const k = r.k;
          const covering = commentCovering(i);
          const sel = inSelection(i) || inComposer(i);
          const codeBg = sel ? "var(--ui-sel)"
            : k === "+" ? "var(--code-add-bg)" : k === "-" ? "var(--code-del-bg)" : "transparent";
          const showPlus = hover === i && !composer && !drag && !covering;
          const isAnchor = covering && covering.fromIdx === i;
          return (
            <React.Fragment key={i}>
              <div onMouseEnter={() => { setHover(i); if (dragRef.current) setDrag((d) => d ? { ...d, current: i } : d); }}
                onMouseLeave={() => setHover((h) => (h === i ? -1 : h))}
                style={{ display: "flex", fontSize: 12, lineHeight: 1.7, background: codeBg,
                  boxShadow: covering ? "inset 2px 0 0 var(--ui-ind)" : "none" }}>
                {/* comment gutter — hover "+", drag handle, saved marker */}
                <span style={{ width: 24, flex: "none", display: "flex", alignItems: "center", justifyContent: "center", userSelect: "none",
                  background: sel ? "var(--ui-sel-2)" : "transparent", cursor: showPlus ? "pointer" : "default" }}>
                  {covering
                    ? (isAnchor
                        ? <span title="comment saved" style={{ width: 15, height: 15, borderRadius: 4, display: "grid", placeItems: "center",
                            background: "var(--ui-fill)", color: "var(--ui-on-fill)" }}><Icon name="chat" size="sm" style={{ width: 10, height: 10 }} /></span>
                        : <span style={{ width: 5, height: 5, borderRadius: "50%", background: "var(--ui-line)" }} />)
                    : showPlus
                      ? <button title="Comment on this line — or drag down to select a range" onMouseDown={(e) => startDrag(i, e)}
                          style={{ width: 16, height: 16, borderRadius: 4, border: "none", display: "grid", placeItems: "center", cursor: "grab",
                            background: "var(--ui-fill)", color: "var(--ui-on-fill)", padding: 0 }}>
                          <Icon name="plus" size="sm" style={{ width: 11, height: 11 }} />
                        </button>
                      : null}
                </span>
                <span className="tnum" style={{ width: 40, flex: "none", textAlign: "right", padding: "0 10px 0 0", color: "var(--ink-4)", userSelect: "none" }}>{r.n}</span>
                {view === "diff" && <span style={{ width: 16, flex: "none", textAlign: "center", userSelect: "none",
                  color: k === "+" ? "var(--code-add-ink)" : k === "-" ? "var(--code-del-ink)" : "var(--ink-4)" }}>{k === " " ? "" : k}</span>}
                <span style={{ flex: 1, whiteSpace: "pre-wrap", wordBreak: "break-word", paddingRight: 14, paddingLeft: view === "diff" ? 0 : 14,
                  color: k === "+" ? "var(--code-add-ink)" : k === "-" ? "var(--code-del-ink)" : "var(--ink-2)" }}>
                  {view === "file" && typeof highlight === "function" ? highlight(r.s, lang) : (r.s || " ")}
                </span>
              </div>

              {/* persistent saved-comment card (under its last line) */}
              {comments.filter((c) => c.toIdx === i).map((c) => (
                <SavedCommentCard key={c.id} c={c} onDelete={() => reviewRemove(agentId, c.id)} />
              ))}

              {/* inline composer (under the range's last line) */}
              {composer && composer.toIdx === i && (
                <InlineComposer range={composer} rows={rows} draft={draft} setDraft={setDraft} taRef={taRef} onCancel={cancel} onSave={save} />
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

function rangeLabel(range, rows) {
  const block = rows.slice(range.fromIdx, range.toIdx + 1).filter((r) => r.type === "code");
  if (!block.length) return "";
  const a = block[0].n, b = block[block.length - 1].n;
  return a === b ? "line " + a : "lines " + a + "–" + b;
}

function InlineComposer({ range, rows, draft, setDraft, taRef, onCancel, onSave }) {
  return (
    <div style={{ display: "flex", background: "var(--ui-sel)", borderTop: "1px solid var(--ui-sel-2)", borderBottom: "1px solid var(--hair)" }}>
      <span style={{ width: 24, flex: "none", background: "var(--ui-sel-2)" }} />
      <div style={{ flex: 1, padding: "10px 14px 10px 12px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 7 }}>
          <Icon name="chat" size="sm" style={{ color: "var(--ui-ink)" }} />
          <span style={{ fontSize: 10.5, color: "var(--ink-2)" }}>Comment on <b style={{ color: "var(--ink)" }}>{rangeLabel(range, rows)}</b></span>
          <span className="up" style={{ marginLeft: "auto", fontSize: 8.5, color: "var(--ink-4)" }}>review · queued for agent</span>
        </div>
        <textarea ref={taRef} value={draft} onChange={(e) => setDraft(e.target.value)} rows={3}
          placeholder="Leave a note for the agent — what to change and why…"
          onKeyDown={(e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") onSave(); if (e.key === "Escape") onCancel(); }}
          style={{ width: "100%", resize: "vertical", minHeight: 56, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)",
            padding: "8px 10px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 12, lineHeight: 1.55, outline: "none" }}
          onFocus={(e) => (e.target.style.borderColor = "var(--ui-line)")}
          onBlur={(e) => (e.target.style.borderColor = "var(--hair)")} />
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
          <span style={{ fontSize: 9.5, color: "var(--ink-4)" }}><span className="kbd">⌘</span> <span className="kbd">↵</span> to save</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 7 }}>
            <button className="btn ghost-hair" onClick={onCancel} style={{ padding: "4px 12px", fontSize: 11 }}>Cancel</button>
            <button className="btn primary" onClick={onSave} disabled={!draft.trim()} style={{ padding: "4px 12px", fontSize: 11 }}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SavedCommentCard({ c, onDelete }) {
  return (
    <div style={{ display: "flex", background: "var(--panel)", borderTop: "1px solid var(--hair)", borderBottom: "1px solid var(--hair)" }}>
      <span style={{ width: 24, flex: "none", background: "var(--ui-sel)", boxShadow: "inset 2px 0 0 var(--ui-ind)" }} />
      <div style={{ flex: 1, padding: "9px 14px 9px 12px", minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
          <span style={{ width: 17, height: 17, flex: "none", borderRadius: "50%", display: "grid", placeItems: "center", fontSize: 8.5, fontWeight: 700,
            color: "var(--ui-ink)", background: "var(--ui-sel)", border: "1px solid var(--ui-sel-2)" }}>YOU</span>
          <span style={{ fontSize: 11, color: "var(--ink-2)" }}>You</span>
          <span className="tnum" style={{ fontSize: 9.5, color: "var(--ink-4)" }}>· {isBlock(c) ? "lines " + refLines(c) : "line " + c.fromLine}</span>
          <span className="chip" style={{ fontSize: 8.5, padding: "0 5px", color: "var(--ui-ink)", borderColor: "var(--ui-sel-2)" }}>pending</span>
          <button onClick={onDelete} title="Delete comment"
            style={{ marginLeft: "auto", background: "transparent", border: "none", color: "var(--ink-4)", cursor: "pointer", display: "flex", padding: 2, borderRadius: 3 }}
            onMouseEnter={(e) => (e.currentTarget.style.color = "var(--st-blocked)")}
            onMouseLeave={(e) => (e.currentTarget.style.color = "var(--ink-4)")}>
            <Icon name="trash" size="sm" />
          </button>
        </div>
        <div style={{ fontSize: 12, color: "var(--ink)", lineHeight: 1.5, marginTop: 5, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{c.note}</div>
      </div>
    </div>
  );
}

// ========================================================================
// SendReviewButton — top-toolbar action; hidden at N=0, shows the count.
// ========================================================================
function SendReviewButton({ agentId, onOpen }) {
  const comments = useReviewComments(agentId);
  const n = comments.length;
  if (!n) return null;
  return (
    <button className="btn" onClick={onOpen} title="Review all pending comments and send them to this agent"
      style={{ padding: "5px 11px", color: "var(--ink)", border: "1px solid var(--ui-line)",
        background: "var(--ui-sel)" }}>
      <Icon name="chat" size="sm" style={{ color: "var(--ui-ink)" }} />Send review
      <span className="tnum" style={{ fontSize: 10, fontWeight: 700, color: "var(--ui-on-fill)", background: "var(--ui-fill)", borderRadius: 999, padding: "1px 6px", marginLeft: 2 }}>{n}</span>
    </button>
  );
}

// ========================================================================
// SendReviewModal — pending comments grouped by file + global note + send.
// Its body mirrors the structured message the agent ultimately receives.
// ========================================================================
function SendReviewModal({ agentId, agentName, onClose, onSend }) {
  const comments = useReviewComments(agentId);
  const [global, setGlobal] = useStateRv("");
  // group by file, keep first-seen order
  const groups = [];
  const byFile = {};
  comments.forEach((c) => { if (!byFile[c.file]) { byFile[c.file] = { file: c.file, items: [] }; groups.push(byFile[c.file]); } byFile[c.file].items.push(c); });

  const send = () => {
    onSend(agentId, { comments: comments.map((c) => ({ file: c.file, fromLine: c.fromLine, toLine: c.toLine, snippet: c.snippet, note: c.note, block: isBlock(c) })), global: global.trim() });
    reviewClear(agentId);
    onClose();
  };

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 70, display: "grid", placeItems: "center", padding: 24, background: "var(--scrim)", backdropFilter: "blur(3px)" }}>
      <div className="surface rise" onClick={(e) => e.stopPropagation()} style={{ width: 600, maxHeight: "88vh", display: "flex", flexDirection: "column", padding: 0, overflow: "hidden", boxShadow: "var(--shadow)" }}>
        {/* header */}
        <div style={{ padding: "14px 18px", borderBottom: "1px solid var(--hair)", display: "flex", alignItems: "center", gap: 9, flex: "none" }}>
          <Icon name="chat" style={{ color: "var(--ui-ink)" }} />
          <span className="disp" style={{ fontSize: 14, fontWeight: 600 }}>Send review</span>
          <span className="tnum" style={{ fontSize: 11, color: "var(--ink-3)" }}>{comments.length} comment{comments.length !== 1 ? "s" : ""} · {groups.length} file{groups.length !== 1 ? "s" : ""}</span>
          <span className="chip" style={{ marginLeft: "auto", fontSize: 9.5 }}>→ {agentName || agentId}</span>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: "var(--ink-4)", cursor: "pointer", display: "flex", padding: 3, borderRadius: 4 }}
            onMouseEnter={(e) => (e.currentTarget.style.color = "var(--ink)")} onMouseLeave={(e) => (e.currentTarget.style.color = "var(--ink-4)")}>
            <Icon name="x" size="sm" />
          </button>
        </div>

        {/* grouped comment list */}
        <div className="scroll-y" style={{ flex: 1, minHeight: 0, padding: "6px 0" }}>
          {groups.length === 0
            ? <div style={{ display: "grid", placeItems: "center", color: "var(--ink-4)", fontSize: 12, padding: 40 }}>no comments yet — hover a line and click the + to add one</div>
            : groups.map((g) => (
              <div key={g.file} style={{ marginBottom: 4 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "7px 18px", position: "sticky", top: 0, background: "var(--panel)", zIndex: 1 }}>
                  <Icon name="file" size="sm" style={{ color: "var(--ink-3)" }} />
                  <span style={{ fontSize: 11, color: "var(--ink-4)" }}>{fileDir(g.file)}</span>
                  <span style={{ fontSize: 11.5, color: "var(--ink)", marginLeft: -3 }}>{fileName(g.file)}</span>
                  <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{g.items.length}</span>
                </div>
                {g.items.map((c) => (
                  <div key={c.id} style={{ display: "flex", gap: 10, padding: "8px 18px 10px", margin: "0 10px", borderRadius: "var(--r-sm)" }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = "var(--panel-2)")}
                    onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}>
                    <span className="tnum" style={{ flex: "none", width: 54, paddingTop: 2, fontSize: 10.5, color: "var(--ink-3)", textAlign: "right" }}>:{refLines(c)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="tnum" style={{ fontSize: 11, color: "var(--ink-3)", background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: 4,
                        padding: "4px 8px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {isBlock(c) ? <span style={{ color: "var(--ink-4)" }}>{c.lines.length} lines · </span> : null}{c.snippet || "(blank line)"}
                      </div>
                      <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                        <span style={{ color: "var(--ui-ink)", flex: "none" }}>→</span>
                        <span style={{ fontSize: 12, color: "var(--ink)", lineHeight: 1.5, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{c.note}</span>
                      </div>
                    </div>
                    <button onClick={() => reviewRemove(agentId, c.id)} title="Delete comment"
                      style={{ flex: "none", background: "transparent", border: "none", color: "var(--ink-4)", cursor: "pointer", display: "flex", padding: 3, borderRadius: 3, alignSelf: "flex-start" }}
                      onMouseEnter={(e) => (e.currentTarget.style.color = "var(--st-blocked)")} onMouseLeave={(e) => (e.currentTarget.style.color = "var(--ink-4)")}>
                      <Icon name="trash" size="sm" />
                    </button>
                  </div>
                ))}
              </div>
            ))}
        </div>

        {/* global note */}
        <div style={{ padding: "12px 18px", borderTop: "1px solid var(--hair)", flex: "none", background: "var(--panel-2)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 7 }}>
            <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Global note</span>
            <span style={{ fontSize: 9.5, color: "var(--ink-4)" }}>· applies to the whole review</span>
          </div>
          <textarea value={global} onChange={(e) => setGlobal(e.target.value)} rows={2}
            placeholder="Overall direction for this pass — e.g. tighten error handling and keep the public API stable…"
            style={{ width: "100%", resize: "none", background: "var(--panel)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)",
              padding: "9px 11px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 12, lineHeight: 1.5, outline: "none" }}
            onFocus={(e) => (e.target.style.borderColor = "var(--ui-line)")}
            onBlur={(e) => (e.target.style.borderColor = "var(--hair)")} />
        </div>

        {/* footer */}
        <div style={{ padding: "12px 18px", borderTop: "1px solid var(--hair)", display: "flex", alignItems: "center", gap: 8, flex: "none" }}>
          <span style={{ fontSize: 10, color: "var(--ink-4)" }}>delivered to the agent as one structured message</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <button className="btn ghost-hair" onClick={onClose}>Cancel</button>
            <button className="btn primary" onClick={send} disabled={!comments.length}><Icon name="enter" size="sm" />Send to agent</button>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, {
  ReviewCode, SendReviewButton, SendReviewModal,
  diffToRows, fileToRows, reviewGet,
});

</script>

<script type="text/babel">
/* global React, Icon, fileName */
// ORCHESTRA — FileTree (worktree explorer) + ContextMenu

const { useState: useStateX, useEffect: useEffectX, useRef: useRefX } = React;

// build nested tree from flat path list + a {path: state} map
function buildTree(paths, stateMap) {
  const root = {};
  paths.forEach((p) => {
    const isDir = p.endsWith("/");
    const parts = p.replace(/\/$/, "").split("/");
    let node = root;
    parts.forEach((part, i) => {
      const last = i === parts.length - 1;
      if (!node[part]) node[part] = { __dir: !last || isDir, __children: {}, __path: parts.slice(0, i + 1).join("/") + ((!last || isDir) ? "/" : "") };
      if (last) node[part].__state = stateMap[p];
      node = node[part].__children;
    });
  });
  // convert to array, dirs first then files, alpha
  const toArr = (obj) => Object.keys(obj).map((k) => {
    const v = obj[k];
    return { name: k, dir: v.__dir, path: v.__path, state: v.__state, children: v.__dir ? toArr(v.__children) : [] };
  }).sort((a, b) => (a.dir === b.dir) ? a.name.localeCompare(b.name) : (a.dir ? -1 : 1));
  return toArr(root);
}

const STATE_COLOR = {
  A: "var(--vcs-added)", M: "var(--vcs-modified)", D: "var(--vcs-deleted)",
};

function TreeNode({ node, depth, openMap, toggle, onOpenFile, activePath }) {
  const open = openMap[node.path] !== false; // default open
  const pad = 8 + depth * 13;
  if (node.dir) {
    const changed = countChanged(node);
    return (
      <div>
        <div onClick={() => toggle(node.path)} className="tree-row"
          style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 8px", paddingLeft: pad, cursor: "pointer", borderRadius: 5 }}>
          <Icon name={open ? "chevronD" : "chevron"} size="sm" style={{ width: 11, height: 11, color: "var(--ink-4)", flex: "none" }} />
          <Icon name={open ? "folderOpen" : "folder"} size="sm" style={{ color: node.state ? STATE_COLOR[node.state] : "var(--ui-ink)", flex: "none", width: 13, height: 13 }} />
          <span style={{ fontSize: 11.5, color: "var(--ink-2)" }}>{node.name}</span>
          {node.state && <span style={{ fontSize: 9, fontWeight: 700, color: STATE_COLOR[node.state] }}>{node.state}</span>}
          {changed > 0 && <span className="tnum" style={{ marginLeft: "auto", fontSize: 9, color: "var(--ink-4)" }}>{changed}</span>}
        </div>
        {open && node.children.map((c) => <TreeNode key={c.path} node={c} depth={depth + 1} openMap={openMap} toggle={toggle} onOpenFile={onOpenFile} activePath={activePath} />)}
      </div>
    );
  }
  const active = activePath === node.path;
  return (
    <div className="tree-row" onClick={() => onOpenFile && onOpenFile(node.path)}
      draggable onDragStart={(e) => { window.__omDrag = { kind: "file", path: node.path }; e.dataTransfer.setData("text/plain", node.path); e.dataTransfer.effectAllowed = "copy"; }}
      onDragEnd={() => { window.__omDrag = null; }}
      title={"drag into an agent prompt to reference " + node.path}
      style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 8px", paddingLeft: pad + 17, cursor: "pointer", borderRadius: 5, background: active ? "var(--panel-3)" : "transparent" }}>
      <Icon name="file" size="sm" style={{ width: 12, height: 12, color: node.state ? STATE_COLOR[node.state] : "var(--ink-4)", flex: "none" }} />
      <span style={{ fontSize: 11.5, color: node.state || active ? "var(--ink)" : "var(--ink-3)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{node.name}</span>
      {node.state && <span style={{ marginLeft: "auto", fontSize: 9, fontWeight: 700, color: STATE_COLOR[node.state] }}>{node.state}</span>}
    </div>
  );
}

function countChanged(node) {
  let n = 0;
  const walk = (x) => { if (!x.dir && x.state) n++; if (x.state && x.dir) n++; x.children.forEach(walk); };
  node.children.forEach(walk);
  return n;
}

function FileTree({ project, agent, onOpenFile, activePath }) {
  const stateMap = {};
  (agent.files || []).forEach((f) => { stateMap[f.path] = f.state; });
  const allPaths = Array.from(new Set([...(project ? project.files : []), ...(agent.files || []).map((f) => f.path)]));
  const tree = buildTree(allPaths, stateMap);
  const [openMap, setOpenMap] = useStateX({});
  const toggle = (p) => setOpenMap((m) => ({ ...m, [p]: m[p] === false ? true : false }));
  const changedCount = (agent.files || []).length;
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "8px 12px", borderBottom: "1px solid var(--hair)" }}>
        <Icon name="folder" size="sm" style={{ color: project ? project.color : "var(--ui-ink)" }} />
        <span style={{ fontSize: 11.5, color: "var(--ink-2)" }}>{agent.worktree}</span>
        <span className="chip tnum" style={{ marginLeft: "auto", fontSize: 9, padding: "0 6px" }}>{changedCount} changed</span>
      </div>
      <div className="scroll-y mono" style={{ flex: 1, padding: "6px 4px" }}>
        {tree.map((n) => <TreeNode key={n.path} node={n} depth={0} openMap={openMap} toggle={toggle} onOpenFile={onOpenFile} activePath={activePath} />)}
      </div>
      <div style={{ padding: "7px 12px", borderTop: "1px solid var(--hair)", fontSize: 9.5, color: "var(--ink-4)", display: "flex", alignItems: "center", gap: 6 }}>
        <Icon name="enter" size="sm" style={{ width: 11, height: 11 }} />click a file to open it in the viewer
      </div>
    </div>
  );
}

// ---------- ContextMenu ----------
function ContextMenu({ x, y, items, onClose }) {
  const ref = useRefX(null);
  const [pos, setPos] = useStateX({ x, y });
  useEffectX(() => {
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("mousedown", close);
    document.addEventListener("keydown", esc);
    // clamp to viewport
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      let nx = x, ny = y;
      if (x + r.width > window.innerWidth - 8) nx = window.innerWidth - r.width - 8;
      if (y + r.height > window.innerHeight - 8) ny = window.innerHeight - r.height - 8;
      setPos({ x: nx, y: ny });
    }
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
  }, []);
  return (
    <div ref={ref} className="rise" style={{
      position: "fixed", left: pos.x, top: pos.y, zIndex: 80, minWidth: 196,
      background: "var(--elev)", border: "1px solid var(--hair-2)", borderRadius: "var(--r-md)",
      boxShadow: "var(--shadow)", padding: 5,
    }}>
      {items.map((it, i) => it.sep ? (
        <div key={i} style={{ height: 1, background: "var(--hair)", margin: "5px 6px" }} />
      ) : (
        <button key={i} disabled={it.disabled}
          onClick={() => { if (!it.disabled) { it.onClick && it.onClick(); onClose(); } }}
          style={{
            display: "flex", alignItems: "center", gap: 9, width: "100%", textAlign: "left",
            padding: "6px 9px", borderRadius: 6, border: "none", cursor: it.disabled ? "default" : "pointer",
            background: "transparent", fontFamily: "var(--font-mono)", fontSize: 12,
            color: it.disabled ? "var(--ink-4)" : it.danger ? "var(--st-blocked)" : "var(--ink-2)",
          }}
          onMouseEnter={(e) => { if (!it.disabled) e.currentTarget.style.background = it.danger ? "color-mix(in oklch, var(--st-blocked), transparent 88%)" : "var(--panel-3)"; }}
          onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
          {it.icon && <Icon name={it.icon} size="sm" style={{ color: it.danger ? "var(--st-blocked)" : it.accent || "var(--ink-3)", flex: "none" }} />}
          <span style={{ flex: 1 }}>{it.label}</span>
          {it.kbd && <span className="kbd">{it.kbd}</span>}
        </button>
      ))}
    </div>
  );
}

Object.assign(window, { FileTree, ContextMenu, buildTree });

</script>

<script type="text/babel">
/* global React, Icon, StatusDot, ToolBadge, toolMeta, projectOf, treeAgentIds */
// ORCHESTRA top bar — brand, draggable/groupable agent tabs, run widget, theme

const { useState: useStateT } = React;

// ---- Orrery mark: epicycle rosette (deferent A + epicycle B at freq K) ----
const _RA = 22, _RB = 13, _RK = -4, _RTAU = Math.PI * 2;
function _rosettePath(N) {
  let d = "";
  for (let i = 0; i <= N; i++) {
    const t = i / N * _RTAU;
    const x = 50 + _RA * Math.cos(t) + _RB * Math.cos(_RK * t);
    const y = 50 + _RA * Math.sin(t) + _RB * Math.sin(_RK * t);
    d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2) + " ";
  }
  return d + "Z";
}
const ORRERY_PATH = _rosettePath(160);

// channel metadata: dev = pre-release, prod = shipped (shown as Beta while in beta)
function VersionBadge({ build, onClick }) {
  const isProd = build.channel === "prod";
  const label = isProd ? "BETA" : "DEV";
  const color = isProd ? "var(--ink-2)" : "var(--sem-attn)";
  return (
    <span onClick={onClick} title={"Orrery v" + build.version + " · " + (isProd ? "production (beta)" : "development build") + " · " + build.commit + " · " + build.built + (onClick ? " · what’s new" : "")}
      style={{ display: "inline-flex", alignItems: "center", gap: 5, height: 17, padding: "0 7px", borderRadius: 999,
        border: "1px solid color-mix(in oklch, " + color + ", transparent 58%)",
        background: "color-mix(in oklch, " + color + ", transparent 88%)", cursor: onClick ? "pointer" : "default",
        fontFamily: "var(--font-mono)", fontWeight: 500, letterSpacing: "0.02em", whiteSpace: "nowrap" }}>
      <span style={{ fontSize: 10, color: "var(--ink-2)" }}>v{build.version}</span>
      <span style={{ width: 1, height: 9, background: "color-mix(in oklch, " + color + ", transparent 50%)" }} />
      <span className="up" style={{ fontSize: 8.5, fontWeight: 700, letterSpacing: "0.12em", color }}>{label}</span>
    </span>
  );
}

function Logo({ size = 22 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" aria-label="Orrery">
      <defs>
        <linearGradient id="orose" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor="var(--accent-3)" />
          <stop offset="0.5" stopColor="var(--brand-2)" />
          <stop offset="1" stopColor="var(--brand-3)" />
        </linearGradient>
        <radialGradient id="ocore" cx="50%" cy="50%">
          <stop offset="0" stopColor="var(--brand-core)" stopOpacity="0.95" />
          <stop offset="0.4" stopColor="var(--brand-2)" />
          <stop offset="1" stopColor="var(--brand-2)" stopOpacity="0.2" />
        </radialGradient>
      </defs>
      <path d={ORRERY_PATH} fill="none" stroke="url(#orose)" strokeWidth="4.6" strokeLinejoin="round" />
      <circle cx="50" cy="50" r="12" fill="url(#ocore)" />
    </svg>
  );
}

// label content for a tab (single agent or a group)
function TabLabel({ tab, agents, tickets, active }) {
  if (tab.kind === "orchestrator") {
    return (<>
      <Icon name="layers" size="sm" style={{ color: active ? "var(--ui-ink)" : "inherit" }} />
      <span style={{ fontSize: 12 }}>Orchestrator</span>
    </>);
  }
  if (tab.kind === "backlog") {
    const open = (tickets || []).filter((t) => t.status !== "done").length;
    return (<>
      <Icon name="columns" size="sm" style={{ color: active ? "var(--ui-ink)" : "inherit" }} />
      <span style={{ fontSize: 12 }}>Backlog</span>
      {open > 0 && <span className="chip tnum" style={{ fontSize: 9, padding: "0 5px" }}>{open}</span>}
    </>);
  }
  if (tab.kind === "ticket") {
    const t = tab.ticketId === "new" ? null : (tickets || []).find((x) => x.id === tab.ticketId);
    return (<>
      <Icon name="layers" size="sm" style={{ color: active ? "var(--ui-ink)" : "var(--ink-3)" }} />
      <span style={{ fontSize: 12, maxWidth: 154, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", display: "inline-block" }}>{t ? t.title : "New ticket"}</span>
    </>);
  }
  const ids = treeAgentIds(tab.root);
  const tabAgents = ids.map((id) => agents.find((a) => a.id === id)).filter(Boolean);
  if (tabAgents.length <= 1) {
    const ag = tabAgents[0];
    const proj = ag ? projectOf(ag.projectId) : null;
    return (<>
      <StatusDot status={ag ? ag.status : "idle"} />
      {proj && <span style={{ width: 6, height: 6, borderRadius: 2, background: proj.color, flex: "none" }} title={proj.name} />}
      <span style={{ fontSize: 12 }}>{ag ? ag.name : "agent"}</span>
    </>);
  }
  // group
  return (<>
    <Icon name="columns" size="sm" style={{ color: active ? "var(--ui-ink)" : "var(--ink-3)" }} />
    <span style={{ display: "flex", gap: 2 }}>
      {tabAgents.slice(0, 3).map((a) => <StatusDot key={a.id} status={a.status} />)}
    </span>
    <span style={{ fontSize: 12 }}>{tabAgents[0].name} <span style={{ color: "var(--ink-4)" }}>+{tabAgents.length - 1}</span></span>
  </>);
}

function TopBar({ nav, onSearchEverywhere, tabs, activeTab, onTab, onCloseTab, onTabContext, agents, projects, tickets, onTheme, theme, onRunAll, running, onMergeTabs, onReorderTab, onAddAgent, win, onHide, onMinimize, onMaximize, onClose, build, compact, rightPanel, onSettings, onShowWhatsNew }) {
  const [dragId, setDragId] = useStateT(null);
  const [drop, setDrop] = useStateT(null); // { id, zone: 'merge'|'before'|'after' }

  const onDragOver = (e, tab) => {
    const d = window.__omDrag;
    if (!d || tab.kind !== "agent") return;
    if (d.kind === "agent") {
      e.preventDefault();
      setDrop({ id: tab.id, zone: "merge" });
      return;
    }
    if (d.kind === "tab") {
      if (d.id === tab.id) return;
      const dragged = tabs.find((t) => t.id === d.id);
      if (!dragged || dragged.kind === "orchestrator") return;
      e.preventDefault();
      const r = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - r.left;
      const zone = x < r.width * 0.28 ? "before" : x > r.width * 0.72 ? "after" : "merge";
      setDrop({ id: tab.id, zone });
    }
  };
  const onDrop = (e, tab) => {
    e.preventDefault();
    const d = window.__omDrag;
    if (!d) { setDrop(null); return; }
    if (d.kind === "agent") {
      onAddAgent(d.id, tab.id);
    } else if (d.kind === "tab" && drop && drop.id === tab.id) {
      if (drop.zone === "merge") onMergeTabs(d.id, tab.id);
      else onReorderTab(d.id, tab.id, drop.zone === "before");
    }
    setDragId(null); setDrop(null); window.__omDrag = null;
  };

  return (
    <header style={{ display: "flex", alignItems: "stretch", background: "var(--panel)", borderBottom: "1px solid var(--hair)", height: 44, position: "relative", zIndex: 5 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 11, flex: "none", overflow: "hidden",
        width: compact ? "var(--rail-w)" : "var(--sidebar-w)",
        padding: compact ? 0 : "0 14px", justifyContent: compact ? "center" : "flex-start",
        borderRight: "1px solid var(--hair)" }}>
        <Logo size={24} />
        {!compact && (
          <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.12, minWidth: 0 }}>
            <span className="disp" style={{ fontSize: 15, fontWeight: 600, letterSpacing: "0.005em", display: "flex", alignItems: "center", gap: 8 }}>
              <span><span style={{ color: "var(--ui-ink)" }}>O</span>rrery</span>
              <VersionBadge build={build} onClick={onShowWhatsNew} />
            </span>
            <span style={{ fontSize: 9.5, color: "var(--ink-3)", letterSpacing: "0.04em", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{projects.length} projects · {agents.length} agents</span>
          </div>
        )}
      </div>

      {/* tabs */}
      <div style={{ display: "flex", alignItems: "stretch", flex: 1, minWidth: 0, overflowX: "auto" }}>
        {tabs.map((tab) => {
          const active = activeTab === tab.id;
          const isGroup = tab.kind === "agent" && treeAgentIds(tab.root).length > 1;
          const d = drop && drop.id === tab.id ? drop.zone : null;
          const draggable = tab.kind === "agent";
          return (
            <div key={tab.id} onClick={() => onTab(tab.id)}
              draggable={draggable}
              onDragStart={(e) => { setDragId(tab.id); window.__omDrag = { kind: "tab", id: tab.id, agentId: tab.kind === "agent" ? treeAgentIds(tab.root)[0] : null }; e.dataTransfer.effectAllowed = "move"; }}
              onDragEnd={() => { setDragId(null); setDrop(null); window.__omDrag = null; }}
              onDragOver={(e) => onDragOver(e, tab)}
              onDragLeave={() => setDrop((cur) => cur && cur.id === tab.id ? null : cur)}
              onDrop={(e) => onDrop(e, tab)}
              onContextMenu={(e) => { if (tab.kind === "agent") onTabContext(e, tab); }}
              style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 13px", cursor: "pointer", whiteSpace: "nowrap", position: "relative",
                borderRight: "1px solid var(--hair)", background: active ? "var(--panel-2)" : "transparent", color: active ? "var(--ink)" : "var(--ink-3)",
                opacity: dragId === tab.id ? 0.45 : 1,
                boxShadow: d === "merge" ? "inset 0 0 0 2px var(--ui-line)" : "none" }}>
              {active && <span style={{ position: "absolute", left: 0, right: 0, top: 0, height: 2, background: "var(--ui-ind)" }} />}
              {/* reorder insertion bars */}
              {d === "before" && <span style={{ position: "absolute", left: -1, top: 4, bottom: 4, width: 3, borderRadius: 2, background: "var(--ui-fill)" }} />}
              {d === "after" && <span style={{ position: "absolute", right: -1, top: 4, bottom: 4, width: 3, borderRadius: 2, background: "var(--ui-fill)" }} />}
              {d === "merge" && <span style={{ position: "absolute", inset: 0, background: "var(--ui-sel)", pointerEvents: "none" }} />}

              <TabLabel tab={tab} agents={agents} tickets={tickets} active={active} />
              {(tab.kind === "agent" || tab.kind === "ticket") && (
                <button onClick={(e) => { e.stopPropagation(); onCloseTab(tab.id); }}
                  style={{ background: "transparent", border: "none", color: "var(--ink-4)", cursor: "pointer", display: "flex", padding: 1, borderRadius: 3, marginLeft: 2 }}
                  onMouseEnter={(e) => e.currentTarget.style.color = "var(--ink)"}
                  onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>
                  <Icon name="x" size="sm" />
                </button>
              )}
            </div>
          );
        })}
        {/* hint */}
        {tabs.filter((t) => t.kind === "agent").length >= 2 && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "0 12px", color: "var(--ink-4)", fontSize: 10, whiteSpace: "nowrap" }}>
            <Icon name="columns" size="sm" style={{ width: 12, height: 12 }} />drag a tab onto another to tile them
          </div>
        )}
      </div>

      {/* nav stack + search everywhere — outside the scrolling tab strip so they stay put */}
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "0 12px", flex: "none" }}>
        {nav && <NavArrows {...nav} />}
        {onSearchEverywhere && (
          <button className="btn ghost-hair" onClick={onSearchEverywhere} title={"Search Everywhere · " + kbdLabel("Shift Shift")}
            style={{ height: 26, padding: "0 7px", gap: 5, fontSize: 10.5, color: "var(--ink-3)" }}>
            <Icon name="search" size="sm" /><span className="kbd">{kbdLabel("Shift Shift")}</span>
          </button>
        )}
      </div>

      {/* right cluster — column-aligned to the right panel */}
      <div style={{ display: "flex", alignItems: "stretch", flex: "none",
        width: rightPanel ? "var(--right-w)" : "auto",
        borderLeft: "1px solid var(--hair)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "0 12px", flex: 1, minWidth: 0, justifyContent: "flex-end" }}>
          <div className="action-pill" role="group" aria-label="Workspace controls">
            <button className={"pill-seg run" + (running ? " running" : "")} onClick={onRunAll}
              title={running ? "Pause all agents" : "Run all agents"} aria-label={running ? "Pause all" : "Run all"}>
              <Icon name={running ? "pause" : "play"} size="sm" />
            </button>
            <span className="pill-div" />
            <button className="pill-seg" onClick={onTheme} title="Toggle theme" aria-label="Toggle theme">
              <Icon name={theme === "dark" ? "sun" : "moon"} size="sm" />
            </button>
            <span className="pill-div" />
            <button className="pill-seg" onClick={onSettings} title="Settings" aria-label="Settings">
              <Icon name="settings" size="sm" />
            </button>
          </div>
        </div>
        <div className="vdiv" />
        <WindowControls win={win} onHide={onHide} onMinimize={onMinimize} onMaximize={onMaximize} onClose={onClose} />
      </div>
    </header>
  );
}

function WinBtn({ title, danger, onClick, children }) {
  return (
    <button className={"winbtn" + (danger ? " danger" : "")} title={title} onClick={onClick} aria-label={title}>
      {children}
    </button>
  );
}

function WindowControls({ win, onHide, onMinimize, onMaximize, onClose }) {
  const s = { width: 13, height: 13, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  return (
    <div style={{ display: "flex", alignItems: "stretch", height: "100%", flex: "none" }}>
      <WinBtn title="Hide to tray" onClick={onHide}>
        <svg {...s}><path d="M3 3l18 18" /><path d="M10.6 10.7a2 2 0 002.7 2.8" /><path d="M9.4 5.2A9 9 0 0121 12a16 16 0 01-2.1 2.8M6.3 6.2A16 16 0 003 12a9 9 0 0011 6.4" /></svg>
      </WinBtn>
      <WinBtn title="Minimize" onClick={onMinimize}>
        <svg {...s}><path d="M6 12h12" /></svg>
      </WinBtn>
      <WinBtn title={win === "normal" ? "Maximize" : "Restore"} onClick={onMaximize}>
        {win === "normal"
          ? <svg {...s}><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
          : <svg {...s}><rect x="8.5" y="8.5" width="9.5" height="9.5" rx="1.5" /><path d="M6 15.5V6h9.5" /></svg>}
      </WinBtn>
      <WinBtn title="Close" danger onClick={onClose}>
        <svg {...s}><path d="M6 6l12 12M18 6L6 18" /></svg>
      </WinBtn>
    </div>
  );
}

Object.assign(window, { TopBar, Logo, WindowControls });

</script>
