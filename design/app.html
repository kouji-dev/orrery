<script type="text/babel">
/* global React, Icon */
// ── Tags — snake_case labels: chips, search-or-create picker, filter dropdown ──
const { useState: useStateTG, useRef: useRefTG, useEffect: useEffectTG } = React;

// normalize any free text to a snake_case tag name
function snakeTag(s) {
  return (s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 32);
}

// derive the sorted union of every tag used across a ticket list
function allTagsOf(tickets) {
  const set = new Set();
  (tickets || []).forEach((t) => (t.tags || []).forEach((tag) => set.add(tag)));
  return [...set].sort();
}

// ── a single tag chip (display / toggle / removable) ─────────────────────────
function Tag({ name, active, onClick, onRemove, dim }) {
  const clickable = !!onClick;
  const [h, setH] = useStateTG(false);
  return (
    <span onClick={clickable ? (e) => { e.stopPropagation(); onClick(name); } : undefined}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} title={name}
      style={{ display: "inline-flex", alignItems: "center", gap: 4, flex: "none", maxWidth: 170,
        fontFamily: "var(--font-mono)", fontSize: 10.5, lineHeight: 1, letterSpacing: "0.01em",
        padding: onRemove ? "3px 4px 3px 8px" : "3px 8px", borderRadius: 999, whiteSpace: "nowrap",
        cursor: clickable ? "pointer" : "default", userSelect: "none", transition: "background .12s, border-color .12s, color .12s",
        color: active ? "var(--ui-ink)" : (dim ? "var(--ink-3)" : "var(--ink-2)"),
        border: "1px solid " + (active ? "var(--ui-line)" : (h && clickable ? "var(--hair-2)" : "var(--hair)")),
        background: active ? "var(--ui-sel)" : (h && clickable ? "var(--panel-3)" : "var(--panel-2)") }}>
      <Icon name="tag" size="sm" style={{ width: 10, height: 10, flex: "none", opacity: 0.65 }} />
      <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{name}</span>
      {onRemove && (
        <button onClick={(e) => { e.stopPropagation(); onRemove(name); }} aria-label={"Remove " + name}
          style={{ display: "grid", placeItems: "center", border: "none", background: "transparent", cursor: "pointer",
            color: "var(--ink-4)", padding: 0, width: 14, height: 14, borderRadius: 4, flex: "none" }}
          onMouseEnter={(e) => e.currentTarget.style.color = "var(--ink)"} onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>
          <Icon name="x" size="sm" style={{ width: 10, height: 10 }} />
        </button>
      )}
    </span>
  );
}

// ── floating popover: search existing tags or create a new one ───────────────
function TagPicker({ allTags, attached, onChange, onClose, align = "left" }) {
  const [q, setQ] = useStateTG("");
  const ref = useRefTG(null);
  const inputRef = useRefTG(null);

  useEffectTG(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  useEffectTG(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("mousedown", onDoc); document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [onClose]);

  const norm = snakeTag(q);
  const available = (allTags || []).filter((t) => !attached.includes(t));
  const matches = norm ? available.filter((t) => t.includes(norm)) : available;
  const exact = (allTags || []).includes(norm) || attached.includes(norm);
  const canCreate = !!norm && !exact;

  const attach = (t) => {
    if (!t || attached.includes(t)) return;
    onChange([...attached, t]); setQ("");
    if (inputRef.current) inputRef.current.focus();
  };
  const onKey = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (matches.includes(norm)) attach(norm);
      else if (canCreate) attach(norm);
      else if (matches.length) attach(matches[0]);
    }
  };

  return (
    <div ref={ref} className="surface" style={{ position: "absolute", top: "100%", [align === "right" ? "right" : "left"]: 0, marginTop: 6,
      zIndex: 40, width: 244, padding: 8, boxShadow: "var(--shadow)", display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "6px 9px", borderRadius: "var(--r-sm)", background: "var(--panel-2)", border: "1px solid var(--hair)" }}>
        <Icon name="search" size="sm" style={{ color: "var(--ink-4)", flex: "none" }} />
        <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onKey} placeholder="Search or create a tag…"
          style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5 }} />
      </div>
      {q && norm !== q.trim().toLowerCase() && (
        <div style={{ fontSize: 9.5, color: "var(--ink-4)", padding: "0 2px" }}>
          saves as <span className="tnum" style={{ color: "var(--ink)" }}>{norm || "…"}</span>
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 2, maxHeight: 208, overflowY: "auto" }} className="scroll-y">
        {canCreate && (
          <button className="tag-row" onClick={() => attach(norm)}>
            <Icon name="plus" size="sm" style={{ color: "var(--ui-ink)", flex: "none" }} />
            <span>Create</span><span className="tnum" style={{ color: "var(--ui-ink)" }}>{norm}</span>
          </button>
        )}
        {matches.map((t) => (
          <button key={t} className="tag-row" onClick={() => attach(t)}>
            <Icon name="tag" size="sm" style={{ color: "var(--ink-4)", flex: "none" }} />
            <span className="tnum">{t}</span>
          </button>
        ))}
        {!matches.length && !canCreate && (
          <div style={{ padding: "8px 9px", fontSize: 10.5, color: "var(--ink-4)" }}>
            {available.length ? "no matches" : (attached.length ? "all tags attached" : "no tags yet — type to create one")}
          </div>
        )}
      </div>
    </div>
  );
}

// ── attached chips + an "Add" trigger that opens the picker ──────────────────
function TagBar({ allTags, tags, onChange, align = "left" }) {
  const [open, setOpen] = useStateTG(false);
  const list = tags || [];
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
      {list.map((t) => <Tag key={t} name={t} onRemove={(n) => onChange(list.filter((x) => x !== n))} />)}
      <div style={{ position: "relative" }}>
        <button className="btn ghost-hair" onClick={() => setOpen((o) => !o)}
          style={{ padding: "3px 9px", fontSize: 10.5, color: "var(--ink-3)", gap: 5 }}>
          <Icon name="plus" size="sm" style={{ width: 11, height: 11 }} />{list.length ? "Add" : "Add tag"}
        </button>
        {open && <TagPicker allTags={allTags} attached={list} onChange={onChange} onClose={() => setOpen(false)} align={align} />}
      </div>
    </div>
  );
}

// ── header filter dropdown: multi-select tags (matches ANY) ──────────────────
function TagFilter({ allTags, counts, selected, onChange }) {
  const [open, setOpen] = useStateTG(false);
  const ref = useRefTG(null);
  useEffectTG(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const sel = selected || [];
  const toggle = (t) => onChange(sel.includes(t) ? sel.filter((x) => x !== t) : [...sel, t]);
  const n = sel.length;

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button className="btn ghost-hair" onClick={() => setOpen((o) => !o)}
        style={{ fontSize: 11.5, color: n ? "var(--ui-ink)" : "var(--ink-2)", borderColor: n ? "var(--ui-line)" : "var(--hair)" }}>
        <Icon name="tag" size="sm" style={{ color: n ? "var(--ui-ink)" : "var(--ink-3)" }} />
        {n ? n + " tag" + (n > 1 ? "s" : "") : "Tags"}
        <Icon name="chevronD" size="sm" style={{ color: "var(--ink-4)" }} />
      </button>
      {open && (
        <div className="surface" style={{ position: "absolute", top: "100%", right: 0, marginTop: 6, zIndex: 20, padding: 6, minWidth: 214, boxShadow: "var(--shadow)" }}>
          {!(allTags || []).length && <div style={{ padding: "9px 10px", fontSize: 11, color: "var(--ink-4)" }}>No tags yet</div>}
          {n > 0 && (
            <button className="tag-row" onClick={() => onChange([])} style={{ color: "var(--ink-3)" }}>
              <Icon name="x" size="sm" style={{ flex: "none" }} />Clear filter<span className="tag-count">{n} on</span>
            </button>
          )}
          {(n > 0 && (allTags || []).length > 0) && <div style={{ height: 1, background: "var(--hair)", margin: "5px 2px" }} />}
          <div style={{ maxHeight: 280, overflowY: "auto", display: "flex", flexDirection: "column", gap: 2 }} className="scroll-y">
            {(allTags || []).map((t) => {
              const on = sel.includes(t);
              return (
                <button key={t} className="tag-row" onClick={() => toggle(t)} style={on ? { color: "var(--ink)" } : null}>
                  <span className={"tag-check" + (on ? " on" : "")}>{on && <Icon name="check" size="sm" style={{ width: 10, height: 10 }} />}</span>
                  <span className="tnum">{t}</span>
                  <span className="tag-count">{(counts && counts[t]) || 0}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { Tag, TagPicker, TagBar, TagFilter, snakeTag, allTagsOf });

</script>

<!-- backlog.jsx -->
<script type="text/babel">
/* global React, Icon, StatusDot, ToolBadge, STATUS_META, projectOf, ORG, Tag, TagFilter */
// ── Backlog — integrated Orchestrator view (board + cards) ──────────────────
const { useState: useStateBL } = React;

const TICKET_COL = {
  todo:       { key: "todo",       label: "To do",       color: "var(--ink-3)" },
  inprogress: { key: "inprogress", label: "In progress", color: "var(--st-running)" },
  done:       { key: "done",       label: "Done",        color: "var(--st-done)" },
};
const TICKET_ORDER = ["todo", "inprogress", "done"];

const _plainCache = {};
function plainText(html) {
  if (html == null) return "";
  if (_plainCache[html]) return _plainCache[html];
  const d = document.createElement("div"); d.innerHTML = html;
  const t = (d.textContent || "").replace(/\s+/g, " ").trim();
  _plainCache[html] = t; return t;
}

// ── ticket project chip ──────────────────────────────────────────────────────
function TicketChip({ projectId, muted }) {
  const p = projectOf(projectId);
  if (!p) return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--ink-4)" }}>
      <Icon name="folder" size="sm" style={{ width: 11, height: 11, flex: "none" }} />no project
    </span>
  );
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, minWidth: 0, overflow: "hidden", color: muted ? "var(--ink-3)" : p.color }}>
      <Icon name={p.icon} size="sm" style={{ width: 12, height: 12, flex: "none" }} />
      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
    </span>
  );
}

// ── attached live-agent strip (resolves the real agent's status) ─────────────
function AgentStrip({ agent, onOpen }) {
  const m = STATUS_META[agent.status] || STATUS_META.idle;
  const [hover, setHover] = useStateBL(false);
  return (
    <div onClick={(e) => { e.stopPropagation(); onOpen(agent.id); }}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      title="Open agent workspace"
      style={{ display: "flex", flexDirection: "column", gap: 7, padding: "8px 9px", cursor: "pointer", borderRadius: "var(--r-md)",
        background: "var(--panel-2)", border: "1px solid " + (hover ? "color-mix(in oklch, " + m.color + ", transparent 55%)" : "var(--hair)"),
        boxShadow: hover ? "0 0 0 1px color-mix(in oklch, " + m.color + ", transparent 72%)" : "none", transition: "border-color .15s, box-shadow .15s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
        <ToolBadge tool={agent.tool} size={17} />
        <span className="disp" style={{ fontSize: 12, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: "0 1 auto" }}>{agent.name}</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 5, flex: "none", fontSize: 9.5, padding: "2px 7px 2px 6px", borderRadius: 999,
          letterSpacing: ".08em", textTransform: "uppercase", color: m.color,
          border: "1px solid color-mix(in oklch, " + m.color + ", transparent 62%)", background: "color-mix(in oklch, " + m.color + ", transparent 88%)" }}>
          <StatusDot status={agent.status} />{m.label}
        </span>
        <Icon name="enter" size="sm" style={{ marginLeft: "auto", flex: "none", color: hover ? m.color : "var(--ink-4)", transition: "color .15s" }} />
      </div>
      <div style={{ height: 3, borderRadius: 3, background: "var(--hair)", overflow: "hidden", position: "relative" }}>
        <div style={{ height: "100%", width: Math.max((agent.progress || 0) * 100, 4) + "%", borderRadius: 3,
          background: m.color, opacity: agent.status === "blocked" ? 0.5 : 1, transition: "width .6s ease" }} />
        {agent.status === "running" && <div className="activity" style={{ position: "absolute", inset: 0, background: "transparent" }} />}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "var(--ink-3)" }} className="tnum">
        {agent.status === "blocked" && agent.blockReason
          ? <span style={{ display: "flex", alignItems: "center", gap: 5, color: "var(--code-del-ink)", minWidth: 0 }}>
              <Icon name="flag" size="sm" style={{ width: 11, height: 11, flex: "none" }} />
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{agent.blockReason}</span></span>
          : <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{agent.branch.replace("agent/", "")}</span>}
        <span style={{ marginLeft: "auto", display: "flex", gap: 4, flex: "none", color: "var(--ink-4)" }}>
          <Icon name="commit" size="sm" style={{ width: 11, height: 11 }} />{agent.commits}</span>
      </div>
    </div>
  );
}

// ── ticket card ──────────────────────────────────────────────────────────────
function TicketCard({ ticket, agents, onOpen, onDispatch, onOpenAgent, onDragStart, onDragEnd, dragging, activeTags, onToggleTag }) {
  const [hover, setHover] = useStateBL(false);
  const st = ticket.status;
  const agent = ticket.agentId ? agents.find((a) => a.id === ticket.agentId) : null;

  const wrap = {
    background: "var(--panel)", border: "1px solid var(--hair)", borderRadius: "var(--r-lg)", padding: 13,
    display: "flex", flexDirection: "column", gap: 9, position: "relative", cursor: "pointer",
    transition: "border-color .15s, transform .15s, box-shadow .15s",
    ...(st === "inprogress" ? { borderLeft: "2px solid var(--ui-line)" } : {}),
    ...(st === "done" ? { background: "var(--panel-2)" } : {}),
    ...(hover ? { borderColor: "var(--hair-2)", transform: "translateY(-2px)", boxShadow: "var(--shadow)" } : {}),
    ...(dragging ? { opacity: 0.4 } : {}),
  };

  return (
    <div draggable onDragStart={(e) => onDragStart(e, ticket)} onDragEnd={onDragEnd}
      onClick={() => onOpen(ticket.id)} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={wrap}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
        {st === "done" && (
          <span style={{ flex: "none", width: 16, height: 16, marginTop: 1, borderRadius: "50%", display: "grid", placeItems: "center",
            background: "color-mix(in oklch, var(--st-done), transparent 82%)", border: "1px solid color-mix(in oklch, var(--st-done), transparent 55%)" }}>
            <Icon name="check" size="sm" style={{ width: 11, height: 11, color: "var(--st-done)" }} />
          </span>
        )}
        <span className="disp" style={{ fontSize: 13.5, fontWeight: 600, lineHeight: 1.3, flex: 1, minWidth: 0,
          display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden",
          color: st === "done" ? "var(--ink-2)" : "var(--ink)" }}>{ticket.title}</span>
        <span style={{ flex: "none", fontSize: 9.5, color: "var(--ink-4)", marginTop: 2 }} className="tnum">#{ticket.id.replace(/^t/, "")}</span>
      </div>

      {st !== "done" && <p style={{ fontSize: 12, color: "var(--ink-2)", lineHeight: 1.5,
        display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{plainText(ticket.notes)}</p>}

      {(ticket.tags && ticket.tags.length > 0) && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {ticket.tags.map((t) => <Tag key={t} name={t} active={activeTags && activeTags.includes(t)} onClick={onToggleTag} />)}
        </div>
      )}

      {st === "inprogress" && (agent
        ? <AgentStrip agent={agent} onOpen={onOpenAgent} />
        : <div onClick={(e) => { e.stopPropagation(); onDispatch(ticket); }}
            style={{ display: "flex", alignItems: "center", gap: 7, padding: "7px 9px", borderRadius: "var(--r-md)", cursor: "pointer",
              border: "1px dashed var(--ui-line)", color: "var(--ui-ink)", fontSize: 11 }}>
            <Icon name="bolt" size="sm" />No agent yet — dispatch one</div>)}

      {st === "todo" && (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <TicketChip projectId={ticket.projectId} />
          <button className={"btn " + (hover ? "primary" : "ghost-hair")} onClick={(e) => { e.stopPropagation(); onDispatch(ticket); }}
            style={{ marginLeft: "auto", flex: "none", padding: "5px 11px", fontSize: 11.5,
              ...(hover ? {} : { color: "var(--ui-ink)", borderColor: "var(--ui-line)" }) }}>
            <Icon name="bolt" size="sm" />Dispatch</button>
        </div>
      )}
      {st === "inprogress" && <div style={{ display: "flex", alignItems: "center" }}><TicketChip projectId={ticket.projectId} /></div>}
      {st === "done" && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, color: "var(--ink-3)" }} className="tnum">
          <TicketChip projectId={ticket.projectId} muted />
          {agent && <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, flex: "none" }}>
            <ToolBadge tool={agent.tool} size={14} />
            <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 92 }}>{agent.name}</span>
            <span style={{ color: "var(--ink-4)" }}>·</span>
            <span style={{ display: "flex", alignItems: "center", gap: 3, color: "var(--st-done)" }}>
              <Icon name="commit" size="sm" style={{ width: 11, height: 11 }} />{agent.commits}</span>
          </span>}
        </div>
      )}
    </div>
  );
}

// ── board column (drop target) ───────────────────────────────────────────────
function Column({ status, tickets, agents, onOpen, onDispatch, onOpenAgent, onMove, drag, setDrag, onNew, activeTags, onToggleTag }) {
  const m = TICKET_COL[status];
  const [over, setOver] = useStateBL(false);
  const isTarget = drag && drag.from !== status;

  return (
    <div onDragOver={(e) => { if (drag) { e.preventDefault(); setOver(true); } }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => { e.preventDefault(); if (drag) onMove(drag.id, status); setOver(false); }}
      style={{ display: "flex", flexDirection: "column", gap: 9, minWidth: 0, borderRadius: "var(--r-lg)",
        outline: over && isTarget ? "1.5px dashed color-mix(in oklch, " + m.color + ", transparent 35%)" : "1.5px dashed transparent",
        outlineOffset: 4, background: over && isTarget ? "color-mix(in oklch, " + m.color + ", transparent 94%)" : "transparent", transition: "background .15s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 2px 6px", borderBottom: "2px solid " + m.color, flex: "none" }}>
        <span className="up" style={{ fontSize: 10, color: "var(--ink-2)" }}>{m.label}</span>
        <span className="chip tnum" style={{ marginLeft: "auto", fontSize: 9.5, padding: "0 6px" }}>{tickets.length}</span>
      </div>
      {tickets.map((tk) => (
        <TicketCard key={tk.id} ticket={tk} agents={agents} onOpen={onOpen} onDispatch={onDispatch} onOpenAgent={onOpenAgent}
          dragging={drag && drag.id === tk.id} activeTags={activeTags} onToggleTag={onToggleTag}
          onDragStart={(e, t) => { setDrag({ id: t.id, from: t.status }); try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id); } catch (_) {} }}
          onDragEnd={() => { setDrag(null); setOver(false); }} />
      ))}
      {status === "todo" && (
        <button className="btn" onClick={onNew} style={{ justifyContent: "center", gap: 6, padding: 9, borderRadius: "var(--r-md)",
          border: "1px dashed var(--hair-2)", color: "var(--ink-3)", fontSize: 11.5, background: "transparent" }}>
          <Icon name="plus" size="sm" />New ticket</button>
      )}
      {!tickets.length && status !== "todo" && (
        <div style={{ padding: 14, textAlign: "center", color: "var(--ink-4)", fontSize: 10.5, border: "1px dashed var(--hair)", borderRadius: "var(--r-md)" }}>empty</div>
      )}
    </div>
  );
}

// ── the Backlog view (center pane) ───────────────────────────────────────────
function BacklogView({ tickets, agents, projects, allTags, onOpen, onNew, onDispatch, onOpenAgent, onMove }) {
  const [filter, setFilter] = useStateBL("all");
  const [filterOpen, setFilterOpen] = useStateBL(false);
  const [tagSel, setTagSel] = useStateBL([]);
  const [drag, setDrag] = useStateBL(null);

  const tags = allTags || [];
  const tagCounts = {};
  tickets.forEach((t) => (t.tags || []).forEach((tg) => { tagCounts[tg] = (tagCounts[tg] || 0) + 1; }));
  // keep the filter from holding tags that no longer exist anywhere
  const activeTagSel = tagSel.filter((t) => tags.includes(t));
  const toggleTag = (t) => setTagSel((s) => s.includes(t) ? s.filter((x) => x !== t) : [...s, t]);

  const shown = tickets.filter((t) =>
    (filter === "all" || t.projectId === filter) &&
    (activeTagSel.length === 0 || (t.tags || []).some((tg) => activeTagSel.includes(tg)))
  );
  const open = tickets.filter((t) => t.status !== "done").length;
  const filterName = filter === "all" ? "All projects" : (projectOf(filter) || {}).name;
  const isEmpty = tickets.length === 0;

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel-2)" }}>
      {/* header */}
      <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", flex: "none", borderBottom: "1px solid var(--hair)", background: "var(--panel)" }}>
        <div>
          <h1 className="disp" style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-0.02em" }}>Backlog</h1>
          <span style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{tickets.length} tickets · {open} open · {ORG}</span>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ position: "relative" }}>
            <button className="btn ghost-hair" style={{ fontSize: 11.5, color: "var(--ink-2)" }} onClick={() => setFilterOpen((o) => !o)}>
              <Icon name="folder" size="sm" style={{ color: "var(--ink-3)" }} />{filterName}
              <Icon name="chevronD" size="sm" style={{ color: "var(--ink-4)" }} />
            </button>
            {filterOpen && (
              <div className="surface" style={{ position: "absolute", top: "100%", right: 0, marginTop: 6, zIndex: 20, padding: 5, minWidth: 190, boxShadow: "var(--shadow)" }}>
                {[{ id: "all", name: "All projects" }, ...projects].map((p) => (
                  <div key={p.id} onClick={() => { setFilter(p.id); setFilterOpen(false); }}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 9px", borderRadius: "var(--r-sm)", cursor: "pointer", fontSize: 12,
                      background: filter === p.id ? "var(--panel-3)" : "transparent", color: filter === p.id ? "var(--ink)" : "var(--ink-2)" }}
                    onMouseEnter={(e) => { if (filter !== p.id) e.currentTarget.style.background = "var(--panel-2)"; }}
                    onMouseLeave={(e) => { if (filter !== p.id) e.currentTarget.style.background = "transparent"; }}>
                    {p.id === "all" ? <Icon name="layers" size="sm" style={{ color: "var(--ink-3)" }} /> : <Icon name={p.icon} size="sm" style={{ color: p.color }} />}
                    {p.name}
                  </div>
                ))}
              </div>
            )}
          </div>
          <TagFilter allTags={tags} counts={tagCounts} selected={activeTagSel} onChange={setTagSel} />
          <button className="btn primary" onClick={onNew}><Icon name="plus" size="sm" />New ticket</button>
        </div>
      </div>

      {/* active tag-filter summary */}
      {activeTagSel.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 18px", flex: "none", borderBottom: "1px solid var(--hair)", background: "var(--panel)" }}>
          <span className="up" style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: ".1em", flex: "none" }}>Filtered by</span>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {activeTagSel.map((t) => <Tag key={t} name={t} active onRemove={(n) => toggleTag(n)} />)}
          </div>
          <span style={{ marginLeft: "auto", flex: "none", fontSize: 10.5, color: "var(--ink-4)" }} className="tnum">{shown.length} of {tickets.length}</span>
        </div>
      )}

      {/* body */}
      <div className="scroll-y" style={{ flex: 1 }}>
        {isEmpty ? (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: "80px 20px", textAlign: "center" }}>
            <div style={{ width: 52, height: 52, borderRadius: 14, display: "grid", placeItems: "center",
              background: "var(--ui-sel)", border: "1px solid var(--ui-sel-2)" }}>
              <Icon name="layers" size="lg" style={{ color: "var(--ui-ink)" }} />
            </div>
            <div>
              <div className="disp" style={{ fontSize: 16, fontWeight: 600 }}>No tickets yet</div>
              <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 5, maxWidth: 340, lineHeight: 1.5 }}>
                Capture work to be done, then dispatch an agent straight from a ticket — the board tracks it to&nbsp;done.</div>
            </div>
            <button className="btn primary" onClick={onNew}><Icon name="plus" size="sm" />New ticket</button>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, padding: 18, alignContent: "start" }}>
            {TICKET_ORDER.map((s) => (
              <Column key={s} status={s} tickets={shown.filter((t) => t.status === s)} agents={agents}
                onOpen={onOpen} onDispatch={onDispatch} onOpenAgent={onOpenAgent} onMove={onMove}
                drag={drag} setDrag={setDrag} onNew={onNew} activeTags={activeTagSel} onToggleTag={toggleTag} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

Object.assign(window, { BacklogView, TicketCard, TICKET_COL, TICKET_ORDER, plainText, TicketChip });

function StatusBar({ agents, projects, toast, build, onShowWhatsNew, onOpenLog, scopeAgent, asleep, onOpenPerf, onOpenCost }) {
  const running = agents.filter((a) => a.status === "running").length;
  const blocked = agents.filter((a) => a.status === "blocked").length;
  const isProd = build.channel === "prod";
  const chColor = isProd ? "var(--ink-2)" : "var(--sem-attn)";
  const mem = window.memorySplit ? window.memorySplit(agents, (id) => !!(asleep && asleep[id])) : null;
  const mb = window.procMb || ((v) => v + " MB");
  // the footer is a fixed 24px row — measure it and shed the lowest-priority
  // items instead of letting anything wrap and clip
  const footRef = useRef(null);
  const [fw, setFw] = useState(1400);
  useEffect(() => {
    const el = footRef.current; if (!el || !window.ResizeObserver) return;
    const ro = new ResizeObserver(() => setFw(el.clientWidth));
    ro.observe(el); setFw(el.clientWidth);
    return () => ro.disconnect();
  }, []);
  const showRoot = fw > 1240, showCounts = fw > 1120, showHealth = fw > 1040, fullMem = fw > 1330;
  const item = { display: "flex", alignItems: "center", gap: 5, flex: "none", whiteSpace: "nowrap" };
  return (
    <footer ref={footRef} style={{ display: "flex", alignItems: "center", gap: 14, padding: "0 14px", background: "var(--panel)", borderTop: "1px solid var(--hair)", fontSize: 10.5, color: "var(--ink-3)", overflow: "hidden", whiteSpace: "nowrap" }}>
      <span style={{ display: "flex", gap: 6, alignItems: "center", flex: "none", whiteSpace: "nowrap" }}>
        <span className="dot running" style={{ background: "var(--st-running)" }} />{running} running
      </span>
      {blocked > 0 && <span style={{ ...item, gap: 6, color: "var(--st-blocked)" }}>
        <span className="dot" style={{ background: "var(--st-blocked)" }} />{blocked} need attention
      </span>}
      {showCounts && <span className="tnum" style={item}>{projects.length} projects · {agents.length} agents</span>}
      {showRoot && <span style={item}><Icon name="folder" size="sm" style={{ width: 11, height: 11 }} />{WORKTREE_ROOT}</span>}
      <span style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", flex: "none", whiteSpace: "nowrap" }} className="tnum">
        {toast && <span className="grad-ink" style={{ fontWeight: 600 }}>{toast}</span>}
        {toast && <span style={{ color: "var(--ink-4)" }}>·</span>}
        {scopeAgent && window.LiveTokenMeter && (
          <React.Fragment>
            <FootAction title="Token & cost dashboard" onClick={onOpenCost}><window.LiveTokenMeter agent={scopeAgent} /></FootAction>
            <span style={{ color: "var(--ink-4)" }}>·</span>
          </React.Fragment>
        )}
        {showHealth && <span style={item}>
          <Icon name="link" size="sm" style={{ width: 11, height: 11 }} />orchestrator: healthy
        </span>}
        {showHealth && <span style={{ color: "var(--ink-4)" }}>·</span>}
        <FootAction icon="file" title="Open log file" onClick={onOpenLog}>Logs</FootAction>
        <span style={{ color: "var(--ink-4)" }}>·</span>
        {mem && (
          <React.Fragment>
            <FootAction icon="cpu" title={"Orrery " + mb(mem.own) + " · agents " + mb(mem.agents) + " · CPU " + mem.cpu + "% — open the process tree"} onClick={onOpenPerf}>
              <span className="tnum" style={{ whiteSpace: "nowrap" }}>
                {fullMem && <React.Fragment>{mb(mem.own)}<span style={{ color: "var(--ink-4)" }}> · </span></React.Fragment>}
                <span style={{ color: mem.agents > 1400 ? "var(--st-blocked)" : "var(--ink-2)" }}>{mb(mem.agents)}</span>
                <span style={{ color: "var(--ink-4)" }}> · </span>
                <span style={{ color: mem.cpu > 70 ? "var(--st-blocked)" : mem.cpu > 40 ? "var(--sem-attn)" : "var(--ink-2)" }}>{mem.cpu}%</span>
              </span>
              {mem.slept > 0 && fullMem && <span style={{ color: "var(--ui-ink)" }}>· {mem.slept} slept</span>}
            </FootAction>
            <span style={{ color: "var(--ink-4)" }}>·</span>
          </React.Fragment>
        )}
        <FootAction title="Release changelog · what’s new" onClick={onShowWhatsNew} gap={6}>
          <span>v{build.version}</span>
          <span className="up" style={{ fontSize: 8.5, fontWeight: 700, letterSpacing: "0.1em", color: chColor,
            border: "1px solid color-mix(in oklch, " + chColor + ", transparent 58%)", borderRadius: 4, padding: "0 4px" }}>
            {isProd ? "BETA" : "DEV"}
          </span>
        </FootAction>
      </span>
    </footer>
  );
}
