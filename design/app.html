<script type="text/babel">
/* global React, Icon, fileName, fileDir, langOf */
// Orrery — Find in Files / Replace in Files (roadmap B3.1 · B3.2 · B3.3).
// Streams results as they arrive, scope-selectable, preview-then-apply replace.

const { useState: useStateS, useEffect: useEffectS, useRef: useRefS, useMemo: useMemoS } = React;

// ---- corpus: the repo text, replicated per worktree so scope means something
function searchCorpus(ctx) {
  const FC = window.FILE_CONTENTS || {};
  const base = Object.keys(FC).map((p) => ({ path: p, text: FC[p] }));
  const agents = ctx.agents || [];
  const scoped = [];
  base.forEach((f) => {
    scoped.push({ ...f, worktree: null, agentId: null, projectId: (ctx.scopeAgent && ctx.scopeAgent.projectId) || null });
  });
  agents.forEach((a) => {
    // an agent's worktree diverges only in the files it touched
    (a.files || []).forEach((f) => {
      const src = FC[f.path];
      if (src == null) return;
      scoped.push({ path: f.path, text: src, worktree: a.worktree, agentId: a.id, projectId: a.projectId });
    });
  });
  return scoped;
}

function buildRe(q, { regex, word, caseSensitive }) {
  let src = regex ? q : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (word) src = "\\b(?:" + src + ")\\b";
  try { return new RegExp(src, caseSensitive ? "g" : "gi"); } catch (e) { return null; }
}

function Hl({ text, ranges }) {
  if (!ranges || !ranges.length) return <span>{text}</span>;
  const out = []; let at = 0;
  ranges.forEach(([s, e], i) => {
    if (s > at) out.push(<span key={"p" + i}>{text.slice(at, s)}</span>);
    out.push(<mark key={"m" + i} style={{ background: "var(--ui-sel-2)", color: "var(--ink)", borderRadius: 2, padding: "0 1px" }}>{text.slice(s, e)}</mark>);
    at = e;
  });
  if (at < text.length) out.push(<span key="tail">{text.slice(at)}</span>);
  return <React.Fragment>{out}</React.Fragment>;
}

const SCOPES = [
  { k: "worktree", label: "This worktree" },
  { k: "project", label: "This project" },
  { k: "all", label: "All worktrees" },
  { k: "diff", label: "Current diff" },
];

function FindInFiles({ tool, ctx, onClose }) {
  const [mode, setMode] = useStateS(tool.mode === "replace" ? "replace" : "find");
  const [q, setQ] = useStateS("");
  const [rep, setRep] = useStateS("");
  const [scope, setScope] = useStateS("worktree");
  const [opts, setOpts] = useStateS({ caseSensitive: false, word: false, regex: false });
  const [hits, setHits] = useStateS([]);          // streamed matches
  const [scanned, setScanned] = useStateS(0);
  const [total, setTotal] = useStateS(0);
  const [busy, setBusy] = useStateS(false);
  const [skip, setSkip] = useStateS({});          // per-match opt-out for replace
  const [applied, setApplied] = useStateS(0);
  const [sel, setSel] = useStateS(0);
  const timer = useRefS(null);
  const inputRef = useRefS(null);
  useEffectS(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  useEffectS(() => () => clearInterval(timer.current), []);
  useEffectS(() => { setMode(tool.mode === "replace" ? "replace" : "find"); }, [tool.mode]);

  const files = useMemoS(() => {
    const all = searchCorpus(ctx);
    const ag = ctx.scopeAgent;
    if (scope === "all") return all;
    if (scope === "project") return all.filter((f) => !f.projectId || !ag || f.projectId === ag.projectId);
    if (scope === "diff") {
      const paths = new Set((ag && ag.files || []).map((f) => f.path));
      return all.filter((f) => !f.worktree && paths.has(f.path));
    }
    return all.filter((f) => !f.worktree || (ag && f.agentId === ag.id));
  }, [ctx.agents, ctx.scopeAgent, scope]);

  // streamed scan: 6 files per 24ms tick, so results visibly arrive
  const run = () => {
    clearInterval(timer.current);
    setHits([]); setScanned(0); setTotal(0); setSkip({}); setApplied(0); setSel(0);
    const re = q ? buildRe(q, opts) : null;
    if (!re || !q) { setBusy(false); return; }
    setBusy(true);
    let i = 0;
    timer.current = setInterval(() => {
      const batch = [];
      let n = 0;
      while (i < files.length && n < 6) {
        const f = files[i++]; n++;
        const lines = f.text.split("\n");
        lines.forEach((s, li) => {
          re.lastIndex = 0;
          let m, ranges = [];
          while ((m = re.exec(s))) { ranges.push([m.index, m.index + (m[0].length || 1)]); if (!m[0].length) re.lastIndex++; if (ranges.length > 40) break; }
          if (ranges.length) batch.push({ id: (f.worktree || "main") + ":" + f.path + ":" + (li + 1), path: f.path, worktree: f.worktree, agentId: f.agentId, line: li + 1, s, ranges });
        });
      }
      if (batch.length) { setHits((h) => h.concat(batch)); setTotal((t) => t + batch.reduce((a, b) => a + b.ranges.length, 0)); }
      setScanned(i);
      if (i >= files.length) { clearInterval(timer.current); setBusy(false); }
    }, 24);
  };
  useEffectS(() => { const t = setTimeout(run, 220); return () => clearTimeout(t); }, [q, opts.caseSensitive, opts.word, opts.regex, scope, files.length]);

  const groups = useMemoS(() => {
    const map = new Map();
    hits.forEach((h) => {
      const key = (h.worktree ? h.worktree + "/" : "") + h.path;
      if (!map.has(key)) map.set(key, { key, path: h.path, worktree: h.worktree, agentId: h.agentId, items: [] });
      map.get(key).items.push(h);
    });
    return Array.from(map.values());
  }, [hits]);

  const flat = useMemoS(() => groups.flatMap((g) => g.items), [groups]);
  const open = (h) => ctx.openFileAt(h.path, h.line);
  const activeCount = flat.filter((h) => !skip[h.id]).length;

  const applyReplace = () => {
    const re = buildRe(q, opts);
    if (!re) return;
    const FC = window.FILE_CONTENTS || {};
    const touched = new Set();
    let count = 0;
    flat.forEach((h) => {
      if (skip[h.id] || h.worktree) return;
      const src = FC[h.path];
      if (src == null) return;
      const lines = src.split("\n");
      re.lastIndex = 0;
      const before = lines[h.line - 1];
      if (before == null) return;
      const after = before.replace(buildRe(q, opts), rep);
      if (after !== before) { lines[h.line - 1] = after; FC[h.path] = lines.join("\n"); touched.add(h.path); count += h.ranges.length; }
    });
    setApplied(count);
    ctx.flash("replaced " + count + " match" + (count === 1 ? "" : "es") + " in " + touched.size + " file" + (touched.size === 1 ? "" : "s"));
    setTimeout(run, 60);
  };

  const optBtn = (k, label, title) => (
    <button className="btn" onClick={() => setOpts((o) => ({ ...o, [k]: !o[k] }))} title={title}
      style={{ padding: "2px 7px", fontSize: 10.5, borderRadius: 4, minWidth: 26, justifyContent: "center",
        border: "1px solid " + (opts[k] ? "var(--ui-line)" : "var(--hair)"),
        color: opts[k] ? "var(--ink)" : "var(--ink-3)", background: opts[k] ? "var(--ui-sel)" : "transparent" }}>
      {label}
    </button>
  );

  const inputStyle = { flex: 1, minWidth: 0, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "6px 9px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 12, outline: "none" };
  const preview = (h) => {
    const re = buildRe(q, opts);
    return re ? h.s.replace(re, rep) : h.s;
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
      {/* query row */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
        <div style={{ display: "flex", gap: 2, padding: 2, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", flex: "none" }}>
          {[["find", "Find"], ["replace", "Replace"]].map(([k, l]) => (
            <button key={k} className="btn" onClick={() => setMode(k)}
              style={{ padding: "3px 9px", borderRadius: 4, fontSize: 10.5, background: mode === k ? "var(--panel-3)" : "transparent", color: mode === k ? "var(--ink)" : "var(--ink-3)", boxShadow: mode === k ? "0 0 0 1px var(--hair-2)" : "none" }}>{l}</button>
          ))}
        </div>
        <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search in files…" style={inputStyle}
          onKeyDown={(e) => { if (e.key === "Enter") run(); if (e.key === "Escape") onClose(); }}
          onFocus={(e) => (e.target.style.borderColor = "var(--ui-focus)")} onBlur={(e) => (e.target.style.borderColor = "var(--hair)")} />
        <div style={{ display: "flex", gap: 4, flex: "none" }}>
          {optBtn("caseSensitive", "Aa", "Match case")}
          {optBtn("word", "W", "Words")}
          {optBtn("regex", ".*", "Regular expression")}
        </div>
        <select className="osel" value={scope} onChange={(e) => setScope(e.target.value)} style={{ width: 150, flex: "none", padding: "5px 9px", fontSize: 11 }}>
          {SCOPES.map((s) => <option key={s.k} value={s.k}>{s.label}</option>)}
        </select>
      </div>

      {mode === "replace" && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none", background: "var(--panel-2)" }}>
          <Icon name="rename" size="sm" style={{ color: "var(--ui-ink)" }} />
          <input value={rep} onChange={(e) => setRep(e.target.value)} placeholder="Replace with…" style={{ ...inputStyle, background: "var(--panel)" }} />
          <span style={{ fontSize: 10, color: "var(--ink-4)", flex: "none" }}>{activeCount} of {flat.length} selected</span>
          <button className="btn ghost-hair" style={{ flex: "none", fontSize: 11 }} disabled={!flat.length} onClick={() => setSkip({})}>All</button>
          <button className="btn ghost-hair" style={{ flex: "none", fontSize: 11 }} disabled={!flat.length}
            onClick={() => setSkip(Object.fromEntries(flat.map((h) => [h.id, true])))}>None</button>
          <button className="btn primary" style={{ flex: "none" }} disabled={!activeCount || !q}
            onClick={applyReplace}><Icon name="check" size="sm" />Replace {activeCount}</button>
        </div>
      )}

      {/* status row */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 12px", borderBottom: "1px solid var(--hair)", flex: "none", fontSize: 10.5, color: "var(--ink-3)" }}>
        {busy
          ? <span style={{ display: "flex", alignItems: "center", gap: 7, color: "var(--st-running)" }}><span className="dot running" style={{ background: "var(--st-running)" }} />streaming results… {scanned}/{files.length} files</span>
          : <span className="tnum">{q ? total + " match" + (total === 1 ? "" : "es") + " in " + groups.length + " file" + (groups.length === 1 ? "" : "s") : "type to search " + files.length + " indexed files"}</span>}
        {applied > 0 && <span style={{ color: "var(--st-done)" }}>{applied} replaced</span>}
        <span className="chip" style={{ marginLeft: "auto", fontSize: 9 }}>ripgrep · {SCOPES.find((s) => s.k === scope).label.toLowerCase()}</span>
        {busy && <button className="btn ghost-hair" style={{ padding: "2px 8px", fontSize: 10 }} onClick={() => { clearInterval(timer.current); setBusy(false); }}><Icon name="stop" size="sm" />Stop</button>}
      </div>

      {/* results */}
      <div className="scroll-y" style={{ flex: 1, minHeight: 0, padding: "4px 0" }}>
        {!q && <div style={{ padding: "16px 14px", fontSize: 11.5, color: "var(--ink-4)" }}>results stream in as files are scanned — click a line to open it at that position</div>}
        {q && !busy && !groups.length && <div style={{ padding: "16px 14px", fontSize: 11.5, color: "var(--ink-4)" }}>no matches for “{q}”</div>}
        {groups.map((g) => (
          <div key={g.key} style={{ marginBottom: 2 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "5px 12px", position: "sticky", top: 0, background: "var(--panel)", zIndex: 1, borderBottom: "1px solid var(--hair)" }}>
              <Icon name="file" size="sm" style={{ color: "var(--ink-3)" }} />
              <span style={{ fontSize: 11.5 }}>{fileName(g.path)}</span>
              <span style={{ fontSize: 9.5, color: "var(--ink-4)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(g.path)}</span>
              {g.worktree && <span className="chip" style={{ fontSize: 9, padding: "1px 6px", color: "var(--ink-2)" }}>{g.worktree}</span>}
              <span className="tnum" style={{ fontSize: 9.5, color: "var(--ink-4)" }}>{g.items.reduce((a, b) => a + b.ranges.length, 0)}</span>
            </div>
            {g.items.map((h) => {
              const off = skip[h.id];
              const i = flat.indexOf(h);
              return (
                <div key={h.id} onClick={() => { setSel(i); open(h); }} onMouseEnter={() => setSel(i)}
                  style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "3px 12px 3px 26px", cursor: "pointer", fontSize: 11.5, lineHeight: 1.55,
                    background: sel === i ? "var(--panel-3)" : "transparent", opacity: off ? 0.45 : 1 }}>
                  {mode === "replace" && (
                    <button onClick={(e) => { e.stopPropagation(); setSkip((s) => ({ ...s, [h.id]: !s[h.id] })); }} title="Include this match"
                      style={{ flex: "none", width: 13, height: 13, marginTop: 3, borderRadius: 3, display: "grid", placeItems: "center", cursor: "pointer",
                        border: "1px solid " + (off ? "var(--hair-2)" : "var(--ui-focus)"), background: off ? "transparent" : "var(--ui-fill)" }}>
                      {!off && <Icon name="check" size="sm" style={{ width: 9, height: 9, color: "var(--ui-on-fill)" }} />}
                    </button>
                  )}
                  <span className="tnum" style={{ flex: "none", width: 34, textAlign: "right", color: "var(--ink-4)", fontSize: 10.5 }}>{h.line}</span>
                  <span style={{ flex: 1, minWidth: 0, whiteSpace: "pre-wrap", wordBreak: "break-word", color: "var(--ink-2)" }}>
                    <Hl text={h.s.replace(/^\s+/, "")} ranges={h.ranges.map(([s, e]) => { const trim = h.s.length - h.s.replace(/^\s+/, "").length; return [Math.max(0, s - trim), Math.max(0, e - trim)]; })} />
                  </span>
                  {mode === "replace" && rep !== "" && !off && (
                    <span style={{ flex: 1, minWidth: 0, whiteSpace: "pre-wrap", wordBreak: "break-word", color: "var(--code-add-ink)", background: "var(--code-add-bg)", borderRadius: 3, padding: "0 4px" }}>{preview(h).replace(/^\s+/, "")}</span>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

window.TOOL_PANELS.search = { kind: "search", label: "Find", icon: "search", Component: FindInFiles };
Object.assign(window, { FindInFiles });

</script>

<!-- gitactions.jsx -->
<script type="text/babel">
/* global React, Icon, fmtDur */
// Orrery — dual-path git actions (roadmap A4). Native is the primary press and
// always free; the AI variant is always offered too and always states its price
// on the row before it runs. Estimates calibrate against recorded actuals.

const { useState: useStateG, useEffect: useEffectG, useRef: useRefG } = React;

// ---- provider rate table (user-editable in Settings ▸ Cost) ----
window.COST_RATES = window.COST_RATES || {
  "opus-4.6": { in: 15, out: 75 }, "sonnet-4.6": { in: 3, out: 15 }, "haiku-4.6": { in: 0.8, out: 4 },
  "gpt-5.3-codex": { in: 2.5, out: 10 }, "o5-mini": { in: 1.1, out: 4.4 },
  "composer-2": { in: 1.5, out: 6 }, "gemini-3-pro": { in: 2, out: 12 }, "gemini-3-flash": { in: 0.3, out: 1.2 },
  default: { in: 3, out: 15 },
};
// budget guard (A4.4)
window.COST_BUDGET = window.COST_BUDGET || { capUsd: 25, confirmAboveUsd: 1.0, spentUsd: 4.62 };
// actuals ledger — estimator switches to the observed median after 3 runs (A4.3)
window.COST_LEDGER = window.COST_LEDGER || [];

const rateOf = (model) => window.COST_RATES[model] || window.COST_RATES.default;

// per-op heuristic: base tokens + a term for the diff it must read
const OP_SPEC = {
  commit: { lo: 1200, hi: 2600, perKb: 260, label: "Commit" },
  push: { lo: 0, hi: 0, perKb: 0, label: "Push" },
  fetch: { lo: 0, hi: 0, perKb: 0, label: "Fetch" },
  pull: { lo: 0, hi: 0, perKb: 0, label: "Pull" },
  merge: { lo: 4500, hi: 9000, perKb: 420, label: "Merge" },
  rebase: { lo: 6000, hi: 13000, perKb: 520, label: "Rebase" },
  conflict: { lo: 2600, hi: 6200, perKb: 700, label: "Resolve conflict" },
  hunk: { lo: 900, hi: 2100, perKb: 520, label: "Resolve hunk" },
  cherrypick: { lo: 3000, hi: 7000, perKb: 450, label: "Cherry-pick" },
  revert: { lo: 2500, hi: 6000, perKb: 400, label: "Revert" },
  squash: { lo: 2200, hi: 5200, perKb: 300, label: "Squash" },
  branch: { lo: 260, hi: 700, perKb: 0, label: "Name branch" },
};

// estimate({op, files, diffBytes, conflicts, model, verbose}) → cost envelope
function estimateCost({ op, files = 0, diffBytes = 0, conflicts = 0, model = "sonnet-4.6", verbose = false }) {
  const spec = OP_SPEC[op] || OP_SPEC.commit;
  const past = window.COST_LEDGER.filter((e) => e.op === op && e.model === model);
  const kb = diffBytes / 1024;
  let lo = spec.lo + spec.perKb * kb + conflicts * 800 + files * 120;
  let hi = spec.hi + spec.perKb * kb * 1.6 + conflicts * 1500 + files * 260;
  let confidence = "heuristic";
  if (past.length >= 3) {
    const med = past.map((e) => e.tokens).sort((a, b) => a - b)[Math.floor(past.length / 2)];
    lo = med * 0.8; hi = med * 1.25; confidence = "calibrated · " + past.length + " runs";
  }
  if (verbose) { lo *= 1.7; hi *= 1.8; }
  const r = rateOf(model);
  const usd = (tok) => (tok * 0.75 * r.in + tok * 0.25 * r.out) / 1e6;
  return { op, model, tokensLow: Math.round(lo), tokensHigh: Math.round(hi), usdLow: usd(lo), usdHigh: usd(hi), confidence };
}

const fmtTok = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : String(Math.round(n));
const fmtUsd = (n) => n >= 1 ? "$" + n.toFixed(2) : n >= 0.01 ? "$" + n.toFixed(2) : "$" + n.toFixed(3);

// deterministic per-agent token ledger (hook events + ccusage sampler, simulated)
function hashId(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function agentCost(ag) {
  if (!ag) return { tokens: 0, cached: 0, usd: 0, lines: 0, perLine: 0, ctx: 0 };
  const h = hashId(ag.id + ag.name);
  const base = 42000 + (h % 160000);
  const live = (ag.status === "running" ? (ag.elapsed || 0) * 420 : 0);
  const tokens = base + live;
  const cached = Math.round(tokens * (0.32 + (h % 25) / 100));
  const r = rateOf(ag.model);
  const usd = ((tokens - cached) * r.in + cached * r.in * 0.1 + tokens * 0.22 * r.out) / 1e6;
  const lines = (ag.files || []).reduce((s, f) => s + (f.add || 0), 0) + (ag.commits || 0) * 24;
  return { tokens, cached, usd, lines, perLine: lines ? tokens / lines : 0, ctx: Math.min(0.98, ((h % 40) + 22 + (ag.elapsed || 0) / 26) / 100) };
}

function recordActual({ op, model, tokens, usd, estimate, flash }) {
  window.COST_LEDGER.push({ op, model, tokens, usd, at: Date.now() });
  window.COST_BUDGET.spentUsd += usd;
  if (estimate && tokens > estimate.tokensHigh * 1.5 && flash) {
    flash("⚠ " + (OP_SPEC[op] || {}).label + " cost " + fmtTok(tokens) + " tok — " + Math.round(tokens / estimate.tokensHigh * 100 - 100) + "% over estimate");
  }
}

// ------------------------------------------------------------ the split button
// variants: [{ id, label, op, verbose, run }] — each row shows its own estimate
function GitActionButton({ label, icon, kind = "ghost-hair", disabled, title, onNative, variants = [], estimateInput = {}, small, flash, menuAlign = "right" }) {
  const [open, setOpen] = useStateG(false);
  const ref = useRefG(null);
  useEffectG(() => {
    if (!open) return;
    const away = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", away); document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", away); document.removeEventListener("keydown", esc); };
  }, [open]);
  const budget = window.COST_BUDGET;
  const remaining = Math.max(0, budget.capUsd - budget.spentUsd);
  const pad = small ? "3px 8px" : "5px 10px";
  const fs = small ? 10.5 : "var(--fs-ui)";
  if (!variants.length) {
    return (
      <button className={"btn " + kind} disabled={disabled} title={title || (label + " · native, 0 tokens")} onClick={onNative}
        style={{ padding: pad, fontSize: fs, flex: "none" }}>
        {icon && <Icon name={icon} size="sm" />}{label}
      </button>
    );
  }
  return (
    <div ref={ref} style={{ position: "relative", display: "flex", flex: "none" }}>
      <button className={"btn " + kind} disabled={disabled} title={title || (label + " · native, no tokens")} onClick={onNative}
        style={{ padding: pad, fontSize: fs, borderTopRightRadius: 0, borderBottomRightRadius: 0, borderRight: "none" }}>
        {icon && <Icon name={icon} size="sm" />}{label}
      </button>
      <button className={"btn " + kind} disabled={disabled || !variants.length} title="AI path — shows its price first" onClick={() => setOpen((v) => !v)}
        style={{ padding: small ? "3px 5px" : "5px 6px", borderTopLeftRadius: 0, borderBottomLeftRadius: 0,
          borderLeft: "1px solid " + (kind === "primary" ? "color-mix(in oklch, var(--ui-on-fill), transparent 78%)" : "var(--hair)") }}>
        <Icon name="chevronD" size="sm" style={{ width: 12, height: 12 }} />
      </button>
      {open && (
        <div className="surface rise" style={{ position: "absolute", top: "calc(100% + 5px)", [menuAlign]: 0, zIndex: 40, minWidth: 316, padding: 5, boxShadow: "var(--shadow)", background: "var(--elev)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 8px 6px" }}>
            <Icon name="spark" size="sm" style={{ color: "var(--ui-ink)" }} />
            <span className="up" style={{ fontSize: 8.5, color: "var(--ink-3)" }}>AI path · spends tokens</span>
            <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{fmtUsd(remaining)} left of {fmtUsd(budget.capUsd)}</span>
          </div>
          {variants.map((v) => {
            const est = estimateCost({ ...estimateInput, op: v.op || estimateInput.op, verbose: v.verbose });
            const overCap = est.usdHigh > remaining;
            return (
              <button key={v.id} className="btn" disabled={overCap} title={overCap ? "would exceed the project budget cap" : est.confidence}
                onClick={() => { setOpen(false); v.run(est); }}
                style={{ width: "100%", justifyContent: "flex-start", padding: "6px 8px", borderRadius: "var(--r-sm)", opacity: overCap ? 0.45 : 1 }}>
                <Icon name={v.icon || "spark"} size="sm" style={{ color: "var(--ink-3)" }} />
                <span style={{ fontSize: 11.5, color: "var(--ink)" }}>{v.label}</span>
                <span className="tnum" style={{ marginLeft: "auto", fontSize: 10, color: "var(--ink-3)", display: "flex", gap: 6, alignItems: "baseline" }}>
                  <span>~{fmtTok(est.tokensHigh)} tok</span>
                  <span style={{ color: "var(--ink)" }}>≈{fmtUsd(est.usdHigh)}</span>
                </span>
              </button>
            );
          })}
          <div style={{ padding: "5px 8px 3px", fontSize: 9, color: "var(--ink-4)", borderTop: "1px solid var(--hair)", marginTop: 3 }}>
            native path is instant, deterministic and costs 0 tokens
          </div>
        </div>
      )}
    </div>
  );
}

// run an AI variant: streams into the agent terminal, then records the actual
function runAIVariant({ agent, op, label, est, flash, appendLog, onDone }) {
  const model = agent ? agent.model : "sonnet-4.6";
  flash && flash(label + " · " + agent.name + " — AI path, est " + fmtTok(est.tokensHigh) + " tok");
  appendLog && appendLog(agent.id, [
    { t: "sys", s: "▶ " + label + " (AI path) — estimate " + fmtTok(est.tokensLow) + "–" + fmtTok(est.tokensHigh) + " tok · " + fmtUsd(est.usdHigh) },
    { t: "cmd", s: "git " + op + "  # driven by " + model },
  ]);
  const jitter = 0.7 + Math.random() * 1.1;
  const tokens = Math.round(est.tokensHigh * jitter);
  const r = rateOf(model);
  const usd = (tokens * 0.75 * r.in + tokens * 0.25 * r.out) / 1e6;
  setTimeout(() => {
    appendLog && appendLog(agent.id, [{ t: "ok", s: "✓ " + label + " complete · " + fmtTok(tokens) + " tok · " + fmtUsd(usd) }]);
    recordActual({ op, model, tokens, usd, estimate: est, flash });
    onDone && onDone({ tokens, usd });
  }, 1400);
}

// ---- disclosure surfaces (A4.4) ----
// live per-agent token counter for the status bar
function LiveTokenMeter({ agent }) {
  const [, tick] = useStateG(0);
  useEffectG(() => { const iv = setInterval(() => tick((v) => v + 1), 1200); return () => clearInterval(iv); }, []);
  if (!agent) return null;
  const c = agentCost(agent);
  const live = agent.status === "running";
  return (
    <span title={"tokens for " + agent.name + " · " + Math.round(c.cached / c.tokens * 100) + "% cached"}
      style={{ display: "flex", gap: 5, alignItems: "center", color: live ? "var(--ink-2)" : "inherit" }} className="tnum">
      <Icon name="spark" size="sm" style={{ width: 11, height: 11, color: live ? "var(--ui-ink)" : "var(--ink-4)" }} />
      {fmtTok(c.tokens)} tok
      <span style={{ color: "var(--ink-4)" }}>·</span>
      <span style={{ color: "var(--ink)" }}>{fmtUsd(c.usd)}</span>
    </span>
  );
}

// cumulative cost + context fill for an agent card (A4.4 / A5.8)
function AgentCostChip({ agent, showCtx = true }) {
  const c = agentCost(agent);
  const pct = Math.round(c.ctx * 100);
  const warm = pct >= 80 ? "var(--sem-del)" : pct >= 60 ? "var(--sem-attn)" : "var(--ui-meter)";
  return (
    <span style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 9.5 }} className="tnum">
      <span title="cumulative tokens · cost" style={{ display: "flex", gap: 4, alignItems: "center", color: "var(--ink-3)" }}>
        <Icon name="spark" size="sm" style={{ width: 10, height: 10, color: "var(--ui-ink)" }} />{fmtTok(c.tokens)}
        <span style={{ color: "var(--ink)" }}>{fmtUsd(c.usd)}</span>
      </span>
      {showCtx && (
        <span title={"context window " + pct + "% full"} style={{ display: "flex", gap: 4, alignItems: "center", color: "var(--ink-4)" }}>
          <span style={{ width: 26, height: 4, borderRadius: 3, background: "var(--hair)", overflow: "hidden", display: "block" }}>
            <span style={{ display: "block", height: "100%", width: pct + "%", background: warm, borderRadius: 3 }} />
          </span>
          {pct}%
        </span>
      )}
    </span>
  );
}

Object.assign(window, { estimateCost, GitActionButton, runAIVariant, recordActual, agentCost, LiveTokenMeter, AgentCostChip, fmtTok, fmtUsd, OP_SPEC, rateOf });

</script>

<!-- git-panels.jsx -->
<script type="text/babel">
/* global React, Icon, fileName, fileDir, GIT_AUTHORS, GIT_HISTORY, GitActionButton, runAIVariant, estimateCost, fmtTok, fmtUsd */
// Orrery — git tool windows: commit graph (B4.1), branches & remotes (A3.1/A3.2),
// local history (B4.4). Lanes are computed once, rows are virtualized.

const { useState: useStateGP, useEffect: useEffectGP, useRef: useRefGP, useMemo: useMemoGP } = React;

const GITD = () => window.GIT || {};
const AUTHORS = () => GITD().authors || {};

const LANE_COLORS = ["var(--lane-1)", "var(--lane-2)", "var(--lane-3)", "var(--lane-4)", "var(--lane-5)", "var(--lane-6)", "var(--lane-7)"];

// ---------------------------------------------------------------- lane layout
function computeGraph(history) {
  let active = [];
  return history.map((c) => {
    let lane = active.indexOf(c.sha);
    if (lane < 0) { lane = active.indexOf(null); if (lane < 0) { lane = active.length; active.push(null); } }
    const before = active.slice();
    active = active.slice();
    active[lane] = (c.parents && c.parents[0]) || null;
    const extra = [];
    (c.parents || []).slice(1).forEach((p) => {
      let l = active.indexOf(p);
      if (l < 0) { l = active.indexOf(null); if (l < 0) { l = active.length; active.push(null); } active[l] = p; }
      extra.push(l);
    });
    active = active.map((s, i) => (s && active.indexOf(s) !== i ? null : s));
    return { c, lane, before, after: active.slice(), extra };
  });
}

const ROW_H = 30;

function GraphCell({ row, width }) {
  const lanes = Math.max(row.before.length, row.after.length, row.lane + 1);
  const x = (l) => 11 + l * 13;
  const mid = ROW_H / 2;
  const segs = [];
  for (let l = 0; l < lanes; l++) {
    const up = row.before[l], dn = row.after[l];
    const col = LANE_COLORS[l % LANE_COLORS.length];
    if (up) segs.push(<line key={"u" + l} x1={x(l)} y1={0} x2={x(l)} y2={l === row.lane ? mid : ROW_H} stroke={col} strokeWidth="1.6" strokeOpacity=".75" />);
    if (dn && l !== row.lane) segs.push(<line key={"d" + l} x1={x(l)} y1={up ? 0 : mid} x2={x(l)} y2={ROW_H} stroke={col} strokeWidth="1.6" strokeOpacity=".75" />);
  }
  if (row.after[row.lane]) segs.push(<line key="own" x1={x(row.lane)} y1={mid} x2={x(row.lane)} y2={ROW_H} stroke={LANE_COLORS[row.lane % LANE_COLORS.length]} strokeWidth="1.6" strokeOpacity=".75" />);
  row.extra.forEach((l, i) => segs.push(
    <path key={"m" + i} d={`M${x(row.lane)} ${mid} C ${x(row.lane)} ${mid + 10}, ${x(l)} ${mid + 6}, ${x(l)} ${ROW_H}`}
      fill="none" stroke={LANE_COLORS[l % LANE_COLORS.length]} strokeWidth="1.6" strokeOpacity=".8" />));
  const col = LANE_COLORS[row.lane % LANE_COLORS.length];
  return (
    <svg width={width} height={ROW_H} style={{ flex: "none", display: "block" }}>
      {segs}
      {row.c.merge
        ? <circle cx={x(row.lane)} cy={mid} r="4.6" fill="var(--panel)" stroke={col} strokeWidth="2" />
        : <circle cx={x(row.lane)} cy={mid} r="3.6" fill={col} />}
    </svg>
  );
}

function AuthorChip({ id }) {
  const a = AUTHORS()[id] || { short: (id || "?").slice(0, 2).toUpperCase(), color: "var(--ink-3)", name: id, kind: "human" };
  return (
    <span title={a.name + (a.kind === "agent" ? " · agent" : "")} style={{ display: "flex", alignItems: "center", gap: 5, flex: "none", fontSize: 10, color: "var(--ink-3)" }}>
      <span style={{ width: 15, height: 15, borderRadius: a.kind === "agent" ? 4 : "50%", display: "grid", placeItems: "center", fontSize: 8, fontWeight: 700,
        color: a.color, background: "color-mix(in oklch, " + a.color + ", transparent 84%)", border: "1px solid color-mix(in oklch, " + a.color + ", transparent 62%)" }}>{a.short}</span>
      {a.name}
    </span>
  );
}

function CommitGraphPanel({ ctx }) {
  const history = GITD().history || [];
  const [author, setAuthor] = useStateGP("");
  const [path, setPath] = useStateGP("");
  const [q, setQ] = useStateGP("");
  const [when, setWhen] = useStateGP("all");
  const [sel, setSel] = useStateGP([]);
  const [scrollTop, setScrollTop] = useStateGP(0);
  const [vh, setVh] = useStateGP(320);
  const scroller = useRefGP(null);

  const filtered = useMemoGP(() => history.filter((c) => {
    if (author && c.author !== author) return false;
    if (path && !(c.files || []).some((f) => f.path.toLowerCase().includes(path.toLowerCase()))) return false;
    if (q && !((c.msg || "") + " " + (c.body || "") + " " + c.sha).toLowerCase().includes(q.toLowerCase())) return false;
    if (when === "today" && !/^(\d+[mh]|now)$/.test(c.rel)) return false;
    if (when === "week" && /w$/.test(c.rel)) return false;
    return true;
  }), [history, author, path, q, when]);
  const rows = useMemoGP(() => computeGraph(filtered), [filtered]);
  const maxLanes = rows.reduce((m, r) => Math.max(m, r.before.length, r.after.length, r.lane + 1), 1);
  const gw = 16 + maxLanes * 13;

  useEffectGP(() => {
    const el = scroller.current; if (!el) return;
    const ro = new ResizeObserver(() => setVh(el.clientHeight));
    ro.observe(el); setVh(el.clientHeight);
    return () => ro.disconnect();
  }, []);
  // virtualized window
  const first = Math.max(0, Math.floor(scrollTop / ROW_H) - 6);
  const last = Math.min(rows.length, Math.ceil((scrollTop + vh) / ROW_H) + 6);
  const slice = rows.slice(first, last);

  const toggle = (sha, shift) => setSel((s) => {
    if (shift) { const nx = s.includes(sha) ? s.filter((x) => x !== sha) : [...s, sha]; return nx.slice(-2); }
    return [sha];
  });
  const authors = Array.from(new Set(history.map((c) => c.author)));

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter by message or sha…"
          style={{ flex: 1, minWidth: 90, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "5px 9px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5, outline: "none" }} />
        <input value={path} onChange={(e) => setPath(e.target.value)} placeholder="path…"
          style={{ width: 150, flex: "none", background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "5px 9px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5, outline: "none" }} />
        <select className="osel" value={author} onChange={(e) => setAuthor(e.target.value)} style={{ width: 132, flex: "none", padding: "4px 9px", fontSize: 11 }}>
          <option value="">All authors</option>
          {authors.map((a) => <option key={a} value={a}>{(AUTHORS()[a] || { name: a }).name}</option>)}
        </select>
        <select className="osel" value={when} onChange={(e) => setWhen(e.target.value)} style={{ width: 108, flex: "none", padding: "4px 9px", fontSize: 11 }}>
          <option value="all">Any date</option><option value="today">Today</option><option value="week">This week</option>
        </select>
        {sel.length === 2
          ? <button className="btn primary" style={{ flex: "none" }} onClick={() => ctx.openRange(sel)}><Icon name="diff" size="sm" />Compare range</button>
          : <span style={{ fontSize: 9.5, color: "var(--ink-4)", flex: "none" }}>shift-click two commits to diff a range</span>}
      </div>

      <div ref={scroller} className="scroll-y" style={{ flex: 1, minHeight: 0 }} onScroll={(e) => setScrollTop(e.currentTarget.scrollTop)}>
        <div style={{ height: rows.length * ROW_H, position: "relative" }}>
          <div style={{ position: "absolute", top: first * ROW_H, left: 0, right: 0 }}>
            {slice.map((r) => {
              const c = r.c;
              const on = sel.includes(c.sha);
              const refs = c.merge && r === rows[0] ? ["main"] : [];
              return (
                <div key={c.sha} onClick={(e) => toggle(c.sha, e.shiftKey)} onDoubleClick={() => ctx.openCommit(c.sha)}
                  style={{ height: ROW_H, display: "flex", alignItems: "center", gap: 9, padding: "0 12px 0 0", cursor: "pointer",
                    background: on ? "var(--panel-3)" : "transparent", borderLeft: "2px solid " + (on ? "var(--ui-focus)" : "transparent") }}
                  onMouseEnter={(e) => { if (!on) e.currentTarget.style.background = "var(--panel-2)"; }}
                  onMouseLeave={(e) => { if (!on) e.currentTarget.style.background = "transparent"; }}>
                  <GraphCell row={r} width={gw} />
                  {refs.map((rf) => <span key={rf} className="chip" style={{ fontSize: 9, padding: "1px 6px", flex: "none", color: "var(--st-done)", borderColor: "color-mix(in oklch, var(--st-done), transparent 60%)" }}><Icon name="branch" size="sm" style={{ width: 10, height: 10 }} />{rf}</span>)}
                  <span style={{ flex: 1, minWidth: 0, fontSize: 11.5, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {c.merge && <Icon name="merge" size="sm" style={{ width: 11, height: 11, color: "var(--ink-3)", marginRight: 5 }} />}{c.msg}
                  </span>
                  <AuthorChip id={c.author} />
                  <span className="tnum" style={{ flex: "none", width: 56, fontSize: 10, color: "var(--ink-4)", textAlign: "right" }}>{c.rel}</span>
                  <span className="tnum" style={{ flex: "none", width: 58, fontSize: 10, color: "var(--ink-2)" }}>{c.sha}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "5px 12px", borderTop: "1px solid var(--hair)", flex: "none", fontSize: 9.5, color: "var(--ink-4)" }}>
        <span className="tnum">{ctx.project ? ctx.project.name + " · " : ""}{filtered.length} of {history.length} commits · {maxLanes} lanes · virtualized ({slice.length} rows mounted)</span>
        <span style={{ marginLeft: "auto" }}>double-click a commit to open its diff</span>
      </div>
    </div>
  );
}

// ------------------------------------------------------- branches & remotes
window.GIT_REMOTES = window.GIT_REMOTES || [
  { name: "origin", url: "git@github.com:northwind/payments-service.git", fetched: "2m ago" },
  { name: "upstream", url: "https://github.com/stripe-samples/payments.git", fetched: "3d ago" },
];

function aheadBehind(name) {
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 33 + name.charCodeAt(i)) | 0;
  h = Math.abs(h);
  return { ahead: h % 7, behind: (h >> 3) % 4 };
}

function BranchesPanel({ ctx }) {
  const ag = ctx.scopeAgent;
  const project = ctx.project || (ctx.projects || []).find((p) => p.id === (ag && ag.projectId)) || (ctx.projects || [])[0];
  const [remotes, setRemotes] = useStateGP(window.GIT_REMOTES);
  const [fetching, setFetching] = useStateGP(0);      // 0..1 progress
  const [newBranch, setNewBranch] = useStateGP("");
  const [from, setFrom] = useStateGP(project ? project.branch : "main");
  const [adding, setAdding] = useStateGP(false);
  const [remoteName, setRemoteName] = useStateGP("");
  const [remoteUrl, setRemoteUrl] = useStateGP("");
  const [current, setCurrent] = useStateGP(ag ? ag.branch : (project ? project.branch : "main"));
  const [extra, setExtra] = useStateGP([]);
  const branches = (project ? project.branches : ["main"]).concat(extra, ag ? [ag.branch] : []).filter((b, i, a) => a.indexOf(b) === i);

  const doFetch = (remote) => {
    setFetching(0.02);
    const iv = setInterval(() => setFetching((f) => {
      const nx = f + 0.06 + Math.random() * 0.13;
      if (nx >= 1) { clearInterval(iv); setTimeout(() => setFetching(0), 550); ctx.flash("fetched " + remote + " · 4 refs updated, 1 pruned"); return 1; }
      return nx;
    }), 90);
  };
  const rowBtn = (icon, label, onClick, danger) => (
    <button className="btn" onClick={(e) => { e.stopPropagation(); onClick(); }} title={label}
      style={{ padding: "2px 6px", fontSize: 10, color: danger ? "var(--st-blocked)" : "var(--ink-3)" }}>
      <Icon name={icon} size="sm" style={{ width: 11, height: 11 }} />{label}
    </button>
  );

  return (
    <div style={{ display: "grid", gridTemplateColumns: "300px 1fr", minHeight: 0, flex: 1 }}>
      {/* remotes */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Remotes</span>
          <button className="btn ghost-hair" style={{ marginLeft: "auto", padding: "2px 7px", fontSize: 10 }} onClick={() => setAdding((v) => !v)}>
            <Icon name="plus" size="sm" />Add
          </button>
        </div>
        {adding && (
          <div style={{ padding: 10, borderBottom: "1px solid var(--hair)", display: "grid", gap: 6, background: "var(--panel-2)" }}>
            <input value={remoteName} onChange={(e) => setRemoteName(e.target.value)} placeholder="name" style={{ background: "var(--panel)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "5px 8px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11, outline: "none" }} />
            <input value={remoteUrl} onChange={(e) => setRemoteUrl(e.target.value)} placeholder="git@… or https://…" style={{ background: "var(--panel)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "5px 8px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11, outline: "none" }} />
            <button className="btn primary" disabled={!remoteName.trim() || !remoteUrl.trim()} style={{ justifyContent: "center", fontSize: 11 }}
              onClick={() => { const r = { name: remoteName.trim(), url: remoteUrl.trim(), fetched: "never" }; window.GIT_REMOTES = [...remotes, r]; setRemotes(window.GIT_REMOTES); setAdding(false); setRemoteName(""); setRemoteUrl(""); ctx.flash("added remote " + r.name); }}>
              Add remote
            </button>
          </div>
        )}
        <div className="scroll-y" style={{ flex: 1, padding: "4px 0" }}>
          {remotes.map((r) => (
            <div key={r.name} style={{ padding: "8px 12px", borderBottom: "1px solid var(--hair)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <Icon name="globe" size="sm" style={{ color: "var(--ink-3)" }} />
                <span style={{ fontSize: 11.5, color: "var(--ink)" }}>{r.name}</span>
                <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{r.fetched}</span>
              </div>
              <div style={{ fontSize: 9.5, color: "var(--ink-4)", marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.url}</div>
              <div style={{ display: "flex", gap: 4, marginTop: 6 }}>
                {rowBtn("refresh", "Fetch", () => doFetch(r.name))}
                {rowBtn("archive", "Prune", () => ctx.flash("pruned " + r.name + " · 2 stale refs removed"))}
                {rowBtn("rename", "Set URL", () => ctx.flash("remote " + r.name + " URL editable inline"))}
                {rowBtn("trash", "Remove", () => { window.GIT_REMOTES = remotes.filter((x) => x.name !== r.name); setRemotes(window.GIT_REMOTES); ctx.flash("removed remote " + r.name); }, true)}
              </div>
            </div>
          ))}
        </div>
        {fetching > 0 && (
          <div style={{ padding: "8px 12px", borderTop: "1px solid var(--hair)", flex: "none" }}>
            <div style={{ display: "flex", fontSize: 9.5, color: "var(--ink-3)", marginBottom: 5 }}>
              <span>receiving objects…</span><span className="tnum" style={{ marginLeft: "auto" }}>{Math.round(fetching * 100)}%</span>
            </div>
            <div className="meter"><i style={{ width: Math.round(fetching * 100) + "%" }} /></div>
          </div>
        )}
      </div>

      {/* branches */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Branches · {project ? project.name : ""}</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 7, alignItems: "center" }}>
            <GitActionButton label="Fetch" icon="refresh" small flash={ctx.flash} onNative={() => doFetch("origin")} variants={[]} />
            <GitActionButton label="Pull" icon="stage" small flash={ctx.flash} onNative={() => { doFetch("origin"); ctx.flash("pulled origin/" + current + " · fast-forward"); }} variants={[]} />
            <GitActionButton label="New branch" icon="plus" kind="primary" small flash={ctx.flash}
              onNative={() => { const nm = newBranch.trim() || "feature/" + Math.random().toString(36).slice(2, 7); setExtra((x) => [...x, nm]); setCurrent(nm); ctx.flash("created + checked out " + nm + " from " + from); }}
              variants={[{ id: "name", label: "Name branch from the task", op: "branch", icon: "spark", run: (est) => { const nm = "agent/" + (ag ? ag.name : "task") + "-followup"; setExtra((x) => [...x, nm]); ctx.flash("AI named branch → " + nm + " · " + fmtTok(est.tokensHigh) + " tok"); } }]}
              estimateInput={{ op: "branch", model: ag ? ag.model : "sonnet-4.6" }} />
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", borderBottom: "1px solid var(--hair)", flex: "none", background: "var(--panel-2)" }}>
          <input value={newBranch} onChange={(e) => setNewBranch(e.target.value)} placeholder="new branch name…"
            style={{ flex: 1, background: "var(--panel)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "5px 9px", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5, outline: "none" }} />
          <span style={{ fontSize: 10, color: "var(--ink-4)" }}>from</span>
          <select className="osel" value={from} onChange={(e) => setFrom(e.target.value)} style={{ width: 160, flex: "none", padding: "4px 9px", fontSize: 11 }}>
            {branches.map((b) => <option key={b} value={b}>{b}</option>)}
          </select>
        </div>
        <div className="scroll-y" style={{ flex: 1, padding: "4px 0" }}>
          {branches.map((b) => {
            const { ahead, behind } = aheadBehind(b);
            const on = b === current;
            return (
              <div key={b} style={{ display: "flex", alignItems: "center", gap: 9, padding: "7px 12px", borderBottom: "1px solid var(--hair)",
                background: on ? "var(--ui-sel)" : "transparent" }}>
                <Icon name="branch" size="sm" style={{ color: on ? "var(--ui-ink)" : "var(--ink-4)" }} />
                <span style={{ fontSize: 11.5, color: on ? "var(--ink)" : "var(--ink-2)" }}>{b}</span>
                {on && <span className="chip" style={{ fontSize: 8.5, padding: "0 5px", color: "var(--ui-ink)", borderColor: "var(--ui-line)" }}>HEAD</span>}
                <span className="tnum" style={{ display: "flex", gap: 7, fontSize: 9.5, color: "var(--ink-4)" }}>
                  {ahead > 0 && <span style={{ color: "var(--st-done)" }}>↑{ahead}</span>}
                  {behind > 0 && <span style={{ color: "var(--sem-attn)" }}>↓{behind}</span>}
                  {!ahead && !behind && <span>in sync</span>}
                </span>
                <div style={{ marginLeft: "auto", display: "flex", gap: 3 }}>
                  {!on && rowBtn("enter", "Checkout", () => { setCurrent(b); ctx.flash("checked out " + b); })}
                  {rowBtn("link", "Upstream", () => ctx.flash("set upstream origin/" + b))}
                  {!on && rowBtn("merge", "Merge in", () => ctx.flash("merged " + b + " → " + current))}
                  {rowBtn("rename", "Rename", () => ctx.flash("rename " + b))}
                  {!on && rowBtn("trash", "Delete", () => { setExtra((x) => x.filter((n) => n !== b)); ctx.flash("deleted branch " + b); }, true)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ----------------------------------------------------------- local history
// snapshots are derived from the worktree the watcher already tracks
function snapshotsFor(ag) {
  if (!ag) return [];
  const files = ag.files || [];
  const out = [];
  const kinds = [["agent turn", "agent"], ["external edit", "edit"], ["pre-command", "guard"], ["commit", "commit"]];
  const n = Math.max(4, Math.min(14, files.length * 3));
  for (let i = 0; i < n; i++) {
    const [label, kind] = kinds[i % kinds.length];
    const touched = files.length ? files.slice(0, 1 + ((i * 3) % Math.max(1, files.length))) : [];
    out.push({
      id: "snap" + i, label, kind,
      when: i === 0 ? "just now" : i < 3 ? i * 4 + "m ago" : i < 7 ? i * 11 + "m ago" : Math.round(i * 0.7) + "h ago",
      bytes: 12000 + ((i * 7919) % 90000),
      files: touched.map((f) => ({ path: f.path, add: Math.max(1, Math.round((f.add || 6) / (i + 1))), del: Math.round((f.del || 2) / (i + 2)) })),
    });
  }
  return out;
}

function LocalHistoryPanel({ ctx }) {
  const ag = ctx.scopeAgent;
  const snaps = useMemoGP(() => snapshotsFor(ag), [ag && ag.id, ag && ag.files]);
  const [sel, setSel] = useStateGP(0);
  const s = snaps[sel];
  const totalMb = (snaps.reduce((a, b) => a + b.bytes, 0) / 1e6).toFixed(1);
  const kindColor = { agent: "var(--ui-ink)", edit: "var(--sem-change)", guard: "var(--sem-attn)", commit: "var(--sem-add)" };
  if (!ag) return <div style={{ padding: 18, fontSize: 11.5, color: "var(--ink-4)" }}>select an agent to see its worktree history</div>;
  return (
    <div style={{ display: "grid", gridTemplateColumns: "280px 1fr", minHeight: 0, flex: 1 }}>
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <Icon name="clock" size="sm" style={{ color: "var(--ui-ink)" }} />
          <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Snapshots</span>
          <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{snaps.length}</span>
        </div>
        <div className="scroll-y" style={{ flex: 1, padding: "4px 0" }}>
          {snaps.map((sn, i) => (
            <div key={sn.id} onClick={() => setSel(i)}
              style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer", borderLeft: "2px solid " + (i === sel ? "var(--ui-focus)" : "transparent"), background: i === sel ? "var(--panel-3)" : "transparent" }}>
              <span style={{ width: 7, height: 7, borderRadius: 2, flex: "none", background: kindColor[sn.kind] }} />
              <span style={{ fontSize: 11.5, color: i === sel ? "var(--ink)" : "var(--ink-2)" }}>{sn.label}</span>
              <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{sn.when}</span>
            </div>
          ))}
        </div>
        <div style={{ padding: "7px 12px", borderTop: "1px solid var(--hair)", fontSize: 9, color: "var(--ink-4)", flex: "none" }} className="tnum">
          {totalMb} MB of 200 MB cap · pruned after 14 days
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <span style={{ fontSize: 11.5, color: "var(--ink)" }}>{s ? s.label : ""}</span>
          <span className="tnum" style={{ fontSize: 9.5, color: "var(--ink-4)" }}>{s ? s.when + " · " + (s.bytes / 1000).toFixed(0) + " KB" : ""}</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 7 }}>
            <button className="btn ghost-hair" style={{ fontSize: 11 }} onClick={() => ctx.flash("showing diff against " + (s ? s.when : ""))}><Icon name="diff" size="sm" />Show diff</button>
            <button className="btn ghost-hair" style={{ fontSize: 11, color: "var(--st-blocked)" }}
              onClick={() => ctx.flash("reverted worktree to snapshot · " + (s ? s.when : ""))}><Icon name="discard" size="sm" />Revert to this point</button>
          </div>
        </div>
        <div className="scroll-y" style={{ flex: 1, padding: "4px 0" }}>
          {(s ? s.files : []).length === 0 && <div style={{ padding: 16, fontSize: 11.5, color: "var(--ink-4)" }}>no file changes captured in this snapshot</div>}
          {(s ? s.files : []).map((f) => (
            <div key={f.path} style={{ display: "flex", alignItems: "center", gap: 9, padding: "6px 14px", borderBottom: "1px solid var(--hair)" }}>
              <Icon name="file" size="sm" style={{ color: "var(--ink-4)" }} />
              <span style={{ fontSize: 11.5 }}>{fileName(f.path)}</span>
              <span style={{ fontSize: 9.5, color: "var(--ink-4)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</span>
              <span className="tnum" style={{ fontSize: 9.5, display: "flex", gap: 5 }}>
                <span style={{ color: "var(--code-add-ink)" }}>+{f.add}</span>{f.del > 0 && <span style={{ color: "var(--code-del-ink)" }}>−{f.del}</span>}
              </span>
              <button className="btn" style={{ padding: "2px 6px", fontSize: 10 }} onClick={() => ctx.openFileAt(f.path)}><Icon name="enter" size="sm" style={{ width: 11, height: 11 }} />Open</button>
              <button className="btn" style={{ padding: "2px 6px", fontSize: 10, color: "var(--st-blocked)" }} onClick={() => ctx.flash("reverted " + fileName(f.path) + " to " + s.when)}><Icon name="discard" size="sm" style={{ width: 11, height: 11 }} />Revert</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

window.TOOL_PANELS.graph = { kind: "graph", label: "Git Graph", icon: "graph", Component: CommitGraphPanel };
window.TOOL_PANELS.branches = { kind: "branches", label: "Branches", icon: "branch", Component: BranchesPanel };
window.TOOL_PANELS.history = { kind: "history", label: "Local History", icon: "clock", Component: LocalHistoryPanel };
Object.assign(window, { CommitGraphPanel, BranchesPanel, LocalHistoryPanel, computeGraph, snapshotsFor });

<!-- perf-panels.jsx -->
<script type="text/babel">
/* global React, Icon, ToolBadge, fmtDur */
// Orrery — Performance tool window: recursive process tree (A7.7), emit telemetry
// inventory + raw trace (A0.7 phase 1), and the live acceptance budgets (A7.2).

const { useState: useStateP, useEffect: useEffectP, useRef: useRefP, useMemo: useMemoP } = React;

const pHash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
const jit = (v, p) => Math.max(0.1, v * (1 + (Math.random() * 2 - 1) * p));
const mb = (v) => v >= 1024 ? (v / 1024).toFixed(2) + " GB" : Math.round(v) + " MB";

const NODE_NOTE = {
  core: "rust core · our code",
  webview: "webview2 · not our code",
  gpu: "gpu process · not our code",
  renderer: "renderer · not our code",
  utility: "utility · not our code",
  conhost: "conhost · ConPTY host",
  shim: "pwsh · shim wrapper (A0.1)",
  agent: "agent CLI",
  spawned: "started by the agent",
};

// ---- process tree: known pids + their discovered descendants ----
function buildProcTree(agents) {
  const node = (o) => ({ children: [], ...o });
  const webview = node({ id: "wv", name: "msedgewebview2.exe", kind: "webview", pid: 6120, cpu: 6.2, priv: 54, rss: 138, children: [
    node({ id: "wv-gpu", name: "msedgewebview2.exe --type=gpu-process", kind: "gpu", pid: 6180, cpu: 2.1, priv: 32, rss: 96 }),
    node({ id: "wv-r", name: "msedgewebview2.exe --type=renderer", kind: "renderer", pid: 6212, cpu: 8.4, priv: 44, rss: 152 }),
    node({ id: "wv-u", name: "msedgewebview2.exe --type=utility", kind: "utility", pid: 6244, cpu: 0.4, priv: 14, rss: 42 }),
  ] });
  const agentNodes = agents.filter((a) => ["running", "waiting", "queued", "blocked"].includes(a.status)).map((a) => {
    const h = pHash(a.id + a.name);
    const shim = h % 3 === 0;
    const cli = node({ id: "cli-" + a.id, name: (a.tool === "claude" ? "node claude/cli.js" : a.tool) + " --model " + a.model, kind: "agent",
      pid: 9000 + (h % 900), cpu: a.status === "running" ? 22 + (h % 40) : 1.4, priv: 56 + (h % 88), rss: 120 + (h % 180), agentId: a.id, tool: a.tool });
    // descendants the agent started and may not clean up
    if (/node|22/.test(a.name)) cli.children.push(node({ id: "dev-" + a.id, name: "next dev", kind: "spawned", pid: 11400 + (h % 90), cpu: 12.5, priv: 842, rss: 1180, ago: "40 minutes ago" }));
    if (h % 4 === 1) cli.children.push(node({ id: "vt-" + a.id, name: "vitest --watch", kind: "spawned", pid: 11600 + (h % 90), cpu: 4.2, priv: 186, rss: 302 }));
    if (h % 5 === 2) cli.children.push(node({ id: "pw-" + a.id, name: "playwright chromium", kind: "spawned", pid: 11800 + (h % 90), cpu: 1.1, priv: 262, rss: 480 }));
    const host = node({ id: "ch-" + a.id, name: "conhost.exe", kind: "conhost", pid: 7000 + (h % 800), cpu: 0.6, priv: 5 + (h % 4), rss: 11 + (h % 7), children: [cli] });
    if (shim) return node({ id: "sh-" + a.id, name: "pwsh -NoProfile -File " + a.tool + ".ps1", kind: "shim", pid: 6800 + (h % 400), cpu: 0.3, priv: 61 + (h % 34), rss: 94 + (h % 38), agentId: a.id, children: [host] });
    return host;
  });
  return [node({ id: "core", name: "orrery.exe", kind: "core", pid: 4820, cpu: 3.1, priv: 62, rss: 148, children: [webview, ...agentNodes] })];
}

const sumTree = (n, key) => n[key] + n.children.reduce((s, c) => s + sumTree(c, key), 0);
const walk = (nodes, fn, depth = 0) => nodes.forEach((n) => { fn(n, depth); walk(n.children, fn, depth + 1); });

function ProcessTree({ ctx }) {
  const [tree, setTree] = useStateP(() => buildProcTree(ctx.agents || []));
  const [open, setOpen] = useStateP({ core: true, wv: false });
  const [sel, setSel] = useStateP(null);
  const [killed, setKilled] = useStateP({});
  // sampler runs only while this panel is mounted (A1.7 pattern)
  useEffectP(() => {
    const iv = setInterval(() => setTree((t) => {
      const copy = JSON.parse(JSON.stringify(t));
      walk(copy, (n) => { n.cpu = Math.min(96, jit(n.cpu, 0.22)); n.priv = jit(n.priv, 0.015); n.rss = jit(n.rss, 0.015); });
      return copy;
    }), 1400);
    return () => clearInterval(iv);
  }, []);
  useEffectP(() => { setTree(buildProcTree(ctx.agents || [])); }, [(ctx.agents || []).length]);

  const rows = [];
  walk(tree, (n, d) => {
    if (killed[n.id]) return;
    rows.push({ n, d });
  });
  // hide children of collapsed nodes
  const visible = [];
  let skipDepth = null;
  rows.forEach((r) => {
    if (skipDepth != null && r.d > skipDepth) return;
    skipDepth = null;
    visible.push(r);
    if (r.n.children.length && !open[r.n.id]) skipDepth = r.d;
  });
  const totalPriv = tree.reduce((s, n) => s + sumTree(n, "priv"), 0);
  const ourPriv = tree[0] ? tree[0].priv : 0;
  const agentPriv = totalPriv - ourPriv - (function () { const wv = tree[0] && tree[0].children.find((c) => c.kind === "webview"); return wv ? sumTree(wv, "priv") : 0; })();
  // threshold alert on any runaway subtree
  const alerts = [];
  walk(tree, (n) => { if (n.kind === "agent" && !killed[n.id]) { const t = sumTree(n, "priv"); if (t > 700) alerts.push({ n, t }); } });

  const kill = (n) => { setKilled((k) => ({ ...k, [n.id]: true })); ctx.flash("killed subtree · " + n.name + " (" + mb(sumTree(n, "priv")) + " reclaimed)"); };

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none", fontSize: 10.5 }}>
        <span className="tnum" style={{ color: "var(--ink-2)" }}>Orrery <b style={{ color: "var(--ink)" }}>{mb(ourPriv + (tree[0] ? sumTree(tree[0].children.find((c) => c.kind === "webview") || { priv: 0, children: [] }, "priv") : 0))}</b></span>
        <span style={{ color: "var(--ink-4)" }}>·</span>
        <span className="tnum" style={{ color: "var(--ink-2)" }}>agents <b style={{ color: "var(--ink)" }}>{mb(agentPriv)}</b></span>
        <span className="chip" style={{ fontSize: 9 }}>private working set · RSS is secondary</span>
        <span style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>job-object accounting · descendants rediscovered every 5s</span>
      </div>
      {alerts.map(({ n, t }) => (
        <div key={n.id} style={{ display: "flex", alignItems: "center", gap: 9, padding: "7px 12px", flex: "none",
          background: "color-mix(in oklch, var(--st-blocked), transparent 91%)", borderBottom: "1px solid color-mix(in oklch, var(--st-blocked), transparent 62%)" }}>
          <Icon name="flag" size="sm" style={{ color: "var(--st-blocked)" }} />
          <span style={{ fontSize: 11, color: "var(--ink)" }}>
            agent subtree <b>{mb(t)}</b> — {mb(n.children.reduce((s, c) => s + sumTree(c, "priv"), 0))} of it is {n.children.map((c) => c.name).join(", ")} it started{n.children[0] && n.children[0].ago ? " " + n.children[0].ago : ""}
          </span>
          <button className="btn ghost-hair" style={{ marginLeft: "auto", padding: "2px 8px", fontSize: 10, color: "var(--st-blocked)" }}
            onClick={() => n.children.forEach(kill)}><Icon name="stop" size="sm" />Kill descendants</button>
        </div>
      ))}
      <div className="scroll-y" style={{ flex: 1, minHeight: 0 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
          <thead>
            <tr style={{ position: "sticky", top: 0, background: "var(--panel-2)", zIndex: 1 }}>
              {["Process", "PID", "CPU", "Private", "RSS", "Subtree", ""].map((h, i) => (
                <th key={h + i} className="up" style={{ textAlign: i > 1 ? "right" : "left", fontSize: 8.5, color: "var(--ink-4)", fontWeight: 500, padding: "6px 10px", borderBottom: "1px solid var(--hair)", whiteSpace: "nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {visible.map(({ n, d }) => {
              const kids = n.children.filter((c) => !killed[c.id]).length;
              const sub = sumTree(n, "priv");
              const on = sel === n.id;
              const notOurs = /not our code/.test(NODE_NOTE[n.kind] || "");
              return (
                <tr key={n.id} onClick={() => setSel(n.id)}
                  style={{ background: on ? "var(--panel-3)" : "transparent", cursor: "pointer", borderBottom: "1px solid var(--hair)" }}>
                  <td style={{ padding: "5px 10px", whiteSpace: "nowrap" }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 6, paddingLeft: d * 15 }}>
                      {kids > 0
                        ? <button className="pane-btn" onClick={(e) => { e.stopPropagation(); setOpen((o) => ({ ...o, [n.id]: !o[n.id] })); }} style={{ padding: 0 }}>
                            <Icon name={open[n.id] ? "chevronD" : "chevron"} size="sm" style={{ width: 12, height: 12 }} />
                          </button>
                        : <span style={{ width: 12 }} />}
                      {n.tool ? <ToolBadge tool={n.tool} size={13} /> : <span style={{ width: 7, height: 7, borderRadius: 2, background: notOurs ? "var(--ink-4)" : n.kind === "spawned" ? "var(--sem-attn)" : n.kind === "shim" ? "var(--st-blocked)" : "var(--ui-fill)" }} />}
                      <span style={{ color: notOurs ? "var(--ink-3)" : "var(--ink)" }}>{n.name}</span>
                      <span style={{ fontSize: 9, color: "var(--ink-4)" }}>{NODE_NOTE[n.kind]}</span>
                    </span>
                  </td>
                  <td className="tnum" style={{ padding: "5px 10px", color: "var(--ink-4)" }}>{n.pid}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: n.cpu > 60 ? "var(--st-blocked)" : n.cpu > 25 ? "var(--sem-attn)" : "var(--ink-2)" }}>{n.cpu.toFixed(1)}%</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: n.priv > 1000 ? "var(--st-blocked)" : "var(--ink)" }}>{mb(n.priv)}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-4)" }}>{mb(n.rss)}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: kids ? "var(--ink-2)" : "var(--ink-4)" }}>{kids ? mb(sub) : "—"}</td>
                  <td style={{ padding: "3px 8px", textAlign: "right" }}>
                    {(n.kind === "spawned" || n.kind === "agent") && (
                      <button className="btn" onClick={(e) => { e.stopPropagation(); kill(n); }} title="Kill this process and its subtree"
                        style={{ padding: "1px 6px", fontSize: 9.5, color: "var(--st-blocked)" }}><Icon name="stop" size="sm" style={{ width: 10, height: 10 }} />Kill</button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "5px 12px", borderTop: "1px solid var(--hair)", flex: "none", fontSize: 9, color: "var(--ink-4)" }}>
        subtree totals sum private working set — RSS double-counts shared pages and would overstate
      </div>
    </div>
  );
}

// ------------------------------------------------- emit telemetry (A0.7 p1)
const EMIT_SEED = [
  { name: "agent://output", cls: "bulk", calls: 3712, bytes: 41_800_000, p50: 1180, p95: 14_600, rate: 62 },
  { name: "agent://status", cls: "coalesced", calls: 1044, bytes: 96_000, p50: 88, p95: 140, rate: 12 },
  { name: "git://scan", cls: "coalesced", calls: 412, bytes: 1_240_000, p50: 2600, p95: 9800, rate: 4 },
  { name: "perf://stats", cls: "coalesced", calls: 310, bytes: 620_000, p50: 1900, p95: 2400, rate: 2 },
  { name: "agent://permission", cls: "bypass", calls: 26, bytes: 8_100, p50: 300, p95: 420, rate: 0.3 },
  { name: "agent://exit", cls: "bypass", calls: 9, bytes: 1_100, p50: 120, p95: 160, rate: 0.1 },
  { name: "watch://event", cls: "bulk", calls: 2280, bytes: 3_900_000, p50: 640, p95: 4200, rate: 28 },
  { name: "cost://usage", cls: "coalesced", calls: 188, bytes: 210_000, p50: 1100, p95: 1600, rate: 1.6 },
  { name: "search://hit", cls: "bulk", calls: 940, bytes: 2_100_000, p50: 1600, p95: 6400, rate: 40 },
];
const CLS_META = { bypass: { label: "bypass", color: "var(--st-done)" }, coalesced: { label: "coalesced state", color: "var(--ink-2)" }, bulk: { label: "bulk weighted", color: "var(--ui-ink)" } };
const kb = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : n >= 1e3 ? Math.round(n / 1e3) + " KB" : n + " B";

function EmitTelemetry({ ctx }) {
  const [rows, setRows] = useStateP(EMIT_SEED);
  const [trace, setTrace] = useStateP(false);
  const [traceMs, setTraceMs] = useStateP(0);
  const [sort, setSort] = useStateP("bytes");
  useEffectP(() => {
    const iv = setInterval(() => setRows((r) => r.map((x) => ({ ...x, calls: x.calls + Math.round(x.rate * 1.4 * Math.random()), bytes: x.bytes + Math.round(x.rate * x.p50 * 1.4) }))), 1400);
    return () => clearInterval(iv);
  }, []);
  useEffectP(() => {
    if (!trace) return;
    const iv = setInterval(() => setTraceMs((m) => {
      const nx = m + 1000;
      if (nx >= 30 * 60 * 1000) { setTrace(false); ctx.flash("raw trace auto-disabled after 30 minutes"); return 0; }
      return nx;
    }), 1000);
    return () => clearInterval(iv);
  }, [trace]);
  const sorted = [...rows].sort((a, b) => (b[sort] || 0) - (a[sort] || 0));
  const total = rows.reduce((s, r) => s + r.bytes, 0);
  const th = (label, key, right) => (
    <th onClick={() => key && setSort(key)} className="up"
      style={{ textAlign: right ? "right" : "left", fontSize: 8.5, color: sort === key ? "var(--ui-ink)" : "var(--ink-4)", fontWeight: 500, padding: "6px 10px", borderBottom: "1px solid var(--hair)", cursor: key ? "pointer" : "default", whiteSpace: "nowrap" }}>{label}</th>
  );
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderBottom: "1px solid var(--hair)", flex: "none", fontSize: 10.5 }}>
        <span className="tnum" style={{ color: "var(--ink-2)" }}>{rows.length} event names · {kb(total)} emitted this session</span>
        <span className="chip" style={{ fontSize: 9, color: "var(--st-done)" }}>aggregate always on · ≤1µs/emit</span>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          {trace && (
            <span className="tnum" style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "var(--st-blocked)" }}>
              <span className="dot blocked" style={{ background: "var(--st-blocked)" }} />recording · {fmtDur(Math.round(traceMs / 1000))} / 30m
            </span>
          )}
          <button className="btn ghost-hair" onClick={() => { setTrace((v) => !v); setTraceMs(0); ctx.flash(trace ? "raw emit trace stopped" : "raw emit trace on · auto-off after 30m or 200MB"); }}
            style={{ padding: "3px 9px", fontSize: 10.5, color: trace ? "var(--st-blocked)" : "var(--ink-3)",
              borderColor: trace ? "color-mix(in oklch, var(--st-blocked), transparent 55%)" : "var(--hair)" }}>
            <Icon name={trace ? "stop" : "play"} size="sm" />{trace ? "Stop raw trace" : "Start raw trace"}
          </button>
        </div>
      </div>
      <div className="scroll-y" style={{ flex: 1, minHeight: 0 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
          <thead><tr style={{ position: "sticky", top: 0, background: "var(--panel-2)", zIndex: 1 }}>
            {th("Event name", "name")}{th("Calls", "calls", true)}{th("Total bytes", "bytes", true)}{th("p50", "p50", true)}{th("p95", "p95", true)}{th("Peak/s", "rate", true)}{th("Suggested class")}
          </tr></thead>
          <tbody>
            {sorted.map((r) => {
              const m = CLS_META[r.cls];
              return (
                <tr key={r.name} style={{ borderBottom: "1px solid var(--hair)" }}>
                  <td style={{ padding: "5px 10px", color: "var(--ink)" }}>{r.name}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-2)" }}>{r.calls.toLocaleString()}</td>

        <span style={{ color: "var(--st-done)" }}>names · keys · byte counts only — payload contents are never written</span>
        <span style={{ marginLeft: "auto" }}>≤50 MB / 7 days, daily rotation</span>
      </div>
    </div>
  );
}

// ------------------------------------------------------ live budgets (A7.2)
function BudgetsPanel({ ctx }) {
  const agents = ctx.agents || [];
  const running = agents.filter((a) => a.status === "running").length;
  const slept = agents.filter((a) => ctx.isAsleep(a.id)).length;
  const rows = [
    { k: "Cold start to interactive", budget: "≤ 300ms", now: "94ms", ok: true },
    { k: "Focused-terminal echo, p50", budget: "≤ 50ms", now: "31ms", ok: true },
    { k: "Focused-terminal echo, p95", budget: "≤ 75ms", now: "68ms", ok: true },
    { k: "agent_input round-trip p95", budget: "≤ 25ms", now: "19ms", ok: true },
    { k: "PTY-origin UI jobs", budget: "≤ 75/s, flat 1→10 agents", now: "58/s", ok: true },
    { k: "Hidden terminal queue peak", budget: "≤ 2MB", now: "740 KB", ok: true },
    { k: "In-flight bytes per agent", budget: "≤ 512KB", now: "212 KB", ok: true },
    { k: "RSS, " + running + " active agents", budget: running > 4 ? "≤ 600MB" : "≤ 250MB", now: (210 + running * 96) + " MB", ok: 210 + running * 96 < (running > 4 ? 600 : 480) },
    { k: "Slept agents", budget: "auto after 30m idle", now: slept + " of " + agents.length, ok: true },
    { k: "Watchers", budget: "≤ 1 per open project", now: (ctx.projects || []).length + " watchers", ok: true },
    { k: "Wrapper processes per agent", budget: "0 (conhost only)", now: "1 pwsh detected", ok: false },

  return (

        </tr></thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.k} style={{ borderBottom: "1px solid var(--hair)" }}>
              <td style={{ padding: "5px 12px", color: "var(--ink)" }}>{r.k}</td>
              <td className="tnum" style={{ padding: "5px 12px", textAlign: "right", color: "var(--ink-4)" }}>{r.budget}</td>
              <td className="tnum" style={{ padding: "5px 12px", textAlign: "right", color: r.ok ? "var(--ink)" : "var(--st-blocked)" }}>{r.now}</td>
              <td style={{ padding: "5px 12px", textAlign: "right", width: 30 }}>
                <Icon name={r.ok ? "check" : "flag"} size="sm" style={{ color: r.ok ? "var(--st-done)" : "var(--st-blocked)" }} />
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// -------------------------------------------------- interest subscription view
function SubscriptionStrip({ ctx }) {
  const visible = new Set(ctx.visibleAgentIds || []);
  const scope = ctx.scopeAgent && ctx.scopeAgent.id;
  const modeOf = (a) => a.id === scope ? "stream" : visible.has(a.id) ? "digest" : "none";
  const color = { stream: "var(--st-running)", digest: "var(--ink-2)", none: "var(--ink-4)" };
  const counts = { stream: 0, digest: 0, none: 0 };
  (ctx.agents || []).forEach((a) => { counts[modeOf(a)] += 1; });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", borderBottom: "1px solid var(--hair)", flex: "none", overflowX: "auto" }}>

      {(ctx.agents || []).map((a) => {

        return (
          <span key={a.id} className="chip" title={a.name + " · " + m} style={{ fontSize: 9, padding: "1px 6px", flex: "none", color: color[m], borderColor: "color-mix(in oklch, " + color[m] + ", transparent 65%)" }}>
            {a.name}<span style={{ color: "var(--ink-4)" }}>{m}</span>
          </span>
        );
      })}
      <span className="tnum" style={{ marginLeft: "auto", fontSize: 9, color: "var(--ink-4)", flex: "none" }}>{counts.stream} stream · {counts.digest} digest · {counts.none} none → 0 bytes</span>
    </div>
  );
}

const PERF_TABS = [
  { k: "proc", label: "Processes", icon: "cpu" },
  { k: "emits", label: "Emits", icon: "link" },
  { k: "budgets", label: "Budgets", icon: "flag" },
];

function PerfPanel({ ctx }) {
  const [tab, setTab] = useStateP("proc");
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 2, padding: "5px 10px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
        {PERF_TABS.map((t) => (
          <button key={t.k} className="btn" onClick={() => setTab(t.k)}
            style={{ padding: "3px 9px", fontSize: 10.5, borderRadius: "var(--r-sm)", color: tab === t.k ? "var(--ink)" : "var(--ink-3)",
              background: tab === t.k ? "var(--panel-3)" : "transparent", boxShadow: tab === t.k ? "0 0 0 1px var(--hair-2)" : "none" }}>
            <Icon name={t.icon} size="sm" style={{ color: tab === t.k ? "var(--ui-ink)" : "inherit" }} />{t.label}
          </button>
        ))}
      </div>
      {tab === "proc" && <SubscriptionStrip ctx={ctx} />}
      {tab === "proc" && <ProcessTree ctx={ctx} />}
      {tab === "emits" && <EmitTelemetry ctx={ctx} />}
      {tab === "budgets" && <BudgetsPanel ctx={ctx} />}
    </div>
  );
}

// status-bar split (A0.6): our memory vs the agents' — the tree is its drill-down
function memorySplit(agents, isAsleep) {
  const tree = buildProcTree(agents || []);
  const core = tree[0];
  const wv = core.children.find((c) => c.kind === "webview");
  const slept = (agents || []).filter((a) => isAsleep && isAsleep(a.id)).length;
  const own = Math.max(90, core.priv + (wv ? sumTree(wv, "priv") : 0) - slept * 6);
  let ag = 0, agCpu = 0;
  core.children.forEach((c) => { if (c.kind !== "webview") { ag += sumTree(c, "priv"); agCpu += sumTree(c, "cpu"); } });
  const ownCpu = core.cpu + (wv ? sumTree(wv, "cpu") : 0);
  const cores = 10;
  return { own, agents: ag, slept, cpu: Math.min(100, Math.round((ownCpu + agCpu) / cores)), ownCpu: Math.round(ownCpu / cores) };
}

// Performance lives in the anchored dev panel only (not the bottom tool window)
Object.assign(window, { PerfPanel, ProcessTree, EmitTelemetry, BudgetsPanel, SubscriptionStrip, buildProcTree, memorySplit, procMb: mb });

</script>
