<script type="text/babel">
/* global React, Icon, ToolBadge, Spark, agentCost, fmtTok, fmtUsd, rateOf, OP_SPEC */
// Orrery — token & cost dashboard (roadmap A6.2 / A6.3). Every number here comes
// from the same ledger the status bar and the estimator read.

const { useState: useStateCo, useEffect: useEffectCo, useMemo: useMemoCo } = React;

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function KPI({ label, value, sub, color, wide }) {
  return (
    <div style={{ flex: wide ? 1.4 : 1, minWidth: 0, padding: "10px 12px", background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-md)" }}>
      <div className="up" style={{ fontSize: 8.5, color: "var(--ink-4)" }}>{label}</div>
      <div className="tnum disp" style={{ fontSize: 19, fontWeight: 600, marginTop: 5, color: color || "var(--ink)" }}>{value}</div>
      {sub && <div style={{ fontSize: 9.5, color: "var(--ink-4)", marginTop: 3 }}>{sub}</div>}
    </div>
  );
}

function Bar({ frac, color }) {
  return (
    <span style={{ display: "block", height: 5, borderRadius: 3, background: "var(--hair)", overflow: "hidden", minWidth: 40 }}>
      <span style={{ display: "block", height: "100%", width: Math.max(2, Math.round(frac * 100)) + "%", background: color || "var(--ui-fill)", borderRadius: 3 }} />
    </span>
  );
}

function CostPanel({ ctx }) {
  const agents = ctx.agents || [];
  const [, tick] = useStateCo(0);
  useEffectCo(() => { const iv = setInterval(() => tick((v) => v + 1), 2000); return () => clearInterval(iv); }, []);
  const budget = window.COST_BUDGET;

  const per = agents.map((a) => ({ a, c: agentCost(a) })).sort((x, y) => y.c.usd - x.c.usd);
  const totals = per.reduce((s, p) => ({ tokens: s.tokens + p.c.tokens, usd: s.usd + p.c.usd, cached: s.cached + p.c.cached, lines: s.lines + p.c.lines }), { tokens: 0, usd: 0, cached: 0, lines: 0 });
  const perLine = totals.lines ? totals.tokens / totals.lines : 0;

  const byModel = useMemoCo(() => {
    const m = {};
    per.forEach(({ a, c }) => { m[a.model] = m[a.model] || { model: a.model, tokens: 0, usd: 0, agents: 0 }; m[a.model].tokens += c.tokens; m[a.model].usd += c.usd; m[a.model].agents += 1; });
    return Object.values(m).sort((x, y) => y.usd - x.usd);
  }, [per.length, totals.tokens]);

  // native vs AI per operation kind — the whole efficiency argument in one table
  const ledger = window.COST_LEDGER || [];
  const ops = useMemoCo(() => {
    const nativeCounts = { commit: agents.reduce((s, a) => s + (a.commits || 0), 0), merge: agents.filter((a) => a.status === "done").length, push: 3, fetch: 12, pull: 6, rebase: 2, conflict: 4, hunk: 9 };
    const keys = Array.from(new Set([...Object.keys(nativeCounts), ...ledger.map((e) => e.op)]));
    return keys.map((op) => {
      const ai = ledger.filter((e) => e.op === op);
      return { op, label: (OP_SPEC[op] || { label: op }).label, native: nativeCounts[op] || 0, aiRuns: ai.length, aiTokens: ai.reduce((s, e) => s + e.tokens, 0), aiUsd: ai.reduce((s, e) => s + e.usd, 0) };
    }).sort((a, b) => (b.aiUsd - a.aiUsd) || (b.native - a.native));
  }, [ledger.length, agents.length]);

  const week = DAYS.map((d, i) => {
    const seed = (i * 9301 + 49297) % 233280 / 233280;
    return { d, usd: 0.4 + seed * 2.6 + (i === 6 ? totals.usd * 0.18 : 0) };
  });
  const maxDay = Math.max(...week.map((w) => w.usd));

  const th = (l, right) => <th className="up" style={{ textAlign: right ? "right" : "left", fontSize: 8.5, color: "var(--ink-4)", fontWeight: 500, padding: "6px 10px", borderBottom: "1px solid var(--hair)", whiteSpace: "nowrap" }}>{l}</th>;
  const capFrac = Math.min(1, budget.spentUsd / budget.capUsd);

  return (
    <div className="scroll-y" style={{ flex: 1, minHeight: 0, padding: 12 }}>
      <div style={{ display: "flex", gap: 9, flexWrap: "wrap" }}>
        <KPI label="Spend · session" value={fmtUsd(totals.usd)} sub={agents.length + " agents · " + fmtTok(totals.tokens) + " tokens"} />
        <KPI label="Cached input" value={Math.round(totals.cached / Math.max(1, totals.tokens) * 100) + "%"} sub="resume keeps the prompt cache warm" color="var(--ink)" />
        <KPI label="Tokens per accepted line" value={Math.round(perLine)} sub={totals.lines.toLocaleString() + " lines merged to main"} color="var(--ink)" wide />
        <KPI label="Native git ops" value={ops.reduce((s, o) => s + o.native, 0)} sub="0 tokens spent" color="var(--st-done)" />
        <KPI label="AI git ops" value={ledger.length} sub={ledger.length ? fmtUsd(ledger.reduce((s, e) => s + e.usd, 0)) + " on the AI path" : "none yet this session"} />
      </div>

      {/* budget */}
      <div style={{ marginTop: 12, padding: "10px 12px", background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-md)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 11 }}>
          <Icon name="shield" size="sm" style={{ color: capFrac > 0.8 ? "var(--st-blocked)" : "var(--ui-ink)" }} />
          <span style={{ color: "var(--ink)" }}>Project budget</span>
          <span className="tnum" style={{ color: "var(--ink-3)" }}>{fmtUsd(budget.spentUsd)} of {fmtUsd(budget.capUsd)}</span>
          <span style={{ flex: 1, minWidth: 60 }}><Bar frac={capFrac} color={capFrac > 0.8 ? "var(--st-blocked)" : "var(--ui-ind)"} /></span>
          <span style={{ fontSize: 9.5, color: "var(--ink-4)" }}>confirm above {fmtUsd(budget.confirmAboveUsd)}</span>
          {[10, 25, 50, 100].map((v) => (
            <button key={v} className="btn ghost-hair" style={{ padding: "2px 7px", fontSize: 10, color: budget.capUsd === v ? "var(--ink)" : "var(--ink-3)", borderColor: budget.capUsd === v ? "var(--ui-focus)" : "var(--hair)" }}
              onClick={() => { window.COST_BUDGET.capUsd = v; ctx.flash("budget cap → $" + v + " · AI variants disable at the cap"); tick((x) => x + 1); }}>${v}</button>
          ))}
        </div>
        {capFrac >= 1 && <div style={{ marginTop: 7, fontSize: 10, color: "var(--st-blocked)" }}>cap reached — AI variants are disabled until you raise it. Native git stays fully usable.</div>}
      </div>

      {/* per day */}
      <div style={{ marginTop: 12, display: "flex", gap: 12 }}>
        <div style={{ flex: 1, minWidth: 0, padding: "10px 12px", background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-md)" }}>
          <div className="up" style={{ fontSize: 8.5, color: "var(--ink-4)", marginBottom: 8 }}>Cost per day</div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 7, height: 70 }}>
            {week.map((w, i) => (
              <div key={w.d} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
                <span className="tnum" style={{ fontSize: 8.5, color: "var(--ink-4)" }}>{fmtUsd(w.usd)}</span>
                <span style={{ width: "100%", height: Math.max(3, Math.round(w.usd / maxDay * 44)), borderRadius: "3px 3px 0 0",
                  background: i === week.length - 1 ? "var(--ui-meter)" : "var(--panel-3)", border: "1px solid var(--hair)" }} />
                <span style={{ fontSize: 8.5, color: "var(--ink-4)" }}>{w.d}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{ flex: 1, minWidth: 0, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-md)", overflow: "hidden" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
            <thead><tr>{th("Model")}{th("Agents", true)}{th("Tokens", true)}{th("Cost", true)}{th("Share")}</tr></thead>
            <tbody>
              {byModel.map((m) => (
                <tr key={m.model} style={{ borderBottom: "1px solid var(--hair)" }}>
                  <td style={{ padding: "5px 10px", color: "var(--ink)" }}>{m.model}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-4)" }}>{m.agents}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-2)" }}>{fmtTok(m.tokens)}</td>
                  <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink)" }}>{fmtUsd(m.usd)}</td>
                  <td style={{ padding: "5px 10px", width: 74 }}><Bar frac={m.usd / Math.max(0.001, totals.usd)} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* per operation */}
      <div style={{ marginTop: 12, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-md)", overflow: "hidden" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderBottom: "1px solid var(--hair)" }}>
          <span className="up" style={{ fontSize: 8.5, color: "var(--ink-4)" }}>Per operation · native vs AI</span>
          <span style={{ fontSize: 9.5, color: "var(--ink-4)", marginLeft: "auto" }}>every native run is a token bill that never arrived</span>
        </div>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
          <thead><tr>{th("Operation")}{th("Native runs", true)}{th("AI runs", true)}{th("AI tokens", true)}{th("AI cost", true)}</tr></thead>
          <tbody>
            {ops.map((o) => (
              <tr key={o.op} style={{ borderBottom: "1px solid var(--hair)" }}>
                <td style={{ padding: "5px 10px", color: "var(--ink)" }}>{o.label}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--st-done)" }}>{o.native || "—"}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-2)" }}>{o.aiRuns || "—"}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-2)" }}>{o.aiTokens ? fmtTok(o.aiTokens) : "—"}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: o.aiUsd ? "var(--ink)" : "var(--ink-4)" }}>{o.aiUsd ? fmtUsd(o.aiUsd) : "0"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* per agent */}
      <div style={{ marginTop: 12, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-md)", overflow: "hidden" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderBottom: "1px solid var(--hair)" }}>
          <span className="up" style={{ fontSize: 8.5, color: "var(--ink-4)" }}>Per agent</span>
        </div>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
          <thead><tr>{th("Agent")}{th("Model")}{th("Tokens", true)}{th("Cached", true)}{th("Cost", true)}{th("Accepted lines", true)}{th("Tok / line", true)}{th("Context", true)}</tr></thead>
          <tbody>
            {per.map(({ a, c }) => (
              <tr key={a.id} style={{ borderBottom: "1px solid var(--hair)", cursor: "pointer" }} onClick={() => ctx.openAgent(a.id)}>
                <td style={{ padding: "5px 10px" }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 6 }}><ToolBadge tool={a.tool} size={13} /><span style={{ color: "var(--ink)" }}>{a.name}</span></span>
                </td>
                <td style={{ padding: "5px 10px", color: "var(--ink-4)" }}>{a.model}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-2)" }}>{fmtTok(c.tokens)}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-4)" }}>{Math.round(c.cached / c.tokens * 100)}%</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink)" }}>{fmtUsd(c.usd)}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: "var(--ink-2)" }}>{c.lines}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", color: c.perLine > 900 ? "var(--st-blocked)" : "var(--ink)" }}>{c.lines ? Math.round(c.perLine) : "—"}</td>
                <td className="tnum" style={{ padding: "5px 10px", textAlign: "right", width: 78 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "flex-end" }}>
                    <span style={{ width: 34 }}><Bar frac={c.ctx} color={c.ctx > 0.8 ? "var(--sem-del)" : c.ctx > 0.6 ? "var(--sem-attn)" : "var(--ui-meter)"} /></span>
                    {Math.round(c.ctx * 100)}%
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "10px 2px 4px", fontSize: 9, color: "var(--ink-4)" }}>
        ledger: token_events (agent · ticket · project · model · input / cached / output / usd) written from hook events and the ccusage sampler
      </div>
    </div>
  );
}

window.TOOL_PANELS.cost = { kind: "cost", label: "Cost", icon: "spark", Component: CostPanel };
Object.assign(window, { CostPanel });

</script>

      <stop offset="0" stop-color="var(--brand-1)"/><stop offset=".5" stop-color="var(--brand-2)"/><stop offset="1" stop-color="var(--brand-3)"/>
    </linearGradient>
  </defs>
  <path d="M40 8 L68 40 L40 72 L12 40 Z" fill="none" stroke="url(#r)" stroke-width="4"/>
  <circle cx="40" cy="40" r="9" fill="var(--brand-2)" opacity=".85"/>
</svg>`;
}

const isImage = (p) => /\.(svg|png|jpe?g|gif|webp|avif)$/i.test(p);
const isPdf = (p) => /\.pdf$/i.test(p);
const LH = 19.5, FS = 12.2;

// ---------------------------------------------------------------- previews
function AssetPreview({ path, onFlash }) {
  const [zoom, setZoom] = useStateE(1);
  const src = (window.FILE_CONTENTS || {})[path];
  const svg = /\.svg$/i.test(path) && src ? src : null;
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
      <div style={{ flex: 1, minHeight: 0, display: "grid", placeItems: "center", overflow: "auto",
        backgroundImage: "linear-gradient(45deg, var(--panel-2) 25%, transparent 25%, transparent 75%, var(--panel-2) 75%), linear-gradient(45deg, var(--panel-2) 25%, transparent 25%, transparent 75%, var(--panel-2) 75%)",
        backgroundSize: "18px 18px", backgroundPosition: "0 0, 9px 9px" }}>
        {svg
          ? <div style={{ transform: "scale(" + zoom * 2.4 + ")", filter: "drop-shadow(0 0 24px rgba(var(--accent-rgb),.35))" }} dangerouslySetInnerHTML={{ __html: svg }} />
          : <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: 30 }}>
              <Icon name={isPdf(path) ? "file" : "layers"} size="lg" style={{ color: "var(--ink-4)" }} />
              <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{fileName(path)}</span>
              <span style={{ fontSize: 10, color: "var(--ink-4)" }}>{isPdf(path) ? "PDF · rendered by the embedded viewer" : "binary image · decoded by the platform decoder"}</span>
              <button className="btn ghost-hair" onClick={() => onFlash("opened " + fileName(path) + " in the system viewer")}><Icon name="ext" size="sm" />Open externally</button>
            </div>}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "6px 12px", borderTop: "1px solid var(--hair)", flex: "none", fontSize: 10, color: "var(--ink-4)" }}>
        <span className="tnum">{svg ? "vector · 80×80" : isPdf(path) ? "3 pages" : "raster"}</span>
        <span>·</span><span className="tnum">{src ? (src.length / 1000).toFixed(1) + " KB" : "—"}</span>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 5 }}>
          <button className="pane-btn" onClick={() => setZoom((z) => Math.max(0.25, z - 0.25))}><Icon name="x" size="sm" style={{ width: 11, height: 11 }} /></button>
          <span className="tnum" style={{ width: 34, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
          <button className="pane-btn" onClick={() => setZoom((z) => Math.min(4, z + 0.25))}><Icon name="plus" size="sm" style={{ width: 11, height: 11 }} /></button>
          <button className="btn" style={{ padding: "2px 7px", fontSize: 10 }} onClick={() => setZoom(1)}>Fit</button>
        </div>
      </div>
    </div>
  );
}

// -------------------------------------------------------------- structure view
function StructureView({ path, cursorLine, onGo }) {
  const syms = useMemoE(() => symbolsOf(path), [path]);
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)", width: 214, flex: "none" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "7px 11px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
        <Icon name="layers" size="sm" style={{ color: "var(--ui-ink)" }} />
        <span className="up" style={{ fontSize: 8.5, color: "var(--ink-3)" }}>Structure</span>
        <span className="tnum" style={{ marginLeft: "auto", fontSize: 9, color: "var(--ink-4)" }}>{syms.length}</span>
      </div>
      <div className="scroll-y" style={{ flex: 1, padding: "3px 0" }}>
        {!syms.length && <div style={{ padding: "10px 11px", fontSize: 10.5, color: "var(--ink-4)" }}>no symbols in this file</div>}
        {syms.map((s) => {
          const on = cursorLine >= s.line && cursorLine < (syms[syms.indexOf(s) + 1] ? syms[syms.indexOf(s) + 1].line : 1e9);
          return (
            <div key={s.line + s.name} onClick={() => onGo(s.line)}
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 10px", paddingLeft: 10 + Math.min(3, s.indent / 2) * 9, cursor: "pointer",
                background: on ? "var(--panel-3)" : "transparent", borderLeft: "2px solid " + (on ? "var(--ui-focus)" : "transparent") }}>
              <Icon name={SYM_ICON[s.kind] || "spark"} size="sm" style={{ width: 11, height: 11, color: on ? "var(--ui-ink)" : "var(--ink-4)" }} />
              <span style={{ fontSize: 11, color: on ? "var(--ink)" : "var(--ink-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</span>
              <span className="tnum" style={{ marginLeft: "auto", fontSize: 8.5, color: "var(--ink-4)" }}>{s.line}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- change hunks: current buffer vs the last saved text (+ git-added lines)
function diffMarks(orig, cur, gitAdded) {
  const marks = {};
  const n = Math.max(orig.length, cur.length);
  for (let i = 0; i < n; i++) {
    if (cur[i] == null) continue;
    if (orig[i] == null) marks[i + 1] = "add";
    else if (orig[i] !== cur[i]) marks[i + 1] = "mod";
  }
  if (cur.length < orig.length) marks[Math.max(1, cur.length)] = "del";
  (gitAdded || []).forEach((ln) => { if (!marks[ln]) marks[ln] = "git"; });
  const hunks = [];
  let run = null;
  Object.keys(marks).map(Number).sort((a, b) => a - b).forEach((ln) => {
    if (run && ln === run.to + 1 && marks[ln] === run.kind) { run.to = ln; return; }
    run = { from: ln, to: ln, kind: marks[ln] };
    hunks.push(run);
  });
  return { marks, hunks };
}

function EditorPane({ path, agent, onFlash, structureOpen, autosave, jump, onOpenCommit }) {
  const FC = window.FILE_CONTENTS || {};
  const initial = useMemoE(() => (FC[path] != null ? FC[path] : getFileLines(path, agent).map((l) => l.s).join("\n")), [path]);
  const [text, setText] = useStateE(initial);
  const [saved, setSaved] = useStateE(initial);
  const [cursor, setCursor] = useStateE({ line: 1, col: 1 });
  const [blame, setBlame] = useStateE(false);
  const [hunkOpen, setHunkOpen] = useStateE(null);
  const [flashLine, setFlashLine] = useStateE(null);
  const ta = useRefE(null);
  const scroller = useRefE(null);
  const saveT = useRefE(null);
  useEffectE(() => { setText(initial); setSaved(initial); setCursor({ line: 1, col: 1 }); }, [path, initial]);

  const lines = text.split("\n");
  const savedLines = saved.split("\n");
  const gitAdded = useMemoE(() => {
    const d = (window.DIFFS || {})[agent && agent.id];
    if (!d || d.file !== path) return [];
    return d.hunks.flatMap((h) => h.lines.filter((l) => l.k === "+").map((l) => l.n));
  }, [path, agent && agent.id]);
  const { marks, hunks } = useMemoE(() => diffMarks(savedLines, lines, gitAdded), [text, saved, gitAdded]);
  const dirty = text !== saved;
  const lang = langOf(path);

  const save = () => {
    if (!dirty) return;
    FC[path] = text;
    setSaved(text);
    onFlash("saved " + fileName(path) + " · " + lines.length + " lines written through the worktree");
  };
  // ⌘S + autosave (debounced 2s after typing stops)
  useEffectE(() => {
    const onSave = () => save();
    window.addEventListener("orrery:save", onSave);
    const onBlame = () => setBlame((v) => !v);
    window.addEventListener("orrery:blame", onBlame);
    const onRevert = () => { if (hunks.length) revertHunk(hunks[0]); };
    window.addEventListener("orrery:revert-hunk", onRevert);
    return () => { window.removeEventListener("orrery:save", onSave); window.removeEventListener("orrery:blame", onBlame); window.removeEventListener("orrery:revert-hunk", onRevert); };
  }, [text, saved, hunks]);
  useEffectE(() => {
    if (!autosave || !dirty) return;
    clearTimeout(saveT.current);
    saveT.current = setTimeout(save, 2000);
    return () => clearTimeout(saveT.current);
  }, [text, autosave]);

  // go-to-line / symbol jump
  const goLine = (line, col) => {
    const el = ta.current;
    if (!el) return;
    const pos = lines.slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0) + Math.max(0, (col || 1) - 1);
    el.focus();
    el.setSelectionRange(pos, pos);
    if (scroller.current) scroller.current.scrollTop = Math.max(0, (line - 6) * LH);
    setCursor({ line, col: col || 1 });
    setFlashLine(line);
    setTimeout(() => setFlashLine(null), 1200);
  };
  useEffectE(() => { if (jump && jump.path === path && jump.line) goLine(jump.line, jump.col); }, [jump && jump.at]);

  const syncCursor = (e) => {
    const upto = e.target.value.slice(0, e.target.selectionStart);
    const ls = upto.split("\n");
    setCursor({ line: ls.length, col: ls[ls.length - 1].length + 1 });
  };
  const revertHunk = (h) => {
    const next = lines.slice();
    for (let ln = h.from; ln <= h.to; ln++) {
      if (savedLines[ln - 1] != null) next[ln - 1] = savedLines[ln - 1];
    }
    setText(next.join("\n"));
    setHunkOpen(null);
    onFlash("reverted hunk · lines " + h.from + (h.to > h.from ? "–" + h.to : ""));
  };

  if (isImage(path) || isPdf(path)) {
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
        <Breadcrumbs path={path} agent={agent} symbol={null} right={<span className="chip" style={{ fontSize: 9 }}>preview</span>} />
        <AssetPreview path={path} onFlash={onFlash} />
      </div>
    );
  }

  const syms = symbolsOf(path);
  const curSym = syms.filter((s) => s.line <= cursor.line).slice(-1)[0];
  const markColor = { add: "var(--sem-add)", mod: "var(--sem-change)", del: "var(--sem-del)", git: "color-mix(in oklch, var(--code-add-ink), transparent 55%)" };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
      <Breadcrumbs path={path} agent={agent} symbol={curSym} right={
        <React.Fragment>
          {dirty && <span className="chip" style={{ fontSize: 9, color: "var(--sem-attn)", borderColor: "color-mix(in oklch, var(--sem-attn), transparent 60%)" }}>unsaved</span>}
          <button className="btn ghost-hair" onClick={() => setBlame((v) => !v)} style={{ padding: "3px 8px", fontSize: 10.5, color: blame ? "var(--ink)" : "var(--ink-3)",
            background: blame ? "var(--ui-sel)" : "transparent", borderColor: blame ? "var(--ui-sel-2)" : "var(--hair)" }}>
            <Icon name="git" size="sm" style={{ color: blame ? "var(--ui-ink)" : "inherit" }} />Annotate
          </button>
          <button className={"btn " + (dirty ? "primary" : "ghost-hair")} disabled={!dirty} onClick={save} style={{ padding: "3px 9px", fontSize: 10.5 }}>
            <Icon name="check" size="sm" />Save
          </button>
        </React.Fragment>
      } />
      {blame
        ? <FileBlameGutter agent={agent} path={path} onOpenCommit={onOpenCommit} />
        : (
          <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
            {structureOpen && <StructureView path={path} cursorLine={cursor.line} onGo={(l) => goLine(l, 1)} />}
            <div ref={scroller} className="scroll-y mono" style={{ flex: 1, minWidth: 0, position: "relative" }}>
              <div style={{ display: "flex", minHeight: "100%" }}>
                {/* gutter: line numbers + change markers */}
                <div style={{ flex: "none", width: 62, background: "var(--panel)", borderRight: "1px solid var(--hair)", position: "relative", userSelect: "none" }}>
                  {lines.map((_, i) => {
                    const ln = i + 1, mk = marks[ln];
                    const h = hunks.find((x) => ln >= x.from && ln <= x.to);
                    return (
                      <div key={ln} style={{ height: LH, display: "flex", alignItems: "center", gap: 4, justifyContent: "flex-end", paddingRight: 6, fontSize: 10.5,
                        color: cursor.line === ln ? "var(--ink-2)" : "var(--ink-4)", background: cursor.line === ln ? "var(--panel-2)" : "transparent" }} className="tnum">
                        {ln}
                        {mk
                          ? <button title={mk === "git" ? "changed by the agent" : "local change · click to revert this hunk"}
                              onClick={() => h && mk !== "git" && setHunkOpen(hunkOpen && hunkOpen.from === h.from ? null : h)}
                              style={{ width: 4, height: LH - 3, marginLeft: 2, border: "none", padding: 0, borderRadius: 2, cursor: mk === "git" ? "default" : "pointer", background: markColor[mk] }} />
                          : <span style={{ width: 4, marginLeft: 2 }} />}
                      </div>
                    );
                  })}
                </div>
                {/* code: highlighted layer under a transparent textarea */}
                <div style={{ flex: 1, minWidth: 0, position: "relative" }}>
                  <pre aria-hidden="true" style={{ margin: 0, padding: "0 14px", fontFamily: "var(--font-mono)", fontSize: FS, lineHeight: LH + "px", pointerEvents: "none", whiteSpace: "pre" }}>
                    {lines.map((s, i) => (
                      <div key={i} style={{ height: LH, background: flashLine === i + 1 ? "var(--ui-sel)" : marks[i + 1] === "git" ? "var(--code-add-bg)" : "transparent" }}>
                        <code>{highlight(s, lang)}</code>
                      </div>
                    ))}
                  </pre>
                  <textarea ref={ta} value={text} spellCheck={false} wrap="off"
                    onChange={(e) => { setText(e.target.value); syncCursor(e); }}
                    onKeyUp={syncCursor} onClick={syncCursor}
                    onKeyDown={(e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } }}
                    style={{ position: "absolute", inset: 0, width: "100%", height: "100%", resize: "none", border: "none", outline: "none",
                      background: "transparent", color: "transparent", caretColor: "var(--ui-focus)", padding: "0 14px",
                      fontFamily: "var(--font-mono)", fontSize: FS, lineHeight: LH + "px", whiteSpace: "pre", overflow: "hidden" }} />
                  {hunkOpen && (
                    <div className="surface rise" style={{ position: "absolute", left: 8, top: (hunkOpen.from) * LH + 4, zIndex: 6, padding: 8, minWidth: 260, boxShadow: "var(--shadow)", background: "var(--elev)" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
                        <Icon name="diff" size="sm" style={{ color: "var(--ink-3)" }} />
                        <span style={{ fontSize: 10.5, color: "var(--ink)" }}>lines {hunkOpen.from}{hunkOpen.to > hunkOpen.from ? "–" + hunkOpen.to : ""}</span>
                        <button className="pane-btn" style={{ marginLeft: "auto" }} onClick={() => setHunkOpen(null)}><Icon name="x" size="sm" /></button>
                      </div>
                      <pre style={{ margin: "0 0 7px", fontSize: 10.5, lineHeight: 1.55, maxHeight: 90, overflow: "auto" }}>
                        {Array.from({ length: hunkOpen.to - hunkOpen.from + 1 }, (_, k) => {
                          const ln = hunkOpen.from + k;
                          return (
                            <React.Fragment key={ln}>
                              {savedLines[ln - 1] != null && <div style={{ color: "var(--code-del-ink)", background: "var(--code-del-bg)" }}>− {savedLines[ln - 1]}</div>}
                              <div style={{ color: "var(--code-add-ink)", background: "var(--code-add-bg)" }}>+ {lines[ln - 1]}</div>
                            </React.Fragment>
                          );
                        })}
                      </pre>
                      <button className="btn ghost-hair" style={{ width: "100%", justifyContent: "center", fontSize: 10.5, color: "var(--st-blocked)" }} onClick={() => revertHunk(hunkOpen)}>
                        <Icon name="discard" size="sm" />Revert hunk
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}
      {/* editor status line */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "4px 12px", borderTop: "1px solid var(--hair)", background: "var(--panel)", flex: "none", fontSize: 9.5, color: "var(--ink-4)" }} className="tnum">
        <span>Ln {cursor.line}, Col {cursor.col}</span>
        <span>{lines.length} lines</span>
        <span>{lang}</span>
        <span>LF · UTF-8 · spaces: 2</span>
        {hunks.filter((h) => h.kind !== "git").length > 0 && <span style={{ color: "var(--ink-2)" }}>{hunks.filter((h) => h.kind !== "git").length} local hunks</span>}
        <span style={{ marginLeft: "auto", color: dirty ? "var(--sem-attn)" : "var(--st-done)" }}>
          {dirty ? (autosave ? "autosaving in 2s…" : "unsaved — ⌘S") : "saved"}
        </span>
      </div>
    </div>
  );
}

function Breadcrumbs({ path, agent, symbol, right }) {
  const parts = path.split("/");
  const proj = agent && window.projectOf ? window.projectOf(agent.projectId) : null;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", flex: "none", fontSize: 11, overflow: "hidden" }}>
      {proj && <span style={{ display: "flex", alignItems: "center", gap: 5, color: proj.color, flex: "none" }}><Icon name={proj.icon} size="sm" style={{ width: 12, height: 12 }} />{proj.name}</span>}
      {parts.map((p, i) => (
        <React.Fragment key={i}>
          <Icon name="chevron" size="sm" style={{ width: 10, height: 10, color: "var(--ink-4)", flex: "none" }} />
          <span style={{ color: i === parts.length - 1 ? "var(--ink)" : "var(--ink-3)", flex: "none", whiteSpace: "nowrap" }}>{p}</span>
        </React.Fragment>
      ))}
      {symbol && (
        <React.Fragment>
          <Icon name="chevron" size="sm" style={{ width: 10, height: 10, color: "var(--ink-4)", flex: "none" }} />
          <span style={{ display: "flex", alignItems: "center", gap: 4, color: "var(--ink-2)", flex: "none" }}>
            <Icon name={SYM_ICON[symbol.kind] || "spark"} size="sm" style={{ width: 11, height: 11 }} />{symbol.name}
          </span>
        </React.Fragment>
      )}
      <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 7, flex: "none" }}>{right}</div>
    </div>
  );
}

Object.assign(window, { EditorPane, StructureView, Breadcrumbs, AssetPreview, diffMarks });

</script>

<script type="text/babel">
/* global React, Icon, logColor, logPrefix, fileName */
// Orrery — terminal stack: arbitrary splits inside one agent pane (B5.1),
// scrollback search (B5.3) and a prompt composer that accepts dropped files (B1.5).

const { useState: useStateT2, useEffect: useEffectT2, useRef: useRefT2, useMemo: useMemoT2 } = React;

let tlSeq = 1;
const leaf = () => ({ t: "leaf", id: "t" + (++tlSeq) });

function splitNode(node, targetId, dir) {
  if (node.t === "leaf") return node.id === targetId ? { t: "split", dir, a: node, b: leaf() } : node;
  return { ...node, a: splitNode(node.a, targetId, dir), b: splitNode(node.b, targetId, dir) };
}
function dropNode(node, targetId) {
  if (node.t === "leaf") return node.id === targetId ? null : node;
  const a = dropNode(node.a, targetId), b = dropNode(node.b, targetId);
  if (!a) return b; if (!b) return a;
  return { ...node, a, b };
}
const leafIds = (node) => node.t === "leaf" ? [node.id] : [...leafIds(node.a), ...leafIds(node.b)];

// ---- one terminal: scrollback + search + optional composer
function TerminalLeaf({ ag, lines, streaming, focused, onFocus, onSplit, onClose, canClose, index, composer, onSend, onFlash }) {
  const [search, setSearch] = useStateT2(null);   // null | {q, idx}
  const body = useRefT2(null);
  const rows = useRefT2({});
  const [draft, setDraft] = useStateT2("");
  const [dragOver, setDragOver] = useStateT2(false);
  const inputRef = useRefT2(null);

  useEffectT2(() => { if (body.current && !search) body.current.scrollTop = body.current.scrollHeight; }, [lines.length]);
  useEffectT2(() => {
    const open = () => { if (focused) setSearch((s) => s || { q: "", idx: 0 }); };
    window.addEventListener("orrery:scrollback-search", open);
    return () => window.removeEventListener("orrery:scrollback-search", open);
  }, [focused]);

  const hits = useMemoT2(() => {
    if (!search || !search.q) return [];
    const q = search.q.toLowerCase();
    return lines.map((l, i) => (l.s || "").toLowerCase().includes(q) ? i : -1).filter((i) => i >= 0);
  }, [search && search.q, lines.length]);
  const cur = hits.length ? hits[Math.min(search.idx, hits.length - 1) % hits.length] : -1;
  useEffectT2(() => {
    if (cur < 0) return;
    const el = rows.current[cur];
    if (el && body.current) body.current.scrollTop = Math.max(0, el.offsetTop - body.current.clientHeight / 2);
  }, [cur]);

  const hl = (s) => {
    if (!search || !search.q) return s;
    const q = search.q, out = [], low = (s || "").toLowerCase(), lq = q.toLowerCase();
    let at = 0, i;
    while ((i = low.indexOf(lq, at)) >= 0) {
      if (i > at) out.push(<span key={at}>{s.slice(at, i)}</span>);
      out.push(<mark key={"m" + i} style={{ background: "var(--ui-line)", color: "var(--ink)", borderRadius: 2 }}>{s.slice(i, i + q.length)}</mark>);
      at = i + q.length;
    }
    out.push(<span key="t">{s.slice(at)}</span>);
    return out;
  };

  const send = () => {
    const v = draft.trim();
    if (!v) return;
    onSend(ag.id, v);
    setDraft("");
  };

  return (
    <div onMouseDown={onFocus} style={{ flex: 1, minWidth: 0, minHeight: 0, display: "flex", flexDirection: "column",
      outline: focused ? "1px solid var(--ui-sel-2)" : "none", outlineOffset: -1, background: "var(--bg)" }}>
      {/* leaf toolbar */}
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "3px 8px 3px 10px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", flex: "none" }}>
        <Icon name="terminal" size="sm" style={{ width: 12, height: 12, color: focused ? "var(--ui-ink)" : "var(--ink-4)" }} />
        <span style={{ fontSize: 10, color: "var(--ink-3)" }}>{index === 0 ? "pty · " + ag.worktree : "shell " + (index + 1) + " · " + ag.worktree}</span>
        {streaming && index === 0 && <span className="dot running" style={{ background: "var(--st-running)" }} />}
        <div style={{ marginLeft: "auto", display: "flex", gap: 2 }}>
          <button className="pane-btn" title="Search scrollback" onClick={() => setSearch((s) => s ? null : { q: "", idx: 0 })}><Icon name="search" size="sm" style={{ width: 12, height: 12 }} /></button>
          <button className="pane-btn" title="Split right" onClick={() => onSplit("v")}><Icon name="splitCol" size="sm" style={{ width: 12, height: 12 }} /></button>
          <button className="pane-btn" title="Split down" onClick={() => onSplit("h")}><Icon name="splitRow" size="sm" style={{ width: 12, height: 12 }} /></button>
          {canClose && <button className="pane-btn" title="Close this shell" onClick={onClose}><Icon name="x" size="sm" style={{ width: 12, height: 12 }} /></button>}
        </div>
      </div>

      {search && (
        <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "5px 9px", background: "var(--panel-2)", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <Icon name="search" size="sm" style={{ color: "var(--ui-ink)" }} />
          <input autoFocus value={search.q} onChange={(e) => setSearch({ q: e.target.value, idx: 0 })}
            onKeyDown={(e) => { if (e.key === "Enter") setSearch((s) => ({ ...s, idx: s.idx + (e.shiftKey ? -1 : 1) })); if (e.key === "Escape") setSearch(null); }}
            placeholder="find in scrollback…"
            style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5 }} />
          <span className="tnum" style={{ fontSize: 10, color: hits.length ? "var(--ink-3)" : "var(--ink-4)" }}>
            {hits.length ? (Math.min(search.idx, hits.length - 1) % hits.length) + 1 + " / " + hits.length : search.q ? "no matches" : ""}
          </span>
          <button className="pane-btn" onClick={() => setSearch((s) => ({ ...s, idx: s.idx - 1 }))}><Icon name="chevron" size="sm" style={{ width: 12, height: 12, transform: "rotate(-90deg)" }} /></button>
          <button className="pane-btn" onClick={() => setSearch((s) => ({ ...s, idx: s.idx + 1 }))}><Icon name="chevron" size="sm" style={{ width: 12, height: 12, transform: "rotate(90deg)" }} /></button>
          <button className="pane-btn" onClick={() => setSearch(null)}><Icon name="x" size="sm" style={{ width: 12, height: 12 }} /></button>
        </div>
      )}

      <div ref={body} className="scroll-y mono" style={{ flex: 1, minHeight: 0, padding: "10px 14px", fontSize: 12, lineHeight: 1.7 }}>
        {index === 0 && <div style={{ color: "var(--ink-4)", marginBottom: 8, fontSize: 10.5 }}>── session: {ag.worktree} · {ag.branch} ──</div>}
        {index > 0 && <div style={{ color: "var(--ink-4)", marginBottom: 8, fontSize: 10.5 }}>── new shell in {ag.worktree} ──</div>}
        {(index === 0 ? lines : lines.slice(-3)).map((l, i) => (
          <div key={i} ref={(el) => { rows.current[i] = el; }}
            style={{ display: "flex", gap: 9, color: logColor(l.t), whiteSpace: "pre-wrap", wordBreak: "break-word",
              background: cur === i ? "var(--ui-sel)" : "transparent" }}>
            <span style={{ color: l.t === "cmd" ? "var(--ink-2)" : "var(--ink-4)", flex: "none", userSelect: "none", width: 10, textAlign: "center" }}>{logPrefix(l.t)}</span>
            <span style={{ flex: 1 }}>{hl(l.s)}</span>
          </div>
        ))}
        {streaming && index === 0 && (
          <div style={{ display: "flex", gap: 9, color: "var(--st-running)" }}>
            <span style={{ width: 10, textAlign: "center" }}>$</span><span className="caret" />
          </div>
        )}
      </div>

      {composer && (
        <div onDragOver={(e) => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)}
          onDrop={(e) => {
            e.preventDefault(); setDragOver(false);
            const d = window.__omDrag;
            const paths = [];
            if (d && d.kind === "file" && d.path) paths.push(d.path);
            const txt = e.dataTransfer.getData("text/plain");
            if (!paths.length && txt) paths.push(txt);
            if (e.dataTransfer.files && e.dataTransfer.files.length) [...e.dataTransfer.files].forEach((f) => paths.push(f.name + " (attached)"));
            if (!paths.length) return;
            setDraft((v) => (v ? v.trim() + " " : "") + paths.map((p) => "@" + p).join(" ") + " ");
            if (inputRef.current) inputRef.current.focus();
            onFlash && onFlash("referenced " + paths.length + " file" + (paths.length === 1 ? "" : "s") + " in the prompt");
          }}
          style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderTop: "1px solid " + (dragOver ? "var(--ui-focus)" : "var(--hair)"),
            background: dragOver ? "var(--ui-sel)" : "var(--panel)", flex: "none" }}>
          <Icon name="chat" size="sm" style={{ color: dragOver ? "var(--ui-ink)" : "var(--ink-4)" }} />
          <input ref={inputRef} value={draft} onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
            placeholder={dragOver ? "drop to reference the file" : "message " + ag.name + " · drag files in to reference them"}
            style={{ flex: 1, minWidth: 0, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)", padding: "6px 9px",
              color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5, outline: "none" }} />
          <button className="btn primary" disabled={!draft.trim()} onClick={send} style={{ padding: "5px 10px", fontSize: 11 }}>
            <Icon name="enter" size="sm" />Send
          </button>
        </div>
      )}
    </div>
  );
}

function TerminalStack({ ag, lines, streaming, onFlash, onSend }) {
  const [tree, setTree] = useStateT2(() => leaf());
  const [focus, setFocus] = useStateT2(null);
  const ids = leafIds(tree);
  const focused = focus && ids.includes(focus) ? focus : ids[0];
  useEffectT2(() => {
    const onSplitEvt = (e) => setTree((t) => splitNode(t, focused, (e.detail && e.detail.dir) || "v"));
    window.addEventListener("orrery:split", onSplitEvt);
    return () => window.removeEventListener("orrery:split", onSplitEvt);
  }, [focused]);
  useEffectT2(() => { setTree(leaf()); }, [ag.id]);

  const render = (node) => {
    if (node.t === "leaf") {
      const i = ids.indexOf(node.id);
      return (
        <TerminalLeaf key={node.id} ag={ag} lines={lines} streaming={streaming} index={i}
          focused={focused === node.id} onFocus={() => setFocus(node.id)}
          onSplit={(dir) => { setTree((t) => splitNode(t, node.id, dir)); onFlash && onFlash("split terminal " + (dir === "v" ? "right" : "down")); }}
          onClose={() => setTree((t) => dropNode(t, node.id) || leaf())} canClose={ids.length > 1}
          composer={i === 0} onSend={onSend} onFlash={onFlash} />
      );
    }
    return (
      <div key={node.a.id + node.b.id} style={{ flex: 1, minWidth: 0, minHeight: 0, display: "flex", flexDirection: node.dir === "v" ? "row" : "column" }}>
        {render(node.a)}
        <div style={{ flex: "none", background: "var(--hair)", width: node.dir === "v" ? 1 : "auto", height: node.dir === "v" ? "auto" : 1 }} />
        {render(node.b)}
      </div>
    );
  };
  return <div style={{ flex: 1, minHeight: 0, display: "flex" }}>{render(tree)}</div>;
}

Object.assign(window, { TerminalStack, TerminalLeaf });

</script>

    body: "JPY partial captures rounded a cent high — switch to half-even rounding.",
  },

const CHECK_META = {
  pass: { icon: "check", color: "var(--st-done)" }, fail: { icon: "x", color: "var(--st-blocked)" },
  running: { icon: "refresh", color: "var(--st-running)" }, skipped: { icon: "dots", color: "var(--ink-4)" },
};
const PR_STATE = { open: { color: "var(--st-done)", label: "open" }, merged: { color: "var(--sem-change)", label: "merged" }, closed: { color: "var(--st-blocked)", label: "closed" } };

function GithubPanel({ ctx }) {
  const prs = window.GITHUB_PRS;
  const [sel, setSel] = useStateGh(prs[0].n);
  const [filter, setFilter] = useStateGh("open");
  const [reviewed, setReviewed] = useStateGh({});
  const pr = prs.find((p) => p.n === sel) || prs[0];
  const shown = prs.filter((p) => filter === "all" || p.state === filter);

  // the PR's files come from the commit it points at — same data the diff views use
  const commit = ((window.GIT || {}).history || []).find((c) => c.sha === pr.sha);
  const files = (commit && commit.files) || [];
  const [selFile, setSelFile] = useStateGh(files[0] ? files[0].path : null);
  const diffKey = pr.sha + "/" + (selFile || "");
  const diff = ((window.GIT || {}).commitDiffs || {})[diffKey];

  const act = (kind) => {
    setReviewed((r) => ({ ...r, [pr.n]: kind }));
    ctx.flash(kind === "approve" ? "approved #" + pr.n : kind === "changes" ? "requested changes on #" + pr.n : "commented on #" + pr.n);
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "310px 1fr", minHeight: 0, flex: 1 }}>
      {/* PR list */}
      <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 10px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
          <Icon name="pr" size="sm" style={{ color: "var(--ui-ink)" }} />
          <span className="up" style={{ fontSize: 8.5, color: "var(--ink-3)" }}>{(ctx.project ? (ctx.project.org || "northwind") + "/" + ctx.project.name : "northwind/payments-service")}</span>
          <select className="osel" value={filter} onChange={(e) => setFilter(e.target.value)} style={{ marginLeft: "auto", width: 92, padding: "3px 8px", fontSize: 10.5, flex: "none" }}>
            <option value="open">Open</option><option value="merged">Merged</option><option value="all">All</option>
          </select>
        </div>
        <div className="scroll-y" style={{ flex: 1 }}>
          {shown.map((p) => {
            const st = PR_STATE[p.state];
            const failing = p.checks.some((c) => c.state === "fail");
            return (
              <div key={p.n} onClick={() => { setSel(p.n); const f = (((window.GIT || {}).history || []).find((c) => c.sha === p.sha) || { files: [] }).files[0]; setSelFile(f ? f.path : null); }}
                style={{ padding: "8px 10px", cursor: "pointer", borderBottom: "1px solid var(--hair)", borderLeft: "2px solid " + (sel === p.n ? "var(--ui-focus)" : "transparent"),

                  <span className="tnum" style={{ fontSize: 10, color: "var(--ink-4)" }}>#{p.n}</span>
                  {p.draft && <span className="chip" style={{ fontSize: 8.5, padding: "0 5px" }}>draft</span>}
                  <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{p.rel}</span>
                </div>
                <div style={{ fontSize: 11.5, color: sel === p.n ? "var(--ink)" : "var(--ink-2)", margin: "4px 0 5px", lineHeight: 1.4 }}>{p.title}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 9.5, color: "var(--ink-4)" }} className="tnum">
                  <span style={{ color: "var(--code-add-ink)" }}>+{p.additions}</span>
                  <span style={{ color: "var(--code-del-ink)" }}>−{p.deletions}</span>
                  <span style={{ display: "flex", gap: 3, alignItems: "center" }}><Icon name="chat" size="sm" style={{ width: 10, height: 10 }} />{p.comments}</span>
                  {p.approvals > 0 && <span style={{ display: "flex", gap: 3, alignItems: "center", color: "var(--st-done)" }}><Icon name="check" size="sm" style={{ width: 10, height: 10 }} />{p.approvals}</span>}

      </div>

      <div style={{ display: "flex", flexDirection: "column", minHeight: 0 }}>
        <div style={{ padding: "9px 12px", borderBottom: "1px solid var(--hair)", flex: "none" }}>

            <span style={{ fontSize: 12.5, color: "var(--ink)" }}>{pr.title}</span>

            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 7, fontSize: 10, color: "var(--ink-3)" }} className="tnum">
            {window.AuthorChip ? <window.AuthorChip id={pr.author} /> : <span>{pr.author}</span>}
            <span style={{ display: "flex", gap: 4, alignItems: "center" }}><Icon name="branch" size="sm" style={{ width: 11, height: 11, color: "var(--ink-3)" }} />{pr.branch} → {pr.base}</span>
            <span style={{ color: "var(--code-add-ink)" }}>+{pr.additions}</span>
            <span style={{ color: "var(--code-del-ink)" }}>−{pr.deletions}</span>
            <span>{files.length} files</span>
          </div>
          <div style={{ fontSize: 11, color: "var(--ink-2)", marginTop: 7, lineHeight: 1.5 }}>{pr.body}</div>
          {/* checks */}
          <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
            {pr.checks.map((c) => {
              const m = CHECK_META[c.state];
              return (
                <span key={c.name} className="chip" style={{ fontSize: 9.5, color: m.color, borderColor: "color-mix(in oklch, " + m.color + ", transparent 66%)" }}>
                  <Icon name={m.icon} size="sm" style={{ width: 10, height: 10 }} />{c.name}
                  {c.ms > 0 && <span style={{ color: "var(--ink-4)" }}>{Math.round(c.ms / 1000)}s</span>}
                </span>
              );
            })}
          </div>
          {/* review actions */}
          <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 9 }}>
            <button className="btn primary" style={{ fontSize: 11 }} disabled={reviewed[pr.n] === "approve"} onClick={() => act("approve")}>
              <Icon name="check" size="sm" />{reviewed[pr.n] === "approve" ? "Approved" : "Approve"}
            </button>
            <button className="btn ghost-hair" style={{ fontSize: 11, color: "var(--st-blocked)" }} onClick={() => act("changes")}><Icon name="flag" size="sm" />Request changes</button>
            <button className="btn ghost-hair" style={{ fontSize: 11 }} onClick={() => act("comment")}><Icon name="chat" size="sm" />Comment</button>
            <span style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>hover a line in the diff to leave an inline comment</span>
          </div>
        </div>

        {/* files + diff — same review surface as agent diffs */}
        <div style={{ flex: 1, display: "grid", gridTemplateColumns: "228px 1fr", minHeight: 0 }}>
          <div className="scroll-y mono" style={{ borderRight: "1px solid var(--hair)", padding: "4px 0", background: "var(--panel)" }}>
            {files.map((f) => (
              <div key={f.path} onClick={() => setSelFile(f.path)}
                style={{ display: "flex", alignItems: "center", gap: 7, padding: "5px 10px", cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)",
                  background: selFile === f.path ? "var(--panel-3)" : "transparent" }}>
                <Icon name="file" size="sm" style={{ width: 12, height: 12, color: f.state === "A" ? "var(--vcs-added)" : "var(--vcs-modified)" }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11, color: selFile === f.path ? "var(--ink)" : "var(--ink-2)", textDecoration: f.state === "D" ? "line-through" : "none", opacity: f.state === "D" ? 0.7 : 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileName(f.path)}</div>
                  <div style={{ fontSize: 9, color: "var(--ink-4)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</div>
                </div>
                <span className="tnum" style={{ fontSize: 9, color: "var(--code-add-ink)", flex: "none" }}>+{f.add}</span>
              </div>
            ))}
          </div>
          {diff
            ? <ReviewCode agentId={"pr-" + pr.n} file={selFile} view="diff" rows={diffToRows({ ...diff, file: selFile })} lang={diff.lang} />
            : <div style={{ display: "grid", placeItems: "center", color: "var(--ink-4)", fontSize: 11.5, padding: 20, textAlign: "center" }}>
                {selFile ? "diff for " + fileName(selFile) + " is fetched on demand from the GitHub API" : "select a file"}
              </div>}
        </div>
      </div>
    </div>
  );
}

window.TOOL_PANELS.github = { kind: "github", label: "Pull Requests", icon: "pr", Component: GithubPanel };
Object.assign(window, { GithubPanel });

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

    <>

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}

      {children}

}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function dvcPush(stats,feed){ const pool=[]; stats.forEach(s=>{ if(s.calls>0){ const w=Math.max(1,Math.round(s.calls/3)); for(let i=0;i<w;i++) pool.push(s);} }); if(!pool.length) return; const n=1+Math.floor(Math.random()*2); for(let i=0;i<n;i++){ const s=pool[Math.floor(Math.random()*pool.length)]; let dur=dvcJit(s.rt,.4); if(Math.random()<.14) dur=dvcRnd(s.rt,s.p95); const err=s.err>0&&Math.random()<(s.err/100)*3; feed.unshift({id:++DVC_SEQ,ts:dvcClock(0),cmd:s.cmd,dur:+dur.toFixed(1),err,fresh:true}); } if(feed.length>30) feed.length=30; }
function dvcTick(stats,feed){
  const allZero = stats.every(s=>s.calls===0);
  if(allZero){ // trickle back after a reset
    const wake=DVC_SEED[Math.floor(Math.random()*DVC_SEED.length)],tgt=stats.find(s=>s.cmd===wake.cmd);
    if(tgt&&tgt.calls===0){ Object.assign(tgt,{calls:Math.max(1,Math.round(dvcJit(wake.calls,.4))),rt:+dvcJit(wake.rt,.15).toFixed(1),exec:+dvcJit(wake.exec,.15).toFixed(1),p95:wake.p95,max:wake.max,err:wake.err,hist:dvcHist(wake.rt,wake.p95),recent:dvcRecent(wake,9)}); tgt.overhead=+(tgt.rt-tgt.exec).toFixed(1); }
    dvcPush(stats,feed); return;
  }
  stats.forEach(s=>{ if(s.calls===0) return; s.rt=+Math.max(.5,dvcJit(s.rt,.06)).toFixed(1); s.exec=+Math.max(.3,Math.min(s.rt-.2,dvcJit(s.exec,.06))).toFixed(1); s.overhead=+(s.rt-s.exec).toFixed(1); s.calls=Math.max(1,Math.round(dvcJit(s.calls,.12))); s.hist.push(s.rt); if(s.hist.length>16) s.hist.shift(); });
  dvcPush(stats,feed);
}
const dvcMs=(v)=> v==null?"—":v>=100?Math.round(v)+"ms":v>=10?v.toFixed(0)+"ms":v.toFixed(1)+"ms";
const dvcLat=(v)=> v==null?"na":v<=16?"g":v<=100?"a":"r";

// ── resources engine (per-process CPU / MEM) ───────────────────────────────
const DVC_CORES = 10;
const DVC_SYSMEM = 16384; // MB
function dvcHash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function dvcClamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function dvcSeries(base,p,n){ const o=[]; for(let i=0;i<n;i++) o.push(dvcJit(base,p)); return o; }
// orrery's own processes
const DVC_ORRERY = [
  { key:"orrery:core", name:"Orrery", sub:"main · rust core", kind:"core", cmd:"orrery", cpu:[1,7], mem:[96,168], thr:[14,26] },
  { key:"orrery:webview", name:"Orrery WebView", sub:"ui · wkwebview", kind:"ui", cmd:"WebKitWebProcess", cpu:[2,14], mem:[300,560], thr:[28,58] },
  { key:"orrery:gpu", name:"Orrery GPU", sub:"gpu helper", kind:"gpu", cmd:"WebKit.GPU", cpu:[0,5], mem:[120,250], thr:[8,16] },
];
const DVC_ALIVE = ["running","waiting","queued","blocked"];
function dvcResReconcile(map, agents){
  DVC_ORRERY.forEach((p,i)=>{
    if(!map.has(p.key)){
      const cpu0=dvcRnd(p.cpu[0],p.cpu[1]), mem0=dvcRnd(p.mem[0],p.mem[1]);
      map.set(p.key, { key:p.key, name:p.name, sub:p.sub, kind:p.kind, cmd:p.cmd,
        pid:4800+i*23+Math.floor(Math.random()*9), cpu:cpu0, mem:mem0,
        threads:Math.round(dvcRnd(p.thr[0],p.thr[1])), start:Date.now()-dvcRnd(900,7200)*1000,
        cpuH:dvcSeries(cpu0,.35,20), memH:dvcSeries(mem0,.04,20), live:true });
    }
  });
  const alive=new Set();
  agents.forEach(a=>{
    if(!DVC_ALIVE.includes(a.status)) return;
    const key="agent:"+a.id; alive.add(key);
    if(!map.has(key)){
      const run=a.status==="running"; const cpu0=run?dvcRnd(18,62):dvcRnd(1,6); const mem0=dvcRnd(150,420);
      map.set(key, { key, name:a.name, sub:"agent · "+a.tool, kind:"agent", tool:a.tool, agentId:a.id, projectId:a.projectId,
        cmd:a.tool+(a.model?" "+a.model:""), pid:9000+dvcHash(a.id)%990, cpu:cpu0, mem:mem0,
        threads:Math.round(dvcRnd(8,28)), start:Date.now()-(a.elapsed||60)*1000,
        cpuH:dvcSeries(cpu0,.4,20), memH:dvcSeries(mem0,.05,20), live:true, status:a.status });
    } else { const v=map.get(key); v.status=a.status; v.name=a.name; v.tool=a.tool; }
  });
  for(const k of [...map.keys()]) if(k.startsWith("agent:") && !alive.has(k)) map.delete(k);
}
function dvcResTick(map, agents){
  dvcResReconcile(map, agents);
  for(const v of map.values()){
    if(v.kind==="agent" && v.status!=="running") v.cpu=dvcClamp(dvcJit(2.5,.6),0.2,6);
    else { const ceil=v.kind==="agent"?92:v.kind==="ui"?38:v.kind==="gpu"?12:18; v.cpu=dvcClamp(dvcJit(Math.max(0.5,v.cpu),.24),0.2,ceil); }
    const ceilM=v.kind==="ui"?640:v.kind==="agent"?620:280;
    v.mem=dvcClamp(dvcJit(v.mem,.035),v.kind==="agent"?110:80,ceilM);
    v.cpuH.push(v.cpu); if(v.cpuH.length>20) v.cpuH.shift();
    v.memH.push(v.mem); if(v.memH.length>20) v.memH.shift();
  }
}
const dvcCpuC=(v)=> v==null?"na":v<30?"g":v<70?"a":"r";
const dvcMemC=(v)=> v==null?"na":v<300?"g":v<600?"a":"r";
const dvcMem=(mb)=> mb>=1024?(mb/1024).toFixed(2)+" GB":Math.round(mb)+" MB";
const dvcUptime=(start)=>{ let s=Math.floor((Date.now()-start)/1000); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); s-=m*60; return h>0?h+"h "+m+"m":m>0?m+"m "+s+"s":s+"s"; };

// ── small helpers ───────────────────────────────────────────────────────────
function dvcDelta(ag){ return (ag.files||[]).reduce((o,f)=>({a:o.a+(f.add||0),d:o.d+(f.del||0)}),{a:0,d:0}); }

function dvcNote(ag){ if(ag.blockReason) return ag.blockReason; if(ag.waitReason) return ag.waitReason; const r=(ag.pending||[]).find(p=>p.kind==="review"); if(r) return r.title+" · "+r.cmd; const d=(ag.pending||[]).find(p=>p.kind==="decision"); if(d) return "Decision: "+d.title; return null; }

                              <span className="dvc-dim" style={{fontSize:10}}>{p.sub}</span>
                            </span></td>
                            <td className="dvc-pid tnum">{p.pid}</td>
                            <td className={"dvc-lat "+cc+" tnum"}><span className="v">{p.cpu.toFixed(1)}%</span></td>
                            <td className="dvc-spk"><Spark data={p.cpuH} color={dvcLatColor(cc)} w={54} h={16} /></td>
                            <td className={"dvc-lat "+mc+" tnum"}><span className="v">{dvcMem(p.mem)}</span></td>
                            <td className="tnum" style={{color:"var(--ink-3)"}}>{p.threads}</td>
                            <td className="tnum" style={{color:"var(--ink-3)"}}>{dvcUptime(p.start)}</td>
                        </tr>

                    })}
                  </tbody>
                </table>
              </React.Fragment>
            )}
          </div>

          <footer className="dvc-foot">
            {tab==="perf" && <React.Fragment>
              <span className="dvc-leg"><span className="dvc-sw g" />≤16ms</span>
              <span className="dvc-leg"><span className="dvc-sw a" />16–100ms</span>
              <span className="dvc-leg"><span className="dvc-sw r" />&gt;100ms · err</span>
              <span className="dvc-sp" />
              <span className="tnum">{hasCalls ? statsRef.current.filter(s=>s.calls>0).length+" commands · "+statsRef.current.reduce((a,s)=>a+(s.calls||0),0)+" calls/10s · "+statsRef.current.filter(s=>s.rt!=null&&s.rt>100).length+" >100ms" : "0 commands · 0 calls"}{!dev && " · prod (aggregates only)"}</span>

            </React.Fragment>}
            {tab==="projects" && <React.Fragment>
              <span className="tnum">{projects.length} projects · {agents.length} worktrees</span>
              <span className="dvc-sp" /><span className="tnum">live state</span>
            </React.Fragment>}
            {tab==="resources" && <React.Fragment>
              <span className="dvc-leg"><span className="dvc-sw g" />idle</span>
              <span className="dvc-leg"><span className="dvc-sw a" />busy</span>
              <span className="dvc-leg"><span className="dvc-sw r" />hot</span>
              <span className="dvc-sp" />
              <span className="tnum">Orrery {(DVC_ORRERY.reduce((a,p)=>{const v=resRef.current.get(p.key);return a+(v?v.cpu:0);},0)).toFixed(1)}% · {procList().length} procs · {machineCpu.toFixed(1)}% / {DVC_CORES} cores · {(sumMem/1024).toFixed(2)} GB</span>
            </React.Fragment>}
          </footer>
        </section>
      )}
    </React.Fragment>
  );
}

Object.assign(window, { DevConsole });
