<script type="text/babel">
/* global React, Icon, StatusDot, ToolBadge, fmtDur */
// ORCHESTRA left sidebar — projects → agents

const { useState: useStateS, useRef: useRefS } = React;

const STATUS_PRIORITY = { blocked: 0, running: 1, waiting: 2, queued: 3, done: 4, idle: 5 };

function AgentRow({ ag, active, onOpen, onContext }) {
  const totAdd = ag.files.reduce((s, f) => s + f.add, 0);
  const totDel = ag.files.reduce((s, f) => s + f.del, 0);
  const needs = ag.status === "blocked" || (ag.pending && ag.pending.some((p) => p.kind === "permission" || p.kind === "decision"));
  return (
    <div onClick={() => onOpen(ag.id)} onContextMenu={(e) => onContext(e, ag.id)}
      draggable
      onDragStart={(e) => { window.__omDrag = { kind: "agent", id: ag.id, agentId: ag.id }; e.dataTransfer.effectAllowed = "copy"; try { e.dataTransfer.setData("text/plain", ag.name); } catch (_) {} }}
      onDragEnd={() => { window.__omDrag = null; }}
      title="drag onto a tab, or into a split, to add its terminal"
      style={{
        display: "flex", flexDirection: "column", gap: 3,
        padding: "6px 10px 7px", cursor: "pointer", position: "relative",
        borderRadius: "var(--r-md)", margin: "1px 8px 1px 14px",
        background: active ? "var(--panel-3)" : "transparent",
        border: "1px solid " + (active ? "var(--hair-2)" : "transparent"),
      }}
      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
      {active && <span style={{ position: "absolute", left: -8, top: 7, bottom: 7, width: 2.5, borderRadius: 3, background: "var(--ui-ind)" }} />}
      <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
        <StatusDot status={ag.status} />
        <span style={{ fontSize: "var(--fs-tree)", color: "var(--ink)", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ag.name}</span>
        {needs && <span style={{ width: 5, height: 5, borderRadius: "50%", background: "var(--st-blocked)", flex: "none" }} />}
        <ToolBadge tool={ag.tool} size={14} />
        <span style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }} className="tnum">{ag.elapsed ? fmtDur(ag.elapsed) : "—"}</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6, paddingLeft: 15 }}>
        <Icon name="branch" size="sm" style={{ color: "var(--ink-4)", width: 11, height: 11, flex: "none" }} />
        <span style={{ fontSize: 10.5, color: "var(--ink-3)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ag.branch.replace("agent/", "")}</span>
        {ag.files.length > 0 && (
          <span className="tnum" style={{ marginLeft: "auto", fontSize: 10, display: "flex", gap: 5, flex: "none" }}>
            <span style={{ color: "var(--code-add-ink)" }}>+{totAdd}</span>
            <span style={{ color: "var(--code-del-ink)" }}>−{totDel}</span>
          </span>
        )}
      </div>
      {ag.status === "running" && <div className="activity" style={{ marginLeft: 15, marginTop: 2 }} />}
    </div>
  );
}

function ProjectGroup({ project, agents, activeAgent, onOpen, onContext, onSpawn, onProjectContext, collapsed, toggle, onScope }) {
  const sorted = [...agents].sort((a, b) => STATUS_PRIORITY[a.status] - STATUS_PRIORITY[b.status]);
  const running = agents.filter((a) => a.status === "running").length;
  const needs = agents.filter((a) => a.status === "blocked").length;
  return (
    <div style={{ marginBottom: 2 }}>
      <div onClick={() => toggle(project.id)} onContextMenu={(e) => onProjectContext(e, project.id)}
        className="proj-row"
        style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", cursor: "pointer", position: "relative", margin: "0 6px", borderRadius: "var(--r-md)" }}>
        <Icon name={collapsed ? "chevron" : "chevronD"} size="sm" style={{ width: 11, height: 11, color: "var(--ink-4)", flex: "none" }} />
        <span style={{ width: 19, height: 19, flex: "none", borderRadius: 5, display: "grid", placeItems: "center",
          background: "color-mix(in oklch, " + project.color + ", transparent 82%)",
          border: "1px solid color-mix(in oklch, " + project.color + ", transparent 62%)" }}>
          <Icon name={project.icon} size="sm" style={{ width: 12, height: 12, color: project.color }} />
        </span>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{project.name}</span>
        {needs > 0 && <span className="tnum" style={{ fontSize: 9, fontWeight: 700, color: "var(--st-blocked)" }}>{needs}!</span>}
        <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)", flex: "none" }}>{agents.length}</span>
        <button className="proj-spawn" title="Spawn agent in this project"
          onClick={(e) => { e.stopPropagation(); onSpawn(project.id); }}
          style={{ background: "transparent", border: "none", color: "var(--ink-3)", cursor: "pointer", display: "flex", padding: 2, borderRadius: 4, flex: "none" }}
          onMouseEnter={(e) => { e.currentTarget.style.color = "var(--ui-ink)"; e.currentTarget.style.background = "var(--panel-3)"; }}
          onMouseLeave={(e) => { e.currentTarget.style.color = "var(--ink-3)"; e.currentTarget.style.background = "transparent"; }}>
          <Icon name="bolt" size="sm" />
        </button>
      </div>
      {!collapsed && (
        <div style={{ position: "relative" }}>
          <span style={{ position: "absolute", left: 21, top: 0, bottom: 4, width: 1, background: "var(--hair)" }} />
          {sorted.length ? sorted.map((ag) => (
            <AgentRow key={ag.id} ag={ag} active={ag.id === activeAgent} onOpen={onOpen} onContext={onContext} />
          )) : (
            <div style={{ padding: "4px 10px 6px 30px", fontSize: 10.5, color: "var(--ink-4)" }}>no agents — spawn one</div>
          )}
        </div>
      )}
    </div>
  );
}

function NavRow({ icon, label, active, onClick, badge }) {
  return (
    <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 9, padding: "7px 9px", borderRadius: "var(--r-md)", cursor: "pointer", position: "relative",
      background: active ? "var(--panel-3)" : "transparent", border: "1px solid " + (active ? "var(--hair-2)" : "transparent") }}
      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
      {active && <span style={{ position: "absolute", left: -8, top: 7, bottom: 7, width: 2.5, borderRadius: 3, background: "var(--ui-ind)" }} />}
      <Icon name={icon} size="sm" style={{ color: active ? "var(--ui-ink)" : "var(--ink-3)" }} />
      <span style={{ fontSize: 12.5, fontWeight: 600, color: active ? "var(--ink)" : "var(--ink-2)" }}>{label}</span>
      {badge > 0 && <span className="chip tnum" style={{ marginLeft: "auto", fontSize: 9, padding: "0 6px" }}>{badge}</span>}
    </div>
  );
}

function Sidebar({ projects, agents, activeAgent, onOpen, onContext, onProjectContext, onSpawn, onAddProject, query, setQuery, onToggleCompact, loading, onReload, view, onNav, openTicketCount }) {
  const [collapsed, setCollapsed] = useStateS({});
  const toggle = (id) => setCollapsed((c) => ({ ...c, [id]: !c[id] }));

  const q = query.toLowerCase();
  const matches = (a) => !q || a.name.toLowerCase().includes(q) || a.task.toLowerCase().includes(q);

  const totalRunning = agents.filter((a) => a.status === "running").length;

  return (
    <aside style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel)", borderRight: "1px solid var(--hair)" }}>
      {onNav && (
        <div style={{ padding: 8, borderBottom: "1px solid var(--hair)", display: "flex", flexDirection: "column", gap: 2 }}>
          <NavRow icon="layers" label="Orchestrator" active={view === "orchestrator"} onClick={() => onNav("orchestrator")} />
          <NavRow icon="columns" label="Backlog" active={view === "backlog"} onClick={() => onNav("backlog")} badge={openTicketCount} />
        </div>
      )}
      <div style={{ padding: "10px 12px 8px", borderBottom: "1px solid var(--hair)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
          <Icon name="layers" size="sm" style={{ color: "var(--ui-ink)" }} />
          <span className="up" style={{ fontSize: 9.5, color: "var(--ink-3)" }}>Projects</span>
          {loading
            ? <span className="skel" style={{ width: 16, height: 13, borderRadius: 999 }} />
            : <span className="chip tnum" style={{ fontSize: 9, padding: "0 6px" }}>{projects.length}</span>}
          <span className="chip tnum" style={{ marginLeft: "auto", fontSize: 9, padding: "1px 6px" }}>
            <span className="dot running" style={{ background: "var(--st-running)", width: 6, height: 6 }} />{totalRunning}/5
          </span>
          {onReload && (
            <button className="pane-btn" onClick={() => !loading && onReload()} title="Refresh projects" disabled={loading}>
              <Icon name="refresh" size="sm" style={{ width: 13, height: 13, animation: loading ? "spin 0.8s linear infinite" : "none" }} />
            </button>
          )}
          <button className="pane-btn" onClick={onToggleCompact} title="Collapse sidebar">
            <Icon name="panelLeft" size="sm" style={{ width: 14, height: 14 }} />
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "5px 8px", background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)" }}>
          <Icon name="search" size="sm" style={{ color: "var(--ink-4)" }} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="filter agents…"
            style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5 }} />
          {query && <Icon name="x" size="sm" style={{ color: "var(--ink-4)", cursor: "pointer" }} onClick={() => setQuery("")} />}
        </div>
      </div>

      <div className="scroll-y" style={{ flex: 1, padding: "6px 0" }}>
        {loading ? <SidebarSkeleton groups={3} /> : projects.map((p) => {
          const pa = agents.filter((a) => a.projectId === p.id && matches(a));
          if (q && !pa.length) return null;
          return (
            <ProjectGroup key={p.id} project={p} agents={pa} activeAgent={activeAgent}
              onOpen={onOpen} onContext={onContext} onProjectContext={onProjectContext}
              onSpawn={onSpawn} collapsed={!!collapsed[p.id]} toggle={toggle} />
          );
        })}
      </div>

      <div style={{ padding: 10, borderTop: "1px solid var(--hair)", display: "flex", gap: 8 }}>
        <button className="btn ghost-hair" onClick={onAddProject} style={{ flex: 1, justifyContent: "center" }}>
          <Icon name="folder" size="sm" />Add project
        </button>
        <button className="btn primary" onClick={() => onSpawn(null)} title="Spawn agent" style={{ padding: "5px 11px" }}>
          <Icon name="bolt" size="sm" />Spawn
        </button>
      </div>
    </aside>
  );
}

// ---------- compact rail ----------
function RailPopover({ project, agents, top, onOpen, onContext, onSpawn, onKeep, onLeave }) {
  const vh = window.innerHeight;
  const t = Math.min(top, vh - Math.min(60 + agents.length * 32, 320) - 40);
  return (
    <div className="rise" onMouseOver={onKeep} onMouseLeave={onLeave}
      style={{ position: "fixed", left: 52, top: Math.max(48, t), zIndex: 60, width: 236,
        background: "var(--elev)", border: "1px solid var(--hair-2)", borderRadius: "var(--r-md)", boxShadow: "var(--shadow)", overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 11px", borderBottom: "1px solid var(--hair)" }}>
        <span style={{ width: 17, height: 17, flex: "none", borderRadius: 5, display: "grid", placeItems: "center",
          background: "color-mix(in oklch, " + project.color + ", transparent 82%)", border: "1px solid color-mix(in oklch, " + project.color + ", transparent 62%)" }}>
          <Icon name={project.icon} size="sm" style={{ width: 11, height: 11, color: project.color }} />
        </span>
        <span style={{ fontSize: 12, fontWeight: 600 }}>{project.name}</span>
        <span className="tnum" style={{ marginLeft: "auto", fontSize: 9.5, color: "var(--ink-4)" }}>{agents.length}</span>
        <button className="pane-btn" onClick={() => onSpawn(project.id)} title="Spawn agent"><Icon name="bolt" size="sm" style={{ width: 13, height: 13 }} /></button>
      </div>
      <div style={{ padding: 5, maxHeight: 280, overflowY: "auto" }}>
        {agents.length ? agents.map((ag) => (
          <div key={ag.id} onClick={() => onOpen(ag.id)} onContextMenu={(e) => onContext(e, ag.id)}
            draggable
            onDragStart={(e) => { window.__omDrag = { kind: "agent", id: ag.id, agentId: ag.id }; e.dataTransfer.effectAllowed = "copy"; try { e.dataTransfer.setData("text/plain", ag.name); } catch (_) {} }}
            onDragEnd={() => { window.__omDrag = null; }}
            style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 8px", borderRadius: 6, cursor: "pointer" }}
            onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"}
            onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
            <StatusDot status={ag.status} />
            <span style={{ flex: 1, fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ag.name}</span>
            {(ag.status === "blocked" || (ag.pending && ag.pending.length)) && <span style={{ width: 5, height: 5, borderRadius: "50%", background: "var(--st-blocked)" }} />}
            <ToolBadge tool={ag.tool} size={13} />
          </div>
        )) : <div style={{ padding: "8px 10px", fontSize: 10.5, color: "var(--ink-4)" }}>no agents — spawn one</div>}
      </div>
    </div>
  );
}

function CompactRail({ projects, agents, activeAgent, onOpen, onContext, onProjectContext, onSpawn, onAddProject, onExpand, loading, view, onNav, openTicketCount }) {
  const [hover, setHover] = useStateS(null); // { id, top }
  const timer = useRefS(null);
  const enter = (id, el) => { clearTimeout(timer.current); setHover({ id, top: el.getBoundingClientRect().top }); };
  const leave = () => { timer.current = setTimeout(() => setHover(null), 130); };
  const keep = () => clearTimeout(timer.current);
  const activeProj = activeAgent ? (agents.find((a) => a.id === activeAgent) || {}).projectId : null;
  const hoverProj = hover ? projects.find((p) => p.id === hover.id) : null;
  return (
    <aside style={{ display: "flex", flexDirection: "column", alignItems: "center", minHeight: 0, width: 54, background: "var(--panel)", borderRight: "1px solid var(--hair)", padding: "8px 0", gap: 4, position: "relative" }}>
      <button className="rail-btn" onClick={onExpand} title="Expand sidebar" style={{ marginBottom: 2 }}>
        <Icon name="panelLeft" size="sm" style={{ color: "var(--ui-ink)" }} />
      </button>
      {onNav && (
        <React.Fragment>
          <button className="rail-btn" onClick={() => onNav("orchestrator")} title="Orchestrator"
            style={{ background: view === "orchestrator" ? "var(--ui-sel)" : "transparent", border: "1px solid " + (view === "orchestrator" ? "var(--ui-line)" : "transparent") }}>
            <Icon name="grid" size="sm" style={{ color: view === "orchestrator" ? "var(--ui-ink)" : "var(--ink-3)" }} />
          </button>
          <div className="rail-item">
            <button className="rail-btn" onClick={() => onNav("backlog")} title="Backlog"
              style={{ background: view === "backlog" ? "var(--ui-sel)" : "transparent", border: "1px solid " + (view === "backlog" ? "var(--ui-line)" : "transparent") }}>
              <Icon name="columns" size="sm" style={{ color: view === "backlog" ? "var(--ui-ink)" : "var(--ink-3)" }} />
              {openTicketCount > 0 && <span style={{ position: "absolute", top: 2, right: 2, minWidth: 13, height: 13, padding: "0 3px", borderRadius: 7, background: "var(--ui-fill)", color: "var(--ui-on-fill)", fontSize: 8, fontWeight: 700, display: "grid", placeItems: "center", border: "2px solid var(--panel)" }} className="tnum">{openTicketCount}</span>}
            </button>
          </div>
        </React.Fragment>
      )}
      <div style={{ width: 24, height: 1, background: "var(--hair)", margin: "2px 0 4px" }} />
      <div className="scroll-y" style={{ flex: 1, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
        {loading
          ? Array.from({ length: 4 }).map((_, i) => <span key={i} className="skel" style={{ width: 30, height: 30, borderRadius: 8 }} />)
          : projects.map((p) => {
          const pa = agents.filter((a) => a.projectId === p.id);
          const running = pa.filter((a) => a.status === "running").length;
          const needs = pa.filter((a) => a.status === "blocked" || (a.pending && a.pending.length)).length;
          const isActive = activeProj === p.id;
          return (
            <div key={p.id} className="rail-item" onMouseOver={(e) => enter(p.id, e.currentTarget)} onMouseLeave={leave}>
              <button className="rail-btn" onClick={() => pa[0] && onOpen(pa[0].id)} onContextMenu={(e) => onProjectContext(e, p.id)} onFocus={(e) => enter(p.id, e.currentTarget.parentNode)}
                style={{ borderColor: isActive ? "color-mix(in oklch, " + p.color + ", transparent 50%)" : "transparent",
                  background: isActive ? "color-mix(in oklch, " + p.color + ", transparent 86%)" : ((hover && hover.id === p.id) ? "var(--panel-2)" : "transparent") }}>
                <span style={{ width: 22, height: 22, borderRadius: 6, display: "grid", placeItems: "center",
                  background: "color-mix(in oklch, " + p.color + ", transparent 84%)", border: "1px solid color-mix(in oklch, " + p.color + ", transparent 60%)" }}>
                  <Icon name={p.icon} size="sm" style={{ width: 13, height: 13, color: p.color }} />
                </span>
                {running > 0 && <span className="dot running" style={{ position: "absolute", top: 3, right: 3, width: 7, height: 7, background: "var(--st-running)" }} />}
                {needs > 0 && <span style={{ position: "absolute", top: 2, right: 2, minWidth: 13, height: 13, padding: "0 3px", borderRadius: 7, background: "var(--st-blocked)", color: "var(--on-solid)", fontSize: 8, fontWeight: 700, display: "grid", placeItems: "center", border: "2px solid var(--panel)" }} className="tnum">{needs}</span>}
              </button>
            </div>
          );
        })}
      </div>
      <div style={{ width: 24, height: 1, background: "var(--hair)", margin: "4px 0" }} />
      <button className="rail-btn" onClick={onAddProject} title="Add project"><Icon name="folder" size="sm" style={{ color: "var(--ink-3)" }} /></button>
      <button className="rail-btn" onClick={() => onSpawn(null)} title="Spawn agent"
        style={{ background: "var(--ui-sel)", border: "1px solid var(--ui-sel-2)" }}>
        <Icon name="bolt" size="sm" style={{ color: "var(--ui-ink)" }} />
      </button>
      {hoverProj && <RailPopover project={hoverProj} agents={agents.filter((a) => a.projectId === hoverProj.id)} top={hover.top}
        onOpen={onOpen} onContext={onContext} onSpawn={onSpawn} onKeep={keep} onLeave={leave} />}
    </aside>
  );
}

Object.assign(window, { Sidebar, CompactRail });

</script>

<!-- overview.jsx -->
<script type="text/babel">
/* global React, Icon, StatusDot, StatusPill, STATUS_META, Ring, fmtDur, fileName, PROJECTS, ORG, LOGS, logColor, logPrefix */
// ORCHESTRA center — Orchestrator overview (hero) with 4 visualization metaphors

const { useState: useStateO } = React;

function StatBlock({ n, label, color, pulse }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 2, paddingRight: 20 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <span className="disp tnum" style={{ fontSize: 24, fontWeight: 600, color: color || "var(--ink)", lineHeight: 1 }}>{n}</span>
        {pulse && <span className="dot running" style={{ background: color }} />}
      </div>
      <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>{label}</span>
    </div>
  );
}

function MiniTerm({ id }) {
  const lines = (LOGS[id] || []).slice(-3);
  return (
    <div style={{
      background: "var(--bg)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)",
      padding: "6px 8px", fontSize: 10, lineHeight: 1.6, overflow: "hidden",
    }}>
      {lines.length ? lines.map((l, i) => (
        <div key={i} style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: logColor(l.t) }}>
          <span style={{ color: "var(--ink-4)", marginRight: 5 }}>{logPrefix(l.t)}</span>{l.s}
        </div>
      )) : <span style={{ color: "var(--ink-4)" }}>no output yet</span>}
    </div>
  );
}

function AgentCard({ ag, proj, onOpen, onAct, asleep, onSleep }) {
  const m = STATUS_META[ag.status];
  const totAdd = ag.files.reduce((s, f) => s + f.add, 0);
  const totDel = ag.files.reduce((s, f) => s + f.del, 0);
  return (
    <div className="surface rise" onClick={() => onOpen(ag.id)}
      style={{
        padding: 14, display: "flex", flexDirection: "column", gap: 11, cursor: "pointer",
        transition: "border-color 0.15s, transform 0.15s",
      }}
      onMouseEnter={(e) => { e.currentTarget.style.borderColor = "var(--hair-2)"; e.currentTarget.style.transform = "translateY(-2px)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.borderColor = "var(--hair)"; e.currentTarget.style.transform = "none"; }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
        <div style={{ position: "relative", flex: "none" }}>
          <Ring value={ag.progress} size={36} stroke={3} color={m.color} />
          <span style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", fontSize: 9, color: "var(--ink-2)" }} className="tnum">
            {Math.round(ag.progress * 100)}
          </span>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
            <span className="disp" style={{ fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", flex: "0 1 auto" }}>{ag.name}</span>
            <span style={{ flex: "none" }}><StatusPill status={ag.status} filled /></span>
          </div>
          <div style={{ fontSize: 11, color: "var(--ink-3)", marginTop: 2, display: "flex", gap: 6, alignItems: "center", minWidth: 0 }}>
            {proj && <span style={{ display: "flex", alignItems: "center", gap: 4, color: proj.color, minWidth: 0, overflow: "hidden" }}>
              <Icon name={proj.icon} size="sm" style={{ width: 11, height: 11, flex: "none" }} /><span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{proj.name}</span>
            </span>}
            <span style={{ color: "var(--ink-4)", flex: "none" }}>·</span>
            <Icon name="branch" size="sm" style={{ width: 11, height: 11, flex: "none" }} /><span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ag.branch.replace("agent/", "")}</span>
          </div>
        </div>
      </div>

      <p style={{ fontSize: 12, color: "var(--ink-2)", lineHeight: 1.5, textWrap: "pretty", minHeight: 34 }}>
        {ag.task}
      </p>

      {ag.status === "blocked" && (
        <div style={{ display: "flex", gap: 7, padding: "7px 9px", borderRadius: "var(--r-sm)",
          background: "color-mix(in oklch, var(--st-blocked), transparent 90%)",
          border: "1px solid color-mix(in oklch, var(--st-blocked), transparent 70%)" }}>
          <Icon name="flag" size="sm" style={{ color: "var(--st-blocked)", flex: "none", marginTop: 1 }} />
          <span style={{ fontSize: 11, color: "var(--code-del-ink)", lineHeight: 1.45 }}>{ag.blockReason}</span>
        </div>
      )}

      <MiniTerm id={ag.id} />

      <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 10.5, color: "var(--ink-3)" }} className="tnum">
        <span style={{ display: "flex", gap: 4 }}><Icon name="file" size="sm" style={{ width: 11, height: 11 }} />{ag.files.length}</span>
        <span style={{ color: "var(--code-add-ink)" }}>+{totAdd}</span>
        <span style={{ color: "var(--code-del-ink)" }}>−{totDel}</span>
        <span style={{ display: "flex", gap: 4 }}><Icon name="commit" size="sm" style={{ width: 11, height: 11 }} />{ag.commits}</span>
        {window.AgentCostChip && <span onClick={(e) => e.stopPropagation()}><window.AgentCostChip agent={ag} /></span>}
        <span style={{ marginLeft: "auto", display: "flex", gap: 4, color: "var(--ink-4)" }}>
          <Icon name="clock" size="sm" style={{ width: 11, height: 11 }} />{ag.elapsed ? fmtDur(ag.elapsed) : "—"}
        </span>
      </div>

      <div style={{ display: "flex", gap: 6 }} onClick={(e) => e.stopPropagation()}>
        {ag.status === "done"
          ? <button className="btn primary" style={{ flex: 1, justifyContent: "center" }} onClick={() => onAct(ag.id, "merge")}>
              <Icon name="merge" size="sm" />Merge</button>
          : ag.status === "blocked"
          ? <button className="btn primary" style={{ flex: 1, justifyContent: "center" }} onClick={() => onOpen(ag.id)}>
              <Icon name="chat" size="sm" />Answer</button>
          : ag.status === "queued"
          ? <button className="btn ghost-hair" style={{ flex: 1, justifyContent: "center" }} onClick={() => onAct(ag.id, "start")}>
              <Icon name="play" size="sm" />Start now</button>
          : <button className="btn ghost-hair" style={{ flex: 1, justifyContent: "center" }} onClick={() => onAct(ag.id, ag.status === "running" ? "pause" : "resume")}>
              <Icon name={ag.status === "running" ? "pause" : "play"} size="sm" />{ag.status === "running" ? "Pause" : "Resume"}</button>}
        <button className="btn ghost-hair" onClick={() => onSleep && onSleep(ag.id)} style={{ padding: "5px 9px", color: asleep ? "var(--ui-ink)" : "var(--ink-3)" }}
          title={asleep ? "Wake — recreate the terminal and replay its scrollback ring" : "Sleep — disposes the xterm + WebGL context, frees ~6 MB (the Rust ring keeps the output)"}>
          <Icon name="moon" size="sm" />{asleep ? "Wake" : "Sleep"}
        </button>
        <button className="btn ghost-hair" onClick={() => onOpen(ag.id)} style={{ padding: "5px 9px" }}>
          <Icon name="terminal" size="sm" />Open
        </button>
      </div>
    </div>
  );
}

function GridView({ agents, projects, onOpen, onAct, asleep, onSleep }) {
  return (
    <div style={{
      display: "grid", gap: 14, padding: 18,
      gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", alignContent: "start",
    }}>
      {agents.map((ag) => <AgentCard key={ag.id} ag={ag} proj={projects.find((p) => p.id === ag.projectId)} onOpen={onOpen} onAct={onAct} asleep={!!(asleep && asleep[ag.id])} onSleep={onSleep} />)}
    </div>
  );
}

function KanbanView({ agents, onOpen }) {
  const cols = [
    { key: "queued", label: "Queued" },
    { key: "running", label: "Running" },
    { key: "blocked", label: "Needs you", alt: "waiting" },
    { key: "done", label: "Done" },
  ];
  const colItems = (c) => agents.filter((a) => a.status === c.key || a.status === c.alt);
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, padding: 18, alignItems: "start", minHeight: 0 }}>
      {cols.map((c) => {
        const items = colItems(c);
        const color = STATUS_META[c.key].color;
        return (
          <div key={c.key} style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "0 2px 4px", borderBottom: "2px solid " + color }}>
              <span className="up" style={{ fontSize: 10, color: "var(--ink-2)" }}>{c.label}</span>
              <span className="chip tnum" style={{ marginLeft: "auto", fontSize: 9.5, padding: "0px 6px" }}>{items.length}</span>
            </div>
            {items.map((ag) => {
              const totAdd = ag.files.reduce((s, f) => s + f.add, 0);
              return (
                <div key={ag.id} className="surface rise" onClick={() => onOpen(ag.id)}
                  style={{ padding: 11, cursor: "pointer", display: "flex", flexDirection: "column", gap: 7 }}
                  onMouseEnter={(e) => e.currentTarget.style.borderColor = "var(--hair-2)"}
                  onMouseLeave={(e) => e.currentTarget.style.borderColor = "var(--hair)"}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                    <StatusDot status={ag.status} />
                    <span className="disp" style={{ fontSize: 12.5, fontWeight: 600 }}>{ag.name}</span>
                  </div>
                  <span style={{ fontSize: 11, color: "var(--ink-2)", lineHeight: 1.45, textWrap: "pretty" }}>{ag.task}</span>
                  {ag.status === "running" && <div className="activity" />}
                  <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 10, color: "var(--ink-3)" }} className="tnum">
                    <Icon name="branch" size="sm" style={{ width: 10, height: 10 }} />
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ag.branch.replace("agent/", "")}</span>
                    <span style={{ marginLeft: "auto", color: "var(--code-add-ink)" }}>+{totAdd}</span>
                  </div>
                </div>
              );
            })}
            {!items.length && <div style={{ padding: 14, textAlign: "center", color: "var(--ink-4)", fontSize: 10.5, border: "1px dashed var(--hair)", borderRadius: "var(--r-md)" }}>empty</div>}
          </div>
        );
      })}
    </div>
  );
}

function GraphView({ agents, projects, onOpen }) {
  // left→right hierarchy: orchestrator → projects → agents
  const rowH = 50, W = 780;
  const xRoot = 54, xProj = 250, xAgent = 470;
  let y = 26;
  const laid = projects.map((p) => {
    const ags = agents.filter((a) => a.projectId === p.id);
    const count = Math.max(ags.length, 1);
    const top = y;
    const agentNodes = ags.map((ag, i) => ({ ag, y: top + i * rowH + rowH / 2 }));
    const projY = top + (count * rowH) / 2;
    y += count * rowH + 18;
    return { p, projY, agentNodes };
  });
  const H = y + 8;
  const rootY = H / 2;

  return (
    <div style={{ padding: 18, display: "grid", placeItems: "center", minHeight: 0, overflow: "auto" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", maxWidth: 920, height: "auto" }}>
        <defs>
          <radialGradient id="core" cx="50%" cy="50%">
            <stop offset="0" stopColor="var(--ui-ink)" stopOpacity="0.4" />
            <stop offset="1" stopColor="var(--ui-ink)" stopOpacity="0" />
          </radialGradient>
        </defs>
        {/* root → project edges */}
        {laid.map(({ p, projY }, i) => (
          <path key={"e" + i} d={`M${xRoot + 22},${rootY} C${(xRoot + xProj) / 2},${rootY} ${(xRoot + xProj) / 2},${projY} ${xProj - 18},${projY}`}
            fill="none" stroke={p.color} strokeWidth="1.6" strokeOpacity="0.5" />
        ))}
        {/* project → agent edges */}
        {laid.map(({ p, projY, agentNodes }) => agentNodes.map((n, j) => {
          const c = STATUS_META[n.ag.status].color;
          const run = n.ag.status === "running";
          return (
            <path key={p.id + j} d={`M${xProj + 16},${projY} C${(xProj + xAgent) / 2},${projY} ${(xProj + xAgent) / 2},${n.y} ${xAgent - 10},${n.y}`}
              fill="none" stroke={c} strokeWidth="1.4" strokeOpacity={n.ag.status === "queued" ? 0.22 : 0.5}
              strokeDasharray={run ? "4 4" : "none"}>
              {run && <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.7s" repeatCount="indefinite" />}
            </path>
          );
        }))}
        {/* root node */}
        <circle cx={xRoot} cy={rootY} r="40" fill="url(#core)" />
        <circle cx={xRoot} cy={rootY} r="20" fill="var(--panel-3)" stroke="var(--ui-ink)" strokeWidth="1.6" />
        <text x={xRoot} y={rootY + 1} textAnchor="middle" fontFamily="var(--font-disp)" fontSize="9" fontWeight="700" fill="var(--ink)">ORCH</text>
        <text x={xRoot} y={rootY + 36} textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--ink-3)">{ORG}</text>
        {/* project nodes */}
        {laid.map(({ p, projY }) => (
          <g key={p.id}>
            <rect x={xProj - 16} y={projY - 16} width="32" height="32" rx="9" fill="var(--panel-3)" stroke={p.color} strokeWidth="1.6" />
            <text x={xProj} y={projY + 5} textAnchor="middle" fontFamily="var(--font-disp)" fontSize="13" fontWeight="700" fill={p.color}>{p.name[0].toUpperCase()}</text>
            <text x={xProj + 26} y={projY - 2} fontFamily="var(--font-disp)" fontSize="12" fontWeight="600" fill="var(--ink)">{p.name}</text>
            <text x={xProj + 26} y={projY + 11} fontFamily="var(--font-mono)" fontSize="9" fill="var(--ink-3)">{p.branch} · {p.head}</text>
          </g>
        ))}
        {/* agent nodes */}
        {laid.map(({ agentNodes }) => agentNodes.map((n) => {
          const c = STATUS_META[n.ag.status].color;
          return (
            <g key={n.ag.id} style={{ cursor: "pointer" }} onClick={() => onOpen(n.ag.id)}>
              <circle cx={xAgent} cy={n.y} r="8" fill="var(--panel-3)" stroke={c} strokeWidth="2" />
              <circle cx={xAgent} cy={n.y} r="3.2" fill={c}>
                {n.ag.status === "running" && <animate attributeName="r" values="3.2;5;3.2" dur="1.4s" repeatCount="indefinite" />}
              </circle>
              <text x={xAgent + 16} y={n.y - 1} fontFamily="var(--font-disp)" fontSize="12" fontWeight="600" fill="var(--ink)">{n.ag.name}</text>
              <text x={xAgent + 16} y={n.y + 12} fontFamily="var(--font-mono)" fontSize="9" fill="var(--ink-3)">{STATUS_META[n.ag.status].label} · {n.ag.commits}c · {n.ag.branch.replace("agent/", "")}</text>
            </g>
          );
        }))}
        {/* empty projects */}
        {laid.filter(({ agentNodes }) => !agentNodes.length).map(({ p, projY }) => (
          <text key={"empty" + p.id} x={xAgent} y={projY + 4} fontFamily="var(--font-mono)" fontSize="10" fill="var(--ink-4)">no agents</text>
        ))}
      </svg>
    </div>
  );
}

function TimelineView({ agents, onOpen }) {
  const maxEl = Math.max(...agents.map((a) => a.elapsed), 1);
  return (
    <div style={{ padding: 18, display: "flex", flexDirection: "column", gap: 2 }}>
      <div style={{ display: "grid", gridTemplateColumns: "150px 1fr 70px", gap: 12, padding: "0 4px 8px", fontSize: 9.5 }} className="up">
        <span style={{ color: "var(--ink-3)" }}>Agent</span>
        <span style={{ color: "var(--ink-3)" }}>Elapsed · progress</span>
        <span style={{ color: "var(--ink-3)", textAlign: "right" }}>Commits</span>
      </div>
      {agents.map((ag) => {
        const c = STATUS_META[ag.status].color;
        const w = (ag.elapsed / maxEl) * 100;
        return (
          <div key={ag.id} onClick={() => onOpen(ag.id)}
            style={{ display: "grid", gridTemplateColumns: "150px 1fr 70px", gap: 12, alignItems: "center",
              padding: "9px 4px", cursor: "pointer", borderRadius: "var(--r-sm)", borderBottom: "1px solid var(--hair)" }}
            onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"}
            onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
              <StatusDot status={ag.status} />
              <span className="disp" style={{ fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ag.name}</span>
            </div>
            <div style={{ position: "relative", height: 22, display: "flex", alignItems: "center" }}>
              <div style={{ position: "absolute", left: 0, height: 9, width: Math.max(w, 3) + "%",
                borderRadius: 5, background: "color-mix(in oklch, " + c + ", transparent 55%)",
                border: "1px solid " + c, overflow: "hidden" }}>
                <div style={{ height: "100%", width: (ag.progress * 100) + "%", background: c, opacity: 0.5 }} />
                {ag.status === "running" && <div className="activity" style={{ position: "absolute", inset: 0, background: "transparent" }} />}
              </div>
              <span className="tnum" style={{ position: "absolute", left: "calc(" + Math.max(w, 3) + "% + 8px)", fontSize: 10, color: "var(--ink-3)", whiteSpace: "nowrap" }}>
                {ag.elapsed ? fmtDur(ag.elapsed) : "—"} · {Math.round(ag.progress * 100)}%
              </span>
            </div>
            <span className="tnum" style={{ textAlign: "right", fontSize: 11, color: "var(--ink-2)" }}>{ag.commits}</span>
          </div>
        );
      })}
    </div>
  );
}

function Overview({ agents, projects, viz, setViz, onOpen, onAct, onSpawn, loading, asleep, onSleep }) {
  const count = (s) => agents.filter((a) => a.status === s).length;
  const VIZ = [
    { key: "grid", icon: "grid", label: "Grid" },
    { key: "kanban", icon: "columns", label: "Board" },
    { key: "graph", icon: "graph", label: "Graph" },
    { key: "timeline", icon: "timeline", label: "Timeline" },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel-2)" }}>
      {/* stat header */}
      <div style={{ display: "flex", alignItems: "center", gap: 0, padding: "14px 18px",
        borderBottom: "1px solid var(--hair)", background: "var(--panel)" }}>
        <div style={{ marginRight: 24 }}>
          <h1 className="disp" style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-0.02em" }}>Orchestrator</h1>
          {loading
            ? <span className="skel" style={{ width: 220, height: 11, borderRadius: 3, marginTop: 4 }} />
            : <span style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{agents.length} agents across {projects.length} projects · {ORG}</span>}
        </div>
        {loading
          ? ["Running", "Need you", "Waiting", "Done"].map((label) => (
              <div key={label} style={{ display: "flex", flexDirection: "column", gap: 5, paddingRight: 20 }}>
                <span className="skel" style={{ width: 26, height: 22, borderRadius: 5 }} />
                <span className="skel" style={{ width: 40, height: 8, borderRadius: 3 }} />
              </div>
            ))
          : <React.Fragment>
              <StatBlock n={count("running")} label="Running" color="var(--st-running)" pulse />
              <StatBlock n={count("blocked")} label="Need you" color="var(--st-blocked)" />
              <StatBlock n={count("waiting") + count("queued")} label="Waiting" color="var(--st-waiting)" />
              <StatBlock n={count("done")} label="Done" color="var(--st-done)" />
            </React.Fragment>}
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          {/* viz switcher */}
          <div style={{ display: "flex", gap: 2, padding: 3, background: "var(--panel-2)", borderRadius: "var(--r-md)", border: "1px solid var(--hair)" }}>
            {VIZ.map((v) => (
              <button key={v.key} className="btn" onClick={() => setViz(v.key)}
                style={{ padding: "4px 9px", borderRadius: "var(--r-sm)",
                  background: viz === v.key ? "var(--panel-3)" : "transparent",
                  color: viz === v.key ? "var(--ink)" : "var(--ink-3)",
                  boxShadow: viz === v.key ? "0 0 0 1px var(--hair-2)" : "none" }}>
                <Icon name={v.icon} size="sm" style={{ color: viz === v.key ? "var(--ui-ink)" : "inherit" }} />
                {v.label}
              </button>
            ))}
          </div>
          <button className="btn primary" onClick={onSpawn}><Icon name="bolt" size="sm" />Spawn</button>
        </div>
      </div>

      {/* body */}
      <div className="scroll-y" style={{ flex: 1 }}>
        {loading
          ? <OverviewSkeleton count={6} />
          : <React.Fragment>
              {viz === "grid" && <GridView agents={agents} projects={projects} onOpen={onOpen} onAct={onAct} asleep={asleep} onSleep={onSleep} />}
              {viz === "kanban" && <KanbanView agents={agents} onOpen={onOpen} />}
              {viz === "graph" && <GraphView agents={agents} projects={projects} onOpen={onOpen} />}
              {viz === "timeline" && <TimelineView agents={agents} onOpen={onOpen} />}
            </React.Fragment>}
      </div>
    </div>
  );
}

Object.assign(window, { Overview });

</script>

<!-- workspace.jsx -->
<script type="text/babel">
/* global React, Icon, StatusDot, StatusPill, STATUS_META, ToolBadge, toolMeta, fmtDur, fileName, fileDir, logColor, logPrefix, getFileLines, highlight, langOf, buildTree, DIFFS, FileBlameGutter, AgentGitView, HunkRows, AddDel */
// ORCHESTRA center — single-agent workspace: diff / file viewer / terminal

const { useState: useStateW, useRef: useRefW, useEffect: useEffectW } = React;

function Terminal({ ag, lines, streaming }) {
  const ref = useRefW(null);
  useEffectW(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [lines]);
  return (
    <div ref={ref} className="scroll-y mono" style={{ flex: 1, background: "var(--bg)", padding: "12px 16px", fontSize: 12, lineHeight: 1.7 }}>
      <div style={{ color: "var(--ink-4)", marginBottom: 8, fontSize: 10.5 }}>── session: {ag.worktree} · {ag.branch} ──</div>
      {lines.map((l, i) => (
        <div key={i} style={{ display: "flex", gap: 9, color: logColor(l.t), whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
          <span style={{ color: l.t === "cmd" ? "var(--ink-2)" : "var(--ink-4)", flex: "none", userSelect: "none", width: 10, textAlign: "center" }}>{logPrefix(l.t)}</span>
          <span style={{ flex: 1 }}>{l.s}</span>
        </div>
      ))}
      {streaming && (
        <div style={{ display: "flex", gap: 9, color: "var(--st-running)" }}>
          <span style={{ width: 10, textAlign: "center", color: "var(--st-running)" }}>$</span>
          <span className="caret" />
        </div>
      )}
    </div>
  );
}

// ---------- file viewer (line-numbered + blame/annotate gutter) ----------
function FileViewer({ path, agent, onOpenCommit }) {
  const [blame, setBlame] = useStateW(false);
  const lines = getFileLines(path, agent);
  const lang = langOf(path);
  const changed = (agent.files || []).find((f) => f.path === path);
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, background: "var(--bg)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", fontSize: 11.5, flex: "none" }}>
        <Icon name="file" size="sm" style={{ color: changed ? (changed.state === "A" ? "var(--vcs-added)" : "var(--vcs-modified)") : "var(--ink-3)" }} />
        <span style={{ color: "var(--ink-4)" }}>{fileDir(path)}</span><span style={{ marginLeft: -6 }}>{fileName(path)}</span>
        {changed && <span className="chip" style={{ fontSize: 9, padding: "1px 6px", color: changed.state === "A" ? "var(--vcs-added)" : "var(--vcs-modified)" }}>{changed.state === "A" ? "added" : "modified"} +{changed.add}{changed.del ? " −" + changed.del : ""}</span>}
        <button className={"btn " + (blame ? "" : "ghost-hair")} onClick={() => setBlame((v) => !v)} title="Toggle blame / annotate"
          style={{ marginLeft: "auto", padding: "4px 9px", fontSize: 10.5, color: blame ? "var(--ink)" : "var(--ink-3)",
            background: blame ? "var(--ui-sel)" : "transparent",
            border: "1px solid " + (blame ? "var(--ui-sel-2)" : "var(--hair)") }}>
          <Icon name="git" size="sm" style={{ color: blame ? "var(--ui-ink)" : "inherit" }} />Annotate
        </button>
        <span className="chip" style={{ fontSize: 9.5 }}>{lang}</span>
        <span className="tnum" style={{ fontSize: 9.5, color: "var(--ink-4)" }}>{lines.length} lines</span>
      </div>
      {blame
        ? <FileBlameGutter agent={agent} path={path} onOpenCommit={onOpenCommit} />
        : <ReviewCode agentId={agent.id} file={path} view="file" rows={fileToRows(lines)} lang={lang} />}
    </div>
  );
}

// ---------- changed-files list (flat or tree), selectable ----------
function StateBadge({ state }) {
  return (
    <span style={{ flex: "none", width: 14, height: 14, borderRadius: 3, display: "grid", placeItems: "center", fontSize: 9, fontWeight: 700,
      color: state === "A" ? "var(--vcs-added)" : state === "D" ? "var(--vcs-deleted)" : "var(--vcs-modified)",
      background: state === "A" ? "color-mix(in oklch, var(--vcs-added), transparent 88%)" : state === "D" ? "transparent" : "color-mix(in oklch, var(--vcs-modified), transparent 88%)" }}>
      {state}
    </span>
  );
}

function TreeRows({ nodes, depth, selPath, onSelect, fileMap }) {
  return nodes.map((node) => {
    const pad = 8 + depth * 13;
    if (node.dir) {
      return (
        <div key={node.path}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 8px", paddingLeft: pad }}>
            <Icon name="folderOpen" size="sm" style={{ width: 13, height: 13, color: "var(--ink-4)", flex: "none" }} />
            <span style={{ fontSize: 11, color: "var(--ink-3)" }}>{node.name}</span>
          </div>
          <TreeRows nodes={node.children} depth={depth + 1} selPath={selPath} onSelect={onSelect} fileMap={fileMap} />
        </div>
      );
    }
    const f = fileMap[node.path];
    const active = selPath === node.path;
    return (
      <div key={node.path} onClick={() => onSelect(node.path)}
        style={{ display: "flex", alignItems: "center", gap: 7, padding: "4px 10px", paddingLeft: pad + 4, cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)", background: active ? "var(--panel-3)" : "transparent" }}
        onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
        onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
        <StateBadge state={node.state} />
        <span style={{ flex: 1, fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: active ? "var(--ink)" : "var(--ink-2)", textDecoration: node.state === "D" ? "line-through" : "none", opacity: node.state === "D" ? 0.7 : 1 }}>{node.name}</span>
        {f && <span className="tnum" style={{ fontSize: 9.5, display: "flex", gap: 4, flex: "none" }}>
          <span style={{ color: "var(--code-add-ink)" }}>+{f.add}</span>{f.del > 0 && <span style={{ color: "var(--code-del-ink)" }}>−{f.del}</span>}
        </span>}
      </div>
    );
  });
}

function ChangedFiles({ files, selPath, onSelect, mode }) {
  if (mode === "tree") {
    const stateMap = {}; const fileMap = {};
    files.forEach((f) => { stateMap[f.path] = f.state; fileMap[f.path] = f; });
    const tree = buildTree(files.map((f) => f.path), stateMap);
    return <TreeRows nodes={tree} depth={0} selPath={selPath} onSelect={onSelect} fileMap={fileMap} />;
  }
  return files.map((f) => {
    const active = selPath === f.path;
    return (
      <div key={f.path} onClick={() => onSelect(f.path)}
        style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)", background: active ? "var(--panel-3)" : "transparent" }}
        onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
        onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
        <StateBadge state={f.state} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "var(--ink)", textDecoration: f.state === "D" ? "line-through" : "none", opacity: f.state === "D" ? 0.7 : 1 }}>{fileName(f.path)}</div>
          {fileDir(f.path) && <div style={{ fontSize: 9.5, color: "var(--ink-4)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</div>}
        </div>
        <span className="tnum" style={{ fontSize: 9.5, display: "flex", gap: 4, flex: "none" }}>
          <span style={{ color: "var(--code-add-ink)" }}>+{f.add}</span>{f.del > 0 && <span style={{ color: "var(--code-del-ink)" }}>−{f.del}</span>}
        </span>
      </div>
    );
  });
}

// hunk/line selection over the agent's primary-file diff → partial commit/discard
function HunkSelectDiff({ diff, ag, onAct }) {
  const hi = (h) => diff.hunks.indexOf(h);
  const changedOf = (h) => h.lines.map((ln, li) => ({ ln, li })).filter((x) => x.ln.k !== " ");
  const [sel, setSel] = useStateW(() => { const s = {}; diff.hunks.forEach((h, j) => h.lines.forEach((ln, li) => { if (ln.k !== " ") s[j + ":" + li] = true; })); return s; });
  const hunkState = (h) => { const ch = changedOf(h); const on = ch.filter((x) => sel[hi(h) + ":" + x.li]).length; return on === 0 ? "none" : on === ch.length ? "all" : "some"; };
  const toggleLine = (h, li) => setSel((s) => ({ ...s, [hi(h) + ":" + li]: !s[hi(h) + ":" + li] }));
  const toggleHunk = (h) => { const want = hunkState(h) !== "all"; setSel((s) => { const n = { ...s }; changedOf(h).forEach((x) => { n[hi(h) + ":" + x.li] = want; }); return n; }); };
  let lineN = 0, hunkN = 0;
  diff.hunks.forEach((h) => { const on = changedOf(h).filter((x) => sel[hi(h) + ":" + x.li]).length; if (on) { hunkN++; lineN += on; } });
  const lead = {
    hunkHead: (h) => { const st = hunkState(h); return (
      <button onClick={(e) => { e.stopPropagation(); toggleHunk(h); }} title="Select hunk"
        style={{ flex: "none", width: 15, height: 15, marginRight: 9, borderRadius: 4, display: "grid", placeItems: "center", cursor: "pointer", border: "1px solid " + (st === "none" ? "var(--hair-2)" : "var(--ui-focus)"), background: st === "all" ? "var(--ui-fill)" : st === "some" ? "var(--ui-line)" : "transparent" }}>
        {st === "all" && <Icon name="check" size="sm" style={{ width: 10, height: 10, color: "var(--ui-on-fill)" }} />}
        {st === "some" && <span style={{ width: 7, height: 2, borderRadius: 2, background: "var(--ui-on-fill)" }} />}
      </button>); },
    lineHead: (h, ln, li) => { if (ln.k === " ") return <span style={{ width: 24, flex: "none" }} />; const on = sel[hi(h) + ":" + li]; return (
      <button onClick={(e) => { e.stopPropagation(); toggleLine(h, li); }}
        style={{ flex: "none", width: 14, height: 14, margin: "3px 10px 0 8px", borderRadius: 3, display: "grid", placeItems: "center", cursor: "pointer", border: "1px solid " + (on ? "var(--ui-focus)" : "var(--hair-2)"), background: on ? "var(--ui-fill)" : "transparent" }}>
        {on && <Icon name="check" size="sm" style={{ width: 9, height: 9, color: "var(--ui-on-fill)" }} />}
      </button>); },
  };
  const lineStyle = (h, ln, li) => { if (ln.k === " ") return "transparent"; return sel[hi(h) + ":" + li] ? (ln.k === "+" ? "var(--code-add-bg)" : "var(--code-del-bg)") : "transparent"; };
  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1, background: "var(--bg)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", fontSize: 11.5, flex: "none" }}>
        <Icon name="file" size="sm" style={{ color: "var(--ink-3)" }} />
        <span style={{ color: "var(--ink-4)" }}>{fileDir(diff.file)}</span><span style={{ marginLeft: -6 }}>{fileName(diff.file)}</span>
        <span className="chip" style={{ fontSize: 9, padding: "1px 6px", color: "var(--ui-ink)", borderColor: "var(--ui-line)" }}>partial commit</span>
        <span className="chip" style={{ marginLeft: "auto", fontSize: 9.5 }}>{diff.lang}</span>
      </div>
      <div className="scroll-y mono" style={{ flex: 1, minHeight: 0 }}>
        <HunkRows hunks={diff.hunks} lang={diff.lang} lead={lead} lineStyle={lineStyle} onLineClick={(h, ln, li) => ln.k !== " " && toggleLine(h, li)} />
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderTop: "1px solid var(--hair)", background: "var(--panel)", flex: "none" }}>
        <span style={{ fontSize: 11, color: "var(--ink)" }}><b className="tnum" style={{ color: "var(--ui-ink)" }}>{hunkN}</b> {hunkN === 1 ? "hunk" : "hunks"} selected</span>
        <span className="tnum" style={{ fontSize: 10, color: "var(--ink-4)" }}>{lineN} lines</span>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          <button className="btn ghost-hair" disabled={!hunkN} onClick={() => onAct(ag.id, "discard")} style={{ color: "var(--st-blocked)" }}><Icon name="discard" size="sm" />Discard selected</button>
          <button className="btn primary" disabled={!hunkN} onClick={() => onAct(ag.id, "commit")}><Icon name="commit" size="sm" />Commit {hunkN} {hunkN === 1 ? "hunk" : "hunks"}</button>
        </div>
      </div>
    </div>
  );
}

function DiffBody({ ag, path, partial, onAct, onOpenCommit }) {
  const diff = DIFFS[ag.id];
  // show the rich hunk diff for the agent's primary file; otherwise the file view
  if (diff && diff.file === path) {
    if (partial) return <HunkSelectDiff diff={diff} ag={ag} onAct={onAct} />;
    const stickyHeader = (
      <div style={{ position: "sticky", top: 0, display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: "var(--panel)", borderBottom: "1px solid var(--hair)", fontSize: 11.5, zIndex: 2 }}>
        <Icon name="file" size="sm" style={{ color: "var(--ink-3)" }} />
        <span style={{ color: "var(--ink-4)" }}>{fileDir(diff.file)}</span><span style={{ marginLeft: -6 }}>{fileName(diff.file)}</span>
        <span style={{ marginLeft: 8, fontSize: 9.5, color: "var(--ink-4)", display: "flex", alignItems: "center", gap: 4 }}><Icon name="chat" size="sm" style={{ width: 11, height: 11, color: "var(--ui-ink)" }} />hover a line to review</span>
        <span className="chip" style={{ marginLeft: "auto", fontSize: 9.5 }}>{diff.lang}</span>
      </div>
    );
    return <ReviewCode agentId={ag.id} file={diff.file} view="diff" rows={diffToRows(diff)} lang={diff.lang} sticky={stickyHeader} />;
  }
  return <FileViewer path={path} agent={ag} onOpenCommit={onOpenCommit} />;
}

// conflicted-file row inside the Diff pane's file list
function ConflictFileRow({ f, rc, active, onSelect }) {
  const done = rc === f.conflicts;
  return (
    <div onClick={() => onSelect(f.path)}
      style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer", margin: "1px 6px", borderRadius: "var(--r-sm)",
        background: active ? "var(--panel-3)" : "transparent", boxShadow: active ? "inset 0 0 0 1px color-mix(in oklch, var(--st-blocked), transparent 55%)" : "none" }}
      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "var(--panel-2)"; }}
      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}>
      <span style={{ flex: "none", width: 15, height: 15, borderRadius: "50%", display: "grid", placeItems: "center",
        background: done ? "var(--st-done)" : "color-mix(in oklch, var(--st-blocked), transparent 80%)", border: done ? "none" : "1px solid color-mix(in oklch, var(--st-blocked), transparent 50%)" }}>
        {done ? <Icon name="check" size="sm" style={{ width: 10, height: 10, color: "var(--ui-on-fill)" }} /> : <span style={{ width: 5, height: 5, borderRadius: "50%", background: "var(--st-blocked)" }} />}
      </span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 11.5, color: active ? "var(--ink)" : "var(--ink-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileName(f.path)}</div>
        {fileDir(f.path) && <div style={{ fontSize: 9.5, color: "var(--ink-4)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{fileDir(f.path)}</div>}
      </div>
      <span className="tnum" style={{ fontSize: 9.5, color: done ? "var(--st-done)" : "var(--vcs-conflicted)", flex: "none" }}>{rc}/{f.conflicts}</span>
    </div>
  );
}

function DiffView({ ag, project, treeMode, setTreeMode, onAct, onOpenCommit, onFlash, onAppendLog }) {
  const conflict = (window.AGENT_GIT && window.AGENT_GIT.agentHasConflict(ag)) ? window.AGENT_GIT.agentConflict(ag, project) : null;
  const conflictPaths = conflict ? conflict.files.map((f) => f.path) : [];
  const [resMap, setResMap] = useStateW({});
  const [selPath, setSelPath] = useStateW(conflict ? conflict.files[0].path : (ag.files[0] ? ag.files[0].path : null));
  const [partial, setPartial] = useStateW(false);
  useEffectW(() => {
    setResMap({}); setPartial(false);
    setSelPath(conflict ? conflict.files[0].path : (ag.files[0] ? ag.files[0].path : null));
  }, [ag.id]);

  const isConflictSel = conflict && conflictPaths.includes(selPath);
  const hasHunks = !isConflictSel && DIFFS[ag.id] && DIFFS[ag.id].file === selPath;

  const resolvedCount = (f) => { const rm = resMap[f.path] || {}; return f.segments.filter((s, i) => s.type === "conflict" && rm[i] && rm[i].res).length; };
  const totalConf = conflict ? conflict.files.reduce((s, f) => s + f.conflicts, 0) : 0;
  const totalResolved = conflict ? conflict.files.reduce((s, f) => s + resolvedCount(f), 0) : 0;
  const allDone = conflict && totalResolved === totalConf;
  const resolve = (path, idx, res) => setResMap((m) => ({ ...m, [path]: { ...(m[path] || {}), [idx]: { res, custom: null } } }));
  const editResult = (path, idx, custom) => setResMap((m) => ({ ...m, [path]: { ...(m[path] || {}), [idx]: { ...(m[path] || {})[idx], custom } } }));
  const acceptAll = (path, side, idxs) => { setResMap((m) => { const fm = { ...(m[path] || {}) }; idxs.forEach((ci) => { fm[ci] = { res: side, custom: null }; }); return { ...m, [path]: fm }; }); onFlash && onFlash("accepted " + side + " — " + fileName(path)); };
  const activeConflictFile = isConflictSel ? conflict.files.find((f) => f.path === selPath) : null;
  // AI path for conflict resolution (A4 · B4.2) — priced per file and per hunk
  const aiResolve = ({ scope, idx, idxs, est }) => {
    const label = scope === "hunk" ? "AI resolve conflict" : "AI resolve " + fileName(selPath);
    window.runAIVariant({ agent: ag, op: scope === "hunk" ? "hunk" : "conflict", label, est, flash: onFlash, appendLog: onAppendLog,
      onDone: () => { if (scope === "hunk") resolve(selPath, idx, "both"); else acceptAll(selPath, "both", idxs); } });
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      {/* merge banner — only when this branch has an in-progress conflicted merge */}
      {conflict && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 16px", flex: "none",
          background: "color-mix(in oklch, var(--st-blocked), transparent 91%)", borderBottom: "1px solid color-mix(in oklch, var(--st-blocked), transparent 60%)" }}>
          <Icon name="merge" size="sm" style={{ color: "var(--st-blocked)" }} />
          <span style={{ fontSize: 11.5, fontWeight: 600, color: "var(--ink)" }}>Merge {conflict.theirs} → {conflict.ours}</span>
          <span style={{ fontSize: 10.5, color: allDone ? "var(--st-done)" : "var(--vcs-conflicted)" }}>{allDone ? "all conflicts resolved" : "paused — resolve conflicts below"}</span>
          <div className="meter" style={{ width: 120, marginLeft: 4 }}><i style={{ width: (totalResolved / totalConf * 100) + "%", background: allDone ? "var(--st-done)" : "var(--ui-ind)" }} /></div>
          <span className="tnum" style={{ fontSize: 10, color: "var(--ink-4)" }}>{totalResolved}/{totalConf}</span>
          <div style={{ marginLeft: "auto", display: "flex", gap: 7 }}>
            <button className={"btn " + (allDone ? "primary" : "ghost-hair")} disabled={!allDone} onClick={() => onFlash && onFlash("committed merge — " + conflict.theirs + " → " + conflict.ours)} style={{ padding: "4px 11px", fontSize: 11 }}>
              <Icon name="commit" size="sm" />Commit merge
            </button>
            <button className="btn ghost-hair" onClick={() => onFlash && onFlash("aborted merge — working tree restored")} style={{ padding: "4px 10px", fontSize: 11, color: "var(--st-blocked)" }}>
              <Icon name="discard" size="sm" />Abort
            </button>
          </div>
        </div>
      )}

      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "246px 1fr", minHeight: 0 }}>
        <div style={{ display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid var(--hair)", background: "var(--panel)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px 8px 14px", borderBottom: "1px solid var(--hair)", flex: "none" }}>
            <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Files</span>
            {/* tree / flat toggle */}
            <div style={{ marginLeft: "auto", display: "flex", gap: 2, padding: 2, background: "var(--panel-2)", border: "1px solid var(--hair)", borderRadius: "var(--r-sm)" }}>
              {[{ k: "tree", icon: "graph" }, { k: "flat", icon: "dots" }].map((o) => (
                <button key={o.k} className="btn" onClick={() => setTreeMode(o.k === "tree")} title={o.k === "tree" ? "Tree view" : "Flattened view"}
                  style={{ padding: "3px 7px", borderRadius: 4, gap: 5, fontSize: 10,
                    background: (treeMode === (o.k === "tree")) ? "var(--panel-3)" : "transparent",
                    color: (treeMode === (o.k === "tree")) ? "var(--ink)" : "var(--ink-3)",
                    boxShadow: (treeMode === (o.k === "tree")) ? "0 0 0 1px var(--hair-2)" : "none" }}>
                  <Icon name={o.icon} size="sm" style={{ width: 12, height: 12, color: (treeMode === (o.k === "tree")) ? "var(--ui-ink)" : "inherit" }} />
                  {o.k === "tree" ? "Tree" : "Flat"}
                </button>
              ))}
            </div>
          </div>
          {/* partial-commit toggle */}
          <button className="btn" onClick={() => setPartial((v) => !v)} disabled={!hasHunks} title={hasHunks ? "Select hunks & lines to commit" : "Open the diffed file to select hunks"}
            style={{ margin: "8px 10px 4px", justifyContent: "center", fontSize: 10.5, borderRadius: "var(--r-sm)", flex: "none",
              border: "1px solid " + (partial ? "var(--ui-line)" : "var(--hair)"),
              color: partial ? "var(--ink)" : "var(--ink-3)", background: partial ? "var(--ui-sel)" : "transparent", opacity: hasHunks ? 1 : 0.5 }}>
            <Icon name="stage" size="sm" style={{ color: partial ? "var(--ui-ink)" : "inherit" }} />{partial ? "Selecting hunks" : "Partial commit"}
          </button>
          <div className="scroll-y" style={{ flex: 1, padding: "6px 0" }}>
            {/* conflicted files first, when a merge is in progress */}
            {conflict && <>
              <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 14px 4px" }}>
                <Icon name="merge" size="sm" style={{ width: 12, height: 12, color: "var(--st-blocked)" }} />
                <span className="up" style={{ fontSize: 9, color: "var(--vcs-conflicted)" }}>Conflicts · {conflict.files.length}</span>
                <span className="tnum" style={{ fontSize: 9, color: "var(--ink-4)", marginLeft: "auto" }}>{totalConf - totalResolved} left</span>
              </div>
              {conflict.files.map((f) => <ConflictFileRow key={f.path} f={f} rc={resolvedCount(f)} active={selPath === f.path} onSelect={setSelPath} />)}
              <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 14px 4px", borderTop: "1px solid var(--hair)", marginTop: 4 }}>
                <span className="up" style={{ fontSize: 9, color: "var(--ink-3)" }}>Changed · {ag.files.length}</span>
              </div>
            </>}
            {ag.files.length ? <ChangedFiles files={ag.files} selPath={selPath} onSelect={setSelPath} mode={treeMode ? "tree" : "flat"} />
              : <div style={{ padding: 16, fontSize: 11, color: "var(--ink-4)" }}>no changes yet</div>}
          </div>
        </div>
        {isConflictSel
          ? <ConflictFilePane file={activeConflictFile} fileRes={resMap[selPath] || {}} ours={conflict.ours} theirs={conflict.theirs}
              ai={{ model: ag.model, flash: onFlash, onAI: aiResolve }}
              onResolve={(i, r) => resolve(selPath, i, r)} onEdit={(i, c) => editResult(selPath, i, c)} onAcceptAll={(side, idxs) => acceptAll(selPath, side, idxs)} />
          : selPath
          ? <DiffBody ag={ag} path={selPath} partial={partial && hasHunks} onAct={onAct} onOpenCommit={onOpenCommit} />
          : <div style={{ display: "grid", placeItems: "center", color: "var(--ink-4)", fontSize: 12 }}>working tree clean</div>}
      </div>
    </div>
  );
}

function Workspace({ ag, project, liveLogs, onAct, onFlash, onAppendLog, openFile, onCloseFile, initialPane, gitView, onCloseGitView, onOpenGit, onSendReview, asleep, onWake, structureOpen, autosave, jump, onSendPrompt }) {
  const [pane, setPane] = useStateW(initialPane || "diff");
  const [treeMode, setTreeMode] = useStateW(false);
  const [reviewOpen, setReviewOpen] = useStateW(false);
  // when a file is opened from the right panel, jump to the file pane
  useEffectW(() => { if (openFile) setPane("file"); }, [openFile]);
  useEffectW(() => { if (!openFile && pane === "file") setPane("diff"); }, [openFile]);
  // when a git view (commit/range/conflict/file-history) is opened, jump to it
  useEffectW(() => { if (gitView) setPane("git"); }, [gitView]);
  useEffectW(() => { if (!gitView && pane === "git") setPane("diff"); }, [gitView]);

  const onOpenCommit = (sha) => onOpenGit && onOpenGit(ag.id, { kind: "commit", sha });
  // dual-path git actions (A4): native primary press, AI variants priced on the row
  const target = project ? project.branch : "main";
  const diffBytes = (ag.files || []).reduce((s, f) => s + ((f.add || 0) + (f.del || 0)) * 42, 0);
  const estIn = { files: (ag.files || []).length, diffBytes, model: ag.model };
  const ai = (op, label, verbose) => ({
    id: op + (verbose ? "-v" : ""), label, op, verbose,
    run: (est) => window.runAIVariant({ agent: ag, op, label, est, flash: onFlash, appendLog: onAppendLog,
      onDone: () => { if (op === "commit") onAct(ag.id, "commit"); } }),
  });

  const PANES = [
    { key: "diff", icon: "diff", label: "Diff", badge: ag.files.length },
    { key: "terminal", icon: "terminal", label: "Terminal" },
  ];
  const gitLabel = gitView ? (gitView.kind === "commit" ? gitView.sha : gitView.kind === "range" ? "range (" + gitView.shas.length + ")" : gitView.kind === "filehistory" ? fileName(gitView.path) : "conflicts") : "";
  const gitIcon = gitView ? (gitView.kind === "conflict" ? "merge" : gitView.kind === "filehistory" ? "clock" : gitView.kind === "range" ? "diff" : "commit") : "git";

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, background: "var(--panel-2)" }}>
      {/* agent header */}
      <div style={{ padding: "12px 18px", borderBottom: "1px solid var(--hair)", background: "var(--panel)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <h1 className="disp" style={{ fontSize: 15, fontWeight: 600 }}>{ag.name}</h1>
          <StatusPill status={ag.status} filled />
          {ag.status === "running" && <div className="activity" style={{ width: 60 }} />}
          <div style={{ marginLeft: "auto", display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
            <SendReviewButton agentId={ag.id} onOpen={() => setReviewOpen(true)} />
            {ag.status === "running"
              ? <button className="btn ghost-hair" onClick={() => onAct(ag.id, "pause")}><Icon name="pause" size="sm" />Pause</button>
              : ag.status === "done" ? null
              : <button className="btn ghost-hair" onClick={() => onAct(ag.id, "resume")}><Icon name="play" size="sm" />Resume</button>}
            <GitActionButton label="Commit" icon="commit" flash={onFlash} onNative={() => onAct(ag.id, "commit")}
              estimateInput={{ ...estIn, op: "commit" }}
              variants={[ai("commit", "Write the commit message from the diff")]} />
            <GitActionButton label={"Rebase onto " + target} icon="branch" flash={onFlash}
              onNative={() => onFlash("rebased " + ag.branch + " onto " + target + " · native, 0 tokens")}
              estimateInput={{ ...estIn, op: "rebase" }}
              variants={[ai("rebase", "Rebase with AI"), ai("rebase", "Rebase with AI (verbose)", true)]} />
            <GitActionButton label={"Merge to " + target} icon="merge" kind={ag.status === "done" ? "primary" : "ghost-hair"} flash={onFlash}
              onNative={() => onAct(ag.id, "merge")}
              estimateInput={{ ...estIn, op: "merge" }}
              variants={[ai("merge", "Merge with AI")]} />
          </div>
        </div>
        <div style={{ marginTop: 8, fontSize: 11, color: "var(--ink-2)" }}>{ag.task}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 8, fontSize: 10.5, color: "var(--ink-3)", flexWrap: "wrap" }} className="tnum">
          {project && <span style={{ display: "flex", gap: 5, alignItems: "center", color: project.color }}><Icon name={project.icon} size="sm" style={{ width: 12, height: 12 }} />{project.name}</span>}
          <span style={{ display: "flex", gap: 5 }}><Icon name="branch" size="sm" style={{ width: 12, height: 12, color: "var(--ink-3)" }} />{ag.branch}</span>
          <span style={{ display: "flex", gap: 5 }}><Icon name="folder" size="sm" style={{ width: 12, height: 12 }} />{ag.worktree}</span>
          <span style={{ display: "flex", gap: 5, alignItems: "center" }}><ToolBadge tool={ag.tool} size={13} />{toolMeta(ag.tool).name} · {ag.model}{ag.effort ? " · " + ag.effort : ""}</span>
          <span style={{ display: "flex", gap: 5 }}><Icon name="commit" size="sm" style={{ width: 12, height: 12 }} />{ag.commits} commits</span>
          <span style={{ display: "flex", gap: 5 }}><Icon name="clock" size="sm" style={{ width: 12, height: 12 }} />{ag.elapsed ? fmtDur(ag.elapsed) : "—"}</span>
        </div>
      </div>

      {/* pane tabs */}
      <div style={{ display: "flex", alignItems: "stretch", gap: 2, padding: "0 12px", background: "var(--panel)", borderBottom: "1px solid var(--hair)" }}>
        {PANES.map((p) => (
          <button key={p.key} className="btn" onClick={() => setPane(p.key)}
            style={{ padding: "9px 12px", borderRadius: 0, position: "relative", color: pane === p.key ? "var(--ink)" : "var(--ink-3)" }}>
            {pane === p.key && <span style={{ position: "absolute", left: 10, right: 10, bottom: 0, height: 2, background: "var(--ui-ind)" }} />}
            <Icon name={p.icon} size="sm" style={{ color: pane === p.key ? "var(--ui-ink)" : "inherit" }} />
            {p.label}

        )}
        {/* dynamic file tab */}
        {openFile && (
          <div onClick={() => setPane("file")} style={{ display: "flex", alignItems: "center", gap: 7, padding: "9px 10px 9px 12px", cursor: "pointer", position: "relative", color: pane === "file" ? "var(--ink)" : "var(--ink-3)", borderLeft: "1px solid var(--hair)" }}>

              onMouseEnter={(e) => e.currentTarget.style.color = "var(--ink)"}
              onMouseLeave={(e) => e.currentTarget.style.color = "var(--ink-4)"}>
              <Icon name="x" size="sm" />
            </button>
          </div>
        )}
      </div>

      {/* pane body */}
      {pane === "diff" && <DiffView ag={ag} project={project} treeMode={treeMode} setTreeMode={setTreeMode} onAct={onAct} onOpenCommit={onOpenCommit} onFlash={onFlash} onAppendLog={onAppendLog} />}
      {pane === "terminal" && (asleep
        ? <div style={{ flex: 1, display: "grid", placeItems: "center", background: "var(--bg)" }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12, textAlign: "center" }}>
              <Icon name="moon" size="lg" style={{ color: "var(--ui-ink)" }} />
              <div style={{ fontSize: 12.5, color: "var(--ink-2)" }}>{ag.name} is asleep</div>
              <div style={{ fontSize: 10.5, color: "var(--ink-4)", maxWidth: 320, lineHeight: 1.6 }}>
                its xterm and WebGL context are disposed — output keeps landing in the 1 MB Rust ring, so nothing is lost. Waking replays it.
              </div>
              <button className="btn primary" onClick={() => onWake && onWake(ag.id)}><Icon name="play" size="sm" />Wake and replay</button>
            </div>
          </div>
        : <TerminalStack ag={ag} lines={liveLogs} streaming={ag.status === "running"} onFlash={onFlash} onSend={onSendPrompt || (() => {})} />)}
      {pane === "git" && gitView && <AgentGitView ag={ag} project={project} gitView={gitView} onFlash={onFlash || (() => {})} onOpenCommit={onOpenCommit} />}
      {pane === "file" && openFile && <EditorPane path={openFile} agent={ag} onFlash={onFlash || (() => {})} structureOpen={structureOpen} autosave={autosave} jump={jump} onOpenCommit={onOpenCommit} />}

      {reviewOpen && <SendReviewModal agentId={ag.id} agentName={ag.name} onClose={() => setReviewOpen(false)} onSend={onSendReview || (() => {})} />}
    </div>
  );
}

Object.assign(window, { Workspace, FileViewer, Terminal, DiffView });

</script>

<script type="text/babel">

// ORCHESTRA — split / tiling pane manager for the central workspace

const { useState: useStateP, useRef: useRefP, useEffect: useEffectP, useCallback: useCB } = React;

let _pid = 0;
const nid = () => "pane" + (++_pid);
const leaf = (agentId, view) => ({ type: "leaf", id: nid(), agentId: agentId || null, view: view || "terminal" });

// ---- immutable tree ops ----
function splitLeaf(node, id, dir, nl) {
  if (node.type === "leaf") return node.id === id ? { type: "split", id: nid(), dir, ratio: 0.5, a: node, b: nl } : node;
  return { ...node, a: splitLeaf(node.a, id, dir, nl), b: splitLeaf(node.b, id, dir, nl) };
}
function removeLeaf(node, id) {
  if (node.type === "leaf") return node;
  const a = node.a, b = node.b;
  if (a.type === "leaf" && a.id === id) return b;
  if (b.type === "leaf" && b.id === id) return a;
  return { ...node, a: removeLeaf(a, id), b: removeLeaf(b, id) };
}
function patchLeaf(node, id, patch) {
  if (node.type === "leaf") return node.id === id ? { ...node, ...patch } : node;
  return { ...node, a: patchLeaf(node.a, id, patch), b: patchLeaf(node.b, id, patch) };
}
// force every leaf bound to an agent onto a given view (used when a commit is
// picked in the right panel → its pane must switch to diff, never the terminal)
function setLeafViewByAgent(node, agentId, view) {
  if (node.type === "leaf") return node.agentId === agentId ? { ...node, view } : node;
  return { ...node, a: setLeafViewByAgent(node.a, agentId, view), b: setLeafViewByAgent(node.b, agentId, view) };
}
function setRatio(node, id, ratio) {
  if (node.type === "leaf") return node;
  if (node.id === id) return { ...node, ratio };
  return { ...node, a: setRatio(node.a, id, ratio), b: setRatio(node.b, id, ratio) };
}
function countLeaves(node) { return node.type === "leaf" ? 1 : countLeaves(node.a) + countLeaves(node.b); }
function treeAgentIds(node) { const out = []; (function w(n) { if (n.type === "leaf") { if (n.agentId) out.push(n.agentId); } else { w(n.a); w(n.b); } })(node); return out; }
function leafAgentOf(node, paneId) { let r = null; (function w(n) { if (n.type === "leaf") { if (n.id === paneId) r = n.agentId; } else { w(n.a); w(n.b); } })(node); return r; }
function dropAgent(node, agentId) {
  if (node.type === "leaf") return node;
  const a = node.a, b = node.b;
  if (a.type === "leaf" && a.agentId === agentId) return b;
  if (b.type === "leaf" && b.agentId === agentId) return a;
  return { ...node, a: dropAgent(a, agentId), b: dropAgent(b, agentId) };
}
// split a specific leaf toward a side, inserting a new leaf (or replace on center)
function splitLeafSide(node, id, side, nl) {
  if (node.type === "leaf") {
    if (node.id !== id) return node;
    if (side === "center") return nl;
    const dir = (side === "left" || side === "right") ? "v" : "h";
    const first = (side === "left" || side === "top");
    return { type: "split", id: nid(), dir, ratio: 0.5, a: first ? nl : node, b: first ? node : nl };
  }
  return { ...node, a: splitLeafSide(node.a, id, side, nl), b: splitLeafSide(node.b, id, side, nl) };
}

// ---- agent picker popover ----
function AgentPicker({ projects, agents, value, onPick, onClose }) {

// ---- single leaf pane ----
function Pane({ node, agents, projects, liveLogs, onSplit, onClose, onAgent, onView, onFocus, canClose, focused, onDropOver, onPaneDrop, dropTarget, onAct, onFlash, gitView, openFile, onOpenGit, onCloseGitView, onCloseFile, onAppendLog, onSendPrompt, autosave, jump }) {

  const myFile = agent && openFile && openFile.agentId === agent.id ? openFile.path : null;
  const onOpenCommit = (sha) => onOpenGit && agent && onOpenGit(agent.id, { kind: "commit", sha });

  const zoneStyle = {

  return (
    <div onMouseDown={() => onFocus(node.id)} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}
      style={{ flex: 1, minWidth: 0, minHeight: 0, display: "flex", flexDirection: "column", background: "var(--panel-2)", position: "relative",

      {/* pane header */}

        {proj && <span style={{ width: 6, height: 6, borderRadius: 2, background: proj.color, flex: "none" }} title={proj.name} />}
        <button onClick={(e) => { e.stopPropagation(); setPick((v) => !v); }}
          style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "none", cursor: "pointer", color: "var(--ink)", fontFamily: "var(--font-mono)", fontSize: 11.5, padding: "2px 4px", borderRadius: 5, minWidth: 0 }}
          onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-3)"}
          onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
          {agent ? <StatusDot status={agent.status} /> : <Icon name="agent" size="sm" style={{ color: "var(--ink-4)" }} />}

        </button>

        {agent && (

            {[{ k: "terminal", icon: "terminal" }, { k: "diff", icon: "diff" }].map((v) => (
              <button key={v.k} onClick={(e) => { e.stopPropagation(); onView(node.id, v.k); }} title={v.k}
                style={{ display: "flex", padding: "2px 5px", borderRadius: 3, border: "none", cursor: "pointer",
                  background: node.view === v.k ? "var(--panel-3)" : "transparent", color: node.view === v.k ? "var(--ui-ink)" : "var(--ink-3)" }}>
