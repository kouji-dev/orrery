<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orrery — Loading Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#07080d; color:#e8ebf2; font-family:'JetBrains Mono',monospace;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),
      radial-gradient(46% 38% at 50% 43%,rgba(168,85,247,.16),transparent 72%);
    background-size:34px 34px,34px 34px,100% 100%,100% 100%;
    overflow:hidden;
  }
  .mark{filter:drop-shadow(0 0 26px rgba(168,85,247,.40))}
  .core-pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.9}50%{opacity:.55}}
  .word{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:36px;letter-spacing:.01em;margin-top:28px;opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease}
  .word.in{opacity:1;transform:none}
  .word .o{color:#a855f7}
  .status{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#6b7488;margin-top:15px;height:13px;opacity:0;transition:opacity .5s}
  .status.in{opacity:1}
  .bar{margin-top:20px;width:188px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#ff5d9e,#a855f7,#22d3ee)}
  .hint{position:fixed;bottom:48px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#444b5e}
  .credit{position:fixed;bottom:22px;display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:-.01em;color:#aab2c5}
  .credit-mark{filter:drop-shadow(0 0 8px rgba(168,85,247,.35))}
  .credit .wm .o{color:#a855f7}
  .credit .x{color:#444b5e;font-family:'JetBrains Mono',monospace;font-size:12px;margin:0 1px}
  .credit a{text-decoration:none;background:linear-gradient(100deg,#ff5d9e,#a855f7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .credit a:hover{filter:brightness(1.12);text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>
  <div class="mark"><svg id="svg" width="168" height="168" viewBox="0 0 100 100" fill="none"></svg></div>
  <div class="word" id="word"><span class="o">O</span>rrery</div>
  <div class="status" id="status">initializing orchestrator</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="hint">loading screen · loops for preview</div>
  <div class="credit"><svg class="credit-mark" id="creditMark" width="18" height="18" viewBox="0 0 100 100"></svg><span class="wm"><span class="o">O</span>rrery</span><span class="x">×</span><a href="https://kouji.dev" target="_blank" rel="noreferrer">Kouji.dev</a></div>
<script>
  var A=22,B=13,K=-4,TAU=Math.PI*2;
  function epi(t){return [50+A*Math.cos(t)+B*Math.cos(K*t),50+A*Math.sin(t)+B*Math.sin(K*t)];}
  var N=260,d="";for(var i=0;i<=N;i++){var t=i/N*TAU,p=epi(t);d+=(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)+" ";}d+="Z";
  document.getElementById('creditMark').innerHTML=
    '<defs>'+
      '<linearGradient id="cm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d9e"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>'+
      '<radialGradient id="cmc"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>'+
    '</defs>'+
    '<path d="'+d+'" fill="none" stroke="url(#cm)" stroke-width="6" stroke-linejoin="round"/>'+
    '<circle cx="50" cy="50" r="13" fill="url(#cmc)"/>';
  var svg=document.getElementById('svg');
  svg.innerHTML=
    '<defs>'+
      '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d9e"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>'+
      '<radialGradient id="c"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>'+
    '</defs>'+
    '<circle cx="50" cy="50" r="22" fill="none" stroke="#6b7488" stroke-width=".6" stroke-opacity=".3"/>'+
    '<path id="path" d="'+d+'" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle id="epc" r="13" fill="none" stroke="#6b7488" stroke-width=".6" stroke-opacity=".4"/>'+
    '<line id="arm" stroke="#22d3ee" stroke-width="1" stroke-opacity=".6"/>'+
    '<circle class="core-pulse" cx="50" cy="50" r="8.5" fill="url(#c)"/>'+
    '<circle id="pen" r="4" fill="#22d3ee"/>';
  var path=svg.querySelector('#path'), L=path.getTotalLength();
  var pen=svg.querySelector('#pen'), epc=svg.querySelector('#epc'), arm=svg.querySelector('#arm');
  var word=document.getElementById('word'), statusEl=document.getElementById('status'), bar=document.getElementById('bar');
  var msgs=['initializing orchestrator','mounting worktrees','linking agents','warming terminals','ready'];
  var DUR=2200, HOLD=900;
  function ease(x){return 1-Math.pow(1-x,3);}
  function run(){
    path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
    epc.style.opacity=1; arm.style.opacity=1; word.classList.remove('in'); bar.style.width='0%';
    var start=performance.now(), wordIn=false, mi=-1;
    setTimeout(function(){statusEl.classList.add('in');},140);
    function frame(now){
      var p=Math.min(1,(now-start)/DUR), e=ease(p);
      path.style.strokeDashoffset=L*(1-e);
      var t=e*TAU, def=[50+A*Math.cos(t),50+A*Math.sin(t)], pp=epi(t);
      epc.setAttribute('cx',def[0]);epc.setAttribute('cy',def[1]);
      pen.setAttribute('cx',pp[0]);pen.setAttribute('cy',pp[1]);
      arm.setAttribute('x1',def[0]);arm.setAttribute('y1',def[1]);arm.setAttribute('x2',pp[0]);arm.setAttribute('y2',pp[1]);
      bar.style.width=(e*100).toFixed(1)+'%';
      var idx=Math.min(msgs.length-1,Math.floor(p*msgs.length));
      if(idx!==mi){mi=idx;statusEl.textContent=msgs[idx];}
      if(p>=0.45&&!wordIn){wordIn=true;word.classList.add('in');}
      if(p<1) requestAnimationFrame(frame);
      else { epc.style.transition=arm.style.transition='opacity .3s'; epc.style.opacity=0; arm.style.opacity=0; var s=epi(0); pen.setAttribute('cx',s[0]); pen.setAttribute('cy',s[1]); setTimeout(run, HOLD); }
    }
    requestAnimationFrame(frame);
  }
  run();
</script>
</body>
</html>
