<!DOCTYPE html>
<html lang="en" data-theme="dark" data-tier="dev" data-state="populated">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orrery — Performance (dev panel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   ORCHESTRA — Performance dev-panel mockup
   Tokens lifted verbatim from the app's styles.css so this drops in cleanly.
   ========================================================================= */
:root{
  --accent:#a855f7; --accent-2:#22d3ee; --accent-rgb:168,85,247; --accent-2-rgb:34,211,238;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --font-disp:'Space Grotesk',var(--font-mono);
  --r-sm:5px; --r-md:8px; --r-lg:12px;
}
[data-theme="dark"]{
  --bg:#090a0f; --bg-grid:rgba(255,255,255,.018);
  --panel:#0e1018; --panel-2:#11141e; --panel-3:#161a26; --elev:#1a1f2e;
  --hair:rgba(255,255,255,.07); --hair-2:rgba(255,255,255,.12);
  --ink:#e8ebf2; --ink-2:#aab2c5; --ink-3:#6b7488; --ink-4:#444b5e;
  --shadow:0 12px 40px -12px rgba(0,0,0,.7);
  /* latency scale */
  --lat-g:#35e0a1; --lat-a:#f5c451; --lat-r:#ff5d7a;
  --lat-g-bg:rgba(53,224,161,.08); --lat-a-bg:rgba(245,196,81,.13); --lat-r-bg:rgba(255,93,122,.18);
  --lat-r-ring:rgba(255,93,122,.40);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#eef0f4; --bg-grid:rgba(20,24,40,.022);
  --panel:#ffffff; --panel-2:#f6f7fa; --panel-3:#eceef3; --elev:#ffffff;
  --hair:rgba(20,24,40,.10); --hair-2:rgba(20,24,40,.16);
  --ink:#161a26; --ink-2:#4a5266; --ink-3:#7b8398; --ink-4:#aab0bf;
  --shadow:0 18px 50px -18px rgba(20,24,40,.40);
  --lat-g:#0a8f5e; --lat-a:#a9700f; --lat-r:#d6304e;
  --lat-g-bg:rgba(10,143,94,.09); --lat-a-bg:rgba(169,112,15,.13); --lat-r-bg:rgba(214,48,78,.14);
  --lat-r-ring:rgba(214,48,78,.34);
  color-scheme:light;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-mono); font-size:12.5px; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; letter-spacing:-.01em;
  overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
.disp{font-family:var(--font-disp); letter-spacing:-.02em;}
.up{text-transform:uppercase; letter-spacing:.12em;}

/* ---------- faint app backdrop ---------- */
.backdrop{position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg);}
.backdrop::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:34px 34px;
}
.backdrop::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 50% at 18% 0%,rgba(var(--accent-rgb),.10),transparent 70%),
             radial-gradient(50% 50% at 100% 100%,rgba(var(--accent-2-rgb),.07),transparent 70%);
}
.ghost{position:absolute; inset:0; opacity:.5; filter:saturate(.7); transition:opacity .3s, filter .3s;}
body.panel-open .ghost{opacity:.32; filter:saturate(.6) blur(1.5px);}
.g-top{position:absolute; top:0; left:0; right:0; height:44px; background:var(--panel);
  border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:14px; padding:0 16px;}
.g-side{position:absolute; top:44px; bottom:24px; left:0; width:252px; background:var(--panel);
  border-right:1px solid var(--hair); padding:14px 12px; display:flex; flex-direction:column; gap:9px;}
.g-bar{height:9px; border-radius:5px; background:var(--panel-3);}
.g-foot{position:absolute; left:0; right:0; bottom:0; height:24px; background:var(--panel); border-top:1px solid var(--hair);}
.g-cards{position:absolute; top:64px; left:272px; right:20px; display:grid; gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); align-content:start;}
.g-card{height:150px; border-radius:var(--r-lg); border:1px solid var(--hair); background:var(--panel);
  padding:14px; display:flex; flex-direction:column; gap:10px;}
.wordmark{font-family:var(--font-disp); font-weight:600; font-size:14px; color:var(--ink-2);}
.wordmark .o{color:var(--accent);}

/* scrim behind the panel when open */
.scrim{position:fixed; inset:0; z-index:30; background:rgba(4,5,9,.34);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .28s ease;}
[data-theme="light"] .scrim{background:rgba(20,24,40,.18);}
body.panel-open .scrim{opacity:1; pointer-events:auto;}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:24px; bottom:30px; z-index:60; width:50px; height:50px; border-radius:15px;
  display:grid; place-items:center; cursor:pointer; border:1px solid var(--hair-2);
  background:linear-gradient(180deg,var(--panel-3),var(--panel));
  color:var(--ink-2); box-shadow:var(--shadow); transition:transform .16s, color .16s, border-color .16s;
}
.fab:hover{transform:translateY(-2px); color:var(--ink); border-color:rgba(var(--accent-rgb),.5);}
.fab .pulse-dot{position:absolute; top:9px; right:9px; width:7px; height:7px; border-radius:50%;
  background:var(--lat-r); box-shadow:0 0 0 0 var(--lat-r); animation:fabpulse 1.6s ease-in-out infinite;}
body.panel-open .fab{opacity:0; pointer-events:none; transform:scale(.6);}
@keyframes fabpulse{0%{box-shadow:0 0 0 0 rgba(255,93,122,.5);}70%{box-shadow:0 0 0 7px rgba(255,93,122,0);}100%{box-shadow:0 0 0 0 rgba(255,93,122,0);}}

/* ---------- floating panel ---------- */
.panel{
  position:fixed; right:24px; bottom:30px; z-index:61; width:720px;
  max-width:calc(100vw - 36px); max-height:calc(100vh - 96px);
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--panel); border:1px solid var(--hair-2); border-radius:14px;
  box-shadow:var(--shadow), 0 0 0 1px rgba(var(--accent-rgb),.04);
  transform-origin:bottom right;
  opacity:0; transform:translateY(10px) scale(.985); pointer-events:none;
  transition:opacity .26s cubic-bezier(.2,.7,.2,1), transform .26s cubic-bezier(.2,.7,.2,1);
}
body.panel-open .panel{opacity:1; transform:none; pointer-events:auto;}

/* panel header */
.p-head{
  flex:none; display:flex; align-items:center; gap:11px; padding:11px 12px 11px 15px;
  border-bottom:1px solid var(--hair); background:linear-gradient(180deg,var(--panel-3),var(--panel));
}
.p-title{font-family:var(--font-disp); font-weight:600; font-size:14px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px;}
.live{display:inline-flex; align-items:center; gap:6px; font-size:9.5px; color:var(--ink-3);}
.live .ld{width:7px; height:7px; border-radius:50%; background:var(--lat-g); position:relative;}
.live .ld::after{content:""; position:absolute; inset:-3px; border-radius:50%; background:inherit; opacity:.4; filter:blur(2px);}
.live.on .ld{animation:livepulse 1.5s ease-in-out infinite;}
@keyframes livepulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.win-chip{display:inline-flex; align-items:center; gap:5px; font-size:10px; padding:2px 8px; border-radius:999px;
  border:1px solid var(--hair); color:var(--ink-2); background:var(--panel-2); white-space:nowrap;}
.tier-pill{font-size:9px; padding:2px 7px; border-radius:5px; letter-spacing:.14em; font-weight:600;
  text-transform:uppercase; border:1px solid;}
.tier-pill.dev{color:var(--accent-2); border-color:rgba(var(--accent-2-rgb),.4); background:rgba(var(--accent-2-rgb),.10);}
.tier-pill.prod{color:var(--ink-3); border-color:var(--hair-2); background:var(--panel-2);}
.p-head .spacer{flex:1;}
.icbtn{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px;
  color:var(--ink-2); background:transparent; border:1px solid var(--hair); border-radius:var(--r-sm);
  padding:5px 9px; cursor:pointer; transition:all .12s;}
.icbtn:hover{color:var(--ink); background:var(--panel-3); border-color:var(--hair-2);}
.icbtn svg{width:13px; height:13px;}
.icbtn-bare{border:none; padding:5px; color:var(--ink-3);}
.icbtn-bare:hover{color:var(--ink); background:var(--panel-3);}

/* panel body */
.p-body{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;}
.p-body::-webkit-scrollbar{width:9px;}
.p-body::-webkit-scrollbar-thumb{background:var(--hair-2); border-radius:6px; border:2px solid transparent; background-clip:padding-box;}
.p-body::-webkit-scrollbar-thumb:hover{background:var(--ink-4); background-clip:padding-box;}

/* ---------- table ---------- */
table.perf{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
table.perf thead th{
  position:sticky; top:0; z-index:2; background:var(--panel-2);
  border-bottom:1px solid var(--hair-2);
  font-weight:500; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  padding:8px 9px; text-align:right; white-space:nowrap; cursor:pointer; user-select:none;
  transition:color .12s, background .12s;
}
table.perf thead th:first-child{text-align:left; padding-left:15px;}
table.perf thead th:last-child{padding-right:15px;}
table.perf thead th:hover{color:var(--ink-2); background:var(--panel-3);}
table.perf thead th.sorted{color:var(--ink);}
th .arrow{display:inline-block; width:9px; margin-left:3px; color:var(--accent); opacity:0; font-size:8px; vertical-align:middle;}
th.sorted .arrow{opacity:1;}
table.perf tbody td{
  padding:0 9px; height:32px; border-bottom:1px solid var(--hair);
  text-align:right; white-space:nowrap; font-size:12px; color:var(--ink-2);
}
table.perf tbody td:first-child{text-align:left; padding-left:15px;}
table.perf tbody td:last-child{padding-right:15px;}
tr.cmd-row{cursor:default; transition:background .1s;}
[data-tier="dev"] tr.cmd-row{cursor:pointer;}
tr.cmd-row:hover{background:var(--panel-2);}
tr.cmd-row.open{background:var(--panel-2);}
.cmd-name{display:flex; align-items:center; gap:8px; color:var(--ink); font-weight:500;}
.cmd-name .twirl{width:11px; height:11px; flex:none; color:var(--ink-4); transition:transform .15s; opacity:0;}
[data-tier="dev"] .cmd-name .twirl{opacity:1;}
tr.cmd-row.open .cmd-name .twirl{transform:rotate(90deg); color:var(--accent);}
.cmd-name .nm{overflow:hidden; text-overflow:ellipsis;}

/* latency cell coloring */
td.lat{font-weight:500;}
td.lat .v{display:inline-block; padding:2px 6px; border-radius:5px;}
td.lat.g .v{color:var(--lat-g);}
td.lat.a .v{color:var(--lat-a); background:var(--lat-a-bg);}
td.lat.r .v{color:var(--lat-r); background:var(--lat-r-bg); font-weight:600; box-shadow:inset 0 0 0 1px var(--lat-r-ring);}
td.lat.na .v{color:var(--ink-4);}
td.num{color:var(--ink-2);}
td.num.dim{color:var(--ink-4);}
td.err .v{display:inline-block; padding:2px 6px; border-radius:5px;}
td.err.zero .v{color:var(--ink-4);}
td.err.bad .v{color:var(--lat-r); background:var(--lat-r-bg); font-weight:600; box-shadow:inset 0 0 0 1px var(--lat-r-ring);}
td.spark{text-align:right; padding-right:15px;}
td.spark svg{display:inline-block; vertical-align:middle;}

/* expanded recent-calls for a single command */
tr.detail > td{padding:0; border-bottom:1px solid var(--hair); background:var(--bg);}
.detail-inner{padding:11px 15px 13px 34px; display:flex; flex-direction:column; gap:9px;
  animation:expand .22s ease;}
@keyframes expand{from{opacity:0; transform:translateY(-3px);}to{opacity:1; transform:none;}}
.detail-head{display:flex; align-items:center; gap:10px; font-size:10px; color:var(--ink-3);}
.detail-head .lbl{text-transform:uppercase; letter-spacing:.1em;}
.detail-stats{display:flex; gap:14px; margin-left:auto; color:var(--ink-2);}
.detail-stats b{color:var(--ink); font-weight:600;}
.calls{display:flex; flex-direction:column; gap:1px;}
.callrow{display:grid; grid-template-columns:84px 1fr auto 14px; align-items:center; gap:10px;
  font-size:11px; padding:3px 0; color:var(--ink-2);}
.callrow .ts{color:var(--ink-4);}
.callrow .cm{color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.callrow .du{text-align:right; font-weight:500;}
.callrow .du.g{color:var(--lat-g);} .callrow .du.a{color:var(--lat-a);} .callrow .du.r{color:var(--lat-r);}
.okdot{width:7px; height:7px; border-radius:50%; justify-self:center;}
.okdot.ok{background:var(--lat-g);}
.okdot.err{background:var(--lat-r); box-shadow:0 0 0 2px var(--lat-r-bg);}

/* ---------- global recent-calls feed (dev) ---------- */
.feed{border-top:1px solid var(--hair-2);}
[data-tier="prod"] .feed{display:none;}
.feed-head{position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:9px;
  padding:9px 15px; background:var(--panel-2); border-bottom:1px solid var(--hair);}
.feed-head .lbl{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}
.feed-head .ct{font-size:10px; color:var(--ink-4); margin-left:auto;}
.feed-list{padding:5px 15px 12px;}
.feedrow{display:grid; grid-template-columns:90px 16px 1fr auto 12px; align-items:center; gap:10px;
  font-size:11px; padding:4px 0; border-bottom:1px solid var(--hair); color:var(--ink-2);}
.feedrow:last-child{border-bottom:none;}
.feedrow.fresh{animation:freshin .4s ease;}
@keyframes freshin{from{background:rgba(var(--accent-2-rgb),.10);}to{background:transparent;}}
.feedrow .ts{color:var(--ink-4);}
.feedrow .ix{color:var(--ink-4); text-align:right; font-size:9px;}
.feedrow .cm{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.feedrow .du{text-align:right; font-weight:500;}
.feedrow .du.g{color:var(--lat-g);} .feedrow .du.a{color:var(--lat-a);} .feedrow .du.r{color:var(--lat-r);}

/* ---------- empty state ---------- */
.empty{display:none; flex-direction:column; align-items:center; justify-content:center; gap:13px;
  padding:60px 20px 66px; text-align:center;}
[data-state="empty"] .empty{display:flex;}
[data-state="empty"] table.perf tbody,
[data-state="empty"] .feed{display:none;}
.empty .ring{width:46px; height:46px; border-radius:50%; border:1.5px dashed var(--hair-2);
  display:grid; place-items:center; color:var(--ink-4);}
.empty .ring svg{width:20px; height:20px;}
.empty h4{font-family:var(--font-disp); font-weight:600; font-size:14px; color:var(--ink-2);}
.empty p{font-size:11.5px; color:var(--ink-4); max-width:300px; line-height:1.55;}
.empty .hint{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-3);}
.empty .ld{width:7px; height:7px; border-radius:50%; background:var(--lat-g); animation:livepulse 1.5s ease-in-out infinite;}

/* footer summary inside body */
.p-foot{flex:none; display:flex; align-items:center; gap:14px; padding:8px 15px;
  border-top:1px solid var(--hair); background:var(--panel-2); font-size:10px; color:var(--ink-3);}
.p-foot .leg{display:flex; align-items:center; gap:6px;}
.p-foot .sw{width:9px; height:9px; border-radius:3px;}
.p-foot .sw.g{background:var(--lat-g);} .p-foot .sw.a{background:var(--lat-a);} .p-foot .sw.r{background:var(--lat-r);}
.p-foot .spacer{flex:1;}

/* ---------- mockup state controls (NOT part of the app) ---------- */
.controls{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80;
  display:flex; align-items:center; gap:5px; padding:6px; border-radius:12px;
  background:var(--panel); border:1px solid var(--hair-2); box-shadow:var(--shadow);
  font-family:var(--font-mono);}
.controls .grp{display:flex; gap:2px; padding:2px; background:var(--panel-2); border-radius:8px; border:1px solid var(--hair);}
.controls .lab{font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4); padding:0 5px 0 7px; align-self:center;}
.seg{font-family:var(--font-mono); font-size:11px; color:var(--ink-3); background:transparent; border:none;
  border-radius:6px; padding:5px 11px; cursor:pointer; transition:all .12s;}
.seg:hover{color:var(--ink-2);}
.seg.on{color:var(--ink); background:var(--panel-3); box-shadow:0 0 0 1px var(--hair-2);}
.controls .vd{width:1px; align-self:stretch; background:var(--hair); margin:2px 3px;}
.tag{font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-4); padding-left:4px; padding-right:2px;}
</style>
</head>
<body>
  <!-- faint app behind the overlay -->
  <div class="backdrop">
    <div class="ghost">
      <div class="g-top">
        <span class="wordmark"><span class="o">O</span>rrery</span>
        <div class="g-bar" style="width:120px"></div>
        <div class="g-bar" style="width:80px; margin-left:auto"></div>
      </div>
      <div class="g-side">
        <div class="g-bar" style="width:70%"></div>
        <div class="g-bar" style="width:90%"></div>
        <div class="g-bar" style="width:60%"></div>
        <div class="g-bar" style="width:80%"></div>
        <div class="g-bar" style="width:50%"></div>
        <div class="g-bar" style="width:85%"></div>
      </div>
      <div class="g-cards">
        <div class="g-card"><div class="g-bar" style="width:50%"></div><div class="g-bar" style="width:90%; height:6px"></div><div class="g-bar" style="width:70%; height:6px"></div></div>
        <div class="g-card"><div class="g-bar" style="width:55%"></div><div class="g-bar" style="width:80%; height:6px"></div><div class="g-bar" style="width:65%; height:6px"></div></div>
        <div class="g-card"><div class="g-bar" style="width:45%"></div><div class="g-bar" style="width:85%; height:6px"></div><div class="g-bar" style="width:60%; height:6px"></div></div>
      </div>
      <div class="g-foot"></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <!-- FAB -->
  <button class="fab" id="fab" title="Open performance panel" aria-label="Open performance panel">
    <span class="pulse-dot"></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-6 4 13 3-9 1.5 2H21"/></svg>
  </button>

  <!-- floating panel -->
  <section class="panel" id="panel" aria-label="Performance">
    <header class="p-head">
      <span class="p-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-6 4 13 3-9 1.5 2H21"/></svg>
        Performance
      </span>
      <span class="tier-pill dev" id="tierPill">dev</span>
      <span class="live on" id="liveBadge"><span class="ld"></span>live</span>
      <span class="spacer"></span>
      <span class="win-chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l4 2M12 3a9 9 0 100 18 9 9 0 000-18z"/></svg>10s window</span>
      <button class="icbtn" id="resetBtn" title="Clear counters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0114-5l2 2M20 13a8 8 0 01-14 5l-2-2M18 4v4h-4M6 20v-4h4"/></svg>Reset</button>
      <button class="icbtn icbtn-bare" id="closeBtn" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <div class="p-body" id="body">
      <table class="perf">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>

      <!-- empty state -->
      <div class="empty">
        <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-6 4 13 3-9 1.5 2H21"/></svg></div>
        <h4>No calls yet</h4>
        <p>Invoke metrics populate as the frontend dispatches Tauri commands. Counters reset on a rolling 10-second window.</p>
        <span class="hint"><span class="ld"></span>listening for invokes…</span>
      </div>

      <!-- global recent-calls feed (dev tier) -->
      <div class="feed">
        <div class="feed-head">
          <span class="lbl">Recent calls</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--ink-4)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
          <span class="ct" id="feedCt">last 30</span>
        </div>
        <div class="feed-list" id="feedList"></div>
      </div>
    </div>

    <footer class="p-foot">
      <span class="leg"><span class="sw g"></span>≤16ms</span>
      <span class="leg"><span class="sw a"></span>16–100ms</span>
      <span class="leg"><span class="sw r"></span>&gt;100ms · err</span>
      <span class="spacer"></span>
      <span id="footSummary" class="tnum"></span>
    </footer>
  </section>

  <!-- mockup state controls (not shipped — for review) -->
  <div class="controls">
    <span class="tag">mock</span>
    <div class="grp" data-control="theme">
      <button class="seg" data-v="dark">Dark</button>
      <button class="seg" data-v="light">Light</button>
    </div>
    <div class="grp" data-control="tier">
      <button class="seg" data-v="prod">Production</button>
      <button class="seg" data-v="dev">Dev</button>
    </div>
    <div class="grp" data-control="state">
      <button class="seg" data-v="populated">Populated</button>
      <button class="seg" data-v="empty">Empty</button>
    </div>
    <div class="grp" data-control="live">
      <button class="seg" data-v="on">Live</button>
      <button class="seg" data-v="off">Paused</button>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const root = document.documentElement;

  // ---- column model ----
  const COLS = [
    { key:"cmd",      label:"command",  kind:"name" },
    { key:"calls",    label:"calls/10s",kind:"num"  },
    { key:"rt",       label:"avg RT",   kind:"lat"  },
    { key:"exec",     label:"avg exec", kind:"lat"  },
    { key:"overhead", label:"overhead", kind:"oh"   },
    { key:"p95",      label:"p95",      kind:"lat"  },
    { key:"max",      label:"max",      kind:"lat"  },
    { key:"err",      label:"err%",     kind:"err"  },
    { key:"spark",    label:"trend",    kind:"spark"},
  ];

  // ---- seed dataset: a realistic mix ----
  // rt = round-trip ms, exec = rust handler ms, overhead = rt-exec (computed)
  const SEED = [
    { cmd:"agent_spawn",     calls:3,  rt:121, exec:109, p95:184, max:247, err:0.4 },
    { cmd:"git_status",      calls:11, rt:96,  exec:91,  p95:142, max:210, err:1.2 },
    { cmd:"project_commits", calls:8,  rt:43,  exec:38,  p95:71,  max:96,  err:0   },
    { cmd:"project_open",    calls:2,  rt:38,  exec:33,  p95:60,  max:88,  err:0   },
    { cmd:"agent_diff",      calls:14, rt:22,  exec:18,  p95:35,  max:52,  err:0   },
    { cmd:"agent_logs",      calls:22, rt:11,  exec:8,   p95:19,  max:28,  err:0   },
    { cmd:"file_read",       calls:31, rt:7,   exec:5,   p95:12,  max:19,  err:0   },
    { cmd:"agent_list",      calls:9,  rt:5,   exec:3,   p95:9,   max:14,  err:0   },
    { cmd:"agent_input",     calls:17, rt:4,   exec:2,   p95:7,   max:12,  err:0   },
    { cmd:"terminal_write",  calls:58, rt:3,   exec:2,   p95:6,   max:11,  err:0   },
    { cmd:"settings_get",    calls:6,  rt:2,   exec:1,   p95:4,   max:7,   err:0   },
  ];

  // ---- live state ----
  let stats = [];          // working command stats
  let feed = [];           // global recent calls (newest first)
  let sort = { key:"rt", dir:-1 };   // default: slowest-first by avg RT
  let openCmd = null;      // expanded command in dev tier
  let liveTimer = null;
  let seq = 0;

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function jitter(v, pct){ return Math.max(0, v*(1 + rnd(-pct,pct))); }

  function makeHistory(avg, p95){
    const out = [];
    for(let i=0;i<16;i++){
      let v = jitter(avg, .35);
      if(Math.random() < 0.12) v = rnd(avg, p95);   // occasional spike toward p95
      out.push(v);
    }
    return out;
  }

  function buildStats(populated){
    return SEED.map(s => populated ? {
      ...s,
      overhead: +(s.rt - s.exec).toFixed(1),
      hist: makeHistory(s.rt, s.p95),
      recent: makeRecent(s, 9),
    } : {
      cmd:s.cmd, calls:0, rt:null, exec:null, overhead:null, p95:null, max:null, err:0,
      hist:[], recent:[],
    });
  }

  function clock(offsetMs){
    const d = new Date(Date.now() - (offsetMs||0));
    const p = (n,l)=>String(n).padStart(l||2,"0");
    return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+"."+p(d.getMilliseconds(),3).slice(0,3);
  }

  function makeRecent(s, n){
    const out = [];
    for(let i=0;i<n;i++){
      let dur = jitter(s.rt, .4);
      if(Math.random() < 0.15) dur = rnd(s.rt, s.p95);
      const isErr = s.err > 0 && Math.random() < (s.err/100)*3.2;
      out.push({ ts:clock(i*rnd(400,1400)), dur:+dur.toFixed(1), err:isErr });
    }
    return out;
  }

  function buildFeed(){
    const f = [];
    // weight by throughput
    const pool = [];
    stats.forEach(s => { if(s.calls>0){ const w = Math.max(1, Math.round(s.calls/3)); for(let i=0;i<w;i++) pool.push(s); } });
    if(!pool.length) return [];
    let t = 0;
    for(let i=0;i<30;i++){
      const s = pool[Math.floor(Math.random()*pool.length)];
      let dur = jitter(s.rt, .4);
      if(Math.random() < 0.14) dur = rnd(s.rt, s.p95);
      const isErr = s.err > 0 && Math.random() < (s.err/100)*3.0;
      t += rnd(120, 900);
      f.push({ id:++seq, ts:clock(t), cmd:s.cmd, dur:+dur.toFixed(1), err:isErr, fresh:false });
    }
    return f;
  }

  // ---- formatting ----
  function fmtMs(v){
    if(v==null) return "—";
    if(v >= 100) return Math.round(v)+"ms";
    if(v >= 10)  return v.toFixed(0)+"ms";
    return v.toFixed(1)+"ms";
  }
  function latClass(v){
    if(v==null) return "na";
    if(v <= 16) return "g";
    if(v <= 100) return "a";
    return "r";
  }

  function sparkSVG(hist, cls, w, h){
    w = w||58; h = h||16;
    if(!hist || hist.length < 2) return "";
    const max = Math.max.apply(null, hist) || 1;
    const min = Math.min.apply(null, hist);
    const span = (max-min) || 1;
    const step = w/(hist.length-1);
    const pts = hist.map((v,i)=> (i*step).toFixed(1)+","+(h - ((v-min)/span)*(h-3) - 1.5).toFixed(1)).join(" ");
    const color = cls==="r" ? "var(--lat-r)" : cls==="a" ? "var(--lat-a)" : "var(--lat-g)";
    const lastX = (w).toFixed(1), lastY = (h - ((hist[hist.length-1]-min)/span)*(h-3) - 1.5).toFixed(1);
    return '<svg width="'+w+'" height="'+h+'" aria-hidden="true">'+
      '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>'+
      '<circle cx="'+lastX+'" cy="'+lastY+'" r="1.7" fill="'+color+'"/>'+
    '</svg>';
  }

  // ---- render: header ----
  function renderHead(){
    const tr = COLS.map(c=>{
      const sorted = sort.key===c.key;
      const arrow = sorted ? (sort.dir<0 ? "▼" : "▲") : "";
      return '<th data-key="'+c.key+'" class="'+(sorted?"sorted":"")+'" title="sort by '+c.label+'">'+
        c.label+'<span class="arrow">'+arrow+'</span></th>';
    }).join("");
    document.getElementById("thead").innerHTML = "<tr>"+tr+"</tr>";
  }

  function sortedStats(){
    const arr = stats.slice();
    const k = sort.key, d = sort.dir;
    arr.sort((a,b)=>{
      if(k==="cmd" || k==="spark"){ return a.cmd<b.cmd ? -1*d : a.cmd>b.cmd ? 1*d : 0; }
      const av = a[k]==null ? -1 : a[k];
      const bv = b[k]==null ? -1 : b[k];
      return (av-bv)*d;
    });
    return arr;
  }

  // ---- render: body rows ----
  function renderRows(){
    const arr = sortedStats();
    let html = "";
    arr.forEach(s=>{
      const has = s.calls>0;
      const rtC = latClass(s.rt), exC = latClass(s.exec), p9C = latClass(s.p95), mxC = latClass(s.max);
      const ohClass = s.overhead==null ? "dim" : "";
      const errBad = s.err>0;
      const spk = has ? sparkSVG(s.hist, rtC) : '<span style="color:var(--ink-4)">—</span>';
      const open = openCmd===s.cmd;
      html += '<tr class="cmd-row '+(open?"open":"")+'" data-cmd="'+s.cmd+'">'+
        '<td><span class="cmd-name"><svg class="twirl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="nm">'+s.cmd+'</span></span></td>'+
        '<td class="num '+(has?"":"dim")+' tnum">'+(has?s.calls:"—")+'</td>'+
        '<td class="lat '+rtC+' tnum"><span class="v">'+fmtMs(s.rt)+'</span></td>'+
        '<td class="lat '+exC+' tnum"><span class="v">'+fmtMs(s.exec)+'</span></td>'+
        '<td class="num '+ohClass+' tnum">'+(s.overhead==null?"—":(s.overhead<10?s.overhead.toFixed(1):Math.round(s.overhead))+"ms")+'</td>'+
        '<td class="lat '+p9C+' tnum"><span class="v">'+fmtMs(s.p95)+'</span></td>'+
        '<td class="lat '+mxC+' tnum"><span class="v">'+fmtMs(s.max)+'</span></td>'+
        '<td class="err '+(errBad?"bad":"zero")+' tnum"><span class="v">'+(has?s.err.toFixed(1)+"%":"—")+'</span></td>'+
        '<td class="spark">'+spk+'</td>'+
      '</tr>';
      if(open && has){
        html += '<tr class="detail"><td colspan="'+COLS.length+'"><div class="detail-inner">'+
          '<div class="detail-head"><span class="lbl">recent · '+s.cmd+'</span>'+
            '<span class="detail-stats tnum"><span>p95 <b>'+fmtMs(s.p95)+'</b></span><span>max <b>'+fmtMs(s.max)+'</b></span><span>overhead <b>'+(s.overhead<10?s.overhead.toFixed(1):Math.round(s.overhead))+'ms</b></span></span>'+
          '</div>'+
          '<div class="calls">'+ s.recent.map(c=>{
            const cc = latClass(c.dur);
            return '<div class="callrow"><span class="ts tnum">'+c.ts+'</span>'+
              '<span class="cm">'+s.cmd+'</span>'+
              '<span class="du '+cc+' tnum">'+fmtMs(c.dur)+'</span>'+
              '<span class="okdot '+(c.err?"err":"ok")+'"></span></div>';
          }).join("") +'</div>'+
        '</div></td></tr>';
      }
    });
    document.getElementById("tbody").innerHTML = html;
  }

  // ---- render: global feed ----
  function renderFeed(){
    const list = document.getElementById("feedList");
    document.getElementById("feedCt").textContent = "last "+feed.length;
    list.innerHTML = feed.map(f=>{
      const cc = latClass(f.dur);
      return '<div class="feedrow '+(f.fresh?"fresh":"")+'">'+
        '<span class="ts tnum">'+f.ts+'</span>'+
        '<span class="okdot '+(f.err?"err":"ok")+'" style="justify-self:start"></span>'+
        '<span class="cm">'+f.cmd+'</span>'+
        '<span class="du '+cc+' tnum">'+fmtMs(f.dur)+'</span>'+
        '<span class="ix tnum">'+(f.err?"err":"ok")+'</span>'+
      '</div>';
    }).join("");
    feed.forEach(f=> f.fresh=false);
  }

  function renderFoot(){
    const has = stats.some(s=>s.calls>0);
    if(!has){ document.getElementById("footSummary").textContent = "0 commands · 0 calls"; return; }
    const calls = stats.reduce((a,s)=>a+(s.calls||0),0);
    const slow = stats.filter(s=>s.rt!=null && s.rt>100).length;
    const errc = stats.filter(s=>s.err>0).length;
    document.getElementById("footSummary").textContent =
      stats.filter(s=>s.calls>0).length+" commands · "+calls+" calls/10s · "+slow+" >100ms · "+errc+" w/ errors";
  }

  function renderAll(){ renderHead(); renderRows(); renderFeed(); renderFoot(); }

  // ---- state setters ----
  function setState(s){ root.setAttribute("data-state", s); syncControls();
    if(s==="empty"){ openCmd=null; } renderAll(); }
  function setTier(t){
    root.setAttribute("data-tier", t);
    document.getElementById("tierPill").textContent = t;
    document.getElementById("tierPill").className = "tier-pill "+t;
    if(t==="prod") openCmd=null;
    syncControls(); renderRows();
  }
  function setTheme(th){ root.setAttribute("data-theme", th); syncControls(); }
  function setLive(on){
    document.getElementById("liveBadge").classList.toggle("on", on);
    document.getElementById("liveBadge").firstChild; // noop
    root.setAttribute("data-live", on?"on":"off");
    if(on) startLive(); else stopLive();
    syncControls();
  }

  function syncControls(){
    document.querySelectorAll(".controls .grp").forEach(grp=>{
      const ctrl = grp.getAttribute("data-control");
      let cur;
      if(ctrl==="live") cur = root.getAttribute("data-live")||"on";
      else cur = root.getAttribute("data-"+ctrl);
      grp.querySelectorAll(".seg").forEach(b=> b.classList.toggle("on", b.getAttribute("data-v")===cur));
    });
  }

  // ---- live simulation ----
  function tick(){
    if(root.getAttribute("data-state")==="empty"){
      // commands trickle back in after a reset
      const dormant = stats.filter(s=>s.calls===0);
      if(dormant.length){
        const wake = SEED[Math.floor(Math.random()*SEED.length)];
        const tgt = stats.find(s=>s.cmd===wake.cmd);
        if(tgt && tgt.calls===0){
          Object.assign(tgt, {
            calls:Math.max(1,Math.round(jitter(wake.calls,.4))),
            rt:+jitter(wake.rt,.15).toFixed(1), exec:+jitter(wake.exec,.15).toFixed(1),
            p95:wake.p95, max:wake.max, err:wake.err,
            hist:makeHistory(wake.rt, wake.p95), recent:makeRecent(wake,9),
          });
          tgt.overhead = +(tgt.rt - tgt.exec).toFixed(1);
        }
        if(stats.every(s=>s.calls>0)) root.setAttribute("data-state","populated");
      }
      pushFeed(); renderAll();
      return;
    }
    // jitter live aggregates
    stats.forEach(s=>{
      if(s.calls===0) return;
      s.rt = +Math.max(0.5, jitter(s.rt, .06)).toFixed(1);
      s.exec = +Math.max(0.3, Math.min(s.rt-0.2, jitter(s.exec, .06))).toFixed(1);
      s.overhead = +(s.rt - s.exec).toFixed(1);
      s.calls = Math.max(1, Math.round(jitter(s.calls, .12)));
      s.hist.push(s.rt); if(s.hist.length>16) s.hist.shift();
    });
    pushFeed();
    renderRows(); renderFoot();
    renderFeed();
  }

  function pushFeed(){
    const pool = [];
    stats.forEach(s=>{ if(s.calls>0){ const w=Math.max(1,Math.round(s.calls/3)); for(let i=0;i<w;i++) pool.push(s); } });
    if(!pool.length) return;
    const n = 1 + Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      const s = pool[Math.floor(Math.random()*pool.length)];
      let dur = jitter(s.rt,.4); if(Math.random()<.14) dur = rnd(s.rt,s.p95);
      const isErr = s.err>0 && Math.random() < (s.err/100)*3.0;
      feed.unshift({ id:++seq, ts:clock(0), cmd:s.cmd, dur:+dur.toFixed(1), err:isErr, fresh:true });
    }
    if(feed.length>30) feed.length = 30;
  }

  function startLive(){ if(liveTimer) return; liveTimer = setInterval(tick, 1200); }
  function stopLive(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

  // ---- reset ----
  function reset(){
    stats.forEach(s=>{ s.calls=0; s.rt=null; s.exec=null; s.overhead=null; s.p95=null; s.max=null; s.err=0; s.hist=[]; s.recent=[]; });
    feed = [];
    openCmd = null;
    root.setAttribute("data-state","empty");
    syncControls();
    renderAll();
  }

  // ---- events ----
  document.getElementById("fab").addEventListener("click", ()=> document.body.classList.add("panel-open"));
  document.getElementById("closeBtn").addEventListener("click", ()=> document.body.classList.remove("panel-open"));
  document.getElementById("scrim").addEventListener("click", ()=> document.body.classList.remove("panel-open"));
  document.getElementById("resetBtn").addEventListener("click", reset);

  document.getElementById("thead").addEventListener("click", e=>{
    const th = e.target.closest("th"); if(!th) return;
    const key = th.getAttribute("data-key");
    if(sort.key===key) sort.dir *= -1;
    else { sort.key=key; sort.dir = (key==="cmd") ? 1 : -1; }
    renderHead(); renderRows();
  });

  document.getElementById("tbody").addEventListener("click", e=>{
    if(root.getAttribute("data-tier")!=="dev") return;
    const tr = e.target.closest("tr.cmd-row"); if(!tr) return;
    const cmd = tr.getAttribute("data-cmd");
    const s = stats.find(x=>x.cmd===cmd);
    if(!s || s.calls===0) return;
    openCmd = (openCmd===cmd) ? null : cmd;
    renderRows();
  });

  document.querySelectorAll(".controls .grp").forEach(grp=>{
    const ctrl = grp.getAttribute("data-control");
    grp.addEventListener("click", e=>{
      const b = e.target.closest(".seg"); if(!b) return;
      const v = b.getAttribute("data-v");
      if(ctrl==="theme") setTheme(v);
      else if(ctrl==="tier") setTier(v);
      else if(ctrl==="state"){ if(v==="populated"){ stats=buildStats(true); feed=buildFeed(); } setState(v); }
      else if(ctrl==="live") setLive(v==="on");
    });
  });

  document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.body.classList.remove("panel-open"); });

  // ---- init ----
  stats = buildStats(true);
  feed = buildFeed();
  root.setAttribute("data-live","on");
  renderAll();
  syncControls();
  // open the panel on load so the reviewer sees the money shot
  document.body.classList.add("panel-open");
  startLive();
})();
</script>
</body>
</html>
