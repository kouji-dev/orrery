<!DOCTYPE html>
<html lang="en" data-theme="dark" data-tier="dev" data-state="populated" data-tab="perf" data-live="on">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orrery — Dev console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   ORCHESTRA — Dev console popover (Perf + Agents + Projects)
   Tokens lifted from the app's styles.css so this drops in cleanly.
   ========================================================================= */
:root{
  --accent:#a855f7; --accent-2:#22d3ee; --accent-rgb:168,85,247; --accent-2-rgb:34,211,238;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --font-disp:'Space Grotesk',var(--font-mono);
  --r-sm:5px; --r-md:8px; --r-lg:12px;
  --st-running:#22d3ee; --st-blocked:#ff5d7a; --st-waiting:#c084fc; --st-done:#34e0a1; --st-idle:#6b7488;
}
[data-theme="dark"]{
  --bg:#090a0f; --bg-grid:rgba(255,255,255,.018);
  --panel:#0e1018; --panel-2:#11141e; --panel-3:#161a26; --elev:#1a1f2e;
  --hair:rgba(255,255,255,.07); --hair-2:rgba(255,255,255,.12);
  --ink:#e8ebf2; --ink-2:#aab2c5; --ink-3:#6b7488; --ink-4:#444b5e;
  --add:#5ef0bb; --del:#ff8ba0;
  --shadow:0 12px 40px -12px rgba(0,0,0,.7);
  --lat-g:#35e0a1; --lat-a:#f5c451; --lat-r:#ff5d7a;
  --lat-g-bg:rgba(53,224,161,.08); --lat-a-bg:rgba(245,196,81,.13); --lat-r-bg:rgba(255,93,122,.18);
  --lat-r-ring:rgba(255,93,122,.40);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#eef0f4; --bg-grid:rgba(20,24,40,.022);
  --panel:#ffffff; --panel-2:#f6f7fa; --panel-3:#eceef3; --elev:#ffffff;
  --hair:rgba(20,24,40,.10); --hair-2:rgba(20,24,40,.16);
  --ink:#161a26; --ink-2:#4a5266; --ink-3:#7b8398; --ink-4:#aab0bf;
  --add:#0a8f5e; --del:#c23252;
  --shadow:0 18px 50px -18px rgba(20,24,40,.40);
  --lat-g:#0a8f5e; --lat-a:#a9700f; --lat-r:#d6304e;
  --lat-g-bg:rgba(10,143,94,.09); --lat-a-bg:rgba(169,112,15,.13); --lat-r-bg:rgba(214,48,78,.14);
  --lat-r-ring:rgba(214,48,78,.34);
  color-scheme:light;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-mono); font-size:12.5px; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; letter-spacing:-.01em; overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
.disp{font-family:var(--font-disp); letter-spacing:-.02em;}
.up{text-transform:uppercase; letter-spacing:.12em;}

/* ---------- faint app backdrop ---------- */
.backdrop{position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg);}
.backdrop::before{content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px); background-size:34px 34px;}
.backdrop::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 50% at 18% 0%,rgba(var(--accent-rgb),.10),transparent 70%),radial-gradient(50% 50% at 100% 100%,rgba(var(--accent-2-rgb),.07),transparent 70%);}
.ghost{position:absolute; inset:0; opacity:.5; filter:saturate(.7); transition:opacity .3s, filter .3s;}
body.panel-open .ghost{opacity:.3; filter:saturate(.6) blur(1.5px);}
.g-top{position:absolute; top:0; left:0; right:0; height:44px; background:var(--panel); border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:14px; padding:0 16px;}
.g-side{position:absolute; top:44px; bottom:24px; left:0; width:252px; background:var(--panel); border-right:1px solid var(--hair); padding:14px 12px; display:flex; flex-direction:column; gap:9px;}
.g-bar{height:9px; border-radius:5px; background:var(--panel-3);}
.g-foot{position:absolute; left:0; right:0; bottom:0; height:24px; background:var(--panel); border-top:1px solid var(--hair);}
.g-cards{position:absolute; top:64px; left:272px; right:20px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); align-content:start;}
.g-card{height:150px; border-radius:var(--r-lg); border:1px solid var(--hair); background:var(--panel); padding:14px; display:flex; flex-direction:column; gap:10px;}
.wordmark{font-family:var(--font-disp); font-weight:600; font-size:14px; color:var(--ink-2);}
.wordmark .o{color:var(--accent);}

.scrim{position:fixed; inset:0; z-index:30; background:rgba(4,5,9,.34); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .28s ease;}
[data-theme="light"] .scrim{background:rgba(20,24,40,.18);}
body.panel-open .scrim{opacity:1; pointer-events:auto;}

/* ---------- anchored FAB stack (Dev sits just above Tweaks) ---------- */
.fab-stack{position:fixed; right:20px; bottom:22px; z-index:60; display:flex; flex-direction:column; gap:10px; align-items:flex-end;}
.fab{position:relative; width:44px; height:44px; border-radius:13px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--hair-2); background:linear-gradient(180deg,var(--panel-3),var(--panel)); color:var(--ink-2);
  box-shadow:var(--shadow); transition:transform .16s, color .16s, border-color .16s, box-shadow .16s;}
.fab:hover{transform:translateY(-2px); color:var(--ink); border-color:rgba(var(--accent-rgb),.5);}
.fab svg{width:19px; height:19px;}
.fab .pulse-dot{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--lat-r); animation:fabpulse 1.6s ease-in-out infinite;}
.fab .fab-badge{position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--lat-r); color:#fff; font-size:10px; font-weight:700; line-height:1; display:grid; place-items:center; border:2px solid var(--bg); font-variant-numeric:tabular-nums; animation:fabpulse 1.8s ease-in-out infinite;}
.fab.tweaks{color:var(--ink-3);}
.fab.tweaks:hover{color:var(--ink-2);}
body.panel-open .fab.dev{color:var(--accent); border-color:rgba(var(--accent-rgb),.6); box-shadow:var(--shadow), 0 0 18px -6px rgba(var(--accent-rgb),.7);}
.fab-tip{position:absolute; right:54px; top:50%; transform:translateY(-50%); white-space:nowrap; font-size:10px; color:var(--ink-3);
  background:var(--panel); border:1px solid var(--hair); border-radius:6px; padding:3px 8px; opacity:0; pointer-events:none; transition:opacity .14s;}
.fab:hover .fab-tip{opacity:1;}
@keyframes fabpulse{0%{box-shadow:0 0 0 0 rgba(255,93,122,.5);}70%{box-shadow:0 0 0 7px rgba(255,93,122,0);}100%{box-shadow:0 0 0 0 rgba(255,93,122,0);}}

/* ---------- floating popover ---------- */
.panel{
  position:fixed; right:20px; bottom:78px; z-index:61; width:720px;
  max-width:calc(100vw - 32px); max-height:calc(100vh - 150px);
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--panel); border:1px solid var(--hair-2); border-radius:14px;
  box-shadow:var(--shadow), 0 0 0 1px rgba(var(--accent-rgb),.04);
  transform-origin:bottom right;
  opacity:0; transform:translateY(8px) scale(.985); pointer-events:none;
  transition:opacity .24s cubic-bezier(.2,.7,.2,1), transform .24s cubic-bezier(.2,.7,.2,1);
}
body.panel-open .panel{opacity:1; transform:none; pointer-events:auto;}

/* header */
.p-head{flex:none; display:flex; align-items:center; gap:10px; padding:9px 11px 9px 13px; border-bottom:1px solid var(--hair); background:linear-gradient(180deg,var(--panel-3),var(--panel));}
.p-brand{display:flex; align-items:center; gap:7px; font-family:var(--font-disp); font-weight:600; font-size:13px;}
.p-brand svg{width:15px; height:15px;}
/* tab nav */
.tabs{display:flex; gap:2px; padding:2px; background:var(--panel-2); border:1px solid var(--hair); border-radius:8px;}
.tab{display:inline-flex; align-items:center; gap:6px; height:28px; font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  background:transparent; border:none; border-radius:6px; padding:0 10px; cursor:pointer; transition:all .12s;}
.tab:hover{color:var(--ink-2);}
.tab.on{color:var(--ink); background:var(--panel-3); box-shadow:0 0 0 1px var(--hair-2);}
.tab.on svg{color:var(--accent);}
.tab svg{width:13px; height:13px; color:var(--ink-4);}
.tab .cnt{display:inline-flex; align-items:center; justify-content:center; height:15px; font-size:9px; padding:0 5px; border-radius:999px; background:var(--panel); border:1px solid var(--hair); color:var(--ink-3); min-width:16px;}
.tab.on .cnt{color:var(--ink-2); border-color:var(--hair-2);}
.live{display:inline-flex; align-items:center; gap:6px; font-size:9.5px; color:var(--ink-3);}
.live .ld{width:7px; height:7px; border-radius:50%; background:var(--lat-g); position:relative;}
.live .ld::after{content:""; position:absolute; inset:-3px; border-radius:50%; background:inherit; opacity:.4; filter:blur(2px);}
[data-live="on"] .live .ld{animation:livepulse 1.5s ease-in-out infinite;}
@keyframes livepulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.p-head .spacer{flex:1;}
.icbtn{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; color:var(--ink-2);
  background:transparent; border:1px solid var(--hair); border-radius:var(--r-sm); padding:5px 9px; cursor:pointer; transition:all .12s;}
.icbtn:hover{color:var(--ink); background:var(--panel-3); border-color:var(--hair-2);}
.icbtn svg{width:13px; height:13px;}
.icbtn-bare{border:none; padding:5px; color:var(--ink-3);}
.icbtn-bare:hover{color:var(--ink); background:var(--panel-3);}
[data-tab="perf"] .perf-only{display:inline-flex;}
.perf-only{display:none;}

.p-body{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;}
.p-body::-webkit-scrollbar{width:9px;}
.p-body::-webkit-scrollbar-thumb{background:var(--hair-2); border-radius:6px; border:2px solid transparent; background-clip:padding-box;}
.p-body::-webkit-scrollbar-thumb:hover{background:var(--ink-4); background-clip:padding-box;}

/* tab panes */
.pane{display:none;}
[data-tab="perf"] #pane-perf{display:block;}
[data-tab="agents"] #pane-agents{display:block;}
[data-tab="projects"] #pane-projects{display:block;}

/* ---------- shared dense table ---------- */
table.dx{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
table.dx thead th{position:sticky; top:0; z-index:2; background:var(--panel-2); border-bottom:1px solid var(--hair-2);
  font-weight:500; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  padding:8px 9px; text-align:right; white-space:nowrap; cursor:pointer; user-select:none; transition:color .12s, background .12s;}
table.dx thead th:first-child{text-align:left; padding-left:13px;}
table.dx thead th:last-child{padding-right:13px;}
table.dx thead th:hover{color:var(--ink-2); background:var(--panel-3);}
table.dx thead th.sorted{color:var(--ink);}
th .arrow{display:inline-block; width:9px; margin-left:3px; color:var(--accent); opacity:0; font-size:8px; vertical-align:middle;}
th.sorted .arrow{opacity:1;}
table.dx tbody td{padding:0 9px; height:32px; border-bottom:1px solid var(--hair); text-align:right; white-space:nowrap; font-size:12px; color:var(--ink-2);}
table.dx tbody td:first-child{text-align:left; padding-left:13px;}
table.dx tbody td:last-child{padding-right:13px;}
tr.dx-row{cursor:pointer; transition:background .1s;}
tr.dx-row:hover{background:var(--panel-2);}
tr.dx-row.open{background:var(--panel-2);}
.twirl{width:11px; height:11px; flex:none; color:var(--ink-4); transition:transform .15s;}
tr.dx-row.open .twirl{transform:rotate(90deg); color:var(--accent);}
.lead{display:flex; align-items:center; gap:8px; color:var(--ink); font-weight:500;}
.lead .nm{overflow:hidden; text-overflow:ellipsis;}
.idk{color:var(--ink-4); font-weight:400;}

/* latency / perf cells */
td.lat{font-weight:500;} td.lat .v{display:inline-block; padding:2px 6px; border-radius:5px;}
td.lat.g .v{color:var(--lat-g);}
td.lat.a .v{color:var(--lat-a); background:var(--lat-a-bg);}
td.lat.r .v{color:var(--lat-r); background:var(--lat-r-bg); font-weight:600; box-shadow:inset 0 0 0 1px var(--lat-r-ring);}
td.lat.na .v{color:var(--ink-4);}
td.num{color:var(--ink-2);} td.num.dim{color:var(--ink-4);}
td.err .v{display:inline-block; padding:2px 6px; border-radius:5px;}
td.err.zero .v{color:var(--ink-4);}
td.err.bad .v{color:var(--lat-r); background:var(--lat-r-bg); font-weight:600; box-shadow:inset 0 0 0 1px var(--lat-r-ring);}
td.spark{text-align:right; padding-right:13px;} td.spark svg{display:inline-block; vertical-align:middle;}

/* status text */
.stat{display:inline-flex; align-items:center; gap:6px; justify-content:flex-end;}
.stat .sd{width:7px; height:7px; border-radius:50%; position:relative;}
.stat .lb{font-size:10px; letter-spacing:.06em; text-transform:uppercase;}
.sd.running{background:var(--st-running);} .stat.running .lb{color:var(--st-running);}
.sd.blocked{background:var(--st-blocked);} .stat.blocked .lb{color:var(--st-blocked);}
.sd.waiting{background:var(--st-waiting);} .stat.waiting .lb{color:var(--st-waiting);}
.sd.done{background:var(--st-done);} .stat.done .lb{color:var(--st-done);}
.sd.queued,.sd.idle{background:var(--st-idle);} .stat.queued .lb,.stat.idle .lb{color:var(--ink-3);}
.sd.running,.sd.blocked,.sd.queued{animation:livepulse 1.4s ease-in-out infinite;}
.needs{width:5px; height:5px; border-radius:50%; background:var(--st-blocked); flex:none;}

/* tool badge */
.tool{width:17px; height:17px; flex:none; border-radius:4px; display:inline-grid; place-items:center; font-size:10px; line-height:1;}
/* project chip */
.pchip{display:inline-flex; align-items:center; gap:6px; justify-content:flex-end; color:var(--ink-2);}
.pchip .pi{width:16px; height:16px; border-radius:4px; display:grid; place-items:center; flex:none;}
.pchip .pi svg{width:11px; height:11px;}
.pchip .pn{overflow:hidden; text-overflow:ellipsis; max-width:96px;}
.add{color:var(--add);} .del{color:var(--del);}
.meter{display:inline-block; width:46px; height:4px; border-radius:3px; background:var(--hair); overflow:hidden; vertical-align:middle; margin-right:6px;}
.meter > i{display:block; height:100%; border-radius:3px;}

/* expand detail */
tr.detail > td{padding:0; border-bottom:1px solid var(--hair); background:var(--bg);}
.detail-inner{padding:12px 14px 14px 32px; display:flex; flex-direction:column; gap:11px; animation:expand .22s ease;}
@keyframes expand{from{opacity:0; transform:translateY(-3px);}to{opacity:1; transform:none;}}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:5px 22px;}
.kv .row{display:flex; gap:8px; font-size:11px; align-items:baseline;}
.kv .k{color:var(--ink-4); min-width:74px; text-transform:lowercase; letter-spacing:.02em;}
.kv .vv{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kv .vv b{color:var(--ink); font-weight:600;}
.sub-lbl{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:1px;}
.files{display:flex; flex-direction:column; gap:1px;}
.frow{display:grid; grid-template-columns:16px 1fr auto; gap:9px; align-items:center; font-size:11px; padding:2px 0; color:var(--ink-2);}
.fstate{width:15px; height:15px; border-radius:4px; display:grid; place-items:center; font-size:9px; font-weight:700; flex:none;}
.fstate.A{color:var(--add); background:rgba(94,240,187,.12);}
.fstate.M{color:var(--lat-a); background:var(--lat-a-bg);}
.fstate.D{color:var(--del); background:rgba(255,139,160,.12);}
.fpath{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2);}
.fdelta{font-size:10px; display:flex; gap:6px;}
.taskline{font-size:11.5px; color:var(--ink-2); line-height:1.5; text-wrap:pretty;}
.attn{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; padding:5px 9px; border-radius:6px;
  color:var(--del); background:var(--lat-r-bg); border:1px solid var(--lat-r-ring);}
.tag-chip{display:inline-flex; align-items:center; gap:5px; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid var(--hair); color:var(--ink-2); background:var(--panel-2);}

/* recent calls (per command) */
.calls{display:flex; flex-direction:column; gap:1px;}
.callrow{display:grid; grid-template-columns:84px 1fr auto 14px; align-items:center; gap:10px; font-size:11px; padding:3px 0; color:var(--ink-2);}
.callrow .ts{color:var(--ink-4);} .callrow .cm{color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.callrow .du{text-align:right; font-weight:500;}
.callrow .du.g{color:var(--lat-g);} .callrow .du.a{color:var(--lat-a);} .callrow .du.r{color:var(--lat-r);}
.okdot{width:7px; height:7px; border-radius:50%; justify-self:center;}
.okdot.ok{background:var(--lat-g);} .okdot.err{background:var(--lat-r); box-shadow:0 0 0 2px var(--lat-r-bg);}
.detail-head{display:flex; align-items:center; gap:10px; font-size:10px; color:var(--ink-3);}
.detail-head .lbl{text-transform:uppercase; letter-spacing:.1em;}
.detail-stats{display:flex; gap:14px; margin-left:auto; color:var(--ink-2);}
.detail-stats b{color:var(--ink); font-weight:600;}

/* global recent-calls feed (dev) */
.feed{border-top:1px solid var(--hair-2);}
[data-tier="prod"] .feed{display:none;}
.feed-head{position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:9px; padding:9px 13px; background:var(--panel-2); border-bottom:1px solid var(--hair);}
.feed-head .lbl{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}
.feed-head .ct{font-size:10px; color:var(--ink-4); margin-left:auto;}
.feed-list{padding:5px 13px 12px;}
.feedrow{display:grid; grid-template-columns:90px 16px 1fr auto 22px; align-items:center; gap:10px; font-size:11px; padding:4px 0; border-bottom:1px solid var(--hair); color:var(--ink-2);}
.feedrow:last-child{border-bottom:none;}
.feedrow.fresh{animation:freshin .4s ease;}
@keyframes freshin{from{background:rgba(var(--accent-2-rgb),.10);}to{background:transparent;}}
.feedrow .ts{color:var(--ink-4);} .feedrow .cm{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.feedrow .du{text-align:right; font-weight:500;}
.feedrow .du.g{color:var(--lat-g);} .feedrow .du.a{color:var(--lat-a);} .feedrow .du.r{color:var(--lat-r);}
.feedrow .ix{color:var(--ink-4); text-align:right; font-size:9px;}

/* empty state (perf) */
.empty{display:none; flex-direction:column; align-items:center; justify-content:center; gap:13px; padding:54px 20px 60px; text-align:center;}
[data-tab="perf"][data-state="empty"] .empty{display:flex;}
[data-state="empty"] #pane-perf table.dx tbody,
[data-state="empty"] #pane-perf .feed{display:none;}
.empty .ring{width:46px; height:46px; border-radius:50%; border:1.5px dashed var(--hair-2); display:grid; place-items:center; color:var(--ink-4);}
.empty .ring svg{width:20px; height:20px;}
.empty h4{font-family:var(--font-disp); font-weight:600; font-size:14px; color:var(--ink-2);}
.empty p{font-size:11.5px; color:var(--ink-4); max-width:300px; line-height:1.55;}
.empty .hint{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-3);}
.empty .ld{width:7px; height:7px; border-radius:50%; background:var(--lat-g); animation:livepulse 1.5s ease-in-out infinite;}

/* footer */
.p-foot{flex:none; display:flex; align-items:center; gap:14px; padding:8px 13px; border-top:1px solid var(--hair); background:var(--panel-2); font-size:10px; color:var(--ink-3);}
.p-foot .leg{display:flex; align-items:center; gap:6px;}
.p-foot .sw{width:9px; height:9px; border-radius:3px;}
.p-foot .sw.g{background:var(--lat-g);} .p-foot .sw.a{background:var(--lat-a);} .p-foot .sw.r{background:var(--lat-r);}
.p-foot .spacer{flex:1;}
.foot-sec{display:none; align-items:center; gap:14px;}
[data-tab="perf"] .foot-sec.perf{display:flex;}
[data-tab="agents"] .foot-sec.agents{display:flex;}
[data-tab="projects"] .foot-sec.projects{display:flex;}

/* mockup state controls (NOT shipped) */

        '<td class="lat '+exC+' tnum"><span class="v">'+fmtMs(s.exec)+'</span></td>'+
        '<td class="num '+(s.overhead==null?"dim":"")+' tnum">'+(s.overhead==null?"—":(s.overhead<10?s.overhead.toFixed(1):Math.round(s.overhead))+"ms")+'</td>'+
        '<td class="lat '+p9+' tnum"><span class="v">'+fmtMs(s.p95)+'</span></td>'+
        '<td class="lat '+mx+' tnum"><span class="v">'+fmtMs(s.max)+'</span></td>'+
        '<td class="err '+(s.err>0?"bad":"zero")+' tnum"><span class="v">'+(has?s.err.toFixed(1)+"%":"—")+'</span></td>'+
        '<td class="spark">'+spk+'</td></tr>';
      if(open&&has){
        html+='<tr class="detail"><td colspan="'+COLS.length+'"><div class="detail-inner">'+
          '<div class="detail-head"><span class="lbl">recent · '+s.cmd+'</span><span class="detail-stats tnum"><span>p95 <b>'+fmtMs(s.p95)+'</b></span><span>max <b>'+fmtMs(s.max)+'</b></span><span>overhead <b>'+(s.overhead<10?s.overhead.toFixed(1):Math.round(s.overhead))+'ms</b></span></span></div>'+
          '<div class="calls">'+s.recent.map(c=>{ const cc=latClass(c.dur); return '<div class="callrow"><span class="ts tnum">'+c.ts+'</span><span class="cm">'+s.cmd+'</span><span class="du '+cc+' tnum">'+fmtMs(c.dur)+'</span><span class="okdot '+(c.err?"err":"ok")+'"></span></div>'; }).join("")+'</div>'+
        '</div></td></tr>';
      }
    });
    $("#perfBody").innerHTML=html;
  }
  function renderFeed(){ $("#feedCt").textContent="last "+feed.length; $("#feedList").innerHTML=feed.map(f=>{ const cc=latClass(f.dur); return '<div class="feedrow '+(f.fresh?"fresh":"")+'"><span class="ts tnum">'+f.ts+'</span><span class="okdot '+(f.err?"err":"ok")+'" style="justify-self:start"></span><span class="cm">'+f.cmd+'</span><span class="du '+cc+' tnum">'+fmtMs(f.dur)+'</span><span class="ix tnum">'+(f.err?"err":"ok")+'</span></div>'; }).join(""); feed.forEach(f=>f.fresh=false); }
  function perfFootRight(){ const has=stats.some(s=>s.calls>0); if(!has) return "0 commands · 0 calls"; const calls=stats.reduce((a,s)=>a+(s.calls||0),0),slow=stats.filter(s=>s.rt!=null&&s.rt>100).length,errc=stats.filter(s=>s.err>0).length; return stats.filter(s=>s.calls>0).length+" commands · "+calls+" calls/10s · "+slow+" >100ms · "+errc+" w/ errors"; }

  // ════════════════════════════════════════════════════════════════════════
  // AGENTS — in-memory state inspector
  // ════════════════════════════════════════════════════════════════════════
  const ACOLS=[
    {key:"name",label:"agent",kind:"name"},{key:"status",label:"status"},{key:"tool",label:"tool"},
    {key:"project",label:"project"},{key:"branch",label:"branch"},{key:"commits",label:"c"},
    {key:"delta",label:"Δ lines"},{key:"elapsed",label:"elapsed"},{key:"progress",label:"prog"},
  ];
  let aSort={key:"status",dir:1}, openAgent=null;
  const SPRIO={blocked:0,running:1,waiting:2,queued:3,done:4,idle:5};
  function sortedAgents(){ const arr=AGENTS.slice(),k=aSort.key,d=aSort.dir; arr.sort((a,b)=>{
    if(k==="status") return (SPRIO[a.status]-SPRIO[b.status])*d;
    if(k==="delta"){ return (delta(a).a-delta(b).a)*d; }
    if(k==="project") return a.projectId<b.projectId?-1*d:1*d;
    if(typeof a[k]==="number") return (a[k]-b[k])*d;
    return String(a[k])<String(b[k])?-1*d:1*d;
  }); return arr; }
  function renderAgHead(){ $("#agHead").innerHTML="<tr>"+ACOLS.map(c=>{ const s=aSort.key===c.key; const a=s?(aSort.dir<0?"▼":"▲"):""; return '<th data-key="'+c.key+'" class="'+(s?"sorted":"")+'">'+c.label+'<span class="arrow">'+a+'</span></th>'; }).join("")+"</tr>"; }
  function renderAgRows(){
    let html="";
    sortedAgents().forEach(ag=>{
      const p=projOf(ag.projectId), t=TOOLS[ag.tool], dl=delta(ag), open=openAgent===ag.id;
      const pc=ag.status==="blocked"?"var(--st-blocked)":ag.status==="running"?"var(--st-running)":ag.status==="done"?"var(--st-done)":ag.status==="waiting"?"var(--st-waiting)":"var(--ink-3)";
      html+='<tr class="dx-row '+(open?"open":"")+'" data-id="'+ag.id+'">'+
        '<td><span class="lead"><svg class="twirl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="idk">'+ag.id+'</span><span class="nm">'+ag.name+'</span>'+(ag.attn?'<span class="needs" title="needs you"></span>':"")+'</span></td>'+
        '<td><span class="stat '+ag.status+'"><span class="lb">'+ag.status+'</span><span class="sd '+ag.status+'"></span></span></td>'+
        '<td><span class="tool" title="'+t.name+' · '+ag.model+'" style="color:'+t.accent+';background:color-mix(in oklch,'+t.accent+',transparent 84%);box-shadow:inset 0 0 0 1px color-mix(in oklch,'+t.accent+',transparent 64%)">'+t.glyph+'</span></td>'+
        '<td><span class="pchip"><span class="pn">'+p.name+'</span><span class="pi" style="background:color-mix(in oklch,'+p.color+',transparent 82%);color:'+p.color+';box-shadow:inset 0 0 0 1px color-mix(in oklch,'+p.color+',transparent 62%)">'+svg(IC[p.icon])+'</span></span></td>'+
        '<td style="color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;max-width:120px">'+ag.branch.replace("agent/","")+'</td>'+
        '<td class="num tnum">'+ag.commits+'</td>'+
        '<td class="tnum">'+(ag.files.length?'<span class="add">+'+dl.a+'</span> <span class="del">−'+dl.d+'</span>':'<span style="color:var(--ink-4)">—</span>')+'</td>'+
        '<td class="num tnum" style="color:var(--ink-3)">'+fmtDur(ag.elapsed)+'</td>'+
        '<td class="tnum"><span class="meter"><i style="width:'+Math.round(ag.progress*100)+'%;background:'+pc+'"></i></span>'+Math.round(ag.progress*100)+'%</td></tr>';
      if(open){
        const fr=ag.files.map(f=>'<div class="frow"><span class="fstate '+f.s+'">'+f.s+'</span><span class="fpath">'+f.p+'</span><span class="fdelta"><span class="add">+'+f.a+'</span><span class="del">−'+f.d+'</span></span></div>').join("")||'<div style="color:var(--ink-4);font-size:11px">no files touched</div>';
        html+='<tr class="detail"><td colspan="'+ACOLS.length+'"><div class="detail-inner">'+
          '<div class="taskline">'+ag.task+'</div>'+
          (ag.attn?'<div class="attn">'+svg("M5 21V4m0 0h11l-2 4 2 4H5",'width="13" height="13"')+ag.note+'</div>':(ag.note?'<div class="tag-chip">'+ag.note+'</div>':""))+
          '<div class="kv">'+
            '<div class="row"><span class="k">id</span><span class="vv"><b>'+ag.id+'</b></span></div>'+
            '<div class="row"><span class="k">tool</span><span class="vv">'+TOOLS[ag.tool].name+' · '+ag.model+'</span></div>'+
            '<div class="row"><span class="k">status</span><span class="vv">'+ag.status+(ag.pending?' · '+ag.pending+' pending':"")+'</span></div>'+
            '<div class="row"><span class="k">branch</span><span class="vv">'+ag.branch+'</span></div>'+
            '<div class="row"><span class="k">worktree</span><span class="vv">'+ag.worktree+'</span></div>'+
            '<div class="row"><span class="k">base</span><span class="vv">'+ag.base+'</span></div>'+
            '<div class="row"><span class="k">commits</span><span class="vv">'+ag.commits+'</span></div>'+
            '<div class="row"><span class="k">elapsed</span><span class="vv">'+fmtDur(ag.elapsed)+'</span></div>'+
          '</div>'+
          '<div><div class="sub-lbl">files · '+ag.files.length+'</div><div class="files">'+fr+'</div></div>'+
        '</div></td></tr>';
      }
    });
    $("#agBody").innerHTML=html;
  }
  function agFoot(){ const c=(s)=>AGENTS.filter(a=>a.status===s).length; $("#agSummary").innerHTML=AGENTS.length+' agents · <span style="color:var(--st-running)">'+c("running")+' running</span> · <span style="color:var(--st-blocked)">'+c("blocked")+' need you</span> · '+(c("waiting")+c("queued"))+' waiting · '+c("done")+' done'; }

  // ════════════════════════════════════════════════════════════════════════
  // PROJECTS — in-memory state inspector
  // ════════════════════════════════════════════════════════════════════════
  const PCOLS=[
    {key:"name",label:"project",kind:"name"},{key:"id",label:"id"},{key:"head",label:"head"},
    {key:"branch",label:"default"},{key:"branches",label:"branches"},{key:"agents",label:"agents"},{key:"files",label:"files"},
  ];
  let pSort={key:"name",dir:1}, openProj=null;
  const agentsIn=(id)=>AGENTS.filter(a=>a.projectId===id);
  function sortedProjects(){ const arr=PROJECTS.slice(),k=pSort.key,d=pSort.dir; arr.sort((a,b)=>{
    if(k==="branches") return (a.branches.length-b.branches.length)*d;
    if(k==="agents") return (agentsIn(a.id).length-agentsIn(b.id).length)*d;
    if(typeof a[k]==="number") return (a[k]-b[k])*d;
    return String(a[k])<String(b[k])?-1*d:1*d;
  }); return arr; }
  function renderPrHead(){ $("#prHead").innerHTML="<tr>"+PCOLS.map(c=>{ const s=pSort.key===c.key; const a=s?(pSort.dir<0?"▼":"▲"):""; return '<th data-key="'+c.key+'" class="'+(s?"sorted":"")+'">'+c.label+'<span class="arrow">'+a+'</span></th>'; }).join("")+"</tr>"; }
  function renderPrRows(){
    let html="";
    sortedProjects().forEach(p=>{
      const ags=agentsIn(p.id), needs=ags.filter(a=>a.attn).length, open=openProj===p.id;
      html+='<tr class="dx-row '+(open?"open":"")+'" data-id="'+p.id+'">'+
        '<td><span class="lead"><svg class="twirl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="pi" style="width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:color-mix(in oklch,'+p.color+',transparent 82%);color:'+p.color+';box-shadow:inset 0 0 0 1px color-mix(in oklch,'+p.color+',transparent 62%)">'+svg(IC[p.icon],'width="12" height="12"')+'</span><span class="nm" style="color:'+p.color+'">'+p.name+'</span></span></td>'+
        '<td class="idk tnum">'+p.id+'</td>'+
        '<td class="num tnum" style="color:var(--ink-3)">'+p.head+'</td>'+
        '<td style="color:var(--ink-3)">'+p.branch+'</td>'+
        '<td class="num tnum">'+p.branches.length+'</td>'+
        '<td class="num tnum">'+ags.length+(needs?' <span style="color:var(--st-blocked);font-weight:700">'+needs+'!</span>':"")+'</td>'+
        '<td class="num tnum">'+p.files+'</td></tr>';
      if(open){
        const al=ags.map(a=>{ const t=TOOLS[a.tool]; return '<div class="frow" style="grid-template-columns:7px 1fr auto"><span class="sd '+a.status+'" style="width:7px;height:7px;border-radius:50%"></span><span class="fpath">'+a.id+' · '+a.name+'</span><span class="tag-chip" style="color:'+t.accent+'">'+t.glyph+' '+a.status+'</span></div>'; }).join("")||'<div style="color:var(--ink-4);font-size:11px">no agents</div>';
        const br=p.branches.map(b=>'<span class="tag-chip">'+svg(IC.branch,'width="11" height="11"')+b+'</span>').join("");
        html+='<tr class="detail"><td colspan="'+PCOLS.length+'"><div class="detail-inner">'+
          '<div class="kv">'+
            '<div class="row"><span class="k">id</span><span class="vv"><b>'+p.id+'</b></span></div>'+
            '<div class="row"><span class="k">path</span><span class="vv">'+p.path+'</span></div>'+
            '<div class="row"><span class="k">repo</span><span class="vv">'+p.repo+'</span></div>'+
            '<div class="row"><span class="k">head</span><span class="vv">'+p.head+' ('+p.branch+')</span></div>'+
            '<div class="row"><span class="k">hasGit</span><span class="vv">'+p.hasGit+'</span></div>'+
            '<div class="row"><span class="k">files</span><span class="vv">'+p.files+'</span></div>'+
          '</div>'+
          '<div><div class="sub-lbl">branches · '+p.branches.length+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+br+'</div></div>'+
          '<div><div class="sub-lbl">agents · '+ags.length+'</div><div class="files">'+al+'</div></div>'+
        '</div></td></tr>';
      }
    });
    $("#prBody").innerHTML=html;
  }
  function prFoot(){ const dirty=PROJECTS.filter(p=>agentsIn(p.id).some(a=>a.files.length)).length; $("#prSummary").innerHTML=PROJECTS.length+' projects · '+AGENTS.length+' worktrees · '+dirty+' with changes'; }

  // ── footer ──────────────────────────────────────────────────────────────
  function updateBadge(){ const b=$("#fabBadge"); if(!b) return; const n=stats.filter(s=>s.calls>0&&(s.err>0||(s.rt!=null&&s.rt>100))).length; b.textContent=n||""; b.style.display=n?"grid":"none"; $("#fab").title=n?("Dev console · "+n+" perf alert"+(n>1?"s":"")):"Dev console"; }
  function renderFoot(){
    updateBadge();
    const tab=root.getAttribute("data-tab");
    if(tab==="perf") $("#footRight").textContent=perfFootRight();
    else if(tab==="agents") $("#footRight").textContent="snapshot · now";
    else $("#footRight").textContent="snapshot · now";
  }
  function renderAll(){ renderPerfHead(); renderPerfRows(); renderFeed(); renderAgHead(); renderAgRows(); renderPrHead(); renderPrRows(); agFoot(); prFoot(); renderFoot(); }

  // ── live sim (perf only) ─────────────────────────────────────────────────
  function pushFeed(){ const pool=[]; stats.forEach(s=>{ if(s.calls>0){ const w=Math.max(1,Math.round(s.calls/3)); for(let i=0;i<w;i++) pool.push(s); } }); if(!pool.length) return; const n=1+Math.floor(Math.random()*2); for(let i=0;i<n;i++){ const s=pool[Math.floor(Math.random()*pool.length)]; let dur=jitter(s.rt,.4); if(Math.random()<.14) dur=rnd(s.rt,s.p95); const err=s.err>0&&Math.random()<(s.err/100)*3; feed.unshift({id:++seq,ts:clock(0),cmd:s.cmd,dur:+dur.toFixed(1),err,fresh:true}); } if(feed.length>30) feed.length=30; }
  function tick(){
    if(root.getAttribute("data-state")==="empty"){
      const dormant=stats.filter(s=>s.calls===0);
      if(dormant.length){ const wake=SEED[Math.floor(Math.random()*SEED.length)],tgt=stats.find(s=>s.cmd===wake.cmd);
        if(tgt&&tgt.calls===0){ Object.assign(tgt,{calls:Math.max(1,Math.round(jitter(wake.calls,.4))),rt:+jitter(wake.rt,.15).toFixed(1),exec:+jitter(wake.exec,.15).toFixed(1),p95:wake.p95,max:wake.max,err:wake.err,hist:makeHistory(wake.rt,wake.p95),recent:makeRecent(wake,9)}); tgt.overhead=+(tgt.rt-tgt.exec).toFixed(1); }
        if(stats.every(s=>s.calls>0)){ root.setAttribute("data-state","populated"); syncControls(); } }
      pushFeed(); renderPerfRows(); renderFeed(); renderFoot(); return;
    }
    stats.forEach(s=>{ if(s.calls===0) return; s.rt=+Math.max(.5,jitter(s.rt,.06)).toFixed(1); s.exec=+Math.max(.3,Math.min(s.rt-.2,jitter(s.exec,.06))).toFixed(1); s.overhead=+(s.rt-s.exec).toFixed(1); s.calls=Math.max(1,Math.round(jitter(s.calls,.12))); s.hist.push(s.rt); if(s.hist.length>16) s.hist.shift(); });
    pushFeed(); renderPerfRows(); renderFeed(); renderFoot();
  }
  function startLive(){ if(liveTimer) return; liveTimer=setInterval(tick,1200); }
  function stopLive(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

  function reset(){ stats.forEach(s=>{ s.calls=0;s.rt=null;s.exec=null;s.overhead=null;s.p95=null;s.max=null;s.err=0;s.hist=[];s.recent=[]; }); feed=[]; openCmd=null; root.setAttribute("data-state","empty"); syncControls(); renderAll(); }

  // ── controls sync ────────────────────────────────────────────────────────
  function syncControls(){
    document.querySelectorAll(".controls .grp").forEach(grp=>{ const c=grp.getAttribute("data-control"); const cur=root.getAttribute("data-"+c); grp.querySelectorAll(".seg").forEach(b=>b.classList.toggle("on",b.getAttribute("data-v")===cur)); });
    document.querySelectorAll(".tabs .tab").forEach(t=>t.classList.toggle("on",t.getAttribute("data-tab")===root.getAttribute("data-tab")));
  }
  function setTab(t){ root.setAttribute("data-tab",t); if(t!=="perf"){} syncControls(); renderFoot(); }

  // ── events ───────────────────────────────────────────────────────────────
  $("#fab").addEventListener("click",()=>{ const o=document.body.classList.toggle("panel-open"); if(!o){} });
  $("#fabTweaks").addEventListener("click",()=>{ /* faux Tweaks anchor — real app opens the Tweaks panel here */ });
  $("#closeBtn").addEventListener("click",()=>document.body.classList.remove("panel-open"));
  $("#scrim").addEventListener("click",()=>document.body.classList.remove("panel-open"));
  $("#resetBtn").addEventListener("click",reset);

  $("#tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(t) setTab(t.getAttribute("data-tab")); });

  $("#perfHead").addEventListener("click",e=>{ const th=e.target.closest("th"); if(!th) return; const k=th.getAttribute("data-key"); if(sort.key===k) sort.dir*=-1; else { sort.key=k; sort.dir=(k==="cmd")?1:-1; } renderPerfHead(); renderPerfRows(); });
  $("#perfBody").addEventListener("click",e=>{ if(root.getAttribute("data-tier")!=="dev") return; const tr=e.target.closest("tr.dx-row"); if(!tr) return; const c=tr.getAttribute("data-cmd"),s=stats.find(x=>x.cmd===c); if(!s||s.calls===0) return; openCmd=(openCmd===c)?null:c; renderPerfRows(); });
  $("#agHead").addEventListener("click",e=>{ const th=e.target.closest("th"); if(!th) return; const k=th.getAttribute("data-key"); if(aSort.key===k) aSort.dir*=-1; else { aSort.key=k; aSort.dir=1; } renderAgHead(); renderAgRows(); });
  $("#agBody").addEventListener("click",e=>{ const tr=e.target.closest("tr.dx-row"); if(!tr) return; const id=tr.getAttribute("data-id"); openAgent=(openAgent===id)?null:id; renderAgRows(); });
  $("#prHead").addEventListener("click",e=>{ const th=e.target.closest("th"); if(!th) return; const k=th.getAttribute("data-key"); if(pSort.key===k) pSort.dir*=-1; else { pSort.key=k; pSort.dir=1; } renderPrHead(); renderPrRows(); });
  $("#prBody").addEventListener("click",e=>{ const tr=e.target.closest("tr.dx-row"); if(!tr) return; const id=tr.getAttribute("data-id"); openProj=(openProj===id)?null:id; renderPrRows(); });

  document.querySelectorAll(".controls .grp").forEach(grp=>{ const c=grp.getAttribute("data-control"); grp.addEventListener("click",e=>{ const b=e.target.closest(".seg"); if(!b) return; const v=b.getAttribute("data-v");
    if(c==="theme") root.setAttribute("data-theme",v);
    else if(c==="tier"){ root.setAttribute("data-tier",v); if(v==="prod") openCmd=null; renderPerfRows(); }
    else if(c==="state"){ if(v==="populated"){ stats=buildStats(true); feed=buildFeed(); } root.setAttribute("data-state",v); if(v==="empty"){ openCmd=null; } renderAll(); }
    else if(c==="live"){ const on=v==="on"; root.setAttribute("data-live",on?"on":"off"); on?startLive():stopLive(); }
    syncControls(); }); });

  document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.body.classList.remove("panel-open"); });

  // ── init ───────────────────────────────────────────────────────────────
  $("#cntAgents").textContent=AGENTS.length;
  $("#cntProjects").textContent=PROJECTS.length;
  stats=buildStats(true); feed=buildFeed();
  renderAll(); syncControls();
  document.body.classList.add("panel-open");
  startLive();
})();

</script>
</body>
</html>
